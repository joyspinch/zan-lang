<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>莫伤怀 - 网易云音乐</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #26212b 0%, #1a171e 60%, #121015 100%);
      color: #e5e5e5;
      font-family: sans-serif;
      overflow: hidden;
    }

    /* 顶栏 */
    .topbar {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 28px;
      background: rgba(26, 23, 30, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    .topbar-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      color: #8f8a95;
      font-size: 13px;
    }

    /* 中间舞台：Flex 伸缩填满中间区域 */
    .stage-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      padding: 20px 40px;
      gap: 60px;
    }

    /* 左侧黑胶唱盘容器 */
    .disc-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 400px;
      height: 400px;
      flex-shrink: 0;
    }
    .disc-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 360px;
      height: 360px;
      border-radius: 180px;
      background: radial-gradient(circle, #2d2633 0%, #141217 65%, #080709 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 3px solid #332d3a;
      flex-shrink: 0;
      animation: spin 24s linear infinite;
    }
    .disc-cover {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 220px;
      height: 220px;
      border-radius: 110px;
      background: linear-gradient(135deg, #442a58 0%, #a85832 50%, #e68d37 100%);
      border: 4px solid #1a171e;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }
    .disc-center {
      width: 28px;
      height: 28px;
      border-radius: 14px;
      background: #0d0b0f;
      border: 2px solid #332d39;
      flex-shrink: 0;
    }

    /* 右侧信息与歌词区 */
    .info-col {
      display: flex;
      flex-direction: column;
      flex: 1;
      max-width: 540px;
      gap: 14px;
      justify-content: center;
    }
    .song-title {
      font-size: 30px;
      font-weight: bold;
      color: #ffffff;
      margin: 0;
    }
    .song-meta {
      font-size: 13px;
      color: #8c8692;
      margin-top: 4px;
    }
    .tag-row {
      display: flex;
      flex-direction: row;
      gap: 8px;
    }
    .capsule {
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #c4bfca;
    }
    .capsule.active {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-weight: bold;
    }

    /* 歌词视口 */
    .lyric-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }
    .lyric-item {
      font-size: 15px;
      color: #7a7482;
    }
    .lyric-item.focus {
      font-size: 19px;
      font-weight: bold;
      color: #ffffff;
    }

    /* 吸底播放条 */
    .bottom-bar {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      padding: 0 24px;
      background: rgba(18, 15, 21, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .track-info {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      width: 220px;
    }
    .ctrl-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 520px;
    }
    .btn-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
    }
    .btn-play {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: #ec4141;
      color: #ffffff;
      font-size: 14px;
      border: none;
    }
    .progress-box {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
      font-size: 11px;
      color: #6a6470;
    }
    .progress-bar {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
    }
    .progress-now {
      width: 42%;
      height: 100%;
      border-radius: 2px;
      background: #ec4141;
    }
    .actions-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      width: 220px;
      justify-content: flex-end;
      color: #a49ea8;
      font-size: 12px;
    }
    .badge-hi {
      border: 1px solid #ec4141;
      color: #ec4141;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
    }
  </style>
</head>
<body id="MusicApp">
  <!-- 1. 顶栏：固定在顶部 -->
  <div class="topbar">
    <div>
      <button style="background:transparent; border:none; color:#a49ea8; font-size:16px;">∨</button>
    </div>
    <div class="topbar-right">
      <span>⏱ 播放器模式</span>
      <span>⛶ 全屏</span>
      <span>— 最小化</span>
      <span>✕ 关闭</span>
    </div>
  </div>

  <!-- 2. 中间舞台：flex: 1 撑满剩余高度 -->
  <div class="stage-row">
    <!-- 左侧黑胶唱盘 -->
    <div class="disc-container">
      <div class="disc-box">
        <div class="disc-cover">
          <div class="disc-center"></div>
        </div>
      </div>
    </div>

    <!-- 右侧歌曲详情与歌词 -->
    <div class="info-col">
      <div>
        <div class="song-title">莫伤怀</div>
        <div class="song-meta">心自在 莫伤怀 · 专辑：莫伤怀 · 歌手：于牧野</div>
      </div>

      <div class="tag-row">
        <span class="capsule active">歌词</span>
        <span class="capsule">百科</span>
        <span class="capsule">相似推荐</span>
      </div>

      <div class="lyric-box">
        <div class="lyric-item">你看那 葱葱郁郁星星点点山花漫开</div>
        <div class="lyric-item focus">你听那 悠悠缓缓的风耳边吹来</div>
        <div class="lyric-item">晓月照亮苍苔</div>
        <div class="lyric-item">浮生若大梦醒来</div>
        <div class="lyric-item">何必去迎合世俗丈量出的成败</div>
        <div class="lyric-item">忘却掉患得患失的贪念和阴霾</div>
        <div class="lyric-item">觅一叶扁舟摇摆</div>
        <div class="lyric-item">赏明月坠入云海</div>
      </div>
    </div>
  </div>

  <!-- 3. 吸底播放控制条：固定在底部 -->
  <div class="bottom-bar">
    <!-- 当前播放歌曲 -->
    <div class="track-info">
      <div style="width:42px; height:42px; border-radius:6px; background:#442a58; flex-shrink:0;"></div>
      <div>
        <div style="font-size:14px; font-weight:bold; color:#fff;">莫伤怀</div>
        <div style="font-size:12px; color:#8c8692;">于牧野</div>
      </div>
      <span style="color:#ec4141; margin-left:6px;">❤</span>
    </div>

    <!-- 播放按键与进度条 -->
    <div class="ctrl-center">
      <div class="btn-row">
        <button style="background:transparent; border:none; color:#a49ea8;">🔀</button>
        <button style="background:transparent; border:none; color:#ffffff; font-size:16px;">⏮</button>
        <button class="btn-play" @click="OnTogglePlay">▶</button>
        <button style="background:transparent; border:none; color:#ffffff; font-size:16px;">⏭</button>
        <button style="background:transparent; border:none; color:#a49ea8;">🔁</button>
      </div>
      <div class="progress-box">
        <span>01:24</span>
        <div class="progress-bar">
          <div class="progress-now"></div>
        </div>
        <span>03:42</span>
      </div>
    </div>

    <!-- 右侧音质与操作 -->
    <div class="actions-right">
      <span class="badge-hi">极高</span>
      <span class="badge-hi" style="border-color:#655c6d; color:#c4bfca;">立体声</span>
      <span>词</span>
      <span>🔊 80%</span>
      <span>☰ 队列</span>
    </div>
  </div>
</body>
</html>
