name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # 全量 full（3600+ 条）在托管 4 核机器上 2 小时跑不完，只放夜间；
  # 推送/PR 跑 smoke 档（~600 条），20 分钟内给信号。
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'ctest tier label (smoke | standard | full)'
        default: 'full'

env:
  ZAN_CI_TIER: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.tier || 'smoke' }}

permissions:
  contents: read


# 多会话高频推送：同分支同事件的新运行取消旧运行，避免排队堆积（夜间 schedule 独立分组不被推送打断）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # main 上多会话约每 15 分钟一推，取消进行中会让运行永远跑不完；main 只替换等待中的。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Linux + macOS share a POSIX shell and a system C compiler (used by zanc at
  # link time). LLVM is provided with its CMake package config so that
  # find_package(LLVM CONFIG) works.
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'push' && 60 || github.event_name == 'pull_request' && 60 || 340 }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Install LLVM (Linux)
      if: runner.os == 'Linux'
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
      with:
        version: "17.0"
        cached: true

    - name: Set LLVM_DIR (Linux)
      if: runner.os == 'Linux'
      run: echo "LLVM_DIR=$LLVM_PATH/lib/cmake/llvm" >> "$GITHUB_ENV"

    - name: Install native libraries (Linux)
      if: runner.os == 'Linux'
      run: |
        # Drop flaky third-party repos (packages.microsoft.com periodically
        # serves an unsigned InRelease and breaks `apt-get update`); they are
        # irrelevant to this project.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                   /etc/apt/sources.list.d/azure-cli.list \
                   /etc/apt/sources.list.d/azure-cli.sources
        sudo apt-get update
        sudo apt-get install -y libx11-dev libfreetype6-dev libfontconfig1-dev \
          unixodbc-dev libsqlite3-dev xvfb xauth

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install llvm@17 unixodbc
        echo "LLVM_DIR=$(brew --prefix llvm@17)/lib/cmake/llvm" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=$(brew --prefix unixodbc)/lib" >> "$GITHUB_ENV"

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLLVM_DIR="$LLVM_DIR"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} -j

    - name: Test
      # dap_integration FAILS by default when gdb is missing. Linux images ship
      # gdb, so it runs for real there; macOS has no usable gdb (it requires
      # code signing), so that job opts into the explicit skip only.
      env:
        ZAN_ALLOW_SKIP_DAP: ${{ runner.os == 'macOS' && '1' || '0' }}
      # 按核数并行；档位见顶部 ZAN_CI_TIER（推送 smoke，夜间 full）。
      run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure -j "$(getconf _NPROCESSORS_ONLN)" -L "^${ZAN_CI_TIER}$"

  # Windows uses MSYS2/MinGW, which ships a prebuilt LLVM (with CMake config),
  # clang (used by zanc at link time), CMake and Ninja in one self-contained
  # toolchain — no Visual Studio environment juggling required.
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    runs-on: windows-latest
    timeout-minutes: ${{ github.event_name == 'push' && 60 || github.event_name == 'pull_request' && 60 || 340 }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-lld
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja

    - name: Configure
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLLVM_DIR="/mingw64/lib/cmake/llvm" -DZAN_BUILD_GUI_TESTS=OFF

    # Only the compiler is built under MinGW, plus the pure-C unit test
    # executables its test roster runs (json/rpc common-code tests): the
    # LSP/DAP/IDE tools depend on MSVC/Win32-specific headers. ctest
    # exercises the compiler end to end (compile + link + run real .zan
    # programs), which is the cross-platform guarantee that matters here.
    - name: Build
      run: cmake --build build --target zanc zanrt_selfhost_bundle zanrt_selfhost_diff_bundle zan_json_oom_test zan_json_trailing_test zan_rpc_framing_test zan_json_nul_test zan_ast_visitor_test zan_diag_dedup_test zan_package_lock_test zan_package_namespace_test zan_package_diamond_solver_test zan_gui_android_clock_test zan_gui_ios_input_test zan_gui_ohos_native_test -j

    # dap_integration is skipped here because this job builds only the
    # `zanc` target (above): it drives the zan-dap adapter + its test
    # harness, which are not built under MinGW (see the build note above).
    # It runs on Linux/macOS, where the full tree builds.
    - name: Test
      # zanc 找 MinGW 系统库默认看 <zanc 目录>\mingw\lib（发布包自带）；CI 用
      # MSYS2 的 MinGW，经 ZAN_LIB_PATH（; 分隔、Windows 路径）指过去。
      run: |
        export ZAN_LIB_PATH="$(cygpath -m /mingw64/lib);$(cygpath -m /mingw64/x86_64-w64-mingw32/lib);$(cygpath -m "$(dirname "$(gcc -print-libgcc-file-name)")")"
        echo "ZAN_LIB_PATH=$ZAN_LIB_PATH"
        ctest --test-dir build --output-on-failure -E "dap_integration" -j "$(nproc)" -L "^${ZAN_CI_TIER}$"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    # 全仓绝大多数文件不合 .clang-format（存量债）。只刻度**本次改动的行**
    #（git clang-format --diff BASE HEAD）：整文件检查会让任何碰了 C 文件的
    # 推送都因存量债失败，门禁永远红、等于没有。新写的行即时达标，存量谁碰谁顺手修。
    - name: Check formatting (changed lines vs base)
      run: |
        BASE="${{ github.event.pull_request.base.sha }}"
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          BASE="${{ github.event.before }}"
        fi
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "no base revision; nothing to diff against"
          exit 0
        fi
        OUT=$(git clang-format --diff --extensions c,h "$BASE" HEAD -- || true)
        case "$OUT" in
          ""|*"no modified files to format"*|*"did not modify any files"*)
            echo "changed C lines are clang-format clean vs $BASE" ;;
          *) echo "$OUT"; echo "::error::changed lines need clang-format"; exit 1 ;;
        esac

  # Fuzz the whole front-end with libFuzzer under ASan + UBSan: lexer, parser,
  # the post-parse resolve steps, the binder and the type checker. Runs a short
  # bounded budget on every push so malformed-input crashes / OOB reads / UB
  # regress loudly. Everything linked here is LLVM-free, which is what keeps the
  # job seconds rather than minutes; fuzzing irgen needs LLVM and a target
  # machine, so that would be a separate harness.
  fuzz:
    name: fuzz (front-end)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Build & run libFuzzer
      run: |
        clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
          -Isrc/compiler \
          src/compiler/arena.c src/compiler/diag.c src/compiler/lexer.c \
          src/compiler/parser.c src/compiler/ast.c src/compiler/nsresolve.c \
          src/compiler/binder.c src/compiler/checker.c src/compiler/definite.c \
          src/compiler/builtin_api.c \
          tests/fuzz/fuzz_frontend.c -o fuzz_frontend
        mkdir -p corpus
        # tests/fuzz/corpus holds inputs that once crashed the front-end, so a
        # regression is caught on the first execution rather than by luck.
        cp tests/fuzz/corpus/*.zan tests/golden/cases/*.zan tests/diag/*.zan \
           examples/*.zan corpus/ 2>/dev/null || true
        ASAN_OPTIONS=detect_leaks=0 ./fuzz_frontend -max_total_time=45 -print_final_stats=1 corpus
