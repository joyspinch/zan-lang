name: drivers

# Builds the native driver bundles (SDL3, SQLite, PostgreSQL/libpq) for every
# supported target on its own native runner, then uploads each per-target
# directory as an artifact. Generated bundles can also refresh the committed
# per-target drivers.
#
# On a tag push the per-target bundles are also attached to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*', 'drivers-*']
    # The Cocoa GUI driver is the one bundle that cannot be built off a Mac,
    # so the committed dylib is only as new as the last run of this workflow.
    # Touching the GUI runtime rebuilds and re-commits it, which is what keeps
    # `zanc --target macos-*` able to link a GUI program from Windows/Linux.
    branches: [main]
    paths:
      - '.github/workflows/drivers.yml'
      - 'src/runtime/gui_runtime.c'
      - 'src/runtime/gui_runtime.h'
      - 'src/runtime/gui_runtime_mac.m'
      # Same story for the Windows-on-ARM runtime objects: they can only be
      # built by an aarch64 mingw toolchain, so a cross publish reads whatever
      # this workflow last committed.
      - 'src/runtime/rt_sync.c'
      - 'src/runtime/rt_io.c'
      - 'scripts/build_win_rt.sh'
  pull_request:
    paths:
      - '.github/workflows/drivers.yml'
      - 'src/runtime/gui_runtime.c'
      - 'src/runtime/gui_runtime.h'
      - 'src/runtime/gui_runtime_mac.m'
      - 'stdlib/SDL3/**'
      - 'stdlib/System/Data/**'
      - 'scripts/stage_*'

permissions:
  contents: read

env:
  SDL3_VERSION: '3.4.10'
  SQLITE_URL: 'https://sqlite.org/2024/sqlite-amalgamation-3460100.zip'
  SQLITE_DIR: 'sqlite-amalgamation-3460100'

jobs:
  # ---------------------------------------------------------------- Linux ----
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64,   runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          # The arm64 runners hit ports.ubuntu.com over a flaky link: `update`
          # succeeds but the .deb fetches drop mid-transfer. Force IPv4, give apt
          # generous per-file retries, and wrap the install in a retry loop.
          sudo tee /etc/apt/apt.conf.d/99net-resilience >/dev/null <<'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Retries "8";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
          sudo apt-get update
          for attempt in 1 2 3 4 5; do
            sudo apt-get install -y --no-install-recommends --fix-missing \
              build-essential cmake pkg-config ninja-build patchelf unzip curl \
              libpq-dev \
              libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxi-dev \
              libxfixes-dev libxinerama-dev libxss-dev libxkbcommon-dev \
              libxtst-dev \
              libwayland-dev wayland-protocols libgbm-dev libdrm-dev \
              libgl1-mesa-dev libasound2-dev libpulse-dev && break
            echo "apt-get install attempt $attempt failed; retrying in 15s"
            sleep 15
            sudo apt-get update || true
          done

      - name: Build SDL3 from source
        run: |
          set -eux
          curl -fsSL -o sdl.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL3_VERSION}/SDL3-${SDL3_VERSION}.tar.gz"
          sh scripts/verify_dep.sh sdl.tar.gz
          tar xzf sdl.tar.gz
          cmake -S "SDL3-${SDL3_VERSION}" -B sdlbuild -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST_LIBRARY=OFF -DCMAKE_INSTALL_PREFIX="$PWD/sdlinst"
          cmake --build sdlbuild
          cmake --install sdlbuild

      - name: Stage SDL3 driver
        run: |
          set -eux
          export PKG_CONFIG_PATH="$PWD/sdlinst/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          DEST="stdlib/SDL3/drivers/${{ matrix.target }}"
          mkdir -p "$DEST"
          cc -O2 -fPIC -shared -Wl,-soname,libzan_sdl3.so \
            -o "$DEST/libzan_sdl3.so" stdlib/SDL3/native/zan_sdl3.c \
            $(pkg-config --cflags sdl3) $(pkg-config --libs sdl3) -lm
          cp -L "$(pkg-config --variable=libdir sdl3)/libSDL3.so.0" "$DEST/libSDL3.so.0"
          patchelf --set-rpath '$ORIGIN' "$DEST/libzan_sdl3.so"
          printf 'libzan_sdl3.so\nlibSDL3.so.0\n' > "$DEST/zan_sdl3.bundle"
          ldd "$DEST/libzan_sdl3.so" || true

      - name: Stage SQLite driver
        run: |
          set -eux
          curl -fsSL -o sq.zip "$SQLITE_URL"
          sh scripts/verify_dep.sh sq.zip
          unzip -q sq.zip
          DEST="stdlib/System/Data/Sqlite/drivers/${{ matrix.target }}"
          mkdir -p "$DEST/static"
          cc -O2 -fPIC -shared -Wl,-soname,libsqlite3.so \
            -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE \
            -o "$DEST/libsqlite3.so" "$SQLITE_DIR/sqlite3.c" -lpthread -ldl -lm
          cc -O2 -fPIC -c -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 \
            -DSQLITE_ENABLE_RTREE -o sqlite3.o "$SQLITE_DIR/sqlite3.c"
          ar rcs "$DEST/static/libsqlite3.a" sqlite3.o

      - name: Stage PostgreSQL (libpq) driver
        run: bash scripts/stage_libpq_linux.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivers-${{ matrix.target }}
          path: |
            stdlib/SDL3/drivers/${{ matrix.target }}/
            stdlib/System/Data/Sqlite/drivers/${{ matrix.target }}/
            stdlib/System/Data/Postgres/drivers/${{ matrix.target }}/

  # ---------------------------------------------------------------- macOS ----
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-14 }
          - { target: macos-x64,   runner: macos-13 }
    runs-on: ${{ matrix.runner }}
    # Only this job needs to write back the refreshed GUI dylibs to main.
    # Elevate just here (top-level is contents: read) and gate the auto-push
    # behind the protected "auto-commit" environment: give that environment a
    # required reviewer in the repo settings to add manual approval.
    environment: auto-commit
    permissions:
      contents: write
    # Intel runners can sit queued for the full 24h job limit, which used to
    # hold the whole run (and its artifacts) hostage. The GUI driver for x64 is
    # cross-built on the arm64 runner below, so this job only carries the
    # brew-built bundles: let it give up early and never block the others.
    timeout-minutes: ${{ matrix.target == 'macos-x64' && 45 || 60 }}
    continue-on-error: ${{ matrix.target == 'macos-x64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install deps
        run: brew install sdl3 libpq sqlite pkg-config

      - name: Stage SDL3 driver
        run: |
          set -eux
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix sdl3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          DEST="stdlib/SDL3/drivers/${{ matrix.target }}"
          mkdir -p "$DEST"
          xcrun clang -O2 -fPIC -dynamiclib -install_name @rpath/libzan_sdl3.dylib \
            -o "$DEST/libzan_sdl3.dylib" stdlib/SDL3/native/zan_sdl3.c \
            $(pkg-config --cflags sdl3) $(pkg-config --libs sdl3) -lm
          cp -L "$(pkg-config --variable=libdir sdl3)/libSDL3.0.dylib" "$DEST/libSDL3.0.dylib"
          chmod u+w "$DEST/libSDL3.0.dylib"
          SDLDEP="$(otool -L "$DEST/libzan_sdl3.dylib" | awk '/libSDL3/{print $1; exit}')"
          install_name_tool -change "$SDLDEP" @rpath/libSDL3.0.dylib "$DEST/libzan_sdl3.dylib"
          install_name_tool -id @rpath/libSDL3.0.dylib "$DEST/libSDL3.0.dylib"
          install_name_tool -add_rpath @loader_path "$DEST/libzan_sdl3.dylib" || true
          codesign --force --sign - "$DEST/libSDL3.0.dylib"
          codesign --force --sign - "$DEST/libzan_sdl3.dylib"
          printf 'libzan_sdl3.dylib\nlibSDL3.0.dylib\n' > "$DEST/zan_sdl3.bundle"
          otool -L "$DEST/libzan_sdl3.dylib"

      - name: Stage SQLite driver
        run: |
          set -eux
          curl -fsSL -o sq.zip "$SQLITE_URL"
          sh scripts/verify_dep.sh sq.zip
          unzip -q sq.zip
          DEST="stdlib/System/Data/Sqlite/drivers/${{ matrix.target }}"
          mkdir -p "$DEST/static"
          xcrun clang -O2 -fPIC -dynamiclib -install_name @rpath/libsqlite3.dylib \
            -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 -DSQLITE_ENABLE_RTREE \
            -o "$DEST/libsqlite3.dylib" "$SQLITE_DIR/sqlite3.c"
          xcrun clang -O2 -fPIC -c -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_JSON1 \
            -DSQLITE_ENABLE_RTREE -o sqlite3.o "$SQLITE_DIR/sqlite3.c"
          ar rcs "$DEST/static/libsqlite3.a" sqlite3.o
          codesign --force --sign - "$DEST/libsqlite3.dylib"

      - name: Stage PostgreSQL (libpq) driver
        run: bash scripts/stage_libpq_macos.sh "${{ matrix.target }}"

      # The Cocoa GUI runtime is the one driver that cannot be built anywhere
      # but on a Mac (Objective-C against the Apple frameworks). Building it
      # here is what makes `zanc --target macos-*` able to link GUI programs
      # from Windows/Linux: the cross link resolves against this dylib, whose
      # own framework dependencies are bound on the target Mac.
      - name: Stage zan_gui driver (Cocoa)
        run: |
          set -eux
          DEST="stdlib/Gui/drivers/${{ matrix.target }}"
          mkdir -p "$DEST"
          xcrun clang -O2 -fPIC -dynamiclib -mmacosx-version-min=11.0 \
            -install_name @rpath/libzan_gui.dylib -o "$DEST/libzan_gui.dylib" \
            -DZAN_GUI_COCOA src/runtime/gui_runtime.c src/runtime/gui_runtime_mac.m \
            -lm -framework Cocoa -framework CoreText -framework QuartzCore \
            -framework IOSurface -framework WebKit
          codesign --force --sign - "$DEST/libzan_gui.dylib"
          printf 'libzan_gui.dylib\n' > "$DEST/zan_gui.bundle"
          otool -l "$DEST/libzan_gui.dylib" | grep -A3 LC_BUILD_VERSION
          otool -L "$DEST/libzan_gui.dylib"

      # The GUI driver has no third-party dependency -- only system frameworks,
      # and the macOS SDK carries both slices -- so the Intel one can be built
      # right here with -arch. That keeps GUI cross-linking for `macos-x64`
      # independent of the (perpetually queued) Intel runner, which is still
      # needed for the brew-installed drivers (SDL3/libpq/sqlite).
      - name: Stage zan_gui driver for macos-x64 (cross -arch)
        if: matrix.target == 'macos-arm64'
        run: |
          set -eux
          DEST="stdlib/Gui/drivers/macos-x64"
          mkdir -p "$DEST"
          xcrun clang -O2 -fPIC -dynamiclib -arch x86_64 -mmacosx-version-min=11.0 \
            -install_name @rpath/libzan_gui.dylib -o "$DEST/libzan_gui.dylib" \
            -DZAN_GUI_COCOA src/runtime/gui_runtime.c src/runtime/gui_runtime_mac.m \
            -lm -framework Cocoa -framework CoreText -framework QuartzCore \
            -framework IOSurface -framework WebKit
          codesign --force --sign - "$DEST/libzan_gui.dylib"
          printf 'libzan_gui.dylib\n' > "$DEST/zan_gui.bundle"
          file "$DEST/libzan_gui.dylib"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.target == 'macos-arm64'
        with:
          name: gui-macos-x64
          path: stdlib/Gui/drivers/macos-x64/

      # Refresh the committed dylibs. A cross link reads them straight out of
      # the working tree, so a GUI runtime change that is not mirrored here
      # fails every `--target macos-*` publish with undefined symbols -- which
      # is exactly what a developer on Windows sees, days later.
      - name: Commit refreshed macOS GUI drivers
        if: >-
          matrix.target == 'macos-arm64' && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        run: |
          set -eux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stdlib/Gui/drivers/macos-arm64 stdlib/Gui/drivers/macos-x64
          if git diff --cached --quiet; then
            echo "drivers already current"
            exit 0
          fi
          git commit -m 'drivers: rebuild macOS GUI dylibs (arm64 + x64)'
          # The earlier steps leave the brew-staged bundles dirty in the work
          # tree; a plain rebase refuses to run with those around.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivers-${{ matrix.target }}
          path: |
            stdlib/SDL3/drivers/${{ matrix.target }}/
            stdlib/System/Data/Sqlite/drivers/${{ matrix.target }}/
            stdlib/System/Data/Postgres/drivers/${{ matrix.target }}/
            stdlib/Gui/drivers/${{ matrix.target }}/

  # -------------------------------------------------------------- Windows ----
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win-x64,   msystem: MINGW64,    prefix: mingw-w64-x86_64 }
          - { target: win-arm64, msystem: CLANGARM64, prefix: mingw-w64-clang-aarch64 }
    runs-on: ${{ matrix.target == 'win-arm64' && 'windows-11-arm' || 'windows-latest' }}
    # win-arm64 SDL3 packaging is not yet reliably available in MSYS2; keep the
    # job best-effort so it never blocks the other targets.
    continue-on-error: ${{ matrix.target == 'win-arm64' }}
    # This job commits the refreshed cross-link runtime objects to main; see
    # the macos job for the environment/approval note.
    environment: auto-commit
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-sdl3
            ${{ matrix.prefix }}-sqlite3
            ${{ matrix.prefix }}-postgresql
            ${{ matrix.target == 'win-x64' && 'mingw-w64-x86_64-openssl' || '' }}

      # Cross-linking a Windows-on-ARM program needs aarch64 copies of the
      # runtime objects zanc otherwise builds for the host; nothing off an ARM
      # mingw toolchain can produce them, so they are built and committed here.
      # Kept ahead of the driver staging: an MSYS2 package that is missing for
      # CLANGARM64 must not take the runtime objects down with it.
      - name: Build cross runtime objects
        run: bash scripts/build_win_rt.sh "${{ matrix.target }}"

      # The GUI runtime DLL a published Windows program links against. The
      # committed win-x64 copy comes from the CMake build on a developer's
      # machine; win-arm64 has no such host, so it is built here from the same
      # source with the same Win32 backend, and the import library is derived
      # from the DLL's export table exactly like scripts/build_gui_driver.ps1.
      - name: Stage GUI driver
        if: matrix.target == 'win-arm64'
        # Same reason the build step sits ahead of this one: a missing
        # CLANGARM64 package here must not stop the runtime objects from being
        # committed below.
        continue-on-error: true
        run: |
          set -eux
          DEST="stdlib/Gui/drivers/${{ matrix.target }}"
          mkdir -p "$DEST"
          cc -O2 -shared -o "$DEST/zan_gui.dll" src/runtime/gui_runtime.c \
            -Wl,--out-implib,"$DEST/libzan_gui.dll.a" -static-libgcc \
            -luser32 -lgdi32 -ldwmapi -lshcore -limm32 -lole32 -lrpcrt4
          # WebView2Loader: the WebView widget resolves it at run time, so the
          # matching arch has to travel with the program.
          curl -fsSL -o wv2.zip \
            "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40"
          sh scripts/verify_dep.sh wv2.zip
          mkdir -p wv2 && unzip -qo wv2.zip -d wv2
          WVARCH=$([ "${{ matrix.target }}" = win-arm64 ] && echo arm64 || echo x64)
          cp "wv2/build/native/$WVARCH/WebView2Loader.dll" "$DEST/WebView2Loader.dll"
          printf 'zan_gui.dll\nWebView2Loader.dll if WebView\n' \
            > "$DEST/zan_gui.bundle"

      # OpenSSL's static archives reference MinGW fortify/stack-check symbols
      # and crypt32. Keep these support archives beside the TLS archives so
      # native links do not depend on the host MinGW's CRT or import libraries.
      - name: Stage TLS static archives
        if: matrix.target == 'win-x64'
        run: |
          set -eux
          P="$(cygpath -u "$MINGW_PREFIX")"
          TDEST="stdlib/System/Net/Tls/drivers/${{ matrix.target }}/static"
          mkdir -p "$TDEST"
          cp "$P/lib/libssl.a" "$TDEST/libssl.a"
          cp "$P/lib/libcrypto.a" "$TDEST/libcrypto.a"
          cp "$P/lib/libcrypt32.a" "$TDEST/libcrypt32.a"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          for obj in \
            lib64_libmingwex_a-chk_fail.o \
            lib64_libmingwex_a-memcpy_chk.o \
            lib64_libmingwex_a-memset_chk.o \
            lib64_libmingwex_a-stack_chk_fail.o \
            lib64_libmingwex_a-stack_chk_guard.o; do
            (cd "$TMP" && ar x "$P/lib/libmingwex.a" "$obj")
          done
          rm -f "$TDEST/libzan_tls_mingw_support.a"
          ar rD "$TDEST/libzan_tls_mingw_support.a" "$TMP"/*.o
          cat > "$TDEST/ssl.libs" <<'EOF'
          # OpenSSL 3.6.3 MinGW-w64 Libs.private dependencies.
          # MinGW fortify/stack-check objects from MSYS2 mingw-w64-x86_64-crt-git.
          # The local crypt32 import library comes from that package as well.
          zan_tls_mingw_support
          crypt32
          ws2_32
          gdi32
          EOF
          cp "$TDEST/ssl.libs" "$TDEST/crypto.libs"
          sh scripts/verify_dep.sh "$TDEST/libssl.a"
          sh scripts/verify_dep.sh "$TDEST/libcrypto.a"
          ls -la "$TDEST"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: winrt-${{ matrix.target }}
          path: |
            toolchain/${{ matrix.target }}/zanrt_*.o
            toolchain/${{ matrix.target }}/mingw/lib/lib*.a
            stdlib/Gui/drivers/${{ matrix.target }}/
            stdlib/System/Net/Tls/drivers/${{ matrix.target }}/static/

      # PowerShell, not the job's msys2 shell: the MSYS2 environments here ship
      # no git, so the runner's own git has to do the commit.
      - name: Commit refreshed Windows runtime objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # *.o is gitignored; these are our own build products, tracked so a
          # cross publish works from a plain checkout.
          $sub = 'toolchain/${{ matrix.target }}'
          git add -f "$sub/zanrt_io.o" "$sub/zanrt_io_mt.o" "$sub/zanrt_sync.o" `
                     "$sub/zanrt_file.o" "$sub/zanrt_timer.o"
          if ('${{ matrix.target }}' -eq 'win-x64') {
            # TLS archives are generated from MSYS2's OpenSSL and CRT packages;
            # *.a is ignored by default, so force-add this self-contained set.
            git add -f 'stdlib/System/Net/Tls/drivers/win-x64/static'
          }
          if ('${{ matrix.target }}' -eq 'win-arm64' -and
              (Test-Path 'stdlib/Gui/drivers/win-arm64')) {
            git add 'stdlib/Gui/drivers/win-arm64'
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'runtime objects already current'
            exit 0
          }
          git commit -m 'drivers: refresh the ${{ matrix.target }} cross-link bundle'
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Stage drivers (SDL3 + SQLite + libpq)
        run: |
          set -eux
          P="$(cygpath -u "$MINGW_PREFIX")"
          # SDL3 bridge
          SDEST="stdlib/SDL3/drivers/${{ matrix.target }}"
          mkdir -p "$SDEST"
          # msys2 has no pkg-config here (and the mingw pkg-config package is
          # unavailable for CLANGARM64), so link SDL3 directly from $MINGW_PREFIX.
          cc -O2 -shared -o "$SDEST/zan_sdl3.dll" stdlib/SDL3/native/zan_sdl3.c \
            -I"$P/include" -L"$P/lib" -lSDL3 \
            -Wl,--out-implib,"$SDEST/libzan_sdl3.dll.a" -static-libgcc
          cp "$P/bin/SDL3.dll" "$SDEST/SDL3.dll"
          printf 'zan_sdl3.dll\nSDL3.dll\n' > "$SDEST/zan_sdl3.bundle"
          # SQLite: mingw ships this as libsqlite3-0.dll, but the driver
          # manifest loads "sqlite3", so stage it as sqlite3.dll.
          QDEST="stdlib/System/Data/Sqlite/drivers/${{ matrix.target }}"
          mkdir -p "$QDEST"
          SQLSRC=""
          for c in "$P"/bin/libsqlite3*.dll "$P"/bin/sqlite3.dll; do
            [ -f "$c" ] && { SQLSRC="$c"; break; }
          done
          [ -n "$SQLSRC" ] || { echo "sqlite3 dll not found in $P/bin" >&2; exit 1; }
          cp "$SQLSRC" "$QDEST/sqlite3.dll"
          [ -f "$P/lib/libsqlite3.dll.a" ] && cp "$P/lib/libsqlite3.dll.a" "$QDEST/" || true
          # libpq + closure: copy the DLLs libpq depends on (ldd within msys2)
          GDEST="stdlib/System/Data/Postgres/drivers/${{ matrix.target }}"
          mkdir -p "$GDEST"
          PQSRC=""
          for c in "$P"/bin/libpq.dll "$P"/bin/libpq*.dll; do
            [ -f "$c" ] && { PQSRC="$c"; break; }
          done
          [ -n "$PQSRC" ] || { echo "libpq dll not found in $P/bin" >&2; exit 1; }
          cp "$PQSRC" "$GDEST/libpq.dll"
          ldd "$PQSRC" | awk '{print $3}' \
            | grep -iE "/mingw|/clang" | while read -r dep; do
              [ -f "$dep" ] && cp -n "$dep" "$GDEST/" || true
            done || true
          { echo libpq.dll; ls "$GDEST" | grep -viE '^(libpq\.dll|pq\.bundle)$' | sort || true; } > "$GDEST/pq.bundle"
          ls -la "$SDEST" "$QDEST" "$GDEST"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drivers-${{ matrix.target }}
          path: |
            stdlib/SDL3/drivers/${{ matrix.target }}/
            stdlib/System/Data/Sqlite/drivers/${{ matrix.target }}/
            stdlib/System/Data/Postgres/drivers/${{ matrix.target }}/
            stdlib/System/Net/Tls/drivers/${{ matrix.target }}/

  # -------------------------------------------------------------- Release ----
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    # Publishes a GitHub Release: the one job that legitimately writes.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: dist }
      - name: Zip per-target bundles
        run: cd dist && for d in drivers-*; do zip -r "../$d.zip" "$d"; done
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: '*.zip'
