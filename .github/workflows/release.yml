name: release

# Build the self-contained Zan IDE / toolchain bundle for each platform and,
# on a version tag, attach the archives + SHA256SUMS to a GitHub Release.
#
# Triggers:
#   - workflow_dispatch : build + package on demand (artifacts only)
#   - push tags v*      : build + package + publish a GitHub Release
#   - pull_request (this file): validate build + package without releasing
#
# Layout produced per platform mirrors docs/RELEASE.md:
#   <bundle>/ ZanIDE[.exe] (Windows only, for now) + <gui runtime>
#             toolchain/{zanc, zan-lsp, zan-dap, zanfmt, zandoc, ...}
#             stdlib/ templates/ examples/ README.txt VERSION
#
# NOTE: the IDE binary itself is currently Windows-only (clang-cl). The
# Linux/macOS bundles ship the compiler + CLIs + stdlib as an SDK until the
# cross-platform IDE build recipe (docs/RELEASE.md 5.2) lands.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  runtime-sanitizers:
    name: Release runtime (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Execute release multiworker soak
        env:
          SANITIZER: ${{ matrix.sanitizer }}
          CC: gcc
        run: |
          mkdir -p build/test-out
          set -o pipefail
          bash tests/runtime/run_multiworker_soak.sh release "$SANITIZER" 2>&1 | tee "build/test-out/release-runtime-$SANITIZER.log"
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-runtime-${{ matrix.sanitizer }}
          path: build/test-out/release-runtime-*.log
          if-no-files-found: error

  # --------------------------------------------------------------- Linux ----
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: "17.0"
          cached: true
      - run: echo "LLVM_DIR=$LLVM_PATH/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gdb
          release_gdb=$(command -v gdb)
          test -x "$release_gdb"
          echo "ZAN_GDB=$release_gdb" >> "$GITHUB_ENV"

      - name: Build toolchain
        run: |
          set -euo pipefail
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR" \
            -DZAN_BUILD_GUI=OFF -DZAN_BUILD_GUI_TESTS=OFF -DZAN_REQUIRE_CROSS_RUNTIME=ON
          # Hosted runners are isolated; observe the existing build in place.
          release_native=(--native-input "$LLVM_DIR/LLVMConfig.cmake")
          for tool in ld.lld ld64.lld llvm-ar; do
            release_native+=(--native-input "$(command -v "$tool")")
          done
          if [ -n "${ZAN_GDB:-}" ]; then
            release_native+=(--native-input "$ZAN_GDB")
          fi
          for target in linux-musl macos/x64; do
            for file in zanrt_timer.o zanrt_io.o zanrt_io_mt.o zanrt_sync.o zanrt_file.o zanrt_decimal.o zan_embed_api.o zan_inflate.o libzancrypto.a; do
              release_native+=(--native-input "$PWD/toolchain/$target/$file")
            done
            if [ -f "toolchain/$target/zanrt_crash.o" ]; then
              release_native+=(--native-input "$PWD/toolchain/$target/zanrt_crash.o")
            fi
          done
          for file in linux-musl/libc.a linux-musl/crt1.o linux-musl/crti.o linux-musl/crtn.o macos/libSystem.tbd; do
            release_native+=(--native-input "$PWD/toolchain/$file")
          done
          python3 -I -B scripts/release_source_manifest.py capture --repo "$PWD" --build build "${release_native[@]}"
          cmake --build build -j
          python3 -I -B scripts/release_source_manifest.py seal --repo "$PWD" --build build \
            --artifact build/zan-lsp --artifact build/zan-dap --artifact build/zanfmt --artifact build/zandoc

      - name: Validate release build
        run: cmake -DBUILD_DIR=build -P scripts/release_quality_gate.cmake

      - name: Upload release validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-${{ runner.os }}-${{ matrix.arch }}
          path: build/test-out/release-*
          if-no-files-found: error

      - name: Package bundle
        run: bash scripts/package_bundle.sh linux ${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zan-ide-linux-${{ matrix.arch }}
          path: out/*.tar.gz*

  # --------------------------------------------------------------- macOS ----
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-14 }
          - { arch: x64,   runner: macos-13 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install LLVM + deps
        run: |
          brew install llvm@17 ninja
          echo "LLVM_DIR=$(brew --prefix llvm@17)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@17)/bin" >> "$GITHUB_PATH"

      - name: Build toolchain
        run: |
          set -euo pipefail
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR" \
            -DZAN_BUILD_GUI=OFF -DZAN_BUILD_GUI_TESTS=OFF -DZAN_REQUIRE_CROSS_RUNTIME=ON
          # Hosted runners are isolated; observe the existing build in place.
          release_native=(--native-input "$LLVM_DIR/LLVMConfig.cmake")
          for tool in ld.lld ld64.lld llvm-ar; do
            release_native+=(--native-input "$(command -v "$tool")")
          done
          if [ -n "${ZAN_GDB:-}" ]; then
            release_native+=(--native-input "$ZAN_GDB")
          fi
          for target in linux-musl macos/x64; do
            for file in zanrt_timer.o zanrt_io.o zanrt_io_mt.o zanrt_sync.o zanrt_file.o zanrt_decimal.o zan_embed_api.o zan_inflate.o libzancrypto.a; do
              release_native+=(--native-input "$PWD/toolchain/$target/$file")
            done
            if [ -f "toolchain/$target/zanrt_crash.o" ]; then
              release_native+=(--native-input "$PWD/toolchain/$target/zanrt_crash.o")
            fi
          done
          for file in linux-musl/libc.a linux-musl/crt1.o linux-musl/crti.o linux-musl/crtn.o macos/libSystem.tbd; do
            release_native+=(--native-input "$PWD/toolchain/$file")
          done
          python3 -I -B scripts/release_source_manifest.py capture --repo "$PWD" --build build "${release_native[@]}"
          cmake --build build -j
          python3 -I -B scripts/release_source_manifest.py seal --repo "$PWD" --build build \
            --artifact build/zan-lsp --artifact build/zan-dap --artifact build/zanfmt --artifact build/zandoc

      - name: Validate release build
        run: cmake -DBUILD_DIR=build -P scripts/release_quality_gate.cmake

      - name: Upload release validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-${{ runner.os }}-${{ matrix.arch }}
          path: build/test-out/release-*
          if-no-files-found: error

      - name: Package bundle
        run: bash scripts/package_bundle.sh macos ${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zan-ide-macos-${{ matrix.arch }}
          path: out/*.tar.gz*

  # ------------------------------------------------------------- Windows ----
  # Full IDE bundle: reproduces the local build (clang-cl + LLVM + staged GUI +
  # bundled MinGW linker), then build_ide.ps1 + publish_ide.ps1.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # find_package(LLVM CONFIG) needs the LLVM dev files (headers, import libs
      # and LLVMConfig.cmake). The chocolatey `llvm` package and the
      # LLVM-*-win64.exe installer ship only the clang toolchain (no libs/cmake),
      # so use the official clang+llvm MSVC archive, which is the full dev
      # distribution and also provides clang-cl/lld-link/llvm-rc. Pinned to the
      # LLVM version used for local IDE builds.
      - name: Install LLVM (dev libs + clang-cl, MSVC ABI)
        shell: pwsh
        run: |
          # The version is pinned once, in deps/checksums.txt beside the archive
          # hash -- not repeated here, so a bump cannot update one and miss the
          # other.
          $pin = Select-String -Path deps/checksums.txt `
                    -Pattern '^# LLVM ([0-9]+\.[0-9]+\.[0-9]+) ' | Select-Object -First 1
          if (-not $pin) { throw "LLVM version pin missing from deps/checksums.txt" }
          $ver = $pin.Matches[0].Groups[1].Value
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/clang+llvm-$ver-x86_64-pc-windows-msvc.tar.xz"
          curl.exe -L --retry 3 --retry-all-errors -o llvm.tar.xz $url
          # Verify against the pinned hash in deps/checksums.txt before use.
          $want = (Select-String -Path deps/checksums.txt -Pattern '^[0-9a-f]{64}  llvm\.tar\.xz$').Line.Substring(0, 64)
          $got = (Get-FileHash llvm.tar.xz -Algorithm SHA256).Hash.ToLower()
          if ($want -ne $got) { throw "LLVM archive checksum mismatch: got $got" }
          New-Item -ItemType Directory -Force build/llvm-dist | Out-Null
          tar -xf llvm.tar.xz -C build/llvm-dist --strip-components=1
          Remove-Item llvm.tar.xz
          if (-not (Test-Path build/llvm-dist/lib/cmake/llvm/LLVMConfig.cmake)) {
            throw "LLVMConfig.cmake missing from the LLVM archive"
          }
          "LLVM_ROOT=$PWD/build/llvm-dist" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$PWD/build/llvm-dist/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install MinGW (bundled linker source for self-contained zanc)
        run: choco install mingw --no-progress -y

      - name: Pin debugger for validation and packaging
        shell: pwsh
        run: |
          $gccDir = Split-Path -Parent (Get-Command gcc -ErrorAction Stop).Source
          $gdb = Join-Path $gccDir 'gdb.exe'
          if (-not (Test-Path -PathType Leaf $gdb)) { throw "Required MinGW debugger missing: $gdb" }
          "ZAN_GDB=$gdb" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZAN_GDB_DIR=$gccDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # LLVM's DebugInfoPDB component links diaguids.lib from the DIA SDK, and
      # the prebuilt archive's CMake exports bake the absolute path from the VS
      # edition LLVM was built with. Rather than guessing that edition (or
      # requiring it to exist), find the real library on this runner and rewrite
      # the exported path. Nothing is written outside the extracted LLVM tree.
      - name: Locate DIA SDK lib for LLVM's DebugInfoPDB component
        shell: pwsh
        run: |
          $real = $null
          if ($env:ZAN_DIAGUIDS) {
            if (-not (Test-Path $env:ZAN_DIAGUIDS)) {
              throw "ZAN_DIAGUIDS is set but not a file: $env:ZAN_DIAGUIDS"
            }
            $real = Get-Item $env:ZAN_DIAGUIDS
          }
          # 1) Some LLVM archives carry the lib beside their CMake exports.
          if (-not $real) {
            $real = Get-ChildItem $env:LLVM_ROOT -Recurse -Filter diaguids.lib -File `
                      -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          }
          # 2) Otherwise ask vswhere for every installed VS (any edition/year).
          if (-not $real) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              foreach ($root in @(& $vswhere -all -products * -property installationPath)) {
                $hit = Get-ChildItem $root -Recurse -Filter diaguids.lib -File `
                         -ErrorAction SilentlyContinue |
                       Where-Object { $_.FullName -match 'DIA SDK\\lib\\amd64' } |
                       Select-Object -First 1
                if ($hit) { $real = $hit; break }
              }
            }
          }
          if (-not $real) {
            throw "diaguids.lib not found. Searched $env:LLVM_ROOT and every VS install reported by vswhere. Install the 'Desktop development with C++' workload (DIA SDK), or set ZAN_DIAGUIDS to the amd64 diaguids.lib."
          }
          Write-Host "Using $($real.FullName)"
          # Rewrite only the baked absolute library path in LLVM's CMake exports.
          $realPath = $real.FullName.Replace('\', '/').Replace('$', '$$')
          $patched = 0
          Get-ChildItem (Join-Path $env:LLVM_ROOT 'lib\cmake') -Recurse -Include *.cmake,*.txt -File `
            -ErrorAction SilentlyContinue | ForEach-Object {
              $text = Get-Content -Raw $_.FullName
              $new = [regex]::Replace($text, '([A-Za-z]:[\\/][^";]*diaguids\.lib)', $realPath)
              if ($new -ne $text) {
                Set-Content -Path $_.FullName -Value $new -NoNewline
                $patched++
              }
            }
          if ($patched -eq 0) { Write-Host "No baked diaguids.lib path found; nothing to patch." }

      - name: Configure + build toolchain (clang-cl)
        shell: pwsh
        run: |
          $mingw = (Split-Path -Parent (Split-Path -Parent (Get-Command gcc).Source))
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link -DLLVM_DIR="$env:LLVM_ROOT/lib/cmake/llvm" `
            -DZAN_MINGW_ROOT="$mingw" -DZAN_REQUIRE_CROSS_RUNTIME=ON
          if ($LASTEXITCODE -ne 0) { throw 'Release configure failed' }
          # Isolated CI runner: use the helper around this existing build.
          $releaseNative = @("$env:LLVM_ROOT/lib/cmake/llvm/LLVMConfig.cmake", $env:ZAN_GDB)
          foreach ($tool in @('ld.lld', 'ld64.lld', 'llvm-ar')) {
            $releaseNative += (Get-Command $tool -ErrorAction Stop).Source
          }
          foreach ($target in @('linux-musl', 'macos/x64')) {
            foreach ($file in @('zanrt_timer.o', 'zanrt_io.o', 'zanrt_io_mt.o', 'zanrt_sync.o', 'zanrt_file.o', 'zanrt_decimal.o', 'zan_embed_api.o', 'zan_inflate.o', 'libzancrypto.a')) {
              $releaseNative += Join-Path $PWD "toolchain/$target/$file"
            }
            $crash = Join-Path $PWD "toolchain/$target/zanrt_crash.o"
            if (Test-Path -PathType Leaf $crash) { $releaseNative += $crash }
          }
          foreach ($file in @('linux-musl/libc.a', 'linux-musl/crt1.o', 'linux-musl/crti.o', 'linux-musl/crtn.o', 'macos/libSystem.tbd')) {
            $releaseNative += Join-Path $PWD "toolchain/$file"
          }
          # Include the debugger's portable DLL closure and ignored package inputs
          # before compilation; post-build inventory cannot establish those inputs.
          $sdkNativeArgs = @('native-inputs', '--repo', "$PWD", '--output', 'build/test-out/sdk-native-inputs.json',
            '--native-dir', 'stdlib', '--native-dir', 'packages')
          foreach ($file in @(Get-Item $env:ZAN_GDB) + @(Get-ChildItem (Split-Path -Parent $env:ZAN_GDB) -Filter '*.dll' -File)) {
            $sdkNativeArgs += @('--native-input', $file.FullName)
          }
          . ./scripts/sdk_stage.ps1
          $portableGdb = Resolve-SdkGdb
          $portableBin = Split-Path -Parent $portableGdb
          $sdkNativeArgs += @('--native-input', $portableGdb, '--payload-native-dir', $portableBin)
          $gdbShare = Join-Path (Split-Path -Parent $portableBin) 'share'
          if (Test-Path -PathType Container $gdbShare) { $sdkNativeArgs += @('--payload-native-dir', $gdbShare) }
          $sdkNativeArgs += @('--native-input', (Get-Command llvm-ar -ErrorAction Stop).Source)
          python -I -B scripts/sdk_stage_manifest.py @sdkNativeArgs
          if ($LASTEXITCODE -ne 0) { throw 'SDK native input discovery failed' }
          $releaseNative += (Get-Content build/test-out/sdk-native-inputs.json -Raw | ConvertFrom-Json).native_inputs
          python -I -B scripts/gen_design_halves.py
          if ($LASTEXITCODE -ne 0) { throw 'IDE design generation failed before capture' }
          & ./scripts/release_build_identity.ps1 -Action Capture -Build build -NativeInput $releaseNative -SdkNativeOutputs
          cmake --build build -j
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed; identity remains unsealed' }
          & ./scripts/publish_ide.ps1 -PrepareOnly -NoBump -SkipDesignGeneration
          & ./scripts/publish_ide.ps1 -SkipBuild -NoBump -PlanOnly
          python -I -B scripts/sdk_stage_manifest.py inputs --repo "$PWD" --build build `
            --plan build/test-out/sdk-stage-plan.json --output build/test-out/sdk-build-inputs.json
          if ($LASTEXITCODE -ne 0) { throw 'SDK artifact discovery failed' }
          $sdkInputs = Get-Content build/test-out/sdk-build-inputs.json -Raw | ConvertFrom-Json
          & ./scripts/release_build_identity.ps1 -Action Seal -Build build `
            -Artifact @($sdkInputs.artifacts)

      - name: Validate release build
        shell: pwsh
        run: cmake -DBUILD_DIR=build -P scripts/release_quality_gate.cmake

      - name: Upload release validation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-Windows-x64
          path: build/test-out/release-*
          if-no-files-found: error

      - name: Publish self-contained bundle
        shell: pwsh
        run: |
          # ZAN_GDB_DIR is pinned before validation to the tested debugger.
          if (-not (Test-Path -PathType Leaf $env:ZAN_GDB)) { throw "Validated debugger missing: $env:ZAN_GDB" }
          & ./scripts/publish_ide.ps1 -SkipBuild -NoBump
          python -I -B scripts/sdk_stage_manifest.py consume --sdk dist/win-x64 `
            --output build/test-out/sdk-consumption --filter '^console/console-args$'
          if ($LASTEXITCODE -ne 0) { throw 'Staged SDK consumption failed' }

      - name: Package archive
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force out | Out-Null
          $name = "zan-ide-$v-win-x64"
          # Archive the platform SDK root; renaming dist itself adds an unwanted
          # win-x64 layer between the archive root and ZanIDE/toolchain.
          $platform = Join-Path $PWD 'dist/win-x64'
          $archiveRoot = Join-Path $PWD "dist/$name"
          Move-Item -LiteralPath $platform -Destination $archiveRoot
          try {
            Compress-Archive -LiteralPath $archiveRoot -DestinationPath "out/$name.zip"
            (Get-FileHash "out/$name.zip" -Algorithm SHA256).Hash + "  $name.zip" |
              Set-Content "out/$name.zip.sha256"
          } finally {
            Move-Item -LiteralPath $archiveRoot -Destination $platform
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zan-ide-win-x64
          path: out/*

  # ------------------------------------------------------------- Release ----
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows, runtime-sanitizers]
    runs-on: ubuntu-latest
    # Publishes the GitHub Release: the one job that legitimately writes.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out }
      - name: Collect + aggregate checksums
        run: |
          cd out
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec mv {} . \;
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt 2>/dev/null || \
            shasum -a 256 *.zip *.tar.gz > SHA256SUMS.txt
          ls -la
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            out/*.zip
            out/*.tar.gz
            out/SHA256SUMS.txt
