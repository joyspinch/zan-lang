<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zan.Web 管理控制台</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div id="sidebar">
    <div class="brand">⚡ Zan.Web 控制台</div>
    <ul class="nav-list" id="navList">
      <li class="nav-group">系统监控</li>
      <li class="nav-item active" onclick="loadView('dashboard', event)">📊 服务运行指标</li>
      <li class="nav-group">系统管理</li>
      <li class="nav-item" onclick="loadView('users', event)">👥 用户体系</li>
      <li class="nav-item" onclick="loadView('depts', event)">🏢 部门架构</li>
      <li class="nav-item" onclick="loadView('roles', event)">🔒 角色与权限</li>
      <li class="nav-group">研发工具</li>
      <li class="nav-item" onclick="loadView('curd', event)">🪄 代码生成 (CURD)</li>
    </ul>
  </div>
  <div id="main">
    <header>
      <div class="header-title" id="pageTitle">服务运行指标与慢SQL监控</div>
      <div class="header-user">
        <span class="badge badge-success">● 在线</span>
        <span>管理员: <strong>admin</strong></span>
      </div>
    </header>
    <div id="content">
      <div class="grid">
        <div class="stat-card">
          <div class="stat-title">累计请求量 (Requests)</div>
          <div class="stat-val" id="stReq">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">全链路平均耗时</div>
          <div class="stat-val" id="stAvg">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">慢请求数 (>300ms)</div>
          <div class="stat-val" id="stSlowReq">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">慢 SQL 追踪数 (>200ms)</div>
          <div class="stat-val" id="stSlowSql">-</div>
        </div>
      </div>
      <div class="card">
        <div class="toolbar">
          <h3 id="tableTitle">数据视图</h3>
          <button class="btn btn-primary" onclick="refreshCurrent()">刷新数据</button>
        </div>
        <div id="tableBox">加载中...</div>
      </div>
    </div>
  </div>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
