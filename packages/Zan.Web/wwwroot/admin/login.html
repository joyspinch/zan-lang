<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>系统登录 - Zan.Web 控制台</title>
  <style>
    :root {
      --brand: #4f46e5;
      --brand-hover: #4338ca;
      --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --card-border: rgba(148, 163, 184, 0.15);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(148, 163, 184, 0.25);
      --error-bg: rgba(239, 68, 68, 0.12);
      --error-border: rgba(239, 68, 68, 0.4);
      --error-text: #fca5a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient background glowing orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.45;
    }
    .orb-1 { width: 400px; height: 400px; background: #4f46e5; top: 10%; left: 15%; }
    .orb-2 { width: 350px; height: 350px; background: #7c3aed; bottom: 10%; right: 15%; }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 40px 32px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--brand-gradient);
      border-radius: 14px;
      font-size: 26px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }
    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .brand-desc {
      font-size: 13px;
      color: var(--text-muted);
    }

    .alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
      animation: fadeIn 0.3s ease;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.25);
    }
    .form-input::placeholder {
      color: #64748b;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--brand-gradient);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transition: filter 0.15s, transform 0.15s;
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .quick-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      text-align: center;
    }
    .quick-tip {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .quick-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake {
      animation: shake 0.4s ease;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-container" id="loginCard">
    <div class="brand-header">
      <div class="brand-logo">⚡</div>
      <h1 class="brand-title">Zan.Web 控制台</h1>
      <p class="brand-desc">企业级统一应用基座与中后台服务</p>
    </div>

    <div class="alert" id="errorAlert"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">管理员账号</label>
        <div class="input-wrapper">
          <input type="text" id="username" class="form-input" placeholder="请输入用户名" autocomplete="username" autofocus required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">登录密码</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password" required />
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember" checked />
          <span>记住会话 (7天)</span>
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">登 录</button>
    </form>

    <div class="quick-box">
      <div class="quick-tip">默认管理员凭据：admin / 123456</div>
      <button class="quick-btn" type="button" onclick="fillAdmin()">一键填入演示账号</button>
    </div>

    <div class="footer">
      Powered by Zan Language &amp; Zan.Web
    </div>
  </div>

  <script>
    function fillAdmin() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = '123456';
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('errorAlert');
      const card = document.getElementById('loginCard');

      if (!user || !pass) {
        showError('请输入完整的账号与密码');
        return;
      }

      btn.disabled = true;
      btn.innerText = '正在验证身份...';
      alertBox.style.display = 'none';

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Accept': 'application/json'
          },
          body: `username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`
        });

        const data = await res.json();
        if (data.code === 0) {
          btn.innerText = '登录成功，正在进入系统...';
          if (data.data && data.data.AccessToken) {
            localStorage.setItem('zan_token', data.data.AccessToken);
            localStorage.setItem('zan_user', JSON.stringify(data.data));
          }
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next') || '/admin';
          window.location.href = next;
        } else {
          showError(data.msg || '账号或密码错误');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 400);
          btn.disabled = false;
          btn.innerText = '登 录';
        }
      } catch (err) {
        showError('请求失败，请检查网络或后端服务连接');
        btn.disabled = false;
        btn.innerText = '登 录';
      }
    }

    function showError(msg) {
      const alertBox = document.getElementById('errorAlert');
      alertBox.innerText = msg;
      alertBox.style.display = 'block';
    }
  </script>
</body>
</html>
