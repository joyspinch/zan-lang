<form data-submit action="/admin/dev/coder/tablesave">
  <input type="hidden" name="id" value="{{id}}">
  <div class="form">
    <label>表名</label>
    <input class="input" name="tableName" value="{{tableName}}" placeholder="shop_order（小写字母/数字/下划线）" required>
    <label>名称</label>
    <input class="input" name="title" value="{{title}}" placeholder="订单" required>
    <label>实体类名</label>
    <input class="input" name="entityName" value="{{entityName}}" placeholder="留空按表名自动生成 ShopOrder">
    <label>URL 分区</label>
    <input class="input" name="section" value="{{section}}" placeholder="content">
    <label>每页条数</label>
    <input class="input" type="number" name="pageSize" value="{{pageSize}}" placeholder="20（1~200）">
    <label>排序列</label>
    <select class="input" name="orderColumn">
      {{#each orderCols}}<option value="{{v}}" {{#if selected}}selected{{/if}}>{{label}}</option>{{/each}}
    </select>
    <label>排序方向</label>
    <select class="input" name="orderDesc">
      <option value="1" {{descSel}}>降序（新记录在前）</option>
      <option value="0" {{ascSel}}>升序</option>
    </select>
    <label>列表状态页签</label>
    <select class="input" name="tabColumn">
      {{#each tabCols}}<option value="{{v}}" {{#if selected}}selected{{/if}}>{{label}}</option>{{/each}}
    </select>
    <label>选项标签列</label>
    <input class="input" name="labelColumn" value="{{labelColumn}}" placeholder="留空自动探测 name→title→文本列">
    <label>菜单图标</label>
    <input class="input" name="menuIcon" value="{{menuIcon}}" placeholder="mdi 图标名（如 mdi:chart-bar），留空不显示">
    <label>CSV 导出</label>
    <label class="sw"><input type="checkbox" name="exportEnabled" value="1" {{exportChecked}}><span></span></label>
    <label>接口</label>
    <label class="sw"><input type="checkbox" name="apiEnabled" value="1" {{apiChecked}}><span></span></label>
  </div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>{{iCancel}}</button>
    <button class="btn primary" type="submit">{{iSave}}</button>
  </footer>
</form>
