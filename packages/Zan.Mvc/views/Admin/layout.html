<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/css/admin.css?v=14">
  <script src="/static/js/zan-table.js?v=2" defer></script>
  <script src="/static/js/admin.js?v=18" defer></script>
</head>
<body class="admin" data-tab-title="{{tabTitle}}">
<!-- 工作区：固定侧栏 + 标签条 + 面板，菜单点击以 X-Fragment 载入保持标签。 -->
<div class="ad-shell">
  <div class="ad-side-mask" data-side></div>
  <aside class="ad-side">
    <a class="ad-brand" href="/" target="_blank"><span class="ad-mark">Z</span><b>{{brand}}</b></a>
    <div class="ad-find">
      <input type="search" id="ad-find" placeholder="{{iFind}}" autocomplete="off">
      <kbd class="ad-find-kbd">Ctrl+K</kbd>
    </div>
    {{#each menu}}
      {{#if group}}<div class="ad-group">{{group}}</div>{{/if}}
      {{#if path}}<a class="mi {{active}}" href="{{path}}" data-tab data-title="{{title}}" data-icon="{{icon}}">{{title}}</a>{{/if}}
    {{/each}}
    <div class="ad-foot">
      <a class="mi" href="/" target="_blank" data-icon="mdi:web">{{iFront}}</a>
    </div>
  </aside>

  <div class="ad-main">
    <header class="ad-top">
      <button class="ad-menu-btn" type="button" data-side title="{{iMenuT}}">☰</button>
      <span class="ad-title">{{heading}}</span>
      <div class="ad-right">
        {{#if canMonitor}}<a class="ad-bell" id="ad-bell" href="/admin/monitor"
           data-tab data-title="{{iAlarm}}" title="{{iAlarm}}" hidden><span
           class="ad-bell-n" hidden>0</span>{{iAlarm}}</a>{{/if}}
        <button class="btn sm" type="button" data-refresh>{{iRefresh}}</button>
        <div class="ad-account" data-account>
          <button class="ad-account-btn" type="button" data-account-btn>
            <span class="ad-avatar">{{accountInitial}}</span>
            <span class="ad-account-name">{{accountName}}</span>
            <i class="caret down"></i>
          </button>
          <div class="ad-account-menu">
            <div class="who">
              <b>{{accountName}}</b>
              {{#if accountMail}}<span>{{accountMail}}</span>{{/if}}
            </div>
            <a href="/admin/profile" data-tab data-title="{{iProfile}}">{{iProfile}}</a>
            <a href="/admin/profile#password" data-tab data-title="{{iProfile}}">{{iPassword}}</a>
            <a class="danger" href="/admin/logout">{{iLogout}}</a>
          </div>
        </div>
      </div>
    </header>
    <div class="ad-tabbar">
      <button class="tabnav" type="button" data-tabnav="-1" title="向左">‹</button>
      <div class="ad-tabs" id="ad-tabs"></div>
      <button class="tabnav" type="button" data-tabnav="1" title="向右">›</button>
    </div>
    <div class="ad-panel" id="ad-panel">
      {{content}}
    </div>
  </div>
</div>

<button class="ai-fab" type="button" data-ai-btn title="AI 助手">AI</button>

<div class="notices" id="ad-notices"></div>
<div class="toasts" id="ad-toasts"></div>
</body>
</html>
