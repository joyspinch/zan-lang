<div class="toolbar">
  <b>{{title}} · 修订历史</b>
  <span class="mono muted">当前 r{{rev}}</span>
  <span class="sp"></span>
  <a class="btn sm" href="/admin/wiki/page?id={{id}}" data-load>{{iRead}}</a>
  <a class="btn sm" href="/admin/wiki" data-load>{{iBackList}}</a>
</div>
<div class="card">
  <div class="table-scroll">
  <table class="table" data-table="sort">
    <thead><tr><th class="num" style="width:80px">版本</th><th>修订说明</th><th style="width:130px">操作人</th><th style="width:170px">时间</th><th class="ops">{{iOps}}</th></tr></thead>
    <tbody>
      {{#each revisions}}
      <tr>
        <td class="num mono">{{#if current}}<span class="tag ok">r{{rev}} 当前</span>{{else}}r{{rev}}{{/if}}</td>
        <td>{{note}}</td>
        <td>{{editor}}</td>
        <td>{{createdAt}}</td>
        <td class="ops">
          <a href="/admin/wiki/revision?id={{id}}&rev={{rev}}" data-load>{{iView}}</a>
          {{#if canRollback}}<a href="#" data-post="/admin/wiki/rollback" data-args="id={{id}}&rev={{rev}}" data-confirm="回滚到 r{{rev}}？会生成一个新版本，历史保留。">回滚到此处</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  </div>
</div>
