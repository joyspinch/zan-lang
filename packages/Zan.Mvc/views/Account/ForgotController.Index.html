<section class="card auth-card{{#if error}} has-error{{/if}}">
  <header>
    {{#if brandLogoUrl}}<img class="brand-logo auth-logo" src="{{brandLogoUrl}}" alt="{{brand}}">{{else}}<span class="brand-mark">{{brandInitial}}</span>{{/if}}
    <div class="auth-head-copy">
      <div class="auth-kicker mono">PASSWORD RECOVERY</div>
      <h2>找回密码</h2>
      <p class="hint">通过绑定的企业邮箱接收一次性验证码</p>
    </div>
  </header>
  <form class="body form" method="post" action="/forgot/submit" data-auth-form>
    {{#if error}}<p class="flash bad" role="alert">{{error}}</p>{{/if}}
    {{#if done}}<p class="flash ok" role="status">{{done}}</p>{{/if}}
    <div class="form-row">
      <label for="email">邮箱</label>
      <div class="input-wrap">
        <span class="input-ico" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </span>
        <input class="input" id="email" type="email" name="email" value="{{email}}"
               placeholder="name@company.com" autocomplete="email" autofocus required>
      </div>
    </div>
    <div class="form-row">
      <label for="code">验证码</label>
      <div class="code-row">
        <div class="input-wrap">
          <span class="input-ico" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <input class="input" id="code" type="text" name="code" inputmode="numeric"
                 placeholder="6 位数字" maxlength="6" autocomplete="one-time-code" required>
        </div>
        <button class="btn" type="button" data-send-code="/forgot/code">获取验证码</button>
      </div>
    </div>
    <div class="form-row">
      <div class="label-row">
        <label for="pass">新密码</label>
        <span class="caps-hint" data-caps-hint hidden>已开启大写锁定</span>
      </div>
      <div class="input-wrap has-toggle">
        <span class="input-ico" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input class="input" id="pass" type="password" name="pass"
               placeholder="至少 8 位字符，建议包含字母与数字" autocomplete="new-password" minlength="8" data-pass-input data-pass-strength-target required>
        <button class="pass-toggle" type="button" data-pass-toggle aria-label="显示或隐藏密码" aria-pressed="false" title="显示或隐藏密码">
          <svg class="ico-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ico-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>
      </div>
      <div class="auth-strength" data-pass-strength hidden>
        <div class="strength-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <span class="strength-text" data-strength-text>密码强度</span>
      </div>
    </div>
    <button class="btn btn-primary auth-submit" type="submit" data-auth-submit data-loading-text="正在提交重设...">
      <span class="btn-spinner" aria-hidden="true"></span>
      <span class="btn-label">重设密码</span>
    </button>
    <p class="hint auth-sub-link">已有账号？<a href="/login">返回登录</a></p>
  </form>
</section>
