<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据网格</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #ef4444;
            --row-hover: rgba(56, 189, 248, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            font-size: 13px;
        }
        .grid-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-item input, .filter-item select {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-main);
            font-size: 13px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border-color); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: #fff; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 12px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: #182234;
            color: var(--text-muted);
            font-weight: 600;
        }
        tr:hover td {
            background: var(--row-hover);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: var(--text-muted);
        }
    </style>
    <script src="/static/zan/js/core/event-bus.js"></script>
    <script src="/static/zan/js/core/layer.js"></script>
</head>
<body>
    <div class="grid-card">
        <div class="grid-header">
            <div class="filter-bar" id="filterBar">
                <!-- 动态渲染过滤器 -->
            </div>
            <div class="actions-bar" id="topActions">
                <!-- 动态渲染顶部操作 -->
            </div>
        </div>

        <div style="overflow-x:auto;">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="pageInfo">共 0 条记录</span>
            <div id="pageControls">
                <!-- 分页按钮 -->
            </div>
        </div>
    </div>

    <script>
        window.GRID_SCHEMA = {{schemaJson}};
    </script>
    <script>
        // 前端数据渲染与拉取逻辑
        (function() {
            var schema = window.GRID_SCHEMA || {};
            var page = 1;
            var columns = schema.columns || schema.Columns || [];
            var tools = schema.tools || schema.Tools || schema.topActions || [];

            // 获取 CSRF 令牌
            function getCsrfToken() {
                var m = document.cookie.match(/(?:^|;\s*)zan_admin_csrf=([^;]+)/);
                return m ? decodeURIComponent(m[1]) : '';
            }

            // 渲染顶部工具栏按钮
            var topActions = document.getElementById('topActions');
            if (topActions && tools.length > 0) {
                tools.forEach(function(tool) {
                    var btn = document.createElement('button');
                    var btnClass = 'btn';
                    var tType = (tool.type || tool.color || '').toLowerCase();
                    if (tType === 'primary') btnClass += ' btn-primary';
                    else if (tType === 'error' || tType === 'danger') btnClass += ' btn-danger';
                    else btnClass += ' btn-secondary';
                    btn.className = btnClass;
                    btn.textContent = tool.name || tool.title;
                    btn.onclick = function() {
                        handleToolAction(tool);
                    };
                    topActions.appendChild(btn);
                });
            }

            function getSelectedIds() {
                var checkboxes = document.querySelectorAll('.row-select-checkbox:checked');
                var ids = [];
                checkboxes.forEach(function(cb) {
                    ids.push(cb.value);
                });
                return ids;
            }

            function handleToolAction(tool) {
                var action = tool.action || tool.actionType;
                var base = window.location.pathname.replace(/\/+$/, '');
                if (action === 'Export') {
                    window.location.href = base + '/Export';
                    return;
                }
                if (action === 'Add') {
                    if (window.ZanLayer) {
                        window.ZanLayer.open({
                            title: '新增' + (tool.showName || ''),
                            url: base + '/Add',
                            width: tool.width || '600px',
                            height: tool.height || '400px'
                        });
                    } else {
                        window.location.href = base + '/Add';
                    }
                    return;
                }
                if (action === 'Delete') {
                    var ids = getSelectedIds();
                    if (!ids || ids.length === 0) {
                        alert('请先勾选需要批量删除的记录！');
                        return;
                    }
                    if (!confirm('确定要删除选中的 ' + ids.length + ' 条记录吗？')) {
                        return;
                    }
                    var csrfToken = getCsrfToken();
                    fetch(base + '/BatchDelete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'X-CSRF-Token': csrfToken
                        },
                        body: 'ids=' + encodeURIComponent(ids.join(','))
                    })
                    .then(function(r) { return r.json(); })
                    .then(function(res) {
                        if (res.code === '0000') {
                            loadData();
                        } else {
                            alert(res.msg || '删除失败');
                        }
                    });
                    return;
                }
            }

            // 渲染表头
            var thead = document.getElementById('tableHead');
            if (thead && columns.length > 0) {
                var htr = document.createElement('tr');
                
                // 复选框全选列
                var thCheck = document.createElement('th');
                thCheck.style.width = '40px';
                thCheck.style.textAlign = 'center';
                var checkAll = document.createElement('input');
                checkAll.type = 'checkbox';
                checkAll.id = 'checkAllRows';
                checkAll.onchange = function() {
                    var cbs = document.querySelectorAll('.row-select-checkbox');
                    cbs.forEach(function(cb) { cb.checked = checkAll.checked; });
                };
                thCheck.appendChild(checkAll);
                htr.appendChild(thCheck);

                columns.forEach(function(col) {
                    if (col.hidden) return;
                    var th = document.createElement('th');
                    th.textContent = col.title || col.headerName || col.field;
                    if (col.width) th.style.width = col.width + 'px';
                    htr.appendChild(th);
                });
                thead.appendChild(htr);
            }

            function loadData() {
                var apiUrl = schema.apiUrl || (window.location.pathname.replace(/\/+$/, '') + '/Page');
                var url = apiUrl + (apiUrl.indexOf('?') > -1 ? '&' : '?') + 'page=' + page;
                fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                    .then(function(r) { return r.json(); })
                    .then(function(res) {
                        if (res.code === '0000' || res.code === 200) {
                            var items = (res.data && res.data.items) || (res.data && res.data.rows) || (Array.isArray(res.data) ? res.data : []);
                            var total = (res.data && res.data.total) || items.length;
                            renderRows(items);
                            document.getElementById('pageInfo').textContent = '共 ' + total + ' 条数据';
                        }
                    });
            }

            function renderRows(items) {
                var tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                var pk = (schema.conf && schema.conf.primaryKey) || 'id';

                items.forEach(function(row) {
                    var tr = document.createElement('tr');
                    
                    // 行复选框
                    var tdCheck = document.createElement('td');
                    tdCheck.style.textAlign = 'center';
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'row-select-checkbox';
                    cb.value = row[pk] !== undefined ? row[pk] : '';
                    tdCheck.appendChild(cb);
                    tr.appendChild(tdCheck);

                    columns.forEach(function(col) {
                        if (col.hidden) return;
                        var td = document.createElement('td');
                        td.style.textAlign = col.align || 'left';
                        td.textContent = row[col.field] !== undefined ? row[col.field] : '';
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            }

            // 初始化
            if (window.ZanBus) {
                window.ZanBus.on('grid:reload', loadData);
            }
            loadData();
        })();
    </script>
</body>
</html>
