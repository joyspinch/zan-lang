<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据网格</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #ef4444;
            --row-hover: rgba(56, 189, 248, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            font-size: 13px;
        }
        .grid-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-item input, .filter-item select {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-main);
            font-size: 13px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border-color); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: #fff; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 12px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: #182234;
            color: var(--text-muted);
            font-weight: 600;
        }
        tr:hover td {
            background: var(--row-hover);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: var(--text-muted);
        }
    </style>
    <script src="/static/zan/js/core/event-bus.js"></script>
    <script src="/static/zan/js/core/layer.js"></script>
</head>
<body>
    <div class="grid-card">
        <div class="grid-header">
            <div class="filter-bar" id="filterBar">
                <!-- 动态渲染过滤器 -->
            </div>
            <div class="actions-bar" id="topActions">
                <!-- 动态渲染顶部操作 -->
            </div>
        </div>

        <div style="overflow-x:auto;">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="pageInfo">共 0 条记录</span>
            <div id="pageControls">
                <!-- 分页按钮 -->
            </div>
        </div>
    </div>

    <script>
        // 前端数据渲染与拉取逻辑
        (function() {
            var schema = window.GRID_SCHEMA || {};
            var page = 1;

            function loadData() {
                if (!schema.apiUrl) return;
                var url = schema.apiUrl + (schema.apiUrl.indexOf('?') > -1 ? '&' : '?') + 'page=' + page;
                fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                    .then(function(r) { return r.json(); })
                    .then(function(res) {
                        if (res.code === '0000') {
                            renderRows(res.data.items || []);
                            document.getElementById('pageInfo').textContent = '共 ' + (res.data.total || 0) + ' 条数据';
                        }
                    });
            }

            function renderRows(items) {
                var tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                items.forEach(function(row) {
                    var tr = document.createElement('tr');
                    (schema.columns || []).forEach(function(col) {
                        var td = document.createElement('td');
                        td.style.textAlign = col.align || 'left';
                        td.textContent = row[col.field] !== undefined ? row[col.field] : '';
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
            }

            // 初始化
            if (window.ZanBus) {
                window.ZanBus.on('grid:reload', loadData);
            }
            loadData();
        })();
    </script>
</body>
</html>
