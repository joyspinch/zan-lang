<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>通用数据网格</title>
  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #1e293b;
      --border: #334155;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; font-size: 13px; }

    /* 容器与卡片 */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }

    /* 工具栏与过滤栏 */
    .toolbar-wrapper { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .tools { display: flex; gap: 8px; }
    .filters { display: flex; gap: 8px; align-items: center; }

    .input-control { height: 32px; background: #0f172a; border: 1px solid var(--border); border-radius: 4px; padding: 0 10px; color: #fff; font-size: 12px; outline: none; }
    .input-control:focus { border-color: var(--primary); }

    .btn { height: 32px; padding: 0 14px; border-radius: 4px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-default { background: #334155; color: #fff; }
    .btn-default:hover { background: #475569; }
    .btn-sm { height: 26px; padding: 0 8px; font-size: 11px; }

    /* 表格 */
    .table-responsive { width: 100%; overflow-x: auto; margin-top: 14px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12.5px; }
    th { background: #162032; color: var(--text-muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: #e2e8f0; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .cell-editable { cursor: pointer; border-bottom: 1px dashed rgba(255,255,255,0.2); }
    .cell-editable:hover { color: var(--primary); border-bottom-color: var(--primary); }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
    .tag-success { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .tag-danger { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    /* 分页栏 */
    .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 12px; color: var(--text-muted); }
    .page-buttons { display: flex; gap: 6px; }

    /* 弹窗通用 */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-backdrop.show { display: flex; }
    .modal-box { width: 480px; max-width: 90vw; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); max-height: 85vh; display: flex; flex-direction: column; }
    .modal-header { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #fff; }
    .modal-body { flex: 1; overflow-y: auto; padding-right: 4px; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; height: 34px; background: #0f172a; border: 1px solid var(--border); border-radius: 4px; padding: 0 10px; color: #fff; font-size: 12px; outline: none; }

    /* 树形列表 */
    .tree-node { padding: 4px 0; }
    .tree-node-header { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #e2e8f0; }
    .tree-children { padding-left: 24px; margin-top: 4px; }
    .tree-child-item { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; margin-bottom: 6px; font-size: 12px; color: #cbd5e1; }
  </style>
</head>
<body>

  <div class="card">
    <div class="toolbar-wrapper">
      <div class="tools" id="tools-container"></div>
      <div class="filters" id="filters-container"></div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr id="thead-row">
            <th width="40"><input type="checkbox" id="check-all" onchange="toggleCheckAll(this)"></th>
          </tr>
        </thead>
        <tbody id="tbody-rows">
          <tr><td colspan="10" style="text-align: center; color: var(--text-muted); padding: 40px;">数据加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <div id="page-info">共 0 条记录</div>
      <div class="page-buttons">
        <button class="btn btn-default btn-sm" id="btn-prev" onclick="changePage(-1)">上一页</button>
        <span id="page-current" style="line-height: 26px; padding: 0 8px;">1</span>
        <button class="btn btn-default btn-sm" id="btn-next" onclick="changePage(1)">下一页</button>
      </div>
    </div>
  </div>

  <!-- 新增/编辑通用弹窗 -->
  <div class="modal-backdrop" id="edit-modal">
    <div class="modal-box">
      <div class="modal-header" id="modal-title">表单操作</div>
      <div class="modal-body" id="modal-form-fields"></div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeEditModal()">取消</button>
        <button class="btn btn-primary" onclick="submitEditForm()">保存</button>
      </div>
    </div>
  </div>

  <!-- 角色分配权限树抽屉弹窗 -->
  <div class="modal-backdrop" id="rules-modal">
    <div class="modal-box" style="width: 580px;">
      <div class="modal-header">分配角色菜单与操作权限</div>
      <div class="modal-body" id="rules-tree-container"></div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeRulesModal()">取消</button>
        <button class="btn btn-primary" onclick="submitRoleRules()">保存权限</button>
      </div>
    </div>
  </div>

  <!-- 用户分配角色弹窗 -->
  <div class="modal-backdrop" id="roles-modal">
    <div class="modal-box" style="width: 460px;">
      <div class="modal-header">分配用户所属角色</div>
      <div class="modal-body" id="user-roles-container"></div>
      <div class="modal-footer">
        <button class="btn btn-default" onclick="closeUserRolesModal()">取消</button>
        <button class="btn btn-primary" onclick="submitUserRoles()">保存角色</button>
      </div>
    </div>
  </div>

  <script>
    const basePath = window.location.pathname.replace(/\/$/, '');
    let tableConfig = null;
    let currentPage = 1;
    let pageSize = 15;
    let currentRows = [];
    let activeRoleId = 0;
    let activeUserId = 0;

    // 1. 初始化并加载表格配置与数据
    async function init() {
      try {
        const confRes = await fetch(`${basePath}/conf`);
        tableConfig = await confRes.json();
        renderToolbar();
        renderHeaders();
        await loadData();
      } catch (e) {
        console.error('初始化失败', e);
      }
    }

    function renderToolbar() {
      const toolsContainer = document.getElementById('tools-container');
      toolsContainer.innerHTML = '';
      if (tableConfig.Tools) {
        tableConfig.Tools.forEach(t => {
          const btn = document.createElement('button');
          btn.className = `btn btn-${t.theme.toLowerCase() === 'error' ? 'danger' : (t.theme.toLowerCase() === 'primary' ? 'primary' : 'default')}`;
          btn.innerText = t.title;
          btn.onclick = () => handleToolClick(t.action);
          toolsContainer.appendChild(btn);
        });
      }

      const filtersContainer = document.getElementById('filters-container');
      filtersContainer.innerHTML = '';
      if (tableConfig.Filters) {
        tableConfig.Filters.forEach(f => {
          const input = document.createElement('input');
          input.className = 'input-control';
          input.placeholder = f.placeholder || f.title;
          input.id = `filter-${f.field}`;
          input.onkeydown = (e) => { if (e.key === 'Enter') loadData(); };
          filtersContainer.appendChild(input);
        });
        const searchBtn = document.createElement('button');
        searchBtn.className = 'btn btn-default';
        searchBtn.innerText = '搜索';
        searchBtn.onclick = () => loadData();
        filtersContainer.appendChild(searchBtn);
      }
    }

    function renderHeaders() {
      const theadRow = document.getElementById('thead-row');
      theadRow.innerHTML = '<th width="40"><input type="checkbox" id="check-all" onchange="toggleCheckAll(this)"></th>';
      if (tableConfig.Columns) {
        tableConfig.Columns.forEach(c => {
          const th = document.createElement('th');
          th.innerText = c.title;
          if (c.width) th.width = c.width;
          theadRow.appendChild(th);
        });
      }
      const actionTh = document.createElement('th');
      actionTh.innerText = '操作';
      actionTh.width = 160;
      theadRow.appendChild(actionTh);
    }

    async function loadData() {
      try {
        const res = await fetch(`${basePath}/list?page=${currentPage}&limit=${pageSize}`);
        const data = await res.json();
        currentRows = data.rows || [];
        renderRows(currentRows);
        document.getElementById('page-info').innerText = `共 ${data.total || 0} 条记录`;
        document.getElementById('page-current').innerText = currentPage;
      } catch (e) {
        console.error('加载数据失败', e);
      }
    }

    function renderRows(rows) {
      const tbody = document.getElementById('tbody-rows');
      tbody.innerHTML = '';
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12" style="text-align: center; color: var(--text-muted); padding: 40px;">暂无数据</td></tr>';
        return;
      }

      rows.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><input type="checkbox" class="row-checkbox" value="${row.id}"></td>`;

        tableConfig.Columns.forEach(col => {
          const td = document.createElement('td');
          let val = row[col.field];
          if (val === undefined || val === null) val = '';

          if (col.field === 'status') {
            const isOk = String(val) === '1';
            td.innerHTML = `<span class="tag ${isOk ? 'tag-success' : 'tag-danger'}">${isOk ? '正常' : '禁用'}</span>`;
          } else if (col.type === 'time' && val > 0) {
            td.innerText = new Date(val * 1000).toLocaleString('zh-CN');
          } else {
            td.innerText = val;
          }

          if (col.editable) {
            td.classList.add('cell-editable');
            td.title = '双击快速修改';
            td.ondblclick = () => handleInlineEdit(row.id, col.field, val, td);
          }
          tr.appendChild(td);
        });

        // 操作列
        const actionTd = document.createElement('td');
        actionTd.style.whiteSpace = 'nowrap';

        // 角色专属：分配权限
        if (basePath.includes('/system/role')) {
          const permBtn = document.createElement('button');
          permBtn.className = 'btn btn-default btn-sm';
          permBtn.style.marginRight = '6px';
          permBtn.innerText = '权限';
          permBtn.onclick = () => openRoleRulesModal(row.id);
          actionTd.appendChild(permBtn);
        }

        // 用户专属：分配角色与重置密码
        if (basePath.includes('/system/user')) {
          const roleBtn = document.createElement('button');
          roleBtn.className = 'btn btn-default btn-sm';
          roleBtn.style.marginRight = '6px';
          roleBtn.innerText = '角色';
          roleBtn.onclick = () => openUserRolesModal(row.id);
          actionTd.appendChild(roleBtn);

          const rstBtn = document.createElement('button');
          rstBtn.className = 'btn btn-default btn-sm';
          rstBtn.style.marginRight = '6px';
          rstBtn.innerText = '重置';
          rstBtn.onclick = () => resetPassword(row.id);
          actionTd.appendChild(rstBtn);
        }

        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-danger btn-sm';
        delBtn.innerText = '删除';
        delBtn.onclick = () => handleDelete(row.id);
        actionTd.appendChild(delBtn);

        tr.appendChild(actionTd);
        tbody.appendChild(tr);
      });
    }

    // 2. 行内即时编辑
    async function handleInlineEdit(id, field, oldValue, tdEl) {
      const newVal = prompt(`修改 ${field}:`, oldValue);
      if (newVal === null || newVal === String(oldValue)) return;
      const formData = new URLSearchParams();
      formData.append('id', id);
      formData.append('field', field);
      formData.append('value', newVal);
      const res = await fetch(`${basePath}/field`, { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        loadData();
      } else {
        alert(json.msg || '修改失败');
      }
    }

    // 3. 删除与批量删除
    async function handleDelete(id) {
      if (!confirm(`确定删除记录 ID: ${id} 吗？`)) return;
      const formData = new URLSearchParams();
      formData.append('id', id);
      const res = await fetch(`${basePath}/delete`, { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        loadData();
      } else {
        alert(json.msg || '删除失败');
      }
    }

    async function handleBatchDelete() {
      const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
      if (checkedBoxes.length === 0) {
        alert('请勾选要删除的记录');
        return;
      }
      const ids = Array.from(checkedBoxes).map(cb => cb.value).join(',');
      if (!confirm(`确定批量删除选中的 ${checkedBoxes.length} 条记录吗？`)) return;
      const formData = new URLSearchParams();
      formData.append('ids', ids);
      const res = await fetch(`${basePath}/batchdelete`, { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        loadData();
      } else {
        alert(json.msg || '批量删除失败');
      }
    }

    // 4. 工具栏点击
    function handleToolClick(action) {
      if (action === 'Add') {
        openAddModal();
      } else if (action === 'Delete') {
        handleBatchDelete();
      } else if (action === 'Export') {
        window.location.href = `${basePath}/export`;
      }
    }

    // 5. 新增弹窗
    async function openAddModal() {
      const res = await fetch(`${basePath}/addconf`);
      const formView = await res.json();
      document.getElementById('modal-title').innerText = formView.title || '新增数据';
      const container = document.getElementById('modal-form-fields');
      container.innerHTML = '';
      if (formView.fields) {
        formView.fields.forEach(f => {
          const group = document.createElement('div');
          group.className = 'form-group';
          group.innerHTML = `<label>${f.label}${f.required ? ' *' : ''}</label><input name="${f.name}" class="form-control" placeholder="${f.placeholder || ''}" type="${f.type === 'password' ? 'password' : 'text'}">`;
          container.appendChild(group);
        });
      }
      document.getElementById('edit-modal').classList.add('show');
    }
    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('show');
    }
    async function submitEditForm() {
      const inputs = document.querySelectorAll('#modal-form-fields input');
      const formData = new URLSearchParams();
      inputs.forEach(input => formData.append(input.name, input.value));
      const res = await fetch(`${basePath}/save`, { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        closeEditModal();
        loadData();
      } else {
        alert(json.msg || '保存失败');
      }
    }

    // 6. 角色权限树分配
    async function openRoleRulesModal(roleId) {
      activeRoleId = roleId;
      const res = await fetch(`/admin/system/role/rules?id=${roleId}`);
      const json = await res.json();
      if (json.code === 0 && json.data) {
        renderRulesTree(json.data);
        document.getElementById('rules-modal').classList.add('show');
      }
    }
    function renderRulesTree(roots) {
      const container = document.getElementById('rules-tree-container');
      container.innerHTML = '';
      roots.forEach(root => {
        const node = document.createElement('div');
        node.className = 'tree-node';
        node.innerHTML = `
          <div class="tree-node-header">
            <input type="checkbox" class="rule-box" data-id="${root.id}" ${root.checked ? 'checked' : ''} onchange="toggleParentRule(this, ${root.id})">
            <span>${root.title}</span>
          </div>
          <div class="tree-children" id="tree-children-${root.id}"></div>
        `;
        const childrenBox = node.querySelector(`#tree-children-${root.id}`);
        if (root.children) {
          root.children.forEach(child => {
            const childEl = document.createElement('label');
            childEl.className = 'tree-child-item';
            childEl.innerHTML = `<input type="checkbox" class="rule-box child-of-${root.id}" data-id="${child.id}" ${child.checked ? 'checked' : ''}><span>${child.title}</span>`;
            childrenBox.appendChild(childEl);
          });
        }
        container.appendChild(node);
      });
    }
    function toggleParentRule(parentBox, parentId) {
      const children = document.querySelectorAll(`.child-of-${parentId}`);
      children.forEach(c => c.checked = parentBox.checked);
    }
    function closeRulesModal() {
      document.getElementById('rules-modal').classList.remove('show');
    }
    async function submitRoleRules() {
      const checkedBoxes = document.querySelectorAll('.rule-box:checked');
      const ruleIds = Array.from(checkedBoxes).map(b => b.getAttribute('data-id')).join(',');
      const formData = new URLSearchParams();
      formData.append('role_id', activeRoleId);
      formData.append('rule_ids', ruleIds);
      const res = await fetch(`/admin/system/role/saverules`, { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        alert('权限配置已保存！');
        closeRulesModal();
      } else {
        alert(json.msg || '保存失败');
      }
    }

    // 7. 用户角色分配与重置密码
    async function openUserRolesModal(userId) {
      activeUserId = userId;
      const res = await fetch(`/admin/system/user/roles?id=${userId}`);
      const json = await res.json();
      if (json.code === 0 && json.data) {
        renderUserRoles(json.data);
        document.getElementById('roles-modal').classList.add('show');
      }
    }
    function renderUserRoles(roles) {
      const container = document.getElementById('user-roles-container');
      container.innerHTML = '';
      roles.forEach(r => {
        const item = document.createElement('div');
        item.style.padding = '8px 0';
        item.innerHTML = `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" class="user-role-box" data-id="${r.id}" ${r.checked ? 'checked' : ''}><span style="font-weight:600;">${r.name}</span><span style="color:var(--text-muted);font-size:11px;">(${r.remark || ''})</span></label>`;
        container.appendChild(item);
      });
    }
    function closeUserRolesModal() {
      document.getElementById('roles-modal').classList.remove('show');
    }
    async function submitUserRoles() {
      const checked = document.querySelectorAll('.user-role-box:checked');
      const roleIds = Array.from(checked).map(c => c.getAttribute('data-id')).join(',');
      const formData = new URLSearchParams();
      formData.append('id', activeUserId);
      formData.append('role_ids', roleIds);
      const res = await fetch(`/admin/system/user/saveroles`, { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        alert('角色分配成功！');
        closeUserRolesModal();
      } else {
        alert(json.msg || '保存失败');
      }
    }

    async function resetPassword(userId) {
      if (!confirm('确定将该用户的密码重置为 123456 吗？')) return;
      const formData = new URLSearchParams();
      formData.append('id', userId);
      const res = await fetch(`/admin/system/user/resetpass`, { method: 'POST', body: formData });
      const json = await res.json();
      alert(json.msg || '操作完成');
    }

    function toggleCheckAll(box) {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = box.checked);
    }
    function changePage(delta) {
      if (currentPage + delta >= 1) {
        currentPage += delta;
        loadData();
      }
    }

    init();
  </script>
</body>
</html>
