<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据网格</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #ef4444;
            --row-hover: rgba(56, 189, 248, 0.05);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 16px;
            font-size: 13px;
        }
        .grid-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-item input, .filter-item select {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 10px;
            color: var(--text-main);
            font-size: 13px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border-color); color: var(--text-main); }
        .btn-danger { background: var(--danger); color: #fff; }
        
        .tree-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 10px;
            color: var(--primary);
            border-radius: 3px;
            background: rgba(56, 189, 248, 0.1);
            transition: all 0.15s ease;
        }
        .tree-toggle:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: scale(1.1);
        }
        .tree-indent {
            display: inline-block;
            flex-shrink: 0;
        }
        .tree-leaf-spacer {
            display: inline-block;
            width: 16px;
            margin-right: 6px;
            flex-shrink: 0;
        }
        .tree-node-title {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
        }
        .tree-node-collapsed {
            display: none !important;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 12px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background: #182234;
            color: var(--text-muted);
            font-weight: 600;
        }
        tr:hover td {
            background: var(--row-hover);
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            color: var(--text-muted);
        }
    </style>
    <script src="/static/zan/js/core/event-bus.js"></script>
    <script src="/static/zan/js/core/layer.js"></script>
</head>
<body>
    <div class="grid-card">
        <div class="grid-header">
            <div class="filter-bar" id="filterBar">
                <!-- 动态渲染过滤器 -->
            </div>
            <div class="actions-bar" id="topActions">
                <!-- 动态渲染顶部操作 -->
            </div>
        </div>

        <div style="overflow-x:auto;">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <span id="pageInfo">共 0 条记录</span>
            <div id="pageControls">
                <!-- 分页按钮 -->
            </div>
        </div>
    </div>

    <script>
        window.GRID_SCHEMA = {{schemaJson}};
    </script>
    <script>
        // 前端数据渲染与拉取逻辑
        (function() {
            var schema = window.GRID_SCHEMA || {};
            var page = 1;
            var columns = schema.columns || schema.Columns || [];
            var tools = schema.tools || schema.Tools || schema.topActions || [];
            var conf = schema.conf || schema.Conf || {};
            var isTree = !!(conf.treeData === true || conf.treeData === 'true');
            var collapsedNodes = {};

            // 获取 CSRF 令牌
            function getCsrfToken() {
                var m = document.cookie.match(/(?:^|;\s*)zan_admin_csrf=([^;]+)/);
                return m ? decodeURIComponent(m[1]) : '';
            }

            // 渲染顶部工具栏按钮
            var topActions = document.getElementById('topActions');
            if (topActions) {
                // 如果是树形表格，自动注入“全部展开”和“全部折叠”按钮
                if (isTree) {
                    var btnExpand = document.createElement('button');
                    btnExpand.className = 'btn btn-secondary';
                    btnExpand.textContent = '全部展开';
                    btnExpand.onclick = function() { expandAllTree(); };
                    topActions.appendChild(btnExpand);

                    var btnCollapse = document.createElement('button');
                    btnCollapse.className = 'btn btn-secondary';
                    btnCollapse.textContent = '全部折叠';
                    btnCollapse.onclick = function() { collapseAllTree(); };
                    topActions.appendChild(btnCollapse);
                }

                if (tools.length > 0) {
                    tools.forEach(function(tool) {
                        var btn = document.createElement('button');
                        var btnClass = 'btn';
                        var tType = (tool.type || tool.color || '').toLowerCase();
                        if (tType === 'primary') btnClass += ' btn-primary';
                        else if (tType === 'error' || tType === 'danger') btnClass += ' btn-danger';
                        else btnClass += ' btn-secondary';
                        btn.className = btnClass;
                        btn.textContent = tool.name || tool.title;
                        btn.onclick = function() {
                            handleToolAction(tool);
                        };
                        topActions.appendChild(btn);
                    });
                }
            }

            function getSelectedIds() {
                var checkboxes = document.querySelectorAll('.row-select-checkbox:checked');
                var ids = [];
                checkboxes.forEach(function(cb) {
                    ids.push(cb.value);
                });
                return ids;
            }

            function handleToolAction(tool) {
                var action = tool.action || tool.actionType;
                var base = window.location.pathname.replace(/\/+$/, '');
                if (action === 'Export' || action === 'ExportXlsx') {
                    // 默认采用原生 Excel .xlsx 格式流式导出
                    window.location.href = base + '/Export?format=xlsx';
                    return;
                }
                if (action === 'ExportCsv') {
                    window.location.href = base + '/Export?format=csv';
                    return;
                }
                if (action === 'Add') {
                    if (window.ZanLayer) {
                        window.ZanLayer.open({
                            title: '新增' + (tool.showName || ''),
                            url: base + '/Add',
                            width: tool.width || '600px',
                            height: tool.height || '400px'
                        });
                    } else {
                        window.location.href = base + '/Add';
                    }
                    return;
                }
                if (action === 'Delete') {
                    var ids = getSelectedIds();
                    if (!ids || ids.length === 0) {
                        alert('请先勾选需要批量删除的记录！');
                        return;
                    }
                    if (!confirm('确定要删除选中的 ' + ids.length + ' 条记录吗？')) {
                        return;
                    }
                    var csrfToken = getCsrfToken();
                    fetch(base + '/BatchDelete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'X-CSRF-Token': csrfToken
                        },
                        body: 'ids=' + encodeURIComponent(ids.join(','))
                    })
                    .then(function(r) { return r.json(); })
                    .then(function(res) {
                        if (res.code === '0000') {
                            loadData();
                        } else {
                            alert(res.msg || '删除失败');
                        }
                    });
                    return;
                }
            }

            // 渲染表头
            var thead = document.getElementById('tableHead');
            if (thead && columns.length > 0) {
                var htr = document.createElement('tr');
                
                // 复选框全选列
                var thCheck = document.createElement('th');
                thCheck.style.width = '40px';
                thCheck.style.textAlign = 'center';
                var checkAll = document.createElement('input');
                checkAll.type = 'checkbox';
                checkAll.id = 'checkAllRows';
                checkAll.onchange = function() {
                    var cbs = document.querySelectorAll('.row-select-checkbox');
                    cbs.forEach(function(cb) { cb.checked = checkAll.checked; });
                };
                thCheck.appendChild(checkAll);
                htr.appendChild(thCheck);

                columns.forEach(function(col) {
                    if (col.hidden) return;
                    var th = document.createElement('th');
                    th.textContent = col.title || col.headerName || col.field;
                    if (col.width) th.style.width = col.width + 'px';
                    htr.appendChild(th);
                });
                thead.appendChild(htr);
            }

            function loadData() {
                var apiUrl = schema.apiUrl || (window.location.pathname.replace(/\/+$/, '') + '/Page');
                var url = apiUrl + (apiUrl.indexOf('?') > -1 ? '&' : '?') + 'page=' + page;
                fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
                    .then(function(r) { return r.json(); })
                    .then(function(res) {
                        if (res.code === '0000' || res.code === 200) {
                            var items = (res.data && res.data.items) || (res.data && res.data.rows) || (Array.isArray(res.data) ? res.data : []);
                            var total = (res.data && res.data.total) || items.length;
                            renderRows(items);
                            document.getElementById('pageInfo').textContent = '共 ' + total + ' 条数据';
                        }
                    });
            }

            function renderRows(items) {
                var tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';
                var pk = (schema.conf && schema.conf.primaryKey) || (schema.Conf && schema.Conf.primaryKey) || 'id';

                // 树形表格元数据构建
                var hasChildrenMap = {};
                var parentMap = {};
                var depthMap = {};
                var treeColIndex = 0;

                if (isTree) {
                    // 1. 建立上下级关系索引与层级探测
                    items.forEach(function(row) {
                        var idStr = String(row[pk]);
                        var pIdStr = row.parent_id !== undefined ? String(row.parent_id) : '';
                        if (pIdStr && pIdStr !== '0' && pIdStr !== idStr) {
                            hasChildrenMap[pIdStr] = true;
                            parentMap[idStr] = pIdStr;
                        }
                        if (row.tree_path) {
                            var parts = row.tree_path.split('/').filter(function(x) { return x.length > 0; });
                            depthMap[idStr] = Math.max(0, parts.length - 1);
                        }
                    });

                    // 对缺少 tree_path 的场景基于 parent_id 计算 depth
                    items.forEach(function(row) {
                        var idStr = String(row[pk]);
                        if (depthMap[idStr] === undefined) {
                            var d = 0;
                            var curr = parentMap[idStr];
                            var guard = 0;
                            while (curr && curr !== '0' && guard < 20) {
                                d++;
                                curr = parentMap[curr];
                                guard++;
                            }
                            depthMap[idStr] = d;
                        }
                    });

                    // 确定缩进与折叠挂载的列（优先 name, title 或首个非隐藏列）
                    var foundTreeCol = false;
                    for (var ci = 0; ci < columns.length; ci++) {
                        var c = columns[ci];
                        if (c.hidden) continue;
                        if (c.field === 'name' || c.field === 'title' || c.field === 'department_name') {
                            treeColIndex = ci;
                            foundTreeCol = true;
                            break;
                        }
                    }
                    if (!foundTreeCol) {
                        for (var ci2 = 0; ci2 < columns.length; ci2++) {
                            if (!columns[ci2].hidden) {
                                treeColIndex = ci2;
                                break;
                            }
                        }
                    }
                }

                items.forEach(function(row) {
                    var tr = document.createElement('tr');
                    var idStr = String(row[pk]);
                    tr.setAttribute('data-id', idStr);
                    if (row.parent_id !== undefined) tr.setAttribute('data-parent-id', String(row.parent_id));
                    if (row.tree_path) tr.setAttribute('data-tree-path', row.tree_path);
                    
                    // 行复选框
                    var tdCheck = document.createElement('td');
                    tdCheck.style.textAlign = 'center';
                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'row-select-checkbox';
                    cb.value = row[pk] !== undefined ? row[pk] : '';
                    tdCheck.appendChild(cb);
                    tr.appendChild(tdCheck);

                    columns.forEach(function(col, colIdx) {
                        if (col.hidden) return;
                        var td = document.createElement('td');
                        td.style.textAlign = col.align || 'left';
                        var rawVal = row[col.field] !== undefined ? row[col.field] : '';

                        if (isTree && colIdx === treeColIndex) {
                            var wrap = document.createElement('div');
                            wrap.className = 'tree-node-title';

                            var depth = depthMap[idStr] || 0;
                            if (depth > 0) {
                                var indent = document.createElement('span');
                                indent.className = 'tree-indent';
                                indent.style.width = (depth * 20) + 'px';
                                wrap.appendChild(indent);
                            }

                            if (hasChildrenMap[idStr]) {
                                var toggle = document.createElement('span');
                                toggle.className = 'tree-toggle';
                                toggle.setAttribute('data-toggle-id', idStr);
                                toggle.textContent = collapsedNodes[idStr] ? '▶' : '▼';
                                toggle.onclick = function(e) {
                                    e.stopPropagation();
                                    toggleTreeNode(idStr);
                                };
                                wrap.appendChild(toggle);
                            } else {
                                var spacer = document.createElement('span');
                                spacer.className = 'tree-leaf-spacer';
                                wrap.appendChild(spacer);
                            }

                            var textNode = document.createElement('span');
                            textNode.textContent = rawVal;
                            wrap.appendChild(textNode);
                            td.appendChild(wrap);
                        } else {
                            td.textContent = rawVal;
                        }
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });

                if (isTree) {
                    updateTreeVisibility();
                }
            }

            // 树形表格折叠/展开与状态刷新
            function toggleTreeNode(nodeId) {
                collapsedNodes[nodeId] = !collapsedNodes[nodeId];
                updateTreeVisibility();
            }

            function expandAllTree() {
                collapsedNodes = {};
                updateTreeVisibility();
            }

            function collapseAllTree() {
                var toggles = document.querySelectorAll('.tree-toggle');
                toggles.forEach(function(t) {
                    var nid = t.getAttribute('data-toggle-id');
                    if (nid) collapsedNodes[nid] = true;
                });
                updateTreeVisibility();
            }

            function updateTreeVisibility() {
                var tbody = document.getElementById('tableBody');
                if (!tbody) return;
                var rows = tbody.querySelectorAll('tr');

                // 更新所有折叠图标
                var toggles = tbody.querySelectorAll('.tree-toggle');
                toggles.forEach(function(t) {
                    var nid = t.getAttribute('data-toggle-id');
                    t.textContent = collapsedNodes[nid] ? '▶' : '▼';
                });

                // 更新每一行的隐藏/展现状态
                rows.forEach(function(tr) {
                    var idStr = tr.getAttribute('data-id');
                    var pIdStr = tr.getAttribute('data-parent-id');
                    var treePath = tr.getAttribute('data-tree-path');

                    var isHidden = false;
                    if (treePath) {
                        var parts = treePath.split('/').filter(function(x) { return x.length > 0; });
                        // 祖先节点集合：排除自身后的所有上级
                        for (var i = 0; i < parts.length; i++) {
                            var anc = parts[i];
                            if (anc !== idStr && collapsedNodes[anc]) {
                                isHidden = true;
                                break;
                            }
                        }
                    } else if (pIdStr && pIdStr !== '0') {
                        var curr = pIdStr;
                        var guard = 0;
                        while (curr && curr !== '0' && guard < 20) {
                            if (collapsedNodes[curr]) {
                                isHidden = true;
                                break;
                            }
                            var parentTr = tbody.querySelector('tr[data-id="' + curr + '"]');
                            curr = parentTr ? parentTr.getAttribute('data-parent-id') : null;
                            guard++;
                        }
                    }

                    if (isHidden) {
                        tr.classList.add('tree-node-collapsed');
                    } else {
                        tr.classList.remove('tree-node-collapsed');
                    }
                });
            }

            // 初始化
            if (window.ZanBus) {
                window.ZanBus.on('grid:reload', loadData);
            }
            loadData();
        })();
    </script>
</body>
</html>
