<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zan 企业级管理工作台</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-sidebar: #0f172a;
            --bg-card: #1e293b;
            --bg-subtle: #182234;
            --border-color: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 侧边导航栏 */
        .sidebar {
            width: 240px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width .25s cubic-bezier(.4,0,.2,1);
        }
        .brand-header {
            height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.95);
        }
        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
        }
        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-main);
        }
        .menu-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }
        .menu-wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .menu-wrapper::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
        .menu-group-title {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 10px 6px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .15s;
            margin-bottom: 2px;
            user-select: none;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }
        .menu-item.active {
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
            font-weight: 600;
        }
        .menu-icon {
            font-size: 15px;
            width: 18px;
            text-align: center;
        }

        /* 主体操作区 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-body);
        }

        /* 顶部导航条 */
        .topbar {
            height: 56px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .breadcrumb-box {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .breadcrumb-box span.active {
            color: var(--text-main);
            font-weight: 600;
        }
        .user-action-bar {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-main);
        }
        .user-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            border: 1px solid var(--border-color);
        }
        .logout-btn {
            color: var(--danger);
            text-decoration: none;
            font-size: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 6px;
            padding: 4px 10px;
            transition: all .2s;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        /* 多标签页导航 */
        .tabs-header {
            height: 40px;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 6px;
            overflow-x: auto;
        }
        .tabs-header::-webkit-scrollbar {
            height: 0px;
        }
        .tab-node {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            font-size: 12px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all .15s;
            user-select: none;
            white-space: nowrap;
        }
        .tab-node:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.06);
        }
        .tab-node.active {
            background: var(--bg-sidebar);
            border-color: var(--border-color);
            color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .tab-close {
            font-size: 12px;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all .15s;
        }
        .tab-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        /* 视窗容器 */
        .workspace-viewport {
            flex: 1;
            position: relative;
            background: var(--bg-body);
        }
        .iframe-view {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .iframe-view.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 左侧菜单 -->
    <div class="sidebar">
        <div class="brand-header">
            <div class="brand-logo">Z</div>
            <div class="brand-title">Zan 管理中台</div>
        </div>
        <div class="menu-wrapper" id="menuTree">
            <div style="padding:20px;font-size:12px;color:#64748b;">正在加载导航菜单...</div>
        </div>
    </div>

    <!-- 右侧主体 -->
    <div class="main-container">
        <!-- 顶部信息 -->
        <div class="topbar">
            <div class="breadcrumb-box">
                <span>管理平台</span>
                <span>/</span>
                <span id="currentTitle" class="active">系统概览</span>
            </div>
            <div class="user-action-bar">
                <div class="user-chip">
                    <div class="user-avatar" id="avatarText">A</div>
                    <span id="userNickname">{{nickname}}</span>
                </div>
                <a href="/admin/logout" class="logout-btn">退出</a>
            </div>
        </div>

        <!-- 标签页栏 -->
        <div class="tabs-header" id="tabsBar">
            <div class="tab-node active" data-id="tab-dashboard" onclick="switchTab('tab-dashboard')">
                <span>📊 工作台</span>
            </div>
        </div>

        <!-- 视窗容器 -->
        <div class="workspace-viewport" id="viewport">
            <iframe id="iframe-tab-dashboard" class="iframe-view active" src="/admin/dashboard"></iframe>
        </div>
    </div>

    <script>
        var currentTabId = 'tab-dashboard';
        var openTabs = { 'tab-dashboard': { title: '工作台', url: '/admin/dashboard' } };

        function openMenuTab(title, url, id) {
            var tabId = 'tab-' + (id || url.replace(/[^a-zA-Z0-9]/g, '_'));
            if (!openTabs[tabId]) {
                openTabs[tabId] = { title: title, url: url };

                // 插入 tab
                var tabsBar = document.getElementById('tabsBar');
                var tab = document.createElement('div');
                tab.className = 'tab-node';
                tab.id = 'tabHeader-' + tabId;
                tab.onclick = function() { switchTab(tabId); };
                tab.innerHTML = '<span>' + title + '</span><span class="tab-close" onclick="closeTab(event, \'' + tabId + '\')">&times;</span>';
                tabsBar.appendChild(tab);

                // 插入 iframe
                var viewport = document.getElementById('viewport');
                var iframe = document.createElement('iframe');
                iframe.id = 'iframe-' + tabId;
                iframe.className = 'iframe-view';
                iframe.src = url;
                viewport.appendChild(iframe);
            }
            switchTab(tabId);
        }

        function switchTab(tabId) {
            currentTabId = tabId;
            var tabInfo = openTabs[tabId];
            if (tabInfo) {
                document.getElementById('currentTitle').textContent = tabInfo.title;
            }

            // 更新 tabs 状态
            var tabNodes = document.querySelectorAll('.tab-node');
            tabNodes.forEach(function(node) { node.classList.remove('active'); });
            var activeTab = document.getElementById('tabHeader-' + tabId);
            if (activeTab) { activeTab.classList.add('active'); }
            else if (tabId === 'tab-dashboard') {
                var first = document.querySelector('.tab-node[data-id="tab-dashboard"]');
                if (first) first.classList.add('active');
            }

            // 更新 iframe 状态
            var iframes = document.querySelectorAll('.iframe-view');
            iframes.forEach(function(f) { f.classList.remove('active'); });
            var activeIframe = document.getElementById('iframe-' + tabId);
            if (activeIframe) { activeIframe.classList.add('active'); }

            // 更新菜单选中
            var menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(function(item) {
                if (tabInfo && item.getAttribute('data-url') === tabInfo.url) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function closeTab(e, tabId) {
            e.stopPropagation();
            if (tabId === 'tab-dashboard') return;

            var tabHeader = document.getElementById('tabHeader-' + tabId);
            if (tabHeader) tabHeader.remove();

            var iframe = document.getElementById('iframe-' + tabId);
            if (iframe) iframe.remove();

            delete openTabs[tabId];

            if (currentTabId === tabId) {
                var keys = Object.keys(openTabs);
                switchTab(keys[keys.length - 1]);
            }
        }

        // 初始化加载动态菜单
        fetch('/admin/api/menus')
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var tree = document.getElementById('menuTree');
                tree.innerHTML = '';
                var list = res.data || [];

                // 默认内置根菜单项
                var dashboardItem = document.createElement('div');
                dashboardItem.className = 'menu-item active';
                dashboardItem.setAttribute('data-url', '/admin/dashboard');
                dashboardItem.innerHTML = '<span class="menu-icon">📊</span><span>工作台总览</span>';
                dashboardItem.onclick = function() { switchTab('tab-dashboard'); };
                tree.appendChild(dashboardItem);

                // 系统管理模块组
                var groupTitle = document.createElement('div');
                groupTitle.className = 'menu-group-title';
                groupTitle.textContent = '业务与系统管理';
                tree.appendChild(groupTitle);

                list.forEach(function(m) {
                    var item = document.createElement('div');
                    item.className = 'menu-item';
                    item.setAttribute('data-url', m.route);
                    var icon = m.icon === 'user' ? '👤' : (m.icon === 'role' ? '🛡️' : (m.icon === 'dept' ? '🏢' : (m.icon === 'log' ? '📝' : '⚡')));
                    item.innerHTML = '<span class="menu-icon">' + icon + '</span><span>' + m.title + '</span>';
                    item.onclick = function() {
                        openMenuTab(m.title, m.route, m.key);
                    };
                    tree.appendChild(item);
                });

                // 研发工具组
                var devGroup = document.createElement('div');
                devGroup.className = 'menu-group-title';
                devGroup.textContent = '研发中台工具';
                tree.appendChild(devGroup);

                var codeGenItem = document.createElement('div');
                codeGenItem.className = 'menu-item';
                codeGenItem.setAttribute('data-url', '/admin/tool/codegen');
                codeGenItem.innerHTML = '<span class="menu-icon">🚀</span><span>代码生成器</span>';
                codeGenItem.onclick = function() {
                    openMenuTab('代码生成器', '/admin/tool/codegen', 'tool_codegen');
                };
                tree.appendChild(codeGenItem);
            })
            .catch(function(err) {
                console.error('Menu load error:', err);
            });
    </script>
</body>
</html>
