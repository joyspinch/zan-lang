<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zan Admin 管理中台</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-header: #1e293b;
      --bg-card: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: var(--bg-dark); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

    /* 侧边栏 */
    .sidebar { width: 240px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s; }
    .brand { height: 60px; display: flex; align-items: center; padding: 0 20px; font-size: 18px; font-weight: 700; color: #fff; border-bottom: 1px solid var(--border); letter-spacing: 0.5px; }
    .brand svg { margin-right: 10px; color: var(--primary); }
    .menu-scroll { flex: 1; overflow-y: auto; padding: 12px 0; }
    .menu-group { margin-bottom: 8px; }
    .menu-group-title { padding: 8px 20px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .menu-item { display: flex; align-items: center; padding: 10px 20px 10px 28px; font-size: 13.5px; color: #cbd5e1; text-decoration: none; border-left: 3px solid transparent; transition: all 0.15s ease; cursor: pointer; }
    .menu-item:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .menu-item.active { color: #fff; background: rgba(59, 130, 246, 0.15); border-left-color: var(--primary); font-weight: 600; }
    .menu-item svg { width: 16px; height: 16px; margin-right: 10px; opacity: 0.8; }

    /* 主体布局 */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .header { height: 60px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
    .header-left { display: flex; align-items: center; gap: 16px; font-size: 14px; font-weight: 500; }
    .header-right { display: flex; align-items: center; gap: 20px; }

    /* 用户面板下拉 */
    .user-profile { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 13px; font-weight: 600; }
    .user-role { font-size: 11px; color: var(--text-muted); }
    .dropdown { position: absolute; top: 50px; right: 0; width: 180px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; z-index: 1000; overflow: hidden; }
    .dropdown.show { display: block; }
    .dropdown-item { padding: 10px 16px; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; text-decoration: none; cursor: pointer; }
    .dropdown-item:hover { background: rgba(255,255,255,0.06); }
    .dropdown-divider { height: 1px; background: var(--border); }

    /* 内容区域 iframe */
    .content-area { flex: 1; background: var(--bg-dark); position: relative; }
    .content-area iframe { width: 100%; height: 100%; border: none; }

    /* 弹窗遮罩 */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; }
    .modal-backdrop.show { display: flex; }
    .modal-box { width: 420px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #fff; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .form-control { width: 100%; height: 38px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; padding: 0 12px; color: #fff; font-size: 13px; outline: none; }
    .form-control:focus { border-color: var(--primary); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
    .btn { height: 36px; padding: 0 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
    .btn-default { background: #334155; color: #fff; }
    .btn-default:hover { background: #475569; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
  </style>
</head>
<body>

  <!-- 侧边导航栏 -->
  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span>Zan Admin</span>
    </div>
    <div class="menu-scroll" id="menu-container">
      <!-- 动态菜单由服务端 /admin/api/menus 自动识别注入 -->
    </div>
  </aside>

  <!-- 工作台主区域 -->
  <div class="main-wrapper">
    <header class="header">
      <div class="header-left">
        <span id="current-title" style="color: var(--text-muted);">控制台 / 工作台</span>
      </div>
      <div class="header-right">
        <div class="user-profile" id="user-trigger">
          <div class="avatar" id="user-avatar">A</div>
          <div class="user-info">
            <span class="user-name" id="user-name">管理员</span>
            <span class="user-role">Super Admin</span>
          </div>
          <div class="dropdown" id="user-dropdown">
            <div class="dropdown-item" onclick="openPasswordModal()">修改密码</div>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item" href="/admin/logout" style="color: #ef4444;">退出登录</a>
          </div>
        </div>
      </div>
    </header>

    <main class="content-area">
      <iframe id="app-frame" src="/admin/system/user"></iframe>
    </main>
  </div>

  <!-- 修改密码弹窗 -->
  <div class="modal-backdrop" id="pwd-modal">
    <div class="modal-box">
      <h3 class="modal-title">修改登录密码</h3>
      <div class="form-group">
        <label>原密码</label>
        <input type="password" id="old-pass" class="form-control" placeholder="请输入当前密码">
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input type="password" id="new-pass" class="form-control" placeholder="不少于6位字母或数字">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input type="password" id="confirm-pass" class="form-control" placeholder="再次输入新密码">
      </div>
      <div class="modal-actions">
        <button class="btn btn-default" onclick="closePasswordModal()">取消</button>
        <button class="btn btn-primary" onclick="submitPassword()">确认修改</button>
      </div>
    </div>
  </div>

  <script>
    // 1. 动态加载并渲染服务端全自动识别的菜单树
    async function loadMenus() {
      try {
        const res = await fetch('/admin/api/menus');
        const json = await res.json();
        if (json.code === 0 && json.data) {
          renderMenus(json.data);
        }
      } catch (e) {
        console.error('加载菜单失败', e);
      }
    }

    function renderMenus(groups) {
      const container = document.getElementById('menu-container');
      container.innerHTML = '';
      groups.forEach((group, idx) => {
        const groupEl = document.createElement('div');
        groupEl.className = 'menu-group';

        const titleEl = document.createElement('div');
        titleEl.className = 'menu-group-title';
        titleEl.innerText = group.title;
        groupEl.appendChild(titleEl);

        if (group.children && group.children.length > 0) {
          group.children.forEach((child, cIdx) => {
            const itemEl = document.createElement('div');
            itemEl.className = 'menu-item' + (idx === 0 && cIdx === 0 ? ' active' : '');
            itemEl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/></svg><span>${child.title}</span>`;
            itemEl.onclick = () => {
              document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
              itemEl.classList.add('active');
              document.getElementById('app-frame').src = child.path;
              document.getElementById('current-title').innerText = `${group.title} / ${child.title}`;
            };
            groupEl.appendChild(itemEl);
          });
        }
        container.appendChild(groupEl);
      });
    }

    // 2. 加载个人资料
    async function loadProfile() {
      try {
        const res = await fetch('/admin/api/profile');
        const json = await res.json();
        if (json.code === 0 && json.data) {
          const user = json.data;
          document.getElementById('user-name').innerText = user.nickname || user.username;
          document.getElementById('user-avatar').innerText = (user.nickname || user.username || 'A')[0].toUpperCase();
        }
      } catch (e) {}
    }

    // 3. 用户面板下拉联动
    const userTrigger = document.getElementById('user-trigger');
    const userDropdown = document.getElementById('user-dropdown');
    userTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle('show');
    });
    document.addEventListener('click', () => userDropdown.classList.remove('show'));

    // 4. 修改密码弹窗
    function openPasswordModal() {
      document.getElementById('pwd-modal').classList.add('show');
    }
    function closePasswordModal() {
      document.getElementById('pwd-modal').classList.remove('show');
    }
    async function submitPassword() {
      const oldPass = document.getElementById('old-pass').value;
      const newPass = document.getElementById('new-pass').value;
      const confirmPass = document.getElementById('confirm-pass').value;
      if (!oldPass || !newPass) {
        alert('原密码与新密码均不能为空');
        return;
      }
      if (newPass !== confirmPass) {
        alert('两次输入的新密码不一致');
        return;
      }
      const formData = new URLSearchParams();
      formData.append('old_password', oldPass);
      formData.append('new_password', newPass);

      const res = await fetch('/admin/api/password', { method: 'POST', body: formData });
      const json = await res.json();
      if (json.code === 0) {
        alert('密码修改成功，请牢记新密码');
        closePasswordModal();
      } else {
        alert(json.msg || '修改失败');
      }
    }

    loadMenus();
    loadProfile();
  </script>
</body>
</html>
