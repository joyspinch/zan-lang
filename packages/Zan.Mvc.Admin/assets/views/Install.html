<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zan 管理中台 - 初始安装向导</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: #1e293b;
            --border-color: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #34d399;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 80%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }
        .installer-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 36px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .brand-box {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .brand-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .brand-title {
            font-size: 19px;
            font-weight: 700;
        }
        .desc-text {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* 步骤条 */
        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            position: relative;
        }
        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 1;
        }
        .step-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #182234;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .step-item.active .step-circle {
            background: var(--primary);
            border-color: var(--primary);
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        .step-item.done .step-circle {
            background: var(--success);
            border-color: var(--success);
            color: #0b0f19;
        }
        .step-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* 探针项列表 */
        .probe-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .probe-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #182234;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
        }
        .probe-status {
            font-weight: 600;
            font-size: 12px;
        }
        .status-pass { color: var(--success); }
        .status-fail { color: var(--danger); }

        /* 表单组 */
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
        }
        input {
            background: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        input:focus {
            border-color: var(--primary);
        }

        /* 按钮与提示 */
        .btn-action {
            width: 100%;
            background: var(--primary);
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 14px;
            transition: all .2s;
        }
        .btn-action:hover {
            background: var(--primary-hover);
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="installer-card">
        <div class="brand-box">
            <div class="brand-logo">Z</div>
            <div>
                <div class="brand-title">Zan 中台系统安装向导</div>
                <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">初始化数据库、系统权限与安全锁</div>
            </div>
        </div>

        <p class="desc-text">
            检测到当前运行环境尚未初始化。通过向导配置管理员账户与存储介质，将自动执行基础数据结构同步与安全熔断。
        </p>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step-item active" id="stepNode1">
                <div class="step-circle">1</div>
                <div class="step-title">运行探针</div>
            </div>
            <div class="step-item" id="stepNode2">
                <div class="step-circle">2</div>
                <div class="step-title">参数配置</div>
            </div>
            <div class="step-item" id="stepNode3">
                <div class="step-circle">3</div>
                <div class="step-title">完成就绪</div>
            </div>
        </div>

        <div id="errorAlert" class="alert-error"></div>

        <!-- 步骤 1：探针检测 -->
        <div id="step1View">
            <div class="probe-list" id="probeItems">
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">
                    正在探测环境与驱动状态...
                </div>
            </div>
            <button id="btnStep1" class="btn-action" style="display: none;" onclick="goStep2()">下一步：配置系统参数</button>
        </div>

        <!-- 步骤 2：参数设置 -->
        <div id="step2View" style="display: none;">
            <div class="form-group">
                <label>数据库存储文件 (SQLite 数据库)</label>
                <input id="dbPath" value="data/app.db" placeholder="data/app.db" />
            </div>
            <div class="form-group">
                <label>初始超级管理员账号</label>
                <input id="adminUser" value="admin" placeholder="输入超级管理员用户名" />
            </div>
            <div class="form-group">
                <label>超级管理员初始密码 (不少于 6 位)</label>
                <input id="adminPass" type="password" value="admin123" placeholder="输入密码" />
            </div>
            <button id="btnSubmit" class="btn-action" onclick="submitInstall()">执行安装并生成安全锁</button>
        </div>

        <!-- 步骤 3：完成 -->
        <div id="step3View" style="display: none; text-align: center;">
            <div style="font-size: 48px; margin-bottom: 12px;">🎉</div>
            <h3 style="font-size: 18px; color: var(--success); margin-bottom: 8px;">安装完成并已锁定</h3>
            <p style="color: var(--text-muted); font-size: 13px; line-height: 1.6; margin-bottom: 24px;">
                系统已完成物理表结构同步与超级管理员账号配置。安全锁文件 <code>install.lock</code> 已生成，安装入口已永久熔断关闭。
            </p>
            <a href="/admin/login" style="display: inline-block; width: 100%; text-decoration: none;">
                <button class="btn-action">立即前往管理后台登录</button>
            </a>
        </div>
    </div>

    <script>
        fetch('/install/api/probe', { method: 'POST' })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                var container = document.getElementById('probeItems');
                container.innerHTML = '';
                var items = res.items || [];
                items.forEach(function(it) {
                    var div = document.createElement('div');
                    div.className = 'probe-item';
                    var statusCls = it.passed ? 'status-pass' : 'status-fail';
                    var statusIcon = it.passed ? '✓ 通过' : '✗ 未就绪';
                    div.innerHTML = '<span>' + it.name + '</span><span class="probe-status ' + statusCls + '">' + (it.current || statusIcon) + '</span>';
                    container.appendChild(div);
                });
                if (res.allPassed) {
                    document.getElementById('btnStep1').style.display = 'block';
                } else {
                    showError('部分环境检查未通过，请排查后刷新重试');
                }
            })
            .catch(function(err) {
                showError('探针接口调用失败: ' + err);
            });

        function goStep2() {
            document.getElementById('step1View').style.display = 'none';
            document.getElementById('step2View').style.display = 'block';
            document.getElementById('stepNode1').classList.remove('active');
            document.getElementById('stepNode1').classList.add('done');
            document.getElementById('stepNode2').classList.add('active');
        }

        function submitInstall() {
            var btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.textContent = '正在初始化数据表并锁定...';

            var p = new URLSearchParams();
            p.append('dbPath', document.getElementById('dbPath').value.trim());
            p.append('adminUser', document.getElementById('adminUser').value.trim());
            p.append('adminPass', document.getElementById('adminPass').value.trim());

            fetch('/install/api/submit', { method: 'POST', body: p })
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.code === '0000') {
                        document.getElementById('step2View').style.display = 'none';
                        document.getElementById('step3View').style.display = 'block';
                        document.getElementById('stepNode2').classList.remove('active');
                        document.getElementById('stepNode2').classList.add('done');
                        document.getElementById('stepNode3').classList.add('active');
                        document.getElementById('stepNode3').classList.add('done');
                    } else {
                        btn.disabled = false;
                        btn.textContent = '执行安装并生成安全锁';
                        showError(res.msg || '安装失败');
                    }
                })
                .catch(function(err) {
                    btn.disabled = false;
                    btn.textContent = '执行安装并生成安全锁';
                    showError('请求异常: ' + err);
                });
        }

        function showError(msg) {
            var el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
