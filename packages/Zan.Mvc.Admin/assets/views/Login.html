<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zan Admin 登录</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }

    /* 背景装饰光斑 */
    .glow { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; pointer-events: none; }
    .glow-1 { top: -100px; left: -100px; }
    .glow-2 { bottom: -100px; right: -100px; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%); }

    /* 卡片容器 */
    .login-card { width: 380px; max-width: 90vw; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 12px; padding: 36px 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); z-index: 10; }
    .brand-header { text-align: center; margin-bottom: 28px; }
    .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: #fff; margin-bottom: 12px; box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3); }
    .brand-title { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    .brand-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper input { width: 100%; height: 42px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 6px; padding: 0 14px; color: #fff; font-size: 13px; outline: none; transition: border-color 0.2s; }
    .input-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    .btn-submit { width: 100%; height: 42px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 8px; }
    .btn-submit:hover { background: var(--primary-hover); }
    .btn-submit:active { transform: scale(0.98); }

    .alert { padding: 10px 14px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; display: none; }
    .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div class="brand-title">Zan Admin</div>
      <div class="brand-sub">生产级通用管理中台</div>
    </div>

    <div class="alert alert-error" id="error-alert"></div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>账号</label>
        <div class="input-wrapper">
          <input type="text" id="username" placeholder="请输入管理员账号" value="admin" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label>密码</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="请输入管理员密码" value="admin123" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-login">立即登录</button>
    </form>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const alertEl = document.getElementById('error-alert');
      alertEl.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerText = '登录验证中...';

      try {
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        const res = await fetch('/admin/api/login', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.code === 0) {
          window.location.href = '/admin';
        } else {
          alertEl.innerText = data.msg || '登录失败，请检查账号密码';
          alertEl.style.display = 'block';
          btn.disabled = false;
          btn.innerText = '立即登录';
        }
      } catch (err) {
        alertEl.innerText = '网络连接异常，请检查服务状态';
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.innerText = '立即登录';
      }
    }
  </script>
</body>
</html>
