<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - Zan 企业管理中台</title>
    <style>
        :root {
            --bg-body: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-focus: #38bdf8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 75%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(56, 189, 248, 0.08);
            animation: fadeIn .4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
        .brand-text h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }
        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-wrap input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all .2s;
        }
        .input-wrap input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0b0f19;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 13px;
            cursor: pointer;
            transition: all .2s;
            margin-top: 8px;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.25);
        }
        .btn-login:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
        }
        .btn-login:active {
            transform: translateY(0);
        }
        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="brand">
            <div class="logo-icon">Z</div>
            <div class="brand-text">
                <h1>Zan 管理中台</h1>
                <p>Enterprise MVC Management Platform</p>
            </div>
        </div>

        <div id="errorBanner" class="error-banner"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">管理员账号</label>
                <div class="input-wrap">
                    <input type="text" id="username" name="username" value="admin" placeholder="请输入用户名" required autofocus autocomplete="username" />
                </div>
            </div>
            <div class="form-group">
                <label for="password">登录密码</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" value="admin123" placeholder="请输入密码" required autocomplete="current-password" />
                </div>
            </div>
            <button type="submit" id="submitBtn" class="btn-login">立即登录</button>
        </form>

        <div class="footer-note">
            基于 Zan 强类型自托管编译与高性能 MVC 架构
        </div>
    </div>

    <script>
        function showError(msg) {
            var b = document.getElementById('errorBanner');
            b.textContent = msg;
            b.style.display = 'block';
        }

        function handleLogin(e) {
            e.preventDefault();
            var b = document.getElementById('errorBanner');
            b.style.display = 'none';

            var btn = document.getElementById('submitBtn');
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value;

            if (!u || !p) {
                showError('用户名和密码不能为空');
                return;
            }

            btn.disabled = true;
            btn.textContent = '登录中...';

            var params = new URLSearchParams();
            params.append('username', u);
            params.append('password', p);

            fetch('/admin/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                btn.disabled = false;
                btn.textContent = '立即登录';
                if (res.code === '0000') {
                    window.location.href = '/admin';
                } else {
                    showError(res.msg || '登录失败，请检查账号密码');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btn.textContent = '立即登录';
                showError('网络连接失败，请确认服务端运行状态');
            });
        }
    </script>
</body>
</html>
