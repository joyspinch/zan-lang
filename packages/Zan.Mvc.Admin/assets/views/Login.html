<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统登录 - Zan 企业管理中台</title>
    <style>
        :root {
            --bg-body: #070a12;
            --bg-card: rgba(15, 23, 42, 0.72);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.4);
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --primary-glow: rgba(56, 189, 248, 0.35);
            --indigo-glow: rgba(99, 102, 241, 0.28);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        /* 背景流光光环 */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.65;
            animation: floatGlow 14s ease-in-out infinite alternate;
        }
        .glow-1 {
            width: 520px;
            height: 520px;
            top: -120px;
            left: 10%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
        }
        .glow-2 {
            width: 580px;
            height: 580px;
            bottom: -140px;
            right: 8%;
            background: radial-gradient(circle, var(--indigo-glow) 0%, transparent 70%);
            animation-duration: 18s;
            animation-delay: -5s;
        }
        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.08); }
            100% { transform: translate(-30px, -20px) scale(0.95); }
        }

        /* 交互粒子画布 */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* 登录卡片外层透视容器 */
        .login-perspective {
            perspective: 1200px;
            z-index: 10;
            width: 100%;
            max-width: 430px;
        }

        /* 主体卡片 (毛玻璃 + 动态聚光灯边框) */
        .login-box {
            position: relative;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 44px 38px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        0 0 45px rgba(56, 189, 248, 0.07);
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardEntrance {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 鼠标跟随聚光光环 */
        .spotlight-overlay {
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            pointer-events: none;
            background: radial-gradient(350px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(56, 189, 248, 0.15), transparent 80%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .login-box:hover .spotlight-overlay {
            opacity: 1;
        }

        /* 品牌标识 */
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }
        .logo-wrap {
            position: relative;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-ring {
            position: absolute;
            inset: -3px;
            border-radius: 14px;
            background: conic-gradient(from 0deg, #38bdf8, #818cf8, #38bdf8);
            animation: spinRing 6s linear infinite;
            filter: blur(4px);
            opacity: 0.65;
        }
        @keyframes spinRing {
            100% { transform: rotate(360deg); }
        }
        .logo-icon {
            position: relative;
            z-index: 1;
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4);
        }
        .brand-text h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-text p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
            letter-spacing: 0.2px;
        }

        /* 错误提示 */
        .error-banner {
            display: none;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 10px;
            padding: 11px 16px;
            color: #fca5a5;
            font-size: 13px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
            40%, 60% { transform: translate3d(3px, 0, 0); }
        }

        /* 表单输入组 */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
            transition: color 0.2s ease;
        }
        .form-group:focus-within label {
            color: var(--primary);
        }
        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 15px;
            color: #64748b;
            transition: color 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }
        .input-wrap input {
            width: 100%;
            background: rgba(11, 15, 25, 0.65);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 13px 14px 13px 40px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-wrap input:hover {
            border-color: rgba(255, 255, 255, 0.16);
            background: rgba(11, 15, 25, 0.85);
        }
        .input-wrap input:focus {
            border-color: var(--primary);
            background: rgba(11, 15, 25, 0.95);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2), 0 0 20px rgba(56, 189, 248, 0.12);
        }
        .input-wrap input:focus + .input-icon,
        .form-group:focus-within .input-icon {
            color: var(--primary);
            transform: scale(1.1);
        }

        /* 酷炫流光登录按钮 */
        .btn-login {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 50%, #2563eb 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: none;
            border-radius: 10px;
            padding: 14px;
            cursor: pointer;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 6px 20px -4px rgba(56, 189, 248, 0.45);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        /* 扫光动效 */
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: skewX(-25deg);
            transition: 0.6s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px -4px rgba(56, 189, 248, 0.6);
            filter: brightness(1.06);
        }
        .btn-login:hover::before {
            left: 140%;
            transition: 0.75s ease;
        }
        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* 旋转微载入动画 */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer-note {
            margin-top: 26px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <!-- 动态背景光球 -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- 粒子交互画布 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 登录卡片透视包装 -->
    <div class="login-perspective">
        <div class="login-box" id="cardBox">
            <div class="spotlight-overlay" id="spotlight"></div>

            <div class="brand">
                <div class="logo-wrap">
                    <div class="logo-ring"></div>
                    <div class="logo-icon">Z</div>
                </div>
                <div class="brand-text">
                    <h1>Zan 管理中台</h1>
                    <p>Enterprise MVC Management Platform</p>
                </div>
            </div>

            <div id="errorBanner" class="error-banner" style="display:none;"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">管理员账号</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" value="admin" placeholder="请输入用户名" required autofocus autocomplete="username" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">登录密码</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" value="admin123" placeholder="请输入密码" required autocomplete="current-password" />
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-login">
                    <span id="btnText">立即进入工作台</span>
                </button>
            </form>

            <div class="footer-note">
                基于 Zan 强类型自托管编译与高性能 MVC 架构
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. 背景微光粒子星座网络系统 (Canvas Particle Constellation)
        // -------------------------------------------------------------
        (function() {
            var canvas = document.getElementById('particleCanvas');
            var ctx = canvas.getContext('2d');
            var width, height;
            var particles = [];
            var count = 52;
            var mouse = { x: null, y: null, maxDist: 140 };

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            window.addEventListener('mousemove', function(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mouseout', function() {
                mouse.x = null;
                mouse.y = null;
            });

            for (var i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.7,
                    vy: (Math.random() - 0.5) * 0.7,
                    radius: Math.random() * 1.8 + 1,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                // 绘制与更新粒子
                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    // 鼠标交互推移斥力
                    if (mouse.x !== null && mouse.y !== null) {
                        var dx = p.x - mouse.x;
                        var dy = p.y - mouse.y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < mouse.maxDist) {
                            var force = (mouse.maxDist - dist) / mouse.maxDist;
                            p.x += (dx / dist) * force * 1.2;
                            p.y += (dy / dist) * force * 1.2;
                        }
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(56, 189, 248, ' + p.alpha + ')';
                    ctx.fill();

                    // 连线
                    for (var j = i + 1; j < particles.length; j++) {
                        var p2 = particles[j];
                        var lx = p.x - p2.x;
                        var ly = p.y - p2.y;
                        var ldist = Math.sqrt(lx * lx + ly * ly);
                        if (ldist < 120) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(p2.x, p2.y);
                            var lineAlpha = (1 - ldist / 120) * 0.16;
                            ctx.strokeStyle = 'rgba(56, 189, 248, ' + lineAlpha + ')';
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            }
            draw();
        })();

        // -------------------------------------------------------------
        // 2. 卡片 3D 视差悬浮与聚光灯跟踪交互
        // -------------------------------------------------------------
        (function() {
            var card = document.getElementById('cardBox');
            var spotlight = document.getElementById('spotlight');
            var rect = card.getBoundingClientRect();

            function updateRect() {
                rect = card.getBoundingClientRect();
            }
            window.addEventListener('resize', updateRect);
            window.addEventListener('scroll', updateRect);

            window.addEventListener('mousemove', function(e) {
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;

                // 更新聚光灯坐标
                card.style.setProperty('--mouse-x', x + 'px');
                card.style.setProperty('--mouse-y', y + 'px');

                // 3D 柔和倾斜角度 (-7deg 到 7deg)
                var centerX = rect.width / 2;
                var centerY = rect.height / 2;
                var rotateX = ((y - centerY) / centerY) * -6;
                var rotateY = ((x - centerX) / centerX) * 6;

                // 仅当鼠标在附近时生效
                var distToCenter = Math.sqrt(Math.pow(e.clientX - (rect.left + centerX), 2) + Math.pow(e.clientY - (rect.top + centerY), 2));
                if (distToCenter < 700) {
                    card.style.transform = 'rotateX(' + rotateX.toFixed(2) + 'deg) rotateY(' + rotateY.toFixed(2) + 'deg)';
                } else {
                    card.style.transform = 'rotateX(0deg) rotateY(0deg)';
                }
            });

            card.addEventListener('mouseleave', function() {
                card.style.transform = 'rotateX(0deg) rotateY(0deg)';
            });
        })();

        // -------------------------------------------------------------
        // 3. 登录请求与平滑反馈处理
        // -------------------------------------------------------------
        function showError(msg) {
            var b = document.getElementById('errorBanner');
            b.innerHTML = '<span>⚠️</span><span>' + msg + '</span>';
            b.style.display = 'flex';
        }

        function handleLogin(e) {
            e.preventDefault();
            var b = document.getElementById('errorBanner');
            b.style.display = 'none';

            var btn = document.getElementById('submitBtn');
            var btnText = document.getElementById('btnText');
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value;

            if (!u || !p) {
                showError('用户名和密码不能为空');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span> 正在校验安全凭证...';

            var params = new URLSearchParams();
            params.append('username', u);
            params.append('password', p);

            fetch('/admin/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params.toString()
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                if (res.code === '0000') {
                    btnText.innerHTML = '✓ 认证成功，正在跳转...';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    setTimeout(function() {
                        window.location.href = '/admin';
                    }, 400);
                } else {
                    btn.disabled = false;
                    btnText.textContent = '立即进入工作台';
                    showError(res.msg || '登录失败，请检查账号密码');
                }
            })
            .catch(function(err) {
                btn.disabled = false;
                btnText.textContent = '立即进入工作台';
                showError('网络连接失败，请确认服务端运行状态');
            });
        }
    </script>
</body>
</html>
