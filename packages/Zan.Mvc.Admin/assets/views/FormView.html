<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单视图</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            font-size: 13px;
        }
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }
        h2 {
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .form-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .required::after {
            content: " *";
            color: #ef4444;
        }
        input, select, textarea {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        .form-actions {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border-color); color: var(--text-main); }
    </style>
    <script src="/static/zan/js/core/event-bus.js"></script>
    <script src="/static/zan/js/core/layer.js"></script>
    <script src="/static/zan/js/core/form.js"></script>
</head>
<body>
    <div class="form-card">
        <h2 id="formTitle">表单</h2>
        <form id="dynamicForm">
            <div id="fieldsContainer"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="window.history.back()">返回</button>
                <button type="submit" class="btn btn-primary">确认保存</button>
            </div>
        </form>
    </div>

    <script>
        window.FORM_SCHEMA = {{formSchemaJson}};
    </script>
    <script>
        (function() {
            var schema = window.FORM_SCHEMA || {};
            if (schema.title) document.getElementById('formTitle').textContent = schema.title;

            var container = document.getElementById('fieldsContainer');
            (schema.fields || []).forEach(function(f) {
                var group = document.createElement('div');
                group.className = 'form-group';
                
                var lbl = document.createElement('label');
                lbl.textContent = f.label;
                if (f.required) lbl.className = 'required';
                group.appendChild(lbl);

                var input;
                if (f.type === 'textarea') {
                    input = document.createElement('textarea');
                    input.rows = 4;
                } else if (f.type === 'select') {
                    input = document.createElement('select');
                    if (f.options) {
                        for (var k in f.options) {
                            var opt = document.createElement('option');
                            opt.value = k;
                            opt.textContent = f.options[k];
                            input.appendChild(opt);
                        }
                    }
                } else {
                    input = document.createElement('input');
                    input.type = f.type || 'text';
                }

                input.name = f.name;
                if (f.placeholder) input.placeholder = f.placeholder;
                if (f.required) input.required = true;
                group.appendChild(input);

                container.appendChild(group);
            });

            // 绑定异步提交
            var form = document.getElementById('dynamicForm');
            form.action = schema.submitUrl || '';
            form.method = schema.method || 'POST';
            if (window.ZanForm) {
                window.ZanForm.bind(form);
            }
        })();
    </script>
</body>
</html>
