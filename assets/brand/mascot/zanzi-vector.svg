<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Zanzi vector master: chibi red panda, sitting pose.
       Pattern rules: tail = ring chain + volt-blue bolt tip; no body spots.
       Anchors: forehead bolt / blue bolt tail tip / cobalt scarf. -->
  <defs>
    <linearGradient id="tailbolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E86FF"/>
      <stop offset="1" stop-color="#2141E6"/>
    </linearGradient>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- ===== tail: silhouette pass then overlapping ring chain (base -> tip) ===== -->
    <g stroke="none">
      <circle cx="366" cy="262" r="46" fill="#402E24"/>
      <circle cx="408" cy="300" r="45" fill="#402E24"/>
      <circle cx="428" cy="348" r="44" fill="#402E24"/>
      <circle cx="428" cy="398" r="42" fill="#402E24"/>
      <circle cx="418" cy="448" r="40" fill="#402E24"/>
      <path d="M 246 78 L 222 122 L 238 122 L 230 152 L 262 108 L 244 108 Z" fill="#402E24"
            transform="translate(398 458) rotate(-38) scale(2.1) translate(-242 -115)"/>
      <circle cx="366" cy="262" r="40" fill="#E08A4C"/>
      <circle cx="408" cy="300" r="39" fill="#8C4A2B"/>
      <circle cx="428" cy="348" r="38" fill="#E08A4C"/>
      <circle cx="428" cy="398" r="36" fill="#8C4A2B"/>
      <circle cx="418" cy="448" r="34" fill="#E08A4C"/>
      <path d="M 246 78 L 222 122 L 238 122 L 230 152 L 262 108 L 244 108 Z" fill="url(#tailbolt)"
            transform="translate(398 458) rotate(-38) scale(1.92) translate(-242 -115)"/>
    </g>
    <!-- ===== hind feet ===== -->
    <g stroke="#402E24" stroke-width="6">
      <ellipse cx="168" cy="446" rx="48" ry="30" fill="#E08A4C"/>
      <ellipse cx="312" cy="446" rx="48" ry="30" fill="#E08A4C"/>
      <ellipse cx="160" cy="438" rx="26" ry="15" fill="#7A4226" stroke="none"/>
      <ellipse cx="304" cy="438" rx="26" ry="15" fill="#7A4226" stroke="none"/>
      <!-- ===== body ===== -->
      <ellipse cx="240" cy="330" rx="132" ry="118" fill="#E08A4C"/>
      <ellipse cx="240" cy="362" rx="90" ry="80" fill="#FFF3DC" stroke="none"/>
      <!-- ===== arms resting on belly ===== -->
      <ellipse cx="158" cy="308" rx="30" ry="52" fill="#E08A4C" transform="rotate(18 158 308)"/>
      <ellipse cx="322" cy="308" rx="30" ry="52" fill="#E08A4C" transform="rotate(-18 322 308)"/>
      <ellipse cx="190" cy="350" rx="25" ry="16" fill="#7A4226" transform="rotate(18 190 350)"/>
      <ellipse cx="290" cy="350" rx="25" ry="16" fill="#7A4226" transform="rotate(-18 290 350)"/>
    </g>
    <!-- ===== scarf: neck band, side knot on the right + draping ends ===== -->
    <g stroke="#402E24" stroke-width="5">
      <path d="M 152 292 Q 240 332 328 292 L 324 316 Q 240 356 156 316 Z" fill="#2B5CFF"/>
      <path d="M 300 318 Q 290 362 272 392 L 316 376 Z" fill="#2B5CFF"/>
      <path d="M 318 314 Q 340 342 350 372 L 358 322 Z" fill="#2141E6"/>
      <circle cx="308" cy="312" r="16" fill="#2B5CFF"/>
    </g>
    <!-- ===== ears (white rim) ===== -->
    <g stroke="#402E24" stroke-width="6">
      <circle cx="136" cy="92" r="52" fill="#FFF3DC"/>
      <circle cx="344" cy="92" r="52" fill="#FFF3DC"/>
      <circle cx="138" cy="94" r="38" fill="#E08A4C"/>
      <circle cx="342" cy="94" r="38" fill="#E08A4C"/>
      <circle cx="140" cy="96" r="18" fill="#FFF3DC" stroke="none"/>
      <circle cx="340" cy="96" r="18" fill="#FFF3DC" stroke="none"/>
      <!-- ===== head ===== -->
      <circle cx="240" cy="188" r="122" fill="#E08A4C"/>
      <!-- forehead bolt -->
      <path d="M 246 78 L 222 122 L 238 122 L 230 152 L 262 108 L 244 108 Z" fill="#4A3529" stroke-width="4"/>
      <!-- muzzle -->
      <ellipse cx="240" cy="244" rx="52" ry="36" fill="#FFF3DC" stroke="none"/>
      <!-- eyes -->
      <circle cx="184" cy="174" r="24" fill="#FFFFFF" stroke-width="4"/>
      <circle cx="296" cy="174" r="24" fill="#FFFFFF" stroke-width="4"/>
      <circle cx="186" cy="178" r="16" fill="#F5A623" stroke="none"/>
      <circle cx="294" cy="178" r="16" fill="#F5A623" stroke="none"/>
      <circle cx="186" cy="178" r="7.5" fill="#402E24" stroke="none"/>
      <circle cx="294" cy="178" r="7.5" fill="#402E24" stroke="none"/>
      <circle cx="191" cy="171" r="4.5" fill="#FFFFFF" stroke="none"/>
      <circle cx="299" cy="171" r="4.5" fill="#FFFFFF" stroke="none"/>
      <!-- brow dots -->
      <circle cx="184" cy="132" r="10" fill="#FFF3DC" stroke="none"/>
      <circle cx="296" cy="132" r="10" fill="#FFF3DC" stroke="none"/>
      <!-- nose + mouth -->
      <path d="M 229 226 Q 240 220 251 226 Q 247 237 240 237 Q 233 237 229 226 Z" fill="#4A3529" stroke-width="4"/>
      <path d="M 240 237 L 240 245 M 240 245 Q 230 254 221 246 M 240 245 Q 250 254 259 246" fill="none" stroke-width="5"/>
      <path d="M 246 256 L 256 256 L 251 267 Z" fill="#FFFFFF" stroke-width="3"/>
    </g>
  </g>
</svg>
