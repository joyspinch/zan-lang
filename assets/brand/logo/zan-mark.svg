<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Zan mark: rounded app tile, volt gradient, white z-goose + gold spark -->
  <defs>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F79FF"/>
      <stop offset="1" stop-color="#1D3CDA"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCE38"/>
      <stop offset="1" stop-color="#FF931E"/>
    </linearGradient>
  </defs>

  <!-- App Tile Base -->
  <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#volt)"/>

  <!-- The Z-Goose Group -->
  <g id="z-goose">
    <!-- Golden Beak -->
    <path d="M 160 168 L 90 186 L 160 204 Z" fill="url(#spark)"/>

    <!-- Solid White Goose Body forming the fluid bold 'Z' -->
    <path d="
      M 160 168
      C 160 128, 190 114, 235 114
      C 278 114, 305 138, 305 174
      C 305 210, 325 250, 345 280
      C 355 292, 375 294, 396 274
      C 382 300, 388 318, 412 304
      C 396 332, 402 346, 422 334
      C 406 376, 360 424, 276 434
      C 204 442, 142 414, 142 368
      C 142 324, 180 290, 195 252
      C 205 224, 195 204, 160 204
      Z"
      fill="#FFFFFF"/>

    <!-- Sharp Innocent Eye -->
    <circle cx="215" cy="164" r="8" fill="#0F1428"/>
    <circle cx="212.5" cy="161.5" r="2.5" fill="#FFFFFF"/>

    <!-- Golden Spark Star at Top Right -->
    <path d="M 404 88 L 413 112 L 438 120 L 413 128 L 404 152 L 395 128 L 370 120 L 395 112 Z"
          fill="url(#spark)"/>
  </g>
</svg>
