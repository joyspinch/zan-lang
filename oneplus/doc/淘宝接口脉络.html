<style>
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
a{color:var(--ac);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
code,.mono{font-family:Consolas,"Courier New",monospace;font-size:12.5px}
header{padding:18px 28px 10px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#111726,#0d1117)}
header h1{font-size:20px;font-weight:700}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:8px 14px;min-width:96px}

.stat span{font-size:12px;color:var(--tx2)}
nav{display:flex;gap:4px;padding:10px 28px;border-bottom:1px solid var(--bd);background:var(--bg2);flex-wrap:wrap;position:sticky;top:0;z-index:50}
nav button{background:none;border:1px solid transparent;color:var(--tx2);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:13.5px;font-family:inherit}
nav button:hover{color:var(--tx);background:var(--bg3)}
nav button.on{background:var(--bg3);color:var(--ac);border-color:var(--bd);font-weight:600}
main{padding:22px 28px;max-width:1500px;margin:0 auto}
.view{display:none}.view.on{display:block}
h2{font-size:16px;margin:26px 0 12px;color:var(--tx)}

.card{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h3{font-size:14.5px;margin-bottom:8px}
.note{background:#1a2233;border-left:3px solid var(--ac);padding:10px 14px;border-radius:0 6px 6px 0;margin:10px 0;font-size:13px;color:var(--tx2)}

.note.dead{border-color:var(--dead);background:#241416}

.badge.b3{background:#3a2c10;color:#e3b341}.badge.b4{background:#3a1518;color:#f47067}
.badge.b5{background:#2a1a3a;color:#c297ff}
table{border-collapse:collapse;width:100%;font-size:12.8px}

.iname{color:var(--ac);cursor:pointer;word-break:break-all}
.iname:hover{text-decoration:underline}
.dim{color:var(--tx2)}
.url{color:#9aa7bb;word-break:break-all;font-size:11.8px}
.mth{color:var(--ac2);font-weight:600;font-size:11.5px}
.mth.G{color:var(--warn)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}

.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.acc-head:hover{background:var(--bg3)}

.accordion.open .acc-head .arrow{transform:rotate(90deg)}

.acc-body{display:none;padding:14px 16px;border-top:1px solid var(--bd);background:#121824}
.accordion.open .acc-body{display:block}
.chain{border:1px solid var(--bd);border-radius:10px;background:var(--bg2);margin-bottom:16px;overflow:hidden}

.chain-body{display:none;padding:6px 16px 16px;border-top:1px solid var(--bd)}
.chain.open .chain-body{display:block}
.steps{margin:12px 0;position:relative}
.step{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed #232d40}
.step:last-child{border-bottom:none}
.step .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--bd);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.step .bd{flex:1;min-width:0}
.step .bd .ep{color:var(--tx2);font-size:12px;word-break:break-all}
.group-head{font-size:13px;color:var(--warn);margin:14px 0 8px;font-weight:600}
.hier{display:flex;flex-direction:column;gap:0;align-items:flex-start;font-family:Consolas,monospace;font-size:13px}
.hier .lv{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;margin:4px 0;position:relative}
.hier .lv b{color:var(--ac)}
.hier .kids{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 6px 34px}
.hier .kids .lv{padding:5px 12px;font-size:12.5px;margin:0}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.flow .fnode{background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:5px 11px}

.k{color:#7ee787}.c{color:#8b98ab}.s{color:#a5d6ff}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IFACE=new Map(DATA.interfaces.map(r=>[r.name,r]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',1600)}
function gotoIface(name){
  if(!IFACE.has(name)){toast('未收录: '+name);return}
  switchTab('v-iface');
  state.q=name;state.status='all';$('#iq').value=name;syncFilters();renderIface();
  const tr=document.getElementById('row-'+cssId(name));
  if(tr)tr.scrollIntoView({block:'center'});
  toast('已定位: '+name);
}
function cssId(s){return 'x'+s.replace(/[^A-Za-z0-9]/g,c=>'_'+c.charCodeAt(0))}
function reqLinks(names,limit){
  if(!names||!names.length)return '<span class="dim">—</span>';
  const shown=names.slice(0,limit||8);
  let h=shown.map(n=>'<a class="iname" onclick="gotoIface(\''+esc(n)+'\')">'+esc(short(n))+'</a>').join(' ');
  if(names.length>(limit||8))h+=' <span class="dim">+'+(names.length-(limit||8))+'</span>';
  return h;
}
function short(n){return n.replace(/Request$/,'').replace(/Async$/,'')}
function hostBadge(h){const m={'万相台 One':'b1','达摩盘':'b5','达摩盘(新)':'b5','Mtop H5':'b3','厂商后端':'b4','创意中心':'b2','创意制作':'b2','京东快车':'b4'};return '<span class="badge '+(m[h]||'')+'">'+esc(h)+'</span>'}

/* ---------- ② 列表 × 右键菜单 ---------- */
(function(){
  let h=`<div class="ctrl">
    <input id="lq" placeholder="搜索菜单项 / 窗体 / 接口…" oninput="renderLists()">
    <label><input type="checkbox" id="lonly" onchange="renderLists()"> 只显示含接口的菜单项</label>
    <span class="dim" id="lcount"></span>
  </div><div id="listBox"></div>`;
  $('#v-lists').innerHTML=h;
  window.renderLists=function(){
    const q=($('#lq').value||'').toLowerCase(), only=$('#lonly').checked;
    let html='',groups={},total=0,linked=0;
    DATA.lists.forEach((L,i)=>{
      if(!L.form&&!L.menus.length)return;
      const key=(L.top||'')+' / '+(L.mod||'');
      let menus=L.menus.filter(m=>(!only||m.requests.length)&&(m.item+ (m.actionForm||'')+ (m.requests||[]).join(' ')).toLowerCase().includes(q));
      if(q&&!menus.length&&!(L.title+L.form).toLowerCase().includes(q))return;
      if(!groups[key])groups[key]=[];
      const self=L.selfRequests||[];
      groups[key].push(`
      <div class="accordion${i<2?' open':''}" id="acc${i}">
        <div class="acc-head" onclick="this.parentNode.classList.toggle('open')">
          <span class="arrow">▶</span><b>${esc(L.title.replace(/：.*$/,''))}</b>
          <span class="badge b1">${esc(L.ctx||'')}</span>
          <span class="mono dim">${esc(L.form)}</span>
          ${self.length?'<span class="badge b2">列表自身接口 ×'+self.length+'</span>':''}
          <span class="badge">菜单 ${L.menus.length} 项</span>
        </div>
        <div class="acc-body">
          ${self.length?`<div style="margin-bottom:8px"><span class="dim">列表数据接口：</span>${reqLinks(self,20)}</div>`:''}
          ${(L.syncForms||[]).length?`<div style="margin-bottom:8px"><span class="dim">同步任务窗体：</span>${L.syncForms.map(f=>'<span class="badge b3">'+esc(f)+'</span>').join('')}</div>`:''}
          <table><tr><th style="width:230px">右键菜单</th><th style="width:230px">动作窗体</th><th>关联接口（点击跳转）</th></tr>
          ${menus.map(m=>{total++;if(m.requests.length)linked++;
            return `<tr><td>${esc(m.item)}</td><td class="mono dim">${esc(m.actionForm||m.action||'')}</td><td>${reqLinks(m.requests,10)}</td></tr>`}).join('')}
          </table>
        </div>
      </div>`);
    });
    html=Object.entries(groups).map(([k,arr])=>`<div class="group-head">${esc(k)}（${arr.length} 个列表）</div>${arr.join('')}`).join('');
    $('#listBox').innerHTML=html||'<div class="card dim">无匹配</div>';
    $('#lcount').textContent=`共 ${DATA.lists.filter(l=>l.form).length} 个列表 · 当前显示菜单项 ${total}（含接口 ${linked}）`;
  };
  renderLists();
})();

          ${(r.callers||[]).slice(0,3).map(c=>'<span class="badge mono dim">'+esc(c.split('/').pop())+'</span>').join('')}
          ${(r.callers||[]).length>3?`<span class="dim">+${r.callers.length-3}</span>`:''}

        <b>调用方（${r.callers.length}）：</b>${r.callers.length?r.callers.map(c=>'<span class="badge mono">'+esc(c)+'</span>').join(''):'无（死接口）'}<br>

/* ---------- ⑥ zan 迁移设计 ---------- */
(function(){
  let h=`
  <div class="card">
    <h3>设计目标</h3>
    <p class="dim">把现在「Request 类 + OneApi 静态门面 + 窗体内散落拼接」的三层混乱，收敛为<b>声明式接口表 + 信封中间件 + 管道组合器</b>，让任意接口可按依赖顺序自由组合——这是用户要求的「更灵活的使用，方便把各个接口组合起来」。</p>
  </div>
  <div class="two-col">
    <div class="card">
      <h3>1. 声明式接口注册表（替代 222 个 Request 类）</h3>
<pre><span class="c">// 每个接口一条记录；迁移时逐条从本页「③ 接口总表」誊录</span>
<span class="k">struct</span> ApiSpec {
    <span class="k">string</span> Name;        <span class="c">// "campaign.findPage"</span>
    <span class="k">string</span> Host;        <span class="c">// AuthHost.One / .Dmp / .Mtop / .Creative</span>
    <span class="k">string</span> Method;      <span class="c">// "POST"</span>
    <span class="k">string</span> Path;        <span class="c">// "/campaign/horizontal/findPage.json"</span>
    AuthKind Auth;      <span class="c">// CsrfEnvelope | XsrfToken | MtopSign | None</span>
    <span class="k">bool</span>   BizInBody;   <span class="c">// bizCode 是否同时进 body（One 系全是）</span>
}
<span class="k">static</span> ApiRegistry One = <span class="k">new</span> ApiRegistry(...); <span class="c">// 153 条在用</span></pre>
    </div>
    <div class="card">
      <h3>2. 信封中间件（按鉴权域分流，替代 OneApiClient 硬编码）</h3>
<pre><span class="c">// one.alimama.com：URL 带 _aem_uid/lite2/bizCode/csrfId，</span>
<span class="c">// body 再重复一遍 —— 封装后调用方零感知</span>
<span class="k">class</span> EnvelopeMiddleware {
    <span class="k">void</span> Apply(HttpReq r, Session s, <span class="k">string</span> bizCode) {
        r.Url.Add(<span class="s">"_aem_uid"</span>, <span class="s">"mx_"</span> + Rand.Next())
             .Add(<span class="s">"lite2"</span>, <span class="s">"false"</span>)
             .Add(<span class="s">"bizCode"</span>, bizCode)
             .Add(<span class="s">"csrfId"</span>, s.CsrfId);
        r.Body[<span class="s">"bizCode"</span>] = bizCode; <span class="c">// …csrfId/loginPointId</span>
        r.Headers[<span class="s">"Bx-V"</span>] = <span class="s">"2.5.36"</span>;
    }
}</pre>
    </div>
    <div class="card">
      <h3>3. Session 层（替代 4 个静态 CookieManager）</h3>
<pre><span class="k">class</span> Session {
    CookieJar Jar;           <span class="c">// ★ zan 需新增（stdlib 缺口）</span>
    <span class="k">string</span> CsrfId;           <span class="c">// WebView 嗅探 checkAccess.json</span>
    <span class="k">string</span> LoginPointId;
    <span class="k">string</span> H5Token;          <span class="c">// _m_h5_tk → mtop 签名</span>
    <span class="k">string</span> DmpXsrf;          <span class="c">// XSRF-TOKEN@dmp.taobao.com</span>
    <span class="k">event</span>  OnReloginNeeded;  <span class="c">// LoginOutException → 拉起登录页</span>
}</pre>
      <div class="dim" style="font-size:12.5px">登录嗅探：Win 用 WebView2 COM 的 WebResourceResponseReceived；macOS 用 WKWebView 的 WKURLSchemeTask/导航代理。抽象成 ILoginSniffer 双实现。</div>
    </div>
    <div class="card">
      <h3>4. 管道组合器（表达「有顺序的调用」）</h3>
<pre><span class="c">// 克隆计划链：上一步输出经 ctx 传给下一步</span>
<span class="k">var</span> pipe = Pipeline(<span class="s">"cloneCampaign"</span>)
  .Step(One.SolutionCopy,   ctx =&gt; Params(src))
  .Step(One.UpdateStatus,   ctx =&gt; Pause(ctx.NewCampaignId))
  .Step(One.AdzoneFindAgg,  ctx =&gt; Params(src))
  .Step(One.SolutionAdd,    ctx =&gt; Rebuild(ctx))
  .Step(One.AdvancedUpdate, ctx =&gt; Adzones(ctx))
  .OnEach(Wait.Jitter)       <span class="c">// 限速：随机延时</span>
  .OnError(Report.AndContinue); <span class="c">// 逐计划不回滚，与现状一致</span>
<span class="k">await</span> pipe.Run(ctx);</pre>
      <div class="dim" style="font-size:12.5px">zan 已有 async/await（CPS）；缺 Task&lt;T&gt;/WhenAll → 并发拉页先用信号量+串行 await 或扩展 stdlib。</div>
    </div>
    <div class="card">
      <h3>5. 读-改-写 模式助手（防整包覆盖事故）</h3>
<pre><span class="c">// batchModifyV2 是整包替换 —— 用模式函数强制「先读后并后写」</span>
<span class="k">await</span> Crowds.ReadModifyWrite(campaignId, adgroupId,
    existing =&gt; Merge(existing, newCrowds)); <span class="c">// 内部：</span>
<span class="c">// CrowdGet → 合并(保 mx_crowdId 规则) → CrowdBatchModify</span></pre>
    </div>
    <div class="card">
      <h3>6. 风控状态机 + 同步底座</h3>
<pre><span class="c">// 响应判定集中在一个出口</span>
<span class="k">match</span> resp.Code {
  <span class="s">"FAIL_SYS_USER_VALIDATE"</span> =&gt; Slider.Verify,
  403 =&gt; Session.Relogin,  703/704 =&gt; Retry,
  <span class="s">"不存在"</span> =&gt; Skip,        _ =&gt; Throw
}
<span class="c">// 同步任务 = 声明：SyncJob(Campaign.findPage, 并发8, TTL 600s)</span>
<span class="c">// 写完调 cache.Invalidate(campaignId) ≙ DeleteTimeOutCamp</span></pre>
    </div>
  </div>
  <div class="card">
    <h3>迁移顺序建议</h3>
    <table><tr><th>阶段</th><th>内容</th><th>依赖</th></tr>
    <tr><td>P0</td><td>zan stdlib 补 CookieJar；HTTP 信封中间件；Session + 登录嗅探（Win 先行）</td><td>—</td></tr>
    <tr><td>P1</td><td>接口注册表 153 条 + 解析器；同步任务（计划/主体/关键词/人群/词包/创意/资源位）→ SQLite</td><td>P0</td></tr>
    <tr><td>P2</td><td>列表工作台（DataTable 虚拟化 + 右键菜单配置表，菜单项↔管道绑定）</td><td>P1</td></tr>
    <tr><td>P3</td><td>④ 调用链全部实现为管道；一键优化；风控状态机</td><td>P2</td></tr>
    <tr><td>P4</td><td>macOS WKWebView 嗅探 + 京东快车同构层（换注册表+信封即可）</td><td>P3</td></tr>
    </table>
  </div>`;
  $('#v-zan').innerHTML=h;
})();
</script>
