<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="Zan 扩展与程序商城 — 扩展（库）安装进 IDE，程序（成品）可执行文件 + 许可证。">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body class="public">
<!-- 商城公共布局：顶栏（扩展/程序/账户）+ 内容 + 页脚。 -->
<header class="site-header">
  <a class="brand" href="/"><span class="brand-mark">Z</span> Zan 商城</a>
  <nav>
    <a href="/mall" aria-current="{{navMall}}">扩展与程序</a>
    <a href="/account" aria-current="{{navAccount}}">我的账户</a>
    {{#if logged}}
    <a href="/logout">退出（{{username}}）</a>
    {{/if}}
    {{#if anonymous}}<a href="/login">登录</a><a href="/register">注册</a>{{/if}}
  </nav>
</header>

<main class="container">
  <div id="flash" class="stack"></div>
  {{content}}
</main>

<footer class="site-footer">
  <div>Zan 扩展与程序商城 · 扩展走 IDE 安全安装 · 程序交付可执行文件 + 许可证</div>
  <div>IDE 默认对接本站：https://ide.zanlang.top</div>
</footer>
</body>
</html>
