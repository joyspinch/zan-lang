<section class="card auth-card">
  <header>
    <span class="brand-mark">Z</span>
    <div>
      <h2>注册账号</h2>
      <p class="hint">注册即成为商城用户，可申请成为开发者</p>
    </div>
  </header>
  <form class="body form" method="post" action="/register">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    <input type="hidden" name="next" value="{{next}}">
    <div class="form-row">
      <label for="user">账号（3-64 字符）</label>
      <input class="input" id="user" type="text" name="user" value="{{user}}"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-row">
      <label for="pass">密码（8-128 字符）</label>
      <input class="input" id="pass" type="password" name="password"
             autocomplete="new-password" required>
    </div>
    <div class="form-row">
      <label for="confirm">确认密码</label>
      <input class="input" id="confirm" type="password" name="confirm"
             autocomplete="new-password" required>
    </div>
    <button class="btn btn-primary" type="submit">注册</button>
    <p class="hint"><a href="/login?next={{next}}">已有账号？登录</a></p>
  </form>
</section>
