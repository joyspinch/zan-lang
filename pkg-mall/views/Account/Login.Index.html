<section class="card auth-card">
  <header>
    <span class="brand-mark">Z</span>
    <div>
      <h2>Zan 商城</h2>
      <p class="hint">登录以购买、兑换与下载</p>
    </div>
  </header>
  <form class="body form" method="post" action="/login">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    <input type="hidden" name="next" value="{{next}}">
    <div class="form-row">
      <label for="user">账号</label>
      <input class="input" id="user" type="text" name="user" value="{{user}}"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-row">
      <label for="pass">密码</label>
      <input class="input" id="pass" type="password" name="password"
             autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">登录</button>
    <p class="hint"><a href="/register?next={{next}}">注册账号</a></p>
  </form>
</section>
