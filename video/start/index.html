<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zan · 为人和 AI 而生的语言</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  #gl{display:block;margin:auto;position:absolute;inset:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center;color:#9af7d3;background:#04060a;
    font:11px/1.9 Consolas,monospace;letter-spacing:.4em;transition:opacity .5s;z-index:9}
  #boot.off{opacity:0;pointer-events:none}
  #rec{position:fixed;left:16px;bottom:14px;color:#9af7d3;font:11px Consolas,monospace;
    letter-spacing:.06em;opacity:0;transition:opacity .3s;z-index:8}
  #rec.on{opacity:.9}
  #fatal{position:fixed;inset:0;display:none;place-items:center;background:#04060a;color:#eef1f2;
    font:13px/2 Consolas,monospace;padding:40px;text-align:center;z-index:10}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="boot">ZAN</div>
<div id="rec"></div>
<div id="fatal"><span id="fatalMsg"></span></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════════════════
   Zan · 品牌片（20s / 锁机位 / 全部内容画进画布 / WebCodecs 出片）
   四段：宣言 → 简洁 → 原生 → 界面 → 落版
   所有动画都是 t 的解析函数，t=0 与 t=20 同态。
   ══════════════════════════════════════════════════════════════════════ */

const W = 1920, H = 1080, D = 20.0;
const qs = new URLSearchParams(location.search);
const ENCODE = qs.has('encode');
const FPS = Number(qs.get('fps')) || 60;
const EW = Number(qs.get('w')) || 1920, EH = Number(qs.get('h')) || 1080;
const SHOT = qs.has('shot') ? Number(qs.get('shot')) : null;
const canvas = document.getElementById('gl');

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const range = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const env = (t, a, b, fi = 0.3, fo = 0.3) => smooth(range(t, a, a + fi)) * (1 - smooth(range(t, b - fo, b)));

/* ── 渲染器 ── */
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false }); }
catch (e) { fatal('浏览器未启用 WebGL。'); throw e; }
const DPR = Math.min(Number(qs.get('dpr')) || devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const VH = 2, VW = VH * (W / H);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
const cam = new THREE.OrthographicCamera(-VW / 2, VW / 2, VH / 2, -VH / 2, -10, 10);
cam.position.z = 5;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(1280, 720), 0.30, 0.75, 0.92);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: 0.02 }, uVig: { value: 0.62 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime,uGrain,uVig; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 c = vUv-0.5; float r = length(c);
      vec3 col = texture2D(tDiffuse,vUv).rgb;
      col *= mix(1.0, 0.42, smoothstep(0.30, 0.95, r*uVig));
      col += (hash(vUv*vec2(1920.,1080.)+fract(uTime)*91.7)-0.5)*uGrain;
      gl_FragColor = vec4(max(col,0.0),1.0);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ── 一张 1920×1080 的画布承载全部内容（导出时字幕天然在里面）── */
const hud = document.createElement('canvas');
hud.width = W; hud.height = H;
const g = hud.getContext('2d');
const hudTex = new THREE.CanvasTexture(hud);
hudTex.colorSpace = THREE.SRGBColorSpace;
hudTex.minFilter = THREE.LinearFilter;
hudTex.magFilter = THREE.LinearFilter;
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(VW, VH),
  new THREE.MeshBasicMaterial({ map: hudTex })
);
scene.add(plane);

/* ── 排版工具 ── */
const SANS = '"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif';
const MONO = 'Consolas,"Cascadia Code",monospace';
const C = { ink: '#04060a', paper: '#eef1f2', mint: '#9af7d3', dim: 'rgba(238,241,242,.45)', gold: '#ffc838' };

function text(s, x, y, size, color, opt = {}) {
  g.save();
  g.font = (opt.weight || '400') + ' ' + size + 'px ' + (opt.mono ? MONO : SANS);
  g.fillStyle = color;
  g.textAlign = opt.align || 'center';
  g.textBaseline = opt.base || 'middle';
  if (opt.track) g.letterSpacing = opt.track;
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.fillText(s, x, y);
  g.restore();
}
function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}
function chip(x, y, w, h, label, accent, alpha = 1) {
  g.save(); g.globalAlpha = alpha;
  rrect(x - w / 2, y - h / 2, w, h, 10);
  g.fillStyle = 'rgba(10,15,21,.9)'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = accent ? 'rgba(154,247,211,.55)' : 'rgba(255,255,255,.18)'; g.stroke();
  g.font = '500 30px ' + MONO; g.fillStyle = accent ? C.mint : C.paper;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, x, y + 1);
  g.restore();
}

/* ── 品牌字标（手绘路径，不依赖字体）── */
function wordmark(cx, cy, gh, color, alpha) {
  const s = gh / 150;
  g.save(); g.globalAlpha = alpha;
  g.translate(cx, cy); g.scale(s, s); g.translate(-320, -160);
  g.strokeStyle = color; g.lineWidth = 38; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(19, 85); g.lineTo(191, 85); g.lineTo(19, 235); g.lineTo(191, 235); g.stroke();
  g.beginPath(); g.arc(338, 160, 75, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(413, 85); g.lineTo(413, 235); g.stroke();
  g.beginPath(); g.moveTo(485, 235); g.lineTo(485, 148);
  g.arc(548, 148, 63, Math.PI, 0, true); g.lineTo(611, 235); g.stroke();
  g.beginPath(); g.arc(654, 216, 19, 0, Math.PI * 2); g.fillStyle = C.mint; g.fill();
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════════
   四段内容
   ══════════════════════════════════════════════════════════════════════ */

/* 1 · 宣言：减法 */
function beatManifesto(t) {
  const a = env(t, 0.20, 2.15, 0.55, 0.35);
  if (a > 0.002) text('少。', W / 2, 520, 250, C.paper, { weight: '600', alpha: a, track: '8px' });
  const b = env(t, 2.45, 3.85, 0.55, 0.4);
  if (b > 0.002) text('做减法的语言。', W / 2, 540, 66, C.mint, { weight: '600', alpha: b, track: '4px' });
  const ln = env(t, 0.5, 3.9, 0.6, 0.3);
  if (ln > 0.002) {
    const w = 260 * easeOut(range(t, 0.5, 1.5));
    g.save(); g.globalAlpha = ln * 0.45; g.fillStyle = C.mint;
    g.fillRect(W / 2 - w / 2, 600, w, 2); g.restore();
  }
}

/* 2 · 代码的减法：60 → 6 行 */
const MARKUP = [
  '<card w="340" r="18">',
  '  <cover src="cover.png" />',
  '  <text>Midnight Drive</text>',
  '  <text class="sub">Zan Sessions</text>',
  '  <progress value="40%" />',
  '  <button icon="play" />',
  '</card>'
];
function beatCode(t) {
  const a = env(t, 3.60, 8.15, 0.45, 0.45);
  if (a < 0.002) return;

  // 大数字 60 → 6
  const roll = easeOut(range(t, 3.9, 6.2));
  const num = Math.round(60 - 53 * roll);
  text(String(num), 480, 470, 190, C.mint, { weight: '600', alpha: a });
  text('行声明', 480, 580, 26, C.dim, { alpha: a, track: '3px' });

  // 代码逐行出现
  const lines = easeOut(range(t, 4.1, 6.4));
  const show = Math.floor(lines * MARKUP.length);
  const px = 1240, py = 470, pw = 880, ph = 420;
  g.save(); g.globalAlpha = a * smooth(range(t, 3.7, 4.1));
  rrect(px - pw / 2, py - ph / 2, pw, ph, 14);
  g.fillStyle = 'rgba(8,12,17,.94)'; g.fill();
  g.lineWidth = 1.3; g.strokeStyle = 'rgba(255,255,255,.13)'; g.stroke();
  g.font = '400 15px ' + MONO; g.fillStyle = 'rgba(255,255,255,.32)';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('player.html', px - pw / 2 + 30, py - ph / 2 + 26);
  g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(px - pw / 2, py - ph / 2 + 48, pw, 1);
  MARKUP.forEach((line, i) => {
    if (i > show) return;
    const on = clamp((lines * MARKUP.length) - i, 0, 1);
    g.globalAlpha = a * on;
    g.font = '400 27px ' + MONO;
    const y = py - ph / 2 + 100 + i * 48;
    const tag = line.match(/^<\/?([a-z]+)/);
    if (tag) {
      const head = '<' + (line.trim().startsWith('</') ? '/' : '') + tag[1];
      g.fillStyle = 'rgba(154,247,211,.92)'; g.fillText(head, px - pw / 2 + 34, y);
      g.fillStyle = 'rgba(238,241,242,.52)';
      g.fillText(line.slice(head.length), px - pw / 2 + 34 + g.measureText(head).width, y);
    } else {
      g.fillStyle = 'rgba(238,241,242,.52)'; g.fillText(line, px - pw / 2 + 34, y);
    }
  });
  g.restore();

  const c = env(t, 6.2, 8.1, 0.35, 0.4);
  if (c > 0.002) text('一个播放器卡片，七行声明。', W / 2, 810, 40, C.paper, { alpha: c, track: '1px' });
}

/* 3 · 运行时的减法：一层层拿掉，只剩一个二进制 */
function beatNative(t) {
  const a = env(t, 8.35, 12.55, 0.45, 0.45);
  if (a < 0.002) return;
  const LAYERS = ['虚拟机', '垃圾回收', '框架', '运行时'];
  LAYERS.forEach((name, i) => {
    const on = smooth(range(t, 8.6 + i * 0.22, 8.9 + i * 0.22));
    const off = smooth(range(t, 9.9 + i * 0.16, 10.2 + i * 0.16));
    const y = 360 + i * 62;
    if (on <= 0.002) return;
    g.save(); g.globalAlpha = a * on * (1 - off);
    rrect(660, y - 26, 600, 52, 8);
    g.fillStyle = 'rgba(255,255,255,.04)'; g.fill();
    g.lineWidth = 1.2; g.strokeStyle = 'rgba(255,255,255,.14)'; g.stroke();
    g.font = '400 24px ' + SANS; g.fillStyle = 'rgba(238,241,242,.5)';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(name, 960, y + 1);
    g.restore();
  });
  const p = easeOut(range(t, 10.6, 11.5));
  if (p > 0.002) chip(960, 470, 300, 84, 'app.exe', true, a * p);
  const b = env(t, 10.9, 12.5, 0.4, 0.4);
  if (b > 0.002) {
    text('没有虚拟机。', W / 2, 700, 44, C.paper, { alpha: b, track: '2px' });
    text('LLVM AOT   ·   ARC   ·   启动 8ms', W / 2, 772, 21, C.mint, { alpha: b * 0.8, mono: true, track: '3px' });
  }
}

/* 4 · 界面的减法：几行声明 → 原生播放器卡片 */
function beatUI(t) {
  const a = env(t, 12.45, 17.05, 0.45, 0.5);
  if (a < 0.002) return;
  g.save(); g.globalAlpha = a;
  g.font = '400 24px ' + MONO; g.textAlign = 'left'; g.textBaseline = 'middle';
  const lx = 250, ly = 470;
  MARKUP.forEach((line, i) => {
    const on = smooth(range(t, 12.6 + i * 0.2, 12.9 + i * 0.2));
    if (on <= 0.002) return;
    g.globalAlpha = a * on;
    const tag = line.match(/^<\/?([a-z]+)/);
    if (tag) {
      const head = '<' + (line.trim().startsWith('</') ? '/' : '') + tag[1];
      g.fillStyle = 'rgba(154,247,211,.92)'; g.fillText(head, lx, ly + i * 46);
      g.fillStyle = 'rgba(238,241,242,.5)';
      g.fillText(line.slice(head.length), lx + g.measureText(head).width, ly + i * 46);
    } else {
      g.fillStyle = 'rgba(238,241,242,.5)'; g.fillText(line, lx, ly + i * 46);
    }
  });
  g.restore();

  /* 原生播放器卡片 */
  const cx = 1290, cy = 470, cw = 620, ch = 400;
  const build = smooth(range(t, 13.1, 13.5));
  if (build <= 0.002) return;
  g.save(); g.globalAlpha = a * build;
  rrect(cx - cw / 2, cy - ch / 2, cw, ch, 18);
  g.fillStyle = 'rgba(12,17,23,.96)'; g.fill();
  g.lineWidth = 1.4; g.strokeStyle = 'rgba(255,255,255,.14)'; g.stroke();

  // 封面
  const cov = smooth(range(t, 13.3, 13.7));
  if (cov > 0.002) {
    g.save(); g.globalAlpha = a * build * cov;
    const ax = cx - cw / 2 + 34, ay = cy - ch / 2 + 34, as = 200;
    rrect(ax, ay, as, as, 14);
    const grad = g.createLinearGradient(ax, ay, ax + as, ay + as);
    grad.addColorStop(0, '#233a5e'); grad.addColorStop(0.5, '#2b5cff'); grad.addColorStop(1, '#9af7d3');
    g.fillStyle = grad; g.fill();
    g.beginPath(); g.arc(ax + as / 2, ay + as / 2, 34, 0, Math.PI * 2);
    g.fillStyle = 'rgba(4,6,10,.55)'; g.fill();
    g.restore();
  }
  // 文案
  const tt = smooth(range(t, 13.5, 13.9));
  if (tt > 0.002) {
    g.save(); g.globalAlpha = a * build * tt;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = '600 30px ' + SANS; g.fillStyle = C.paper;
    g.fillText('Midnight Drive', cx - cw / 2 + 268, cy - ch / 2 + 92);
    g.font = '400 20px ' + SANS; g.fillStyle = 'rgba(238,241,242,.45)';
    g.fillText('Zan Sessions', cx - cw / 2 + 268, cy - ch / 2 + 132);
    // 进度
    const pg = smooth(range(t, 13.7, 14.1));
    g.globalAlpha = a * build * pg;
    const bx = cx - cw / 2 + 268, by = cy - ch / 2 + 200, bw = 300;
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(bx, by, bw, 4);
    g.fillStyle = C.mint; g.fillRect(bx, by, bw * 0.4, 4);
    g.beginPath(); g.arc(bx + bw * 0.4, by + 2, 6, 0, Math.PI * 2); g.fillStyle = C.mint; g.fill();
    // 控制
    const p2 = smooth(range(t, 13.9, 14.3));
    g.globalAlpha = a * build * p2;
    g.fillStyle = 'rgba(238,241,242,.75)';
    const px2 = cx - cw / 2 + 268, py2 = cy + 30;
    g.beginPath(); g.moveTo(px2, py2 - 12); g.lineTo(px2, py2 + 12); g.lineTo(px2 + 14, py2); g.fill();
    g.beginPath(); g.moveTo(px2 + 28, py2 - 12); g.lineTo(px2 + 28, py2 + 12); g.lineTo(px2 + 42, py2); g.fill();
    g.beginPath(); g.arc(px2 + 88, py2, 26, 0, Math.PI * 2); g.fillStyle = C.mint; g.fill();
    g.fillStyle = C.ink;
    g.beginPath(); g.moveTo(px2 + 82, py2 - 11); g.lineTo(px2 + 82, py2 + 11); g.lineTo(px2 + 100, py2); g.fill();
    g.restore();
  }
  g.restore();

  const b = env(t, 13.4, 17.0, 0.4, 0.45);
  if (b > 0.002) {
    text('界面，几行声明。', W / 2, 830, 42, C.paper, { alpha: b, track: '2px' });
    text('NATIVE CONTROL  ·  NO WEBVIEW', W / 2, 894, 20, C.mint, { alpha: b * 0.75, mono: true, track: '4px' });
  }
}

/* 5 · 落版 */
function beatLockup(t) {
  const a = env(t, 16.85, 20.0, 0.7, 0.001);
  if (a < 0.002) return;
  wordmark(W / 2, 460, 150, C.paper, a);
  const b = env(t, 17.45, 20.0, 0.5, 0.001);
  text('少，即是多。', W / 2, 630, 36, 'rgba(238,241,242,.8)', { alpha: b, track: '10px' });
  text('AOT  ·  ARC  ·  原生界面', W / 2, 700, 19, 'rgba(154,247,211,.6)', { alpha: b, mono: true, track: '5px' });
}
/* ── 帧内 HUD ── */
function drawHud(t) {
  g.save();
  g.globalAlpha = 0.28;
  g.font = '400 13px ' + MONO; g.fillStyle = C.paper;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('ZAN', 80, 62);
  g.textAlign = 'right';
  g.fillText('20.000s · LOOP', W - 80, 62);
  g.globalAlpha = 0.12;
  g.fillRect(80, H - 54, W - 160, 1);
  g.globalAlpha = 0.5;
  g.fillStyle = C.mint;
  g.fillRect(80, H - 54, (W - 160) * (t / D), 1);
  g.restore();
}

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = C.ink;
  g.fillRect(0, 0, W, H);

  beatManifesto(t);
  beatCode(t);
  beatNative(t);
  beatUI(t);
  beatLockup(t);
  drawHud(t);

  hudTex.needsUpdate = true;
}

/* ── 尺寸 ── */
function layout() {
  const vw = innerWidth, vh = innerHeight;
  let w = vw, h = vw / (W / H);
  if (h > vh) { h = vh; w = vh * (W / H); }
  canvas.style.width = Math.round(w) + 'px';
  canvas.style.height = Math.round(h) + 'px';
  if (ENCODE) { renderer.setPixelRatio(1); renderer.setSize(EW, EH, false); composer.setSize(EW, EH); }
  else { renderer.setPixelRatio(DPR); renderer.setSize(Math.round(w), Math.round(h), false); composer.setSize(Math.round(w), Math.round(h)); }
  bloom.setSize(1280, 720);
}

/* ── 主循环 ── */
let t0 = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (ENCODE) return;
  const t = SHOT != null ? SHOT : ((now - t0) / 1000) % D;
  draw(t);
  grade.uniforms.uTime.value = t;
  composer.render();
}
window.__seek = t => { draw(Number(t) || 0); grade.uniforms.uTime.value = t; composer.render(); };

addEventListener('resize', layout);

/* ── WebCodecs 导出 ── */
const recEl = document.getElementById('rec');
async function encodeVideo() {
  recEl.classList.add('on');
  recEl.textContent = '准备编码…';
  let Muxer, ArrayBufferTarget;
  try { ({ Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.mjs')); }
  catch (e) { recEl.textContent = 'mp4-muxer 加载失败'; return; }
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: EW, height: EH, frameRate: FPS }, fastStart: 'in-memory' });
  const encoder = new VideoEncoder({
    output: (c, m) => muxer.addVideoChunk(c, m),
    error: e => { recEl.textContent = '编码错误：' + e.message; }
  });
  let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42E01F']) {
    const s = await VideoEncoder.isConfigSupported({ codec, width: EW, height: EH, bitrate: 16e6, framerate: FPS, avc: { format: 'avc' } });
    if (s.supported) { cfg = { ...s.config, bitrate: 16e6, framerate: FPS, avc: { format: 'avc' } }; break; }
  }
  if (!cfg) { recEl.textContent = '无可用 H.264 编码器'; return; }
  encoder.configure(cfg);
  const total = Math.round(D * FPS), dt = 1e6 / FPS, start = performance.now();
  for (let i = 0; i < total; i++) {
    const t = i / FPS;
    draw(t); grade.uniforms.uTime.value = t; composer.render();
    const f = new VideoFrame(canvas, { timestamp: Math.round(i * dt), duration: Math.round(dt) });
    encoder.encode(f, { keyFrame: i % (FPS * 2) === 0 });
    f.close();
    if (encoder.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 0));
    if (i % 20 === 0) recEl.textContent = `编码 ${i}/${total} · ${((performance.now() - start) / 1000).toFixed(1)}s`;
  }
  await encoder.flush(); encoder.close(); muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zan-brand-${EW}x${EH}-${FPS}fps.mp4`;
  document.body.appendChild(a); a.click();
  recEl.textContent = '✓ ' + (blob.size / 1048576).toFixed(1) + ' MB';
  window.__recording = { size: blob.size, frames: total };
}

function fatal(msg) {
  document.getElementById('fatal').style.display = 'grid';
  document.getElementById('fatalMsg').textContent = msg;
  document.getElementById('boot').classList.add('off');
}

layout();
draw(0);
composer.render();
document.getElementById('boot').classList.add('off');
if (ENCODE) encodeVideo();
requestAnimationFrame(frame);
</script>
</body>
