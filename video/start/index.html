<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zan · 为人和 AI 而生的语言</title>
<style>
  html,body{margin:0;height:100%;background:#04060a;overflow:hidden}
  #gl{display:block;margin:auto;position:absolute;inset:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center;color:#9af7d3;background:#04060a;
    font:11px/1.9 Consolas,monospace;letter-spacing:.4em;transition:opacity .5s;z-index:9}
  #boot.off{opacity:0;pointer-events:none}
  #rec{position:fixed;left:16px;bottom:14px;color:#9af7d3;font:11px Consolas,monospace;
    letter-spacing:.06em;opacity:0;transition:opacity .3s;z-index:8}
  #rec.on{opacity:.9}
  #fatal{position:fixed;inset:0;display:none;place-items:center;background:#04060a;color:#eef1f2;
    font:13px/2 Consolas,monospace;padding:40px;text-align:center;z-index:10}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="boot">ZAN</div>
<div id="rec"></div>
<div id="fatal"><span id="fatalMsg"></span></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════════════════
   Zan · 品牌片（20s / 锁机位 / 全部内容画进画布 / WebCodecs 出片）
   四段：宣言 → 简洁 → 原生 → 界面 → 落版
   所有动画都是 t 的解析函数，t=0 与 t=20 同态。
   ══════════════════════════════════════════════════════════════════════ */

const W = 1920, H = 1080, D = 22.0;
const qs = new URLSearchParams(location.search);
const ENCODE = qs.has('encode');
const FPS = Number(qs.get('fps')) || 60;
const EW = Number(qs.get('w')) || 1920, EH = Number(qs.get('h')) || 1080;
const SHOT = qs.has('shot') ? Number(qs.get('shot')) : null;
const canvas = document.getElementById('gl');

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const range = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const env = (t, a, b, fi = 0.3, fo = 0.3) => smooth(range(t, a, a + fi)) * (1 - smooth(range(t, b - fo, b)));

/* ── 渲染器 ── */
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false }); }
catch (e) { fatal('浏览器未启用 WebGL。'); throw e; }
const DPR = Math.min(Number(qs.get('dpr')) || devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const VH = 2, VW = VH * (W / H);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
const cam = new THREE.OrthographicCamera(-VW / 2, VW / 2, VH / 2, -VH / 2, -10, 10);
cam.position.z = 5;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(1280, 720), 0.30, 0.75, 0.92);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: 0.02 }, uVig: { value: 0.62 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime,uGrain,uVig; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 c = vUv-0.5; float r = length(c);
      vec3 col = texture2D(tDiffuse,vUv).rgb;
      col *= mix(1.0, 0.42, smoothstep(0.30, 0.95, r*uVig));
      col += (hash(vUv*vec2(1920.,1080.)+fract(uTime)*91.7)-0.5)*uGrain;
      gl_FragColor = vec4(max(col,0.0),1.0);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ── 一张 1920×1080 的画布承载全部内容（导出时字幕天然在里面）── */
const hud = document.createElement('canvas');
hud.width = W; hud.height = H;
const g = hud.getContext('2d');
const hudTex = new THREE.CanvasTexture(hud);
hudTex.colorSpace = THREE.SRGBColorSpace;
hudTex.minFilter = THREE.LinearFilter;
hudTex.magFilter = THREE.LinearFilter;
const plane = new THREE.Mesh(
  new THREE.PlaneGeometry(VW, VH),
  new THREE.MeshBasicMaterial({ map: hudTex })
);
scene.add(plane);

/* ── 排版工具 ── */
const SANS = '"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif';
const MONO = 'Consolas,"Cascadia Code",monospace';
const C = { ink: '#04060a', paper: '#eef1f2', mint: '#9af7d3', dim: 'rgba(238,241,242,.45)', gold: '#ffc838' };

function text(s, x, y, size, color, opt = {}) {
  g.save();
  g.font = (opt.weight || '400') + ' ' + size + 'px ' + (opt.mono ? MONO : SANS);
  g.fillStyle = color;
  g.textAlign = opt.align || 'center';
  g.textBaseline = opt.base || 'middle';
  if (opt.track) g.letterSpacing = opt.track;
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.fillText(s, x, y);
  g.restore();
}
function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}
function chip(x, y, w, h, label, accent, alpha = 1) {
  g.save(); g.globalAlpha = alpha;
  rrect(x - w / 2, y - h / 2, w, h, 10);
  g.fillStyle = 'rgba(10,15,21,.9)'; g.fill();
  g.lineWidth = 1.5; g.strokeStyle = accent ? 'rgba(154,247,211,.55)' : 'rgba(255,255,255,.18)'; g.stroke();
  g.font = '500 30px ' + MONO; g.fillStyle = accent ? C.mint : C.paper;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, x, y + 1);
  g.restore();
}

/* ── 品牌字标（手绘路径，不依赖字体）── */
function wordmark(cx, cy, gh, color, alpha) {
  const s = gh / 150;
  g.save(); g.globalAlpha = alpha;
  g.translate(cx, cy); g.scale(s, s); g.translate(-320, -160);
  g.strokeStyle = color; g.lineWidth = 38; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(19, 85); g.lineTo(191, 85); g.lineTo(19, 235); g.lineTo(191, 235); g.stroke();
  g.beginPath(); g.arc(338, 160, 75, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(413, 85); g.lineTo(413, 235); g.stroke();
  g.beginPath(); g.moveTo(485, 235); g.lineTo(485, 148);
  g.arc(548, 148, 63, Math.PI, 0, false); g.lineTo(611, 235); g.stroke();
  g.beginPath(); g.arc(654, 216, 19, 0, Math.PI * 2); g.fillStyle = C.mint; g.fill();
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════════
   四段内容
   ══════════════════════════════════════════════════════════════════════ */

/* ── 开发流程：五步，每步一个减法 ── */
const STEPS = ['界面', '逻辑', '编译', '运行', '发布'];
const STEP_AT = [2.60, 6.50, 10.20, 13.85, 17.55, 20.25];   // 每步起点 + 收尾

const CARD_W = 600, CARD_H = 380;
function playerCard(cx, cy, sc, parts) {
  const w = CARD_W * sc, h = CARD_H * sc;
  const x = cx - w / 2, y = cy - h / 2, k = sc;
  g.save();
  rrect(x, y, w, h, 18 * k);
  g.fillStyle = 'rgba(12,17,23,.97)'; g.fill();
  g.lineWidth = 1.4; g.strokeStyle = 'rgba(255,255,255,.14)'; g.stroke();

  if (parts.cover > 0) {
    g.globalAlpha *= parts.cover;
    const ax = x + 26 * k, ay = y + 26 * k, as = 190 * k;
    rrect(ax, ay, as, as, 12 * k);
    const gr = g.createLinearGradient(ax, ay, ax + as, ay + as);
    gr.addColorStop(0, '#22375c'); gr.addColorStop(0.55, '#2b5cff'); gr.addColorStop(1, '#9af7d3');
    g.fillStyle = gr; g.fill();
    g.beginPath(); g.arc(ax + as / 2, ay + as / 2, 32 * k, 0, Math.PI * 2);
    g.fillStyle = 'rgba(4,6,10,.55)'; g.fill();
    g.globalAlpha /= parts.cover;
  }
  if (parts.title > 0) {
    g.save(); g.globalAlpha *= parts.title;
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = '600 ' + Math.round(30 * k) + 'px ' + SANS; g.fillStyle = C.paper;
    g.fillText('Midnight Drive', x + 246 * k, y + 84 * k);
    g.font = '400 ' + Math.round(20 * k) + 'px ' + SANS; g.fillStyle = 'rgba(238,241,242,.45)';
    g.fillText('Zan Sessions', x + 246 * k, y + 124 * k);
    g.restore();
  }
  if (parts.progress > 0) {
    g.save(); g.globalAlpha *= parts.progress;
    const bx = x + 246 * k, by = y + 196 * k, bw = 300 * k;
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(bx, by, bw, 4 * k);
    g.fillStyle = C.mint; g.fillRect(bx, by, bw * (parts.value || 0.4), 4 * k);
    g.beginPath(); g.arc(bx + bw * (parts.value || 0.4), by + 2 * k, 6 * k, 0, Math.PI * 2);
    g.fillStyle = C.mint; g.fill();
    g.restore();
  }
  if (parts.controls > 0) {
    g.save(); g.globalAlpha *= parts.controls;
    const px = x + 246 * k, py = y + 268 * k;
    g.fillStyle = 'rgba(238,241,242,.7)';
    g.beginPath(); g.moveTo(px, py - 12 * k); g.lineTo(px, py + 12 * k); g.lineTo(px + 14 * k, py); g.fill();
    g.beginPath(); g.moveTo(px + 30 * k, py - 12 * k); g.lineTo(px + 30 * k, py + 12 * k); g.lineTo(px + 44 * k, py); g.fill();
    g.beginPath(); g.arc(px + 92 * k, py, 26 * k, 0, Math.PI * 2); g.fillStyle = C.mint; g.fill();
    g.fillStyle = C.ink;
    g.beginPath(); g.moveTo(px + 86 * k, py - 11 * k); g.lineTo(px + 86 * k, py + 11 * k); g.lineTo(px + 104 * k, py); g.fill();
    g.restore();
  }
  g.restore();
}

/* 0 · 宣言 */
function beatManifesto(t) {
  const a = env(t, 0.15, 1.55, 0.55, 0.35);
  if (a > 0.002) text('软件，正在变复杂。', W / 2, 512, 52, 'rgba(238,241,242,.72)', { alpha: a, track: '4px' });
  const b = env(t, 1.45, 2.55, 0.45, 0.40);
  if (b > 0.002) text('我们选择做减法。', W / 2, 590, 62, C.mint, { weight: '600', alpha: b, track: '6px' });
}

/* 1 · 界面：七行声明 */
const MARKUP = [
  '<card w="340" r="18">',
  '  <cover src="cover.png" />',
  '  <text>Midnight Drive</text>',
  '  <text class="sub">Zan Sessions</text>',
  '  <progress value="40%" />',
  '  <button icon="play" />',
  '</card>'
];
function beatUI(t) {
  const a = env(t, 2.45, 6.55, 0.45, 0.45);
  if (a < 0.002) return;
  g.save(); g.globalAlpha = a;
  g.font = '400 24px ' + MONO; g.textAlign = 'left'; g.textBaseline = 'middle';
  const lx = 470, ly = 470;
  MARKUP.forEach((line, i) => {
    const on = smooth(range(t, 2.75 + i * 0.28, 3.0 + i * 0.28));
    if (on <= 0.002) return;
    g.globalAlpha = a * on;
    const tag = line.match(/^<\/?([a-z]+)/);
    if (tag) {
      const head = '<' + (line.trim().startsWith('</') ? '/' : '') + tag[1];
      g.fillStyle = 'rgba(154,247,211,.92)'; g.fillText(head, lx, ly + i * 44);
      g.fillStyle = 'rgba(238,241,242,.5)';
      g.fillText(line.slice(head.length), lx + g.measureText(head).width, ly + i * 44);
    } else {
      g.fillStyle = 'rgba(238,241,242,.5)'; g.fillText(line, lx, ly + i * 44);
    }
  });
  g.restore();
  const cv = smooth(range(t, 3.1, 3.85));
  if (cv > 0.002) playerCard(1420, 470, 0.86, { cover: cv, title: smooth(range(t, 3.6, 4.25)), progress: 0, controls: 0 });
  const cap = env(t, 4.35, 6.45, 0.4, 0.4);
  if (cap > 0.002) text('不用 UI 框架。', W / 2, 860, 40, C.paper, { alpha: cap, track: '2px' });
}

/* 2 · 逻辑：三行 */
const LOGIC = [
  'class Player : Card {',
  '    var playing = bind("state");',
  '}'
];
function beatLogic(t) {
  const a = env(t, 6.35, 10.05, 0.45, 0.45);
  if (a < 0.002) return;
  g.save(); g.globalAlpha = a;
  g.font = '400 30px ' + MONO; g.textAlign = 'left'; g.textBaseline = 'middle';
  const lx = 470, ly = 450;
  LOGIC.forEach((line, i) => {
    const on = smooth(range(t, 6.45 + i * 0.24, 6.7 + i * 0.24));
    if (on <= 0.002) return;
    g.globalAlpha = a * on;
    g.fillStyle = 'rgba(238,241,242,.7)';
    g.fillText(line, lx, ly + i * 62);
    const kw = line.match(/^\s*(class|var)\b/);
    if (kw) {
      g.fillStyle = 'rgba(114,223,227,.95)';
      g.fillText(kw[1], lx + g.measureText(line.slice(0, line.indexOf(kw[1]))).width, ly + i * 62);
    }
  });
  g.restore();
  playerCard(1420, 470, 0.86, { cover: 1, title: 1, progress: smooth(range(t, 7.1, 7.6)), controls: smooth(range(t, 7.4, 7.9)) });
  const cap = env(t, 7.2, 9.75, 0.35, 0.35);
  if (cap > 0.002) text('不用胶水代码。', W / 2, 860, 40, C.paper, { alpha: cap, track: '2px' });
}

/* 3 · 编译：一条命令 */
function beatCompile(t) {
  const a = env(t, 10.05, 13.70, 0.45, 0.45);
  if (a < 0.002) return;
  const CMD = 'zanc app.zan --publish';
  const n = Math.round(range(t, 10.15, 10.95) * CMD.length);
  g.save(); g.globalAlpha = a;
  g.font = '400 34px ' + MONO; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = C.mint; g.fillText('$', 700, 430);
  g.fillStyle = C.paper; g.textAlign = 'left';
  g.fillText(CMD.slice(0, n), 740, 430);
  g.restore();
  const p = smooth(range(t, 11.0, 11.7));
  if (p > 0.002) chip(1130, 560, 320, 84, 'app.exe', true, a * p);
  const b = env(t, 11.3, 13.35, 0.4, 0.35);
  if (b > 0.002) {
    text('没有虚拟机。', W / 2, 720, 44, C.paper, { alpha: b, track: '2px' });
    text('LLVM AOT  ·  ARC  ·  启动 8ms', W / 2, 792, 21, C.mint, { alpha: b * 0.8, mono: true, track: '3px' });
  }
}

/* 4 · 运行：它在播 */
function beatRun(t) {
  const a = env(t, 13.70, 17.30, 0.5, 0.5);
  if (a < 0.002) return;
  const val = 0.18 + 0.62 * range(t, 13.9, 16.8);
  g.save(); g.globalAlpha = a;
  playerCard(W / 2, 450, 1.12, { cover: 1, title: 1, progress: 1, controls: 1, value: val });
  g.restore();
  const cap = env(t, 13.9, 16.95, 0.35, 0.35);
  if (cap > 0.002) text('不是网页。', W / 2, 820, 42, C.paper, { alpha: cap, track: '2px' });
}

/* 5 · 发布：一个文件 */
const TGT = [
  ['WINDOWS', 'app.exe'], ['LINUX', 'app.elf'], ['MACOS', 'app.app'], ['ANDROID', 'app.apk'],
  ['IOS', 'app.ipa'], ['WASI', 'app.wasm'], ['OPENHARMONY', 'app.hap']
];
function beatShip(t) {
  const a = env(t, 17.30, 20.20, 0.5, 0.45);
  if (a < 0.002) return;
  TGT.forEach((d, i) => {
    const on = smooth(range(t, 17.55 + i * 0.26, 17.90 + i * 0.26));
    if (on <= 0.002) return;
    const col = i % 4, row = i < 4 ? 0 : 1;
    const x = i < 4 ? 960 + (col - 1.5) * 340 : 960 + (i - 5) * 340;
    const y = 380 + row * 118;
    g.save(); g.globalAlpha = a * on;
    rrect(x - 150, y - 40, 300, 80, 10);
    g.fillStyle = 'rgba(10,15,21,.92)'; g.fill();
    g.lineWidth = 1.4; g.strokeStyle = 'rgba(154,247,211,.42)'; g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '400 20px ' + MONO; g.fillStyle = C.paper;
    g.fillText(d[0], x, y - 10);
    g.font = '400 16px ' + MONO; g.fillStyle = 'rgba(154,247,211,.85)';
    g.fillText(d[1], x, y + 17);
    g.restore();
  });
  const b = env(t, 18.95, 20.15, 0.45, 0.35);
  if (b > 0.002) {
    text('一份源码，七个原生目标。', W / 2, 700, 46, C.paper, { alpha: b, track: '2px' });
    text('SAME SOURCE  ·  SEVEN NATIVE TARGETS', W / 2, 780, 20, C.mint, { alpha: b * 0.8, mono: true, track: '4px' });
  }
}

/* 6 · 落版 */
function beatLockup(t) {
  const a = env(t, 20.20, 22.0, 0.6, 0.001);
  if (a < 0.002) return;
  wordmark(W / 2, 470, 146, C.paper, a);
  const b = env(t, 20.60, 22.0, 0.5, 0.001);
  text('少，即是多。', W / 2, 636, 34, 'rgba(238,241,242,.8)', { alpha: b, track: '10px' });
  text('AOT  ·  ARC  ·  原生界面', W / 2, 702, 19, 'rgba(154,247,211,.6)', { alpha: b, mono: true, track: '5px' });
}
/* ── 流程轨：五步，当前步高亮 ── */
function drawRail(t) {
  const on = smooth(range(t, 2.3, 2.9)) * (1 - smooth(range(t, 20.1, 20.5)));
  if (on <= 0.002) return;
  let cur = -1;
  for (let i = 0; i < 5; i++) if (t >= STEP_AT[i]) cur = i;
  g.save(); g.globalAlpha = on;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) {
    const y = 300 + i * 60;
    const hot = i === cur;
    g.globalAlpha = on * (hot ? 1 : 0.42);
    g.beginPath(); g.arc(150, y, hot ? 5 : 3, 0, Math.PI * 2);
    g.fillStyle = hot ? C.mint : 'rgba(238,241,242,.7)'; g.fill();
    g.font = '400 13px ' + MONO; g.fillStyle = hot ? C.mint : 'rgba(238,241,242,.6)';
    g.fillText('0' + (i + 1), 178, y);
    g.font = '400 22px ' + SANS; g.fillStyle = hot ? C.paper : 'rgba(238,241,242,.5)';
    g.fillText(STEPS[i], 214, y);
  }
  g.restore();
}

/* ── 帧内 HUD ── */
function drawHud(t) {
  g.save();
  g.globalAlpha = 0.28;
  g.font = '400 13px ' + MONO; g.fillStyle = C.paper;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText('ZAN', 80, 62);
  g.textAlign = 'right';
  g.fillText('22.000s · LOOP', W - 80, 62);
  g.globalAlpha = 0.12;
  g.fillRect(80, H - 54, W - 160, 1);
  g.globalAlpha = 0.5;
  g.fillStyle = C.mint;
  g.fillRect(80, H - 54, (W - 160) * (t / D), 1);
  g.restore();
}

function draw(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = C.ink;
  g.fillRect(0, 0, W, H);

  beatManifesto(t);
  beatUI(t);
  beatLogic(t);
  beatCompile(t);
  beatRun(t);
  beatShip(t);
  beatLockup(t);
  drawRail(t);
  drawHud(t);

  hudTex.needsUpdate = true;
}

/* ── 尺寸 ── */
function layout() {
  const vw = innerWidth, vh = innerHeight;
  let w = vw, h = vw / (W / H);
  if (h > vh) { h = vh; w = vh * (W / H); }
  canvas.style.width = Math.round(w) + 'px';
  canvas.style.height = Math.round(h) + 'px';
  if (ENCODE) { renderer.setPixelRatio(1); renderer.setSize(EW, EH, false); composer.setSize(EW, EH); }
  else { renderer.setPixelRatio(DPR); renderer.setSize(Math.round(w), Math.round(h), false); composer.setSize(Math.round(w), Math.round(h)); }
  bloom.setSize(1280, 720);
}

/* ── 主循环 ── */
let t0 = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (ENCODE) return;
  const t = SHOT != null ? SHOT : ((now - t0) / 1000) % D;
  draw(t);
  grade.uniforms.uTime.value = t;
  composer.render();
}
window.__seek = t => { draw(Number(t) || 0); grade.uniforms.uTime.value = t; composer.render(); };

addEventListener('resize', layout);

/* ── WebCodecs 导出 ── */
const recEl = document.getElementById('rec');
async function encodeVideo() {
  recEl.classList.add('on');
  recEl.textContent = '准备编码…';
  let Muxer, ArrayBufferTarget;
  try { ({ Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.mjs')); }
  catch (e) { recEl.textContent = 'mp4-muxer 加载失败'; return; }
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: EW, height: EH, frameRate: FPS }, fastStart: 'in-memory' });
  const encoder = new VideoEncoder({
    output: (c, m) => muxer.addVideoChunk(c, m),
    error: e => { recEl.textContent = '编码错误：' + e.message; }
  });
  let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42E01F']) {
    const s = await VideoEncoder.isConfigSupported({ codec, width: EW, height: EH, bitrate: 16e6, framerate: FPS, avc: { format: 'avc' } });
    if (s.supported) { cfg = { ...s.config, bitrate: 16e6, framerate: FPS, avc: { format: 'avc' } }; break; }
  }
  if (!cfg) { recEl.textContent = '无可用 H.264 编码器'; return; }
  encoder.configure(cfg);
  const total = Math.round(D * FPS), dt = 1e6 / FPS, start = performance.now();
  for (let i = 0; i < total; i++) {
    const t = i / FPS;
    draw(t); grade.uniforms.uTime.value = t; composer.render();
    const f = new VideoFrame(canvas, { timestamp: Math.round(i * dt), duration: Math.round(dt) });
    encoder.encode(f, { keyFrame: i % (FPS * 2) === 0 });
    f.close();
    if (encoder.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 0));
    if (i % 20 === 0) recEl.textContent = `编码 ${i}/${total} · ${((performance.now() - start) / 1000).toFixed(1)}s`;
  }
  await encoder.flush(); encoder.close(); muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `zan-brand-${EW}x${EH}-${FPS}fps.mp4`;
  document.body.appendChild(a); a.click();
  recEl.textContent = '✓ ' + (blob.size / 1048576).toFixed(1) + ' MB';
  window.__recording = { size: blob.size, frames: total };
}

function fatal(msg) {
  document.getElementById('fatal').style.display = 'grid';
  document.getElementById('fatalMsg').textContent = msg;
  document.getElementById('boot').classList.add('off');
}

layout();
draw(0);
composer.render();
document.getElementById('boot').classList.add('off');
if (ENCODE) encodeVideo();
requestAnimationFrame(frame);
</script>
</body>
