<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ══════════════════════════════════════════════════════════════════════
   Zan 语言基础 · 讲解片（66s / 锁机位 / HUD 全画布 / WebCodecs 出片）
   八段：概览 → 程序结构 → 类型系统 → 面向对象 → 控制流 →
         内存 ARC → 异步·互操作 → 标准库·界面 → 落版
   一切动画是 t 的解析函数，t=0 与 t=D 同态（首尾皆是同一片星场）。
   ══════════════════════════════════════════════════════════════════════ */

const qs     = new URLSearchParams(location.search);
const PORT   = qs.get('ratio') === '9:16';
const W      = PORT ? 1080 : 1920;
const H      = PORT ? 1920 : 1080;
const D      = qs.has('dur') ? Number(qs.get('dur')) : 66.0;
const ENCODE = qs.has('encode');
const FPS    = Number(qs.get('fps')) || 60;
const EW     = Number(qs.get('w')) || W, EH = Number(qs.get('h')) || H;
const SHOT   = qs.has('shot') ? Number(qs.get('shot')) : null;
const canvas = document.getElementById('gl');

const clamp   = (x, a, b) => x < a ? a : x > b ? b : x;
const smooth  = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const range   = (t, a, b) => b === a ? (t >= a ? 1 : 0) : clamp((t - a) / (b - a), 0, 1);
const easeOut = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);
const env     = (t, a, b, fi = 0.3, fo = 0.3) => smooth(range(t, a, a + fi)) * (1 - smooth(range(t, b - fo, b)));
const slideIn = (t, a, b) => ({
  a: smooth(range(t, a, a + 0.5)) * (1 - smooth(range(t, b - 0.5, b))),
  dx: (1 - easeOut(range(t, a, a + 0.65))) * -42 + easeOut(range(t, b - 0.65, b)) * 42,
});
const mulberry32 = a => () => {
  a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
};

/* ── 场景 ── */
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false }); }
catch (e) { fatal('浏览器未启用 WebGL。'); throw e; }
const DPR = Math.min(Number(qs.get('dpr')) || devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(DPR);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const VH = 2, VW = VH * (W / H);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
const cam = new THREE.OrthographicCamera(-VW / 2, VW / 2, VH / 2, -VH / 2, -12, 12);
cam.position.z = 5;

/* 真实景深：星尘在 HUD 画布之后，从画布的透明区透出来 */
const N = 340;
const rnd = mulberry32(20261019);
const spos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  spos[i * 3]     = (rnd() * 2 - 1) * VW * 0.62;
  spos[i * 3 + 1] = (rnd() * 2 - 1) * VH * 0.62;
  spos[i * 3 + 2] = -2.6 + rnd() * 2.4;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(spos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0x9af7d3, size: 2.2, sizeAttenuation: false,
  transparent: true, opacity: 0.42, depthWrite: false, blending: THREE.AdditiveBlending,
}));
scene.add(stars);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(1280, 720), 0.34, 0.72, 0.90);
composer.addPass(bloom);
const grade = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uGrain: { value: 0.018 }, uVig: { value: 0.66 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime,uGrain,uVig; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    void main(){
      vec2 c = vUv-0.5; float r = length(c);
      vec3 col = texture2D(tDiffuse,vUv).rgb;
      col *= mix(1.0, 0.40, smoothstep(0.30, 0.98, r*uVig));
      col += (hash(vUv*vec2(1920.,1080.)+fract(uTime)*91.7)-0.5)*uGrain;
      gl_FragColor = vec4(max(col,0.0),1.0);
    }`
});
composer.addPass(grade);
composer.addPass(new OutputPass());

/* ── HUD：一张 W×H 画布承载全部内容（导出时字幕天然在里面）── */
const hud = document.createElement('canvas');
hud.width = W; hud.height = H;
const g = hud.getContext('2d');
const hudTex = new THREE.CanvasTexture(hud);
hudTex.colorSpace = THREE.SRGBColorSpace;
hudTex.minFilter = THREE.LinearFilter;
hudTex.magFilter = THREE.LinearFilter;
scene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(VW, VH),
  new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, depthWrite: false })
));

/* ── 版式锚点（横版 / 竖版两套）── */
const L = PORT ? {
  rail:  { x: 104, y: 130, dx: 126, dy: 0, horiz: true },
  head:  { x: 104, y: 216 },
  code:  { x: 104, y0: 700, size: 26, dy: 50 },
  cap:   { x: 104, key: 1492, line: 1554, sub: 1622, size: 34, maxW: 1080 - 104 - 90 },
  panel: { x0: 104, x1: 976 },
  cx: 540,
} : {
  rail:  { x: 150, y: 300, dy: 58 },
  head:  { x: 620, y: 266 },
  code:  { x: 620, y0: 322, size: 26, dy: 44 },
  cap:   { x: 150, key: 838, line: 892, sub: 944, size: 40, maxW: 1920 - 150 - 110 },
  panel: { x0: 620, x1: 1800 },
  cx: 960,
};

const SANS = '"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif';
const MONO = 'Consolas,"Cascadia Code",monospace';
const C = { paper: '#eef1f2', mint: '#9af7d3', gold: '#ffc838' };

/* ── 排版原语 ── */
function text(s, x, y, size, color, o = {}) {
  g.save();
  g.font = (o.weight || '400') + ' ' + size + 'px ' + (o.mono ? MONO : SANS);
  g.fillStyle = color;
  g.textAlign = o.align || 'center';
  g.textBaseline = o.base || 'middle';
  if (o.track) g.letterSpacing = o.track;
  if (o.alpha != null) g.globalAlpha = o.alpha;
  g.fillText(s, x, y);
  g.restore();
}
function rrect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}
function panelBox(x, y, w, h, accent) {
  rrect(x, y, w, h, 16);
  g.fillStyle = 'rgba(9,13,18,.96)'; g.fill();
  g.lineWidth = 1.4;
  g.strokeStyle = accent ? 'rgba(154,247,211,.5)' : 'rgba(255,255,255,.13)';
  g.stroke();
}
function chipW(label, size) { g.font = '400 ' + size + 'px ' + MONO; return g.measureText(label).width + 30; }
function chip(cx, cy, label, o = {}) {
  const size = o.size || 26, h = o.h || 44, w = chipW(label, size);
  g.save(); g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  rrect(cx - w / 2, cy - h / 2, w, h, 9);
  g.fillStyle = o.accent ? 'rgba(154,247,211,.10)' : 'rgba(255,255,255,.045)'; g.fill();
  g.lineWidth = 1.2;
  g.strokeStyle = o.accent ? 'rgba(154,247,211,.5)' : 'rgba(255,255,255,.18)';
  g.stroke();
  g.font = '400 ' + size + 'px ' + MONO;
  g.fillStyle = o.accent ? C.mint : 'rgba(238,241,242,.86)';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, cx, cy + 1);
  g.restore();
}
/* 一行 chip，超宽自动折行、逐行居中 */
function chipRows(names, cx, y0, size, maxW, alpha, t, t0, step = 0.12, gap = 14) {
  const widths = names.map(n => chipW(n, size));
  const rows = [];
  let cur = [], cw = 0;
  names.forEach((n, i) => {
    const add = cur.length ? gap + widths[i] : widths[i];
    if (cur.length && cw + add > maxW) { rows.push({ items: cur, w: cw }); cur = [n]; cw = widths[i]; }
    else { cur.push(n); cw += add; }
  });
  if (cur.length) rows.push({ items: cur, w: cw });
  rows.forEach((row, ri) => {
    let x = cx - row.w / 2;
    row.items.forEach(n => {
      const w = chipW(n, size), i = names.indexOf(n);
      const on = smooth(range(t, t0 + i * step, t0 + i * step + 0.26)) * alpha;
      chip(x + w / 2, y0 + ri * (size + 30), n, { size, h: size + 18, alpha: on });
      x += w + gap;
    });
  });
  return rows.length;
}
function arrow(x1, y1, x2, y2, color, lw = 1.6, dash) {
  g.save();
  g.strokeStyle = color; g.fillStyle = color; g.lineWidth = lw;
  if (dash) g.setLineDash(dash);
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1), s = 9;
  g.beginPath();
  g.moveTo(x2, y2);
  g.lineTo(x2 - Math.cos(a - 0.42) * s, y2 - Math.sin(a - 0.42) * s);
  g.lineTo(x2 - Math.cos(a + 0.42) * s, y2 - Math.sin(a + 0.42) * s);
  g.closePath(); g.fill();
  g.restore();
}

/* ── 代码高亮 ── */
const KW = /^(using|namespace|class|struct|interface|enum|delegate|public|private|protected|internal|static|virtual|override|sealed|abstract|readonly|const|void|var|new|return|if|else|foreach|for|while|do|in|switch|case|default|when|try|catch|finally|throw|lock|async|await|extern|is|as|ref|out|this|base|null|true|false|weak|operator|get|set|value|bool|byte|sbyte|short|ushort|int|uint|long|ulong|float|double|char|nint|string|object|decimal|Task|DllImport)$/;
const TOK = /(\/\/[^\n]*)|(\$?@?"(?:[^"\\]|\\.)*")|(\b\d[\d_]*(?:\.\d+)?f?\b)|([A-Za-z_]\w*)|(\s+)|([\s\S])/g;
function codeLine(line, x, y, size) {
  g.font = '400 ' + size + 'px ' + MONO;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  let cx = x, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(line)) !== null) {
    const tk = m[0];
    if (!tk) break;
    let col = 'rgba(238,241,242,.82)';
    if (m[1]) col = 'rgba(238,241,242,.30)';
    else if (m[2]) col = C.gold;
    else if (m[3]) col = 'rgba(255,200,56,.85)';
    else if (m[4] && KW.test(tk)) col = C.mint;
    g.fillStyle = col;
    g.fillText(tk, cx, y);
    cx += g.measureText(tk).width;
  }
  return cx - x;
}
/* 逐行长出来的代码面板 + 打字光标 */
function codePanel(lines, size, dy, x, y0, alpha, t, t0, step = 0.13) {
  if (alpha <= 0.002) return;
  g.save(); g.globalAlpha = alpha;
  g.font = '400 ' + size + 'px ' + MONO;
  let maxw = 0;
  for (const ln of lines) maxw = Math.max(maxw, g.measureText(ln).width);
  let shown = 0;
  for (let i = 0; i < lines.length; i++) shown += smooth(range(t, t0 + i * step, t0 + i * step + 0.24));
  const pad = 36;
  panelBox(x - pad, y0 - size * 0.95, maxw + pad * 2, pad * 2 + Math.max(shown, 0.5) * dy);
  for (let i = 0; i < lines.length; i++) {
    const on = smooth(range(t, t0 + i * step, t0 + i * step + 0.24));
    if (on <= 0.01) continue;
    g.save(); g.globalAlpha = alpha * on;
    codeLine(lines[i], x, y0 + i * dy, size);
    g.restore();
  }
  if (shown < lines.length - 0.03 && shown > 0.4) {
    const li = clamp(Math.ceil(shown) - 1, 0, lines.length - 1);
    g.globalAlpha = alpha * (0.35 + 0.65 * Math.abs(Math.sin(t * 7)));
    g.fillStyle = C.mint;
    g.font = '400 ' + size + 'px ' + MONO;
    g.fillRect(x + g.measureText(lines[li]).width + 4, y0 + li * dy - size * 0.52, size * 0.5, size * 1.02);
  }
  g.restore();
}
/* 字幕：超宽自动折行，子行随之下移 */
function caption(s, alpha, key, sub) {
  if (alpha <= 0.002) return;
  const A = L.cap;
  g.save(); g.globalAlpha = alpha;
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.font = '400 15px ' + MONO; g.fillStyle = 'rgba(154,247,211,.72)';
  g.fillText(key, A.x, A.key);
  g.font = '600 ' + A.size + 'px ' + SANS;
  const lines = [];
  if (g.measureText(s).width <= A.maxW) lines.push(s);
  else {
    let cur = '';
    for (const ch of s) {
      if (cur && g.measureText(cur + ch).width > A.maxW) { lines.push(cur); cur = ch; }
      else cur += ch;
    }
    if (cur) lines.push(cur);
  }
  lines.forEach((ln, i) => {
    g.font = '600 ' + A.size + 'px ' + SANS; g.fillStyle = C.paper;
    g.fillText(ln, A.x, A.line + i * (A.size + 14));
  });
  if (sub) {
    g.font = '400 18px ' + MONO; g.fillStyle = 'rgba(154,247,211,.6)';
    g.fillText(sub, A.x, A.sub + Math.max(0, lines.length - 1) * (A.size + 14));
  }
  g.restore();
}
function chapterHead(c, alpha, dx) {
  if (alpha <= 0.002) return;
  const h = L.head;
  g.save(); g.globalAlpha = alpha; g.translate(dx, 0);
  g.textAlign = 'left'; g.textBaseline = 'middle';
  g.font = '400 15px ' + MONO; g.fillStyle = 'rgba(154,247,211,.7)';
  g.fillText(c.no, h.x, h.y);
  const w = g.measureText(c.no).width;
  g.font = '600 30px ' + SANS; g.fillStyle = C.paper;
  g.fillText(c.name, h.x + w + 16, h.y);
  g.restore();
}
/* ── 品牌字标（手绘路径，不依赖字体）── */
function wordmark(cx, cy, gh, alpha) {
  const s = gh / 150;
  g.save(); g.globalAlpha = alpha;
  g.translate(cx, cy); g.scale(s, s); g.translate(-320, -160);
  g.strokeStyle = C.paper; g.lineWidth = 38; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(19, 85); g.lineTo(191, 85); g.lineTo(19, 235); g.lineTo(191, 235); g.stroke();
  g.beginPath(); g.arc(338, 160, 75, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.moveTo(413, 85); g.lineTo(413, 235); g.stroke();
  g.beginPath(); g.moveTo(485, 235); g.lineTo(485, 148);
  g.arc(548, 148, 63, Math.PI, 0, false); g.lineTo(611, 235); g.stroke();
  g.beginPath(); g.arc(654, 216, 19, 0, Math.PI * 2); g.fillStyle = C.mint; g.fill();
  g.restore();
}

/* ══════════════════════════════════════════════════════════════════════
   章节时间表
   ══════════════════════════════════════════════════════════════════════ */
const CH = [
  { no: '01', name: '程序结构',     t0: 5.4,  t1: 13.4 },
  { no: '02', name: '类型系统',     t0: 13.4, t1: 21.4 },
  { no: '03', name: '面向对象',     t0: 21.4, t1: 29.4 },
  { no: '04', name: '控制流',       t0: 29.4, t1: 37.4 },
  { no: '05', name: '内存 · ARC',   t0: 37.4, t1: 45.4 },
  { no: '06', name: '异步 · 互操作', t0: 45.4, t1: 53.4 },
  { no: '07', name: '标准库 · 界面', t0: 53.4, t1: 61.4 },
];

/* 00 · 概览（0 – 5.4）*/
function beatIntro(t) {
  const a = env(t, 0.35, 5.45, 0.7, 0.5);
  if (a < 0.002) return;
  const cy = PORT ? 690 : 400;
  wordmark(L.cx, cy, PORT ? 190 : 168, a);
  const b = env(t, 1.30, 5.45, 0.5, 0.5);
  if (b > 0.002) {
    text('Zan 语言基础', L.cx, cy + (PORT ? 190 : 168), PORT ? 62 : 52, C.paper, { weight: '600', alpha: b, track: '4px' });
    text('ZAN LANGUAGE BASICS', L.cx, cy + (PORT ? 266 : 236), 19, 'rgba(154,247,211,.62)', { mono: true, alpha: b, track: '7px' });
  }
  const anchors = ['C# 风格语法', 'LLVM AOT', 'ARC 确定性内存'];
  anchors.forEach((s, i) => {
    const on = env(t, 2.30 + i * 0.32, 5.45, 0.45, 0.5);
    if (on <= 0.002) return;
    if (PORT) chip(L.cx, 1112 + i * 78, s, { size: 30, h: 58, accent: i === 2, alpha: on });
    else chip(L.cx + (i - 1) * 306, 706, s, { size: 28, h: 56, accent: i === 2, alpha: on });
  });
  text('面向系统级、桌面与实时应用的强类型语言。', L.cx, PORT ? 1420 : 790, PORT ? 30 : 26,
    'rgba(238,241,242,.5)', { alpha: env(t, 3.4, 5.45, 0.5, 0.5) });
}

/* 01 · 程序结构（5.4 – 13.4）*/
const CODE_STRUCT = [
  'using System;',
  '',
  'namespace HelloWorld;',
  '',
  'class Program {',
  '    static void Main(string[] args) {',
  '        var p = new Point { X = 3.0, Y = 4.0 };',
  '        Console.WriteLine($"({p.X}, {p.Y}) -> {p.Length()}");',
  '    }',
  '}',
];
function beatStructure(c, t) {
  const { a, dx } = slideIn(t, c.t0, c.t1);
  if (a <= 0.002) return;
  chapterHead(c, a, dx);
  codePanel(CODE_STRUCT, L.code.size, L.code.dy, L.code.x, L.code.y0, a, t, c.t0 + 0.5, 0.13);
  caption('命名空间即目录，using 按需拉入源码。', env(t, c.t0 + 4.4, c.t1 - 0.1, 0.45, 0.5),
    '01 / 程序结构', 'using System; · namespace HelloWorld; · static void Main(string[] args)');
}

/* 02 · 类型系统（13.4 – 21.4）*/
const VALUE_CHIPS = ['bool', 'byte', 'sbyte', 'short', 'ushort', 'int', 'uint', 'long', 'ulong', 'float', 'double', 'char', 'nint', 'struct', 'enum'];
const REF_CHIPS = ['class', 'interface', 'delegate', 'T[]', 'string'];
function beatTypes(c, t) {
  const { a, dx } = slideIn(t, c.t0, c.t1);

function layout() {

  canvas.style.width = Math.round(w) + 'px';

  if (ENCODE) { renderer.setPixelRatio(1); renderer.setSize(EW, EH, false); composer.setSize(EW, EH); }

/* ── 主循环 ── */
let t0 = performance.now();
let encoding = false;
function frame(now) {
  requestAnimationFrame(frame);
  if (ENCODE || encoding) return;
  const t = SHOT != null ? SHOT : ((now - t0) / 1000) % D;
  draw(t);
  grade.uniforms.uTime.value = t;
  composer.render();
}
window.__seek = t => { draw(Number(t) || 0); grade.uniforms.uTime.value = t; composer.render(); };

/* ── WebCodecs 导出 ── */
const recEl = document.getElementById('rec');
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* rAF 在窗口不可见/被遮挡时不再触发，会导致逐帧循环永久挂起：
   rAF 与定时器赛跑，谁先到算谁的。 */
const yieldFrame = () => new Promise(res => {
  let done = false;
  const fin = () => { if (!done) { done = true; res(); } };
  requestAnimationFrame(fin);
  setTimeout(fin, 200);
});
async function encodeVideo() {
  if (encoding) return;
  encoding = true;
  recEl.classList.add('on');
  recEl.textContent = '准备编码…';
  renderer.setPixelRatio(1);
  renderer.setSize(EW, EH, false);
  composer.setSize(EW, EH);
  bloom.setSize(Math.round(EW * 2 / 3), Math.round(EH * 2 / 3));
  let Muxer, ArrayBufferTarget;
  try { ({ Muxer, ArrayBufferTarget } = await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.mjs')); }
  catch (e) { recEl.textContent = 'mp4-muxer 加载失败'; encoding = false; return; }
  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width: EW, height: EH, frameRate: FPS }, fastStart: 'in-memory' });
  let encErr = null;
  const encoder = new VideoEncoder({
    output: (ch, m) => muxer.addVideoChunk(ch, m),
    error: e => { encErr = e.message; },
  });
  let cfg = null;
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42E01F']) {
    const s = await VideoEncoder.isConfigSupported({ codec, width: EW, height: EH, bitrate: 16e6, framerate: FPS, avc: { format: 'avc' } });
    if (s.supported) { cfg = { ...s.config, bitrate: 16e6, framerate: FPS, avc: { format: 'avc' } }; break; }
  }
  if (!cfg) { recEl.textContent = '无可用 H.264 编码器'; encoding = false; return; }
  encoder.configure(cfg);
  const total = Math.round(D * FPS), dt = 1e6 / FPS, start = performance.now();
  let fail = null;
  for (let i = 0; i < total; i++) {
    const t = i / FPS;
    draw(t); grade.uniforms.uTime.value = t; composer.render();
    if (encErr || encoder.state !== 'configured') { fail = encErr || ('codec state = ' + encoder.state); break; }
    const f = new VideoFrame(canvas, { timestamp: Math.round(i * dt), duration: Math.round(dt) });
    try { encoder.encode(f, { keyFrame: i % (FPS * 2) === 0 }); }
    catch (err) { fail = err.message; f.close(); break; }
    f.close();
    // 背压：队列堆太深会把 codec 顶爆（Cannot call 'encode' on a closed codec）
    while (encoder.encodeQueueSize > 8) await sleep(2);
    if (i % 20 === 0) { recEl.textContent = '逐帧渲染 ' + i + ' / ' + total + ' · ' + ((performance.now() - start) / 1000).toFixed(1) + 's'; await yieldFrame(); }
  }
  if (fail) {
    try { encoder.close(); } catch {}
    recEl.textContent = '编码失败：' + fail;
    window.__encodeError = fail;
    encoding = false;
    layout();
    return;
  }
  await encoder.flush(); encoder.close(); muxer.finalize();
  const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zan-basics-' + EW + 'x' + EH + '-' + FPS + 'fps.mp4';
  document.body.appendChild(a); a.click();
  recEl.textContent = '✓ ' + (blob.size / 1048576).toFixed(1) + ' MB';
  window.__recording = { size: blob.size, frames: total, name: a.download };
  layout();
  encoding = false;
}

function fatal(msg) {
  document.getElementById('fatal').style.display = 'grid';
  document.getElementById('fatalMsg').textContent = msg;
  document.getElementById('boot').classList.add('off');
}

layout();
draw(0);
composer.render();
document.getElementById('boot').classList.add('off');
document.getElementById('btn').addEventListener('click', encodeVideo);
if (SHOT != null) { document.getElementById('btn').style.display = 'none'; document.getElementById('rec').style.display = 'none'; }
if (ENCODE) setTimeout(() => { encodeVideo().catch(e => { recEl.textContent = '编码失败：' + e.message; encoding = false; }); }, 700);
requestAnimationFrame(frame);
</script>
