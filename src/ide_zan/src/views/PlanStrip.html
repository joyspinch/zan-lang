<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PlanStrip</title>
</head>
<body data-zan-design id="PlanStrip" class="ide-panel" data-role="control" data-layout-mode="1">
  <div id="Run" data-kind="RunStrip" class="ide-panel-natural" data-fh="22"></div>
  <div id="Head" data-kind="Panel" class="plan-head ide-panel-toolbar">
    <button id="TitleBtn" data-kind="Button" class="text small plan-title ide-panel-field"></button>
    <button id="ClearBtn" data-kind="Button" class="small ide-panel-action"></button>
  </div>
  <div id="FilesHead" data-kind="Panel" class="plan-head ide-panel-toolbar">
    <button id="FilesBtn" data-kind="Button" class="text small plan-title ide-panel-field"></button>
  </div>
  <div id="Files" data-kind="ListView" data-of="AiFileChange" class="ai-files flat ide-panel-natural" data-fh="0"></div>
  <div id="Rows" data-kind="ListView" data-of="AiPlanStep" class="plan flat ide-panel-fill"></div>
  <hr id="Rule" class="planstrip-rule ide-panel-natural" />
</body>
</html>
