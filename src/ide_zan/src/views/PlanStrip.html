<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PlanStrip</title>
</head>
<body data-zan-design id="PlanStrip" class="ide-panel" data-role="control" data-layout-mode="1">
  <zan-run-strip id="Run" class="ide-panel-natural" data-fh="22"></zan-run-strip>
  <panel id="Head" class="plan-head ide-panel-toolbar">
    <button id="TitleBtn" class="text small plan-title ide-panel-field"></button>
    <button id="ClearBtn" class="small ide-panel-action"></button>
  </panel>
  <panel id="FilesHead" class="plan-head ide-panel-toolbar">
    <button id="FilesBtn" class="text small plan-title ide-panel-field"></button>
  </panel>
  <listview id="Files" data-of="AiFileChange" class="ai-files flat ide-panel-natural" data-fh="0"></listview>
  <listview id="Rows" data-of="AiPlanStep" class="plan flat ide-panel-fill"></listview>
  <hr id="Rule" class="planstrip-rule ide-panel-natural" />
</body>
</html>
