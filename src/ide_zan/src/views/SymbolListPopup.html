<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SymbolListPopup</title>
</head>
<body data-zan-design id="SymbolListPopup" data-role="control" data-layout-mode="1">
  <panel id="Shell" class="reflist" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-dock="fill" data-gap="0" data-pad="0">
    <panel id="Bar" class="reflist-head" data-dock="top" data-fh="28" data-gap="6" data-pad="4">
      <button id="CloseBtn" class="text tiny" data-dock="right" data-fw="24" data-x-props="{&quot;icon&quot;:&quot;close&quot;}"></button>
      <label id="HeadLbl" class="secondary small" data-dock="fill"></label>
    </panel>
    <treeview id="Tree" class="reflist" data-dock="fill"></treeview>
  </panel>
</body>
</html>
