<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DebugPanel</title>
</head>
<body data-zan-design id="DebugPanel" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">
  <tabs id="TabBar" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></tabs>
  <zan-console-view id="Console" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></zan-console-view>
  <listview id="Vars" data-of="DbgVar" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></listview>
  <panel id="WatchPane" data-gap="6" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;1&quot;}" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">
    <input id="WatchIn" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"/>
    <listview id="WatchGrid" data-of="DbgVar" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></listview>
  </panel>
  <listview id="Stack" data-of="DbgFrame" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></listview>
</body>
</html>
