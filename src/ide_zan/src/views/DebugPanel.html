<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DebugPanel</title>
</head>
<body data-zan-design id="DebugPanel" data-role="control" data-layout-mode="1">
  <tabs id="TabBar" data-dock="top" data-fh="0"></tabs>
  <zan-console-view id="Console" data-dock="fill"></zan-console-view>
  <listview id="Vars" data-of="DbgVar" data-dock="fill"></listview>
  <panel id="WatchPane" data-dock="fill" data-gap="6" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;1&quot;}">
    <input id="WatchIn" data-dock="top" data-fh="0" />
    <listview id="WatchGrid" data-of="DbgVar" data-dock="fill"></listview>
  </panel>
  <listview id="Stack" data-of="DbgFrame" data-dock="fill"></listview>
</body>
</html>
