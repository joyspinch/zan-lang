<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RefListPopup</title>
</head>
<body data-zan-design id="RefListPopup" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <panel id="Shell" class="reflist" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-gap="0" data-pad="0" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:28px minmax(0,1fr) 28px">
    <panel id="Bar" class="reflist-head" data-gap="6" data-pad="4" style="min-width:0;min-height:0;height:28px;grid-column:1 / 2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) 24px;grid-template-rows:minmax(0,1fr)">
      <button id="CloseBtn" class="text tiny" data-x-props="{&quot;icon&quot;:&quot;close&quot;}" style="min-width:0;min-height:0;width:24px;grid-column:2;grid-row:1"></button>
      <label id="HeadLbl" class="secondary small" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></label>
    </panel>
    <panel id="Foot" class="reflist-foot" data-gap="6" data-pad="4" style="min-width:0;min-height:0;height:28px;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr) 110px;grid-template-rows:minmax(0,1fr)">
      <button id="FoldBtn" class="text small" style="min-width:0;min-height:0;width:110px;grid-column:2;grid-row:1"></button>
    </panel>
    <treeview id="Tree" class="reflist" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></treeview>
  </panel>
</body>
</html>
