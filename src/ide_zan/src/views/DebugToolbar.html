<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DebugToolbar</title>
</head>
<body data-zan-design id="DebugToolbar" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr) 120px;grid-template-rows:minmax(0,1fr)">
  <label id="LineLbl" class="secondary small" style="min-width:0;min-height:0;width:120px;grid-column:2;grid-row:1"></label>
  <toolbar id="Strip" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></toolbar>
</body>
</html>
