<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AssetPanel</title>
</head>
<body data-zan-design id="AssetPanel" data-role="control" data-layout-mode="1">
  <label id="Crumb" class="medium" data-dock="1" data-fh="22"></label>
  <panel id="Bar1" class="assets-bar" data-dock="1" data-fh="28" data-gap="6">
    <button id="ImportBtn" data-label="Import file" class="primary small" data-dock="3" data-fw="120"></button>
    <button id="ImportDirBtn" data-label="Import folder" class="primary small" data-dock="3" data-fw="132"></button>
    <button id="LinkBtn" data-label="Link file" class="small" data-dock="3" data-fw="108"></button>
    <button id="UpBtn" data-label="Up" class="small" data-dock="3" data-fw="72"></button>
  </panel>
  <panel id="Bar2" class="assets-bar" data-dock="1" data-fh="28" data-gap="6">
    <input id="FolderIn" data-placeholder="new-folder" data-dock="3" data-fw="200" />
    <button id="MkBtn" data-label="New folder" class="small" data-dock="3" data-fw="132"></button>
    <button id="PkBtn" data-label="Publish" class="small" data-dock="3" data-fw="200"></button>
  </panel>
  <panel id="Footer" class="assets-footer" data-dock="2" data-fh="32" data-gap="6">
    <button id="CloseBtn" data-label="Close" class="primary small" data-dock="4" data-fw="96"></button>
    <label id="Msg" class="secondary small" data-dock="5"></label>
  </panel>
  <panel id="Body" class="assets-body" data-dock="5" data-gap="8">
    <panel id="Detail" class="assets-detail" data-dock="4" data-fw="290" data-gap="6" data-x-props="{&quot;layout&quot;:&quot;1&quot;}">
      <label id="MultiLbl" class="medium" data-dock="1"></label>
      <label id="TitleLbl" class="medium" data-dock="1"></label>
      <label id="MetaLbl" class="secondary small" data-dock="1"></label>
      <label id="PathLbl" class="hint tiny" data-dock="1"></label>
      <label id="HintLbl" class="secondary small" data-dock="1"></label>
      <panel id="RenameRow" class="assets-row" data-dock="1" data-fh="26" data-gap="6">
        <button id="RenameBtn" data-label="Rename" class="small" data-dock="4" data-fw="96"></button>
        <input id="RenameIn" data-placeholder="name" data-dock="5" />
      </panel>
      <panel id="DelRow" class="assets-row" data-dock="1" data-fh="26">
        <button id="DelBtn" data-label="Delete" class="small error" data-dock="3" data-fw="140"></button>
      </panel>
      <panel id="AnimBox" class="assets-anim" data-dock="1" data-gap="4" data-x-props="{&quot;layout&quot;:&quot;1&quot;}">
        <hr id="AnimRule"  data-dock="1" data-fh="1" />
        <label id="AnimHead" class="secondary small" data-dock="1"></label>
        <panel id="FpdRow" class="assets-field" data-dock="1" data-fh="24" data-gap="6">
          <label id="FpdName" class="hint tiny field-name" data-dock="3" data-fw="92"></label>
          <input id="FpdIn" data-placeholder="6" data-dock="5" />
        </panel>
        <panel id="DirsRow" class="assets-field" data-dock="1" data-fh="24" data-gap="6">
          <label id="DirsName" class="hint tiny field-name" data-dock="3" data-fw="92"></label>
          <input id="DirsIn" data-placeholder="8" data-dock="5" />
        </panel>
        <panel id="FpsRow" class="assets-field" data-dock="1" data-fh="24" data-gap="6">
          <label id="FpsName" class="hint tiny field-name" data-dock="3" data-fw="92"></label>
          <input id="FpsIn" data-placeholder="12" data-dock="5" />
        </panel>
        <panel id="SizeRow" class="assets-field" data-dock="1" data-fh="24" data-gap="6">
          <label id="SizeName" class="hint tiny field-name" data-dock="3" data-fw="92"></label>
          <input id="FrameWIn" data-placeholder="0" data-dock="5" />
          <input id="FrameHIn" data-placeholder="0" data-dock="5" />
        </panel>
        <panel id="StartRow" class="assets-field" data-dock="1" data-fh="24" data-gap="6">
          <button id="LoopBtn" data-label="loop" class="small" data-dock="3" data-fw="92"></button>
          <input id="StartIn" data-placeholder="0" data-dock="5" />
        </panel>
        <panel id="WriteRow" class="assets-row" data-dock="1" data-fh="26">
          <button id="AnimBtn" data-label="Write .anim" class="primary small" data-dock="3" data-fw="132"></button>
        </panel>
      </panel>
    </panel>
    <listview id="List" data-of="AssetEntry" data-dock="5"></listview>
  </panel>
</body>
</html>
