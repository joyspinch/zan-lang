<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AssetPanel</title>
</head>
<body data-zan-design id="AssetPanel" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:22px 28px 28px minmax(0,1fr) 32px">
  <label id="Crumb" class="medium" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:1"></label>
  <panel id="Bar1" class="assets-bar" data-gap="6" style="min-width:0;min-height:0;height:28px;grid-column:1 / 2;grid-row:2;display:grid;grid-template-columns:120px 132px 108px 72px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <button id="ImportBtn" data-label="Import file" class="primary small" style="min-width:0;min-height:0;width:120px;grid-column:1;grid-row:1"></button>
    <button id="ImportDirBtn" data-label="Import folder" class="primary small" style="min-width:0;min-height:0;width:132px;grid-column:2;grid-row:1"></button>
    <button id="LinkBtn" data-label="Link file" class="small" style="min-width:0;min-height:0;width:108px;grid-column:3;grid-row:1"></button>
    <button id="UpBtn" data-label="Up" class="small" style="min-width:0;min-height:0;width:72px;grid-column:4;grid-row:1"></button>
  </panel>
  <panel id="Bar2" class="assets-bar" data-gap="6" style="min-width:0;min-height:0;height:28px;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:200px 132px 200px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <input id="FolderIn" data-placeholder="new-folder" style="min-width:0;min-height:0;width:200px;grid-column:1;grid-row:1"/>
    <button id="MkBtn" data-label="New folder" class="small" style="min-width:0;min-height:0;width:132px;grid-column:2;grid-row:1"></button>
    <button id="PkBtn" data-label="Publish" class="small" style="min-width:0;min-height:0;width:200px;grid-column:3;grid-row:1"></button>
  </panel>
  <panel id="Footer" class="assets-footer" data-gap="6" style="min-width:0;min-height:0;height:32px;grid-column:1 / 2;grid-row:5;display:grid;grid-template-columns:minmax(0,1fr) 96px;grid-template-rows:minmax(0,1fr)">
    <button id="CloseBtn" data-label="Close" class="primary small" style="min-width:0;min-height:0;width:96px;grid-column:2;grid-row:1"></button>
    <label id="Msg" class="secondary small" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></label>
  </panel>
  <panel id="Body" class="assets-body" data-gap="8" style="min-width:0;min-height:0;grid-column:1;grid-row:4;display:grid;grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:minmax(0,1fr)">
    <panel id="Detail" class="assets-detail" data-gap="6" data-x-props="{&quot;layout&quot;:&quot;1&quot;}" style="min-width:0;min-height:0;width:290px;grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto 26px 26px auto minmax(0,1fr)">
      <label id="MultiLbl" class="medium" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></label>
      <label id="TitleLbl" class="medium" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:2"></label>
      <label id="MetaLbl" class="secondary small" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:3"></label>
      <label id="PathLbl" class="hint tiny" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:4"></label>
      <label id="HintLbl" class="secondary small" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:5"></label>
      <panel id="RenameRow" class="assets-row" data-gap="6" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:6;display:grid;grid-template-columns:minmax(0,1fr) 96px;grid-template-rows:minmax(0,1fr)">
        <button id="RenameBtn" data-label="Rename" class="small" style="min-width:0;min-height:0;width:96px;grid-column:2;grid-row:1"></button>
        <input id="RenameIn" data-placeholder="name" style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
      </panel>
      <panel id="DelRow" class="assets-row" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:7;display:grid;grid-template-columns:140px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
        <button id="DelBtn" data-label="Delete" class="small error" style="min-width:0;min-height:0;width:140px;grid-column:1;grid-row:1"></button>
      </panel>
      <panel id="AnimBox" class="assets-anim" data-gap="4" data-x-props="{&quot;layout&quot;:&quot;1&quot;}" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:8;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1px auto 24px 24px 24px 24px 24px 26px minmax(0,1fr)">
        <hr id="AnimRule" style="min-width:0;min-height:0;height:1px;grid-column:1 / 2;grid-row:1"/>
        <label id="AnimHead" class="secondary small" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:2"></label>
        <panel id="FpdRow" class="assets-field" data-gap="6" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
          <label id="FpdName" class="hint tiny field-name" style="min-width:0;min-height:0;width:92px;grid-column:1;grid-row:1"></label>
          <input id="FpdIn" data-placeholder="6" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
        </panel>
        <panel id="DirsRow" class="assets-field" data-gap="6" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:4;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
          <label id="DirsName" class="hint tiny field-name" style="min-width:0;min-height:0;width:92px;grid-column:1;grid-row:1"></label>
          <input id="DirsIn" data-placeholder="8" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
        </panel>
        <panel id="FpsRow" class="assets-field" data-gap="6" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:5;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
          <label id="FpsName" class="hint tiny field-name" style="min-width:0;min-height:0;width:92px;grid-column:1;grid-row:1"></label>
          <input id="FpsIn" data-placeholder="12" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
        </panel>
        <panel id="SizeRow" class="assets-field" data-gap="6" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:6;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
          <label id="SizeName" class="hint tiny field-name" style="min-width:0;min-height:0;width:92px;grid-column:1;grid-row:1"></label>
          <input id="FrameWIn" data-placeholder="0" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
          <input id="FrameHIn" data-placeholder="0" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
        </panel>
        <panel id="StartRow" class="assets-field" data-gap="6" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:7;display:grid;grid-template-columns:92px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
          <button id="LoopBtn" data-label="loop" class="small" style="min-width:0;min-height:0;width:92px;grid-column:1;grid-row:1"></button>
          <input id="StartIn" data-placeholder="0" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
        </panel>
        <panel id="WriteRow" class="assets-row" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:8;display:grid;grid-template-columns:132px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
          <button id="AnimBtn" data-label="Write .anim" class="primary small" style="min-width:0;min-height:0;width:132px;grid-column:1;grid-row:1"></button>
        </panel>
      </panel>
    </panel>
    <listview id="List" data-of="AssetEntry" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></listview>
  </panel>
</body>
</html>
