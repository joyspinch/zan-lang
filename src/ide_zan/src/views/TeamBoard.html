<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TeamBoard</title>
</head>
<body data-zan-design id="TeamBoard" class="ide-panel" data-role="control" data-layout-mode="1">
  <panel id="Head" class="ide-panel-toolbar">
    <switch id="ModeSw" class="small"></switch>
    <label id="TeamLbl" class="small secondary"></label>
    <panel id="Chips" class="ide-panel-field" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;2&quot;}"></panel>
    <button id="ProjBtn" class="small text ide-panel-action" data-on-click="teamBackProject"></button>
    <button id="OpenBtn" class="small text ide-panel-action" data-on-click="teamToggleOpen"></button>
  </panel>
  <steps id="Pipeline" class="small ide-panel-natural"></steps>
  <zan-graph-view id="Graph" class="ide-panel-natural"></zan-graph-view>
  <panel id="Sizer" class="team-sizer ide-panel-natural" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-fh="7"></panel>
  <label id="Why" class="small warning ide-panel-natural"></label>
</body>
</html>
