<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QuickPrompt</title>
</head>
<body data-zan-design id="QuickPrompt" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <panel id="Shell" class="quickprompt card" data-gap="6" data-pad="8" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:18px 26px 26px minmax(0,1fr)">
    <label id="Cap" class="small secondary" style="min-width:0;min-height:0;height:18px;grid-column:1 / 2;grid-row:1"></label>
    <panel id="Row1" data-gap="6" data-pad="0" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) 44px;grid-template-rows:minmax(0,1fr)">
      <button id="Go" class="small primary" style="min-width:0;min-height:0;width:44px;grid-column:2;grid-row:1"></button>
      <input id="First" style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
    </panel>
    <panel id="Row2" data-gap="6" data-pad="0" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
      <input id="Second" style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
    </panel>
  </panel>
</body>
</html>
