<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>QuickPrompt</title>
</head>
<body data-zan-design id="QuickPrompt" data-role="control" data-layout-mode="1">
  <panel id="Shell" class="quickprompt card" data-dock="5" data-gap="6" data-pad="8">
    <label id="Cap" class="small secondary" data-dock="1" data-fh="18"></label>
    <panel id="Row1" data-dock="1" data-fh="26" data-gap="6" data-pad="0">
      <button id="Go" class="small primary" data-dock="4" data-fw="44"></button>
      <input id="First" data-dock="5" />
    </panel>
    <panel id="Row2" data-dock="1" data-fh="26" data-gap="6" data-pad="0">
      <input id="Second" data-dock="5" />
    </panel>
  </panel>
</body>
</html>
