<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PublishStudio</title>
</head>
<body data-zan-design id="PublishStudio" data-role="control" data-layout-mode="1" class="studio-root" style="display:flex;flex-direction:column;align-items:stretch;width:100%;height:100%;min-width:0;min-height:0">
  <panel id="HeaderBar" class="studio-header" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
    <panel class="studio-title-group" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="TitleLabel" class="h2 strong"></label>
      <tag id="TypeTag" class="small"></tag>
    </panel>
    <select id="RecentSelect" class="small" style="min-width:220px;max-width:340px"></select>
    <button id="BtnOpen" class="secondary small" data-on-click="openProject"></button>
    <button id="BtnConfig" class="secondary small" data-on-click="openConfig"></button>
    <button id="BtnLang" class="ghost small" data-on-click="toggleLang"></button>
  </panel>

  <card id="ProjectCard" class="studio-card">
    <panel class="studio-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="ProjectNameLabel" class="h3 strong"></label>
      <label id="ProjectEntryLabel" class="small secondary"></label>
    </panel>
    <label id="ProjectPathLabel" class="small secondary"></label>
    <label id="SigningSummaryLabel" class="small secondary"></label>
    <panel id="QuickOptionsRow" class="studio-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <input id="ChkSingleFile" type="checkbox" class="small" />
      <input id="ChkPackAssets" type="checkbox" class="small" />
      <input id="ChkPubDebug" type="checkbox" class="small" />
      <input id="ChkStripSymbols" type="checkbox" class="small" />
      <input id="ChkDenyWarnings" type="checkbox" class="small" />
    </panel>
    <label id="TargetsCap" class="small strong"></label>
    <panel id="TargetList" class="studio-targets" data-x-props="{&quot;style&quot;:&quot;3&quot;}"></panel>
  </card>

  <panel id="ActionBar" class="studio-actions" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
    <button id="BtnPublish" class="primary medium" data-on-click="startPublish"></button>
    <button id="BtnBuild" class="secondary medium" data-on-click="startBuild"></button>
    <button id="BtnRun" class="secondary medium" data-on-click="startRun"></button>
    <button id="BtnOpenOut" class="ghost medium" data-on-click="openPublishDir"></button>
    <button id="BtnClearLog" class="ghost small" data-on-click="clearLog"></button>
    <progress id="PubProgress" class="small" style="width:140px"></progress>
    <label id="StatusLabel" class="small secondary" style="flex:1;min-width:0"></label>
  </panel>

  <card id="LogCard" class="studio-log-card">
    <label id="OutputCap" class="small strong"></label>
    <textarea id="LogArea" class="studio-log small" style="width:100%;flex:1;min-width:0;min-height:0"></textarea>
  </card>
</body>
</html>
