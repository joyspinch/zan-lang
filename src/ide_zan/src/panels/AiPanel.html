<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiPanel</title>
</head>
<body data-zan-design id="AiPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <div id="Columns" class="ide-panel-row ide-panel-fill">
    <div id="Sidebar" class="ide-panel-column ide-panel-natural ide-panel-inset"></div>
    <panel id="SideRule" class="ai-rule" data-x-props="{&quot;style&quot;:&quot;0&quot;}"></panel>
    <div id="Body" class="ide-panel-column ide-panel-fill">
      <div id="Header" class="ide-panel-toolbar ide-panel-inset">
        <div id="ModelHost" class="ide-panel-row ide-panel-field"></div>
        <button id="InitBtn" data-label="AI access" class="small ai-row ide-panel-action" data-on-click="aiInitAgent"></button>
        <button id="CfgBtn" data-label="Config" class="small ai-row ide-panel-action" data-on-click="aiOpenSettings"></button>
        <zan-ctx-ring id="Ring" class="ide-ai-ring"></zan-ctx-ring>
      </div>
      <zan-team-board id="Team" class="ide-panel-natural"></zan-team-board>
      <zan-plan-strip id="Plan" class="ide-panel-natural"></zan-plan-strip>
      <zan-chat-view id="Chat" class="ide-panel-fill"></zan-chat-view>
      <div id="ApplyRow" class="ide-panel-toolbar ide-panel-actions">
        <button id="ReplaceBtn" data-label="Replace file" class="small ai-row ide-panel-action" data-on-click="aiReplaceFile"></button>
        <button id="ApplyBtn" data-label="Insert code" class="small ai-row ide-panel-action" data-on-click="aiApplyCode"></button>
      </div>
      <zan-send-cue id="Cue" class="ide-panel-natural"></zan-send-cue>
      <div id="InputRow" class="ide-panel-column ide-panel-natural ide-panel-inset">
        <label id="PendLbl" class="small ai-pend ide-panel-natural"></label>
        <textarea id="Prompt" class="small ide-panel-natural" data-placeholder="Ask the assistant..." data-x-props="{&quot;autoHeight&quot;:true}"></textarea>
        <div id="InputActions" class="ide-panel-toolbar">
          <button id="AutoBtn" data-label="Auto: off" class="small ai-row ide-panel-action" data-on-click="aiAutoToggle"></button>
          <div id="InputSpace" class="ide-panel-field"></div>
          <button id="RejectBtn" data-label="Reject" class="small ai-row ide-panel-action" data-on-click="aiReject"></button>
          <button id="ApproveBtn" data-label="Approve" class="primary small ai-row ide-panel-action" data-on-click="aiApprove"></button>
          <button id="StopBtn" data-label="Stop" class="small ai-row ide-panel-action" data-on-click="aiStop"></button>
          <button id="SendBtn" data-label="Send" class="primary small ai-row ide-panel-action" data-on-click="aiSend"></button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
