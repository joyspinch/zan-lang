<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiPanel</title>
</head>
<body data-zan-design id="AiPanel" data-role="control" data-layout-mode="1">
  <div id="Sidebar" data-kind="Panel" data-dock="3" data-fw="154" data-pad="6"></div>
  <div id="SideRule" data-kind="Panel" class="ai-rule" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-dock="3" data-fw="1"></div>
  <div id="Body" data-kind="Panel" data-dock="5">
    <div id="Header" data-kind="Panel" data-dock="1" data-fh="46" data-pad="6" data-gap="6">
      <div id="Ring" data-kind="CtxRing" data-dock="4" data-fw="34"></div>
      <button id="CfgBtn" data-kind="Button" data-label="Config" class="small ai-row" data-dock="4" data-fw="52" data-on-click="aiOpenSettings"></button>
      <button id="InitBtn" data-kind="Button" data-label="AI access" class="small ai-row" data-dock="4" data-fw="96" data-on-click="aiInitAgent"></button>
      <div id="ModelHost" data-kind="Panel" data-dock="5"></div>
    </div>
    <div id="Team" data-kind="TeamBoard" data-dock="1" data-fh="0"></div>
    <div id="Plan" data-kind="PlanStrip" data-dock="1" data-fh="0"></div>
    <div id="InputRow" data-kind="Panel" data-dock="2" data-fh="88" data-pad="6" data-gap="6">
      <button id="AutoBtn" data-kind="Button" data-label="Auto: off" class="small ai-row" data-dock="3" data-fw="84" data-on-click="aiAutoToggle"></button>
      <button id="SendBtn" data-kind="Button" data-label="Send" class="primary small ai-row" data-dock="4" data-fw="56" data-on-click="aiSend"></button>
      <button id="StopBtn" data-kind="Button" data-label="Stop" class="small ai-row" data-dock="4" data-fw="56" data-on-click="aiStop"></button>
      <button id="ApproveBtn" data-kind="Button" data-label="Approve" class="primary small ai-row" data-dock="4" data-fw="56" data-on-click="aiApprove"></button>
      <button id="RejectBtn" data-kind="Button" data-label="Reject" class="small ai-row" data-dock="4" data-fw="56" data-on-click="aiReject"></button>
      <label id="PendLbl" data-kind="Label" class="small ai-pend" data-dock="5"></label>
      <textarea id="Prompt" data-kind="TextArea" data-placeholder="Ask the assistant..." data-dock="5"></textarea>
    </div>
    <div id="Cue" data-kind="SendCue" data-dock="2" data-fh="0"></div>
    <div id="ApplyRow" data-kind="Panel" data-dock="2" data-fh="0" data-gap="6">
      <button id="ApplyBtn" data-kind="Button" data-label="Insert code" class="small ai-row" data-dock="4" data-fw="110" data-on-click="aiApplyCode"></button>
      <button id="ReplaceBtn" data-kind="Button" data-label="Replace file" class="small ai-row" data-dock="4" data-fw="110" data-on-click="aiReplaceFile"></button>
    </div>
    <div id="Chat" data-kind="ChatView" data-dock="5"></div>
  </div>
</body>
</html>
