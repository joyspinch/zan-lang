<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiPanel</title>
</head>
<body data-zan-design id="AiPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <div id="Columns" class="ide-panel-row ide-panel-fill">
    <div id="Sidebar" class="ide-panel-column ide-panel-natural ide-panel-inset"></div>
    <div id="SideRule" data-kind="Panel" class="ai-rule" data-x-props="{&quot;style&quot;:&quot;0&quot;}"></div>
    <div id="Body" class="ide-panel-column ide-panel-fill">
      <div id="Header" class="ide-panel-toolbar ide-panel-inset">
        <div id="ModelHost" class="ide-panel-row ide-panel-field"></div>
        <button id="InitBtn" data-kind="Button" data-label="AI access" class="small ai-row ide-panel-action" data-on-click="aiInitAgent"></button>
        <button id="CfgBtn" data-kind="Button" data-label="Config" class="small ai-row ide-panel-action" data-on-click="aiOpenSettings"></button>
        <div id="Ring" data-kind="CtxRing" class="ide-ai-ring"></div>
      </div>
      <div id="Team" data-kind="TeamBoard" class="ide-panel-natural"></div>
      <div id="Plan" data-kind="PlanStrip" class="ide-panel-natural"></div>
      <div id="Chat" data-kind="ChatView" class="ide-panel-fill"></div>
      <div id="ApplyRow" class="ide-panel-toolbar ide-panel-actions">
        <button id="ReplaceBtn" data-kind="Button" data-label="Replace file" class="small ai-row ide-panel-action" data-on-click="aiReplaceFile"></button>
        <button id="ApplyBtn" data-kind="Button" data-label="Insert code" class="small ai-row ide-panel-action" data-on-click="aiApplyCode"></button>
      </div>
      <div id="Cue" data-kind="SendCue" class="ide-panel-natural"></div>
      <div id="InputRow" class="ide-panel-column ide-panel-natural ide-panel-inset">
        <label id="PendLbl" data-kind="Label" class="small ai-pend ide-panel-natural"></label>
        <textarea id="Prompt" data-kind="TextArea" class="small ide-panel-natural" data-placeholder="Ask the assistant..." data-x-props="{&quot;autoHeight&quot;:true}"></textarea>
        <div id="InputActions" class="ide-panel-toolbar">
          <button id="AutoBtn" data-kind="Button" data-label="Auto: off" class="small ai-row ide-panel-action" data-on-click="aiAutoToggle"></button>
          <div id="InputSpace" class="ide-panel-field"></div>
          <button id="RejectBtn" data-kind="Button" data-label="Reject" class="small ai-row ide-panel-action" data-on-click="aiReject"></button>
          <button id="ApproveBtn" data-kind="Button" data-label="Approve" class="primary small ai-row ide-panel-action" data-on-click="aiApprove"></button>
          <button id="StopBtn" data-kind="Button" data-label="Stop" class="small ai-row ide-panel-action" data-on-click="aiStop"></button>
          <button id="SendBtn" data-kind="Button" data-label="Send" class="primary small ai-row ide-panel-action" data-on-click="aiSend"></button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
