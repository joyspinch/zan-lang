<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OutputPanel</title>
</head>
<body data-zan-design id="OutputPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <div id="Bar" class="ide-panel-toolbar">
    <input id="Filter" class="small ide-panel-field" data-placeholder="Filter..." />
    <button id="ClearBtn" data-label="Clear" class="small ide-panel-action" data-on-click="outputClear"></button>
  </div>
  <hr id="Rule" class="ide-panel-natural" />
  <zan-console-view id="Log" class="ide-panel-fill"></zan-console-view>
</body>
</html>
