<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OutputPanel</title>
</head>
<body data-zan-design id="OutputPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <div id="Bar" class="ide-panel-toolbar">
    <input id="Filter" data-kind="Input" class="small ide-panel-field" data-placeholder="Filter..." />
    <button id="ClearBtn" data-kind="Button" data-label="Clear" class="small ide-panel-action" data-on-click="outputClear"></button>
  </div>
  <hr id="Rule" class="ide-panel-natural" />
  <div id="Log" data-kind="ConsoleView" class="ide-panel-fill"></div>
</body>
</html>
