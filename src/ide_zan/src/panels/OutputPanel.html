<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OutputPanel</title>
</head>
<body data-zan-design id="OutputPanel" data-role="control" data-layout-mode="1">
  <div id="Bar" data-kind="Panel" data-dock="1" data-fh="28">
    <button id="ClearBtn" data-kind="Button" data-label="Clear" class="tiny" data-dock="4" data-fw="74" data-on-click="outputClear"></button>
    <input id="Filter" data-kind="Input" data-placeholder="Filter..." data-dock="5" />
  </div>
  <hr id="Rule"  data-dock="1" data-fh="1" />
  <div id="Log" data-kind="ConsoleView" data-dock="5"></div>
</body>
</html>
