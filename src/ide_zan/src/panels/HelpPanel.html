<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HelpPanel</title>
</head>
<body data-zan-design id="HelpPanel" data-role="control" data-layout-mode="1">
  <div id="Bar" data-kind="Panel" data-dock="1" data-fh="26" data-gap="6" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
    <button id="ClearBtn" data-kind="Button" data-label="Clear" class="small" data-dock="4" data-fw="58"></button>
    <button id="ExportBtn" data-kind="Button" data-label="Export" class="small" data-dock="4" data-fw="58"></button>
    <button id="CopyBtn" data-kind="Button" data-label="Copy" class="small" data-dock="4" data-fw="58"></button>
    <button id="ConsentBtn" data-kind="Button" data-label="Logs: on" class="small" data-dock="4" data-fw="78"></button>
    <button id="ReportBtn" data-kind="Button" data-label="Report" class="small" data-dock="4" data-fw="58"></button>
    <label id="Head" data-kind="Label" class="small secondary" data-dock="5"></label>
  </div>
  <textarea id="Note" data-kind="TextArea" data-dock="1" data-fh="40"></textarea>
  <label id="Stat" data-kind="Label" class="small hint" data-dock="1" data-fh="18"></label>
  <div id="List" data-kind="ConsoleView" data-dock="5"></div>
</body>
</html>
