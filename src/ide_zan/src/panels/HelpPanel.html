<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HelpPanel</title>
</head>
<body data-zan-design id="HelpPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <div id="Bar" class="ide-panel-toolbar">
    <label id="Head" class="small secondary ide-panel-field"></label>
    <button id="ReportBtn" data-label="Report" class="small ide-panel-action"></button>
    <button id="ConsentBtn" data-label="Logs: on" class="small ide-panel-action"></button>
    <button id="CopyBtn" data-label="Copy" class="small ide-panel-action"></button>
    <button id="ExportBtn" data-label="Export" class="small ide-panel-action"></button>
    <button id="ClearBtn" data-label="Clear" class="small ide-panel-action"></button>
  </div>
  <textarea id="Note" class="small ide-panel-natural" data-x-props="{&quot;autoHeight&quot;:true}"></textarea>
  <label id="Stat" class="small hint ide-panel-natural"></label>
  <zan-console-view id="List" class="ide-panel-fill"></zan-console-view>
</body>
</html>
