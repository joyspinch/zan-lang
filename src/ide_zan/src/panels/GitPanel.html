<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GitPanel</title>
</head>
<body data-zan-design id="GitPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <label id="NoRepo" data-label="Not a git repository." class="secondary small ide-panel-natural"></label>
  <div id="InitRow" class="ide-panel-toolbar">
    <button id="InitBtn" data-label="Initialize repository" class="primary small ide-panel-action" data-on-click="gitInit"></button>
  </div>
  <label id="Branch" class="small ide-panel-natural"></label>
  <div id="Row1" class="ide-panel-toolbar">
    <button id="RefreshBtn" data-label="Refresh" class="ghost small ide-panel-action" data-on-click="gitRefresh"></button>
    <button id="StageBtn" data-label="Stage all" class="ghost small ide-panel-action" data-on-click="gitStage"></button>
    <button id="StageOneBtn" data-label="Stage file" class="ghost small ide-panel-action" data-on-click="gitStageOne"></button>
    <button id="UnstageBtn" data-label="Unstage" class="ghost small ide-panel-action" data-on-click="gitUnstage"></button>
  </div>
  <div id="Row2" class="ide-panel-toolbar">
    <button id="DiffBtn" data-label="Diff" class="ghost small ide-panel-action" data-on-click="gitDiff"></button>
    <button id="LogBtn" data-label="History" class="ghost small ide-panel-action" data-on-click="gitLog"></button>
    <button id="PullBtn" data-label="Pull" class="ghost small ide-panel-action" data-on-click="gitPull"></button>
    <button id="PushBtn" data-label="Push" class="ghost small ide-panel-action" data-on-click="gitPush"></button>
  </div>
  <div id="BranchRow" class="ide-panel-toolbar">
    <input id="BranchName" class="small ide-panel-field" data-placeholder="Branch name..." />
    <button id="BranchNewBtn" data-label="Branch" class="ghost small ide-panel-action" data-on-click="gitBranchNew"></button>
    <button id="BranchSwitchBtn" data-label="Switch" class="ghost small ide-panel-action" data-on-click="gitBranchSwitch"></button>
    <button id="MergeBtn" data-label="Merge" class="ghost small ide-panel-action" data-on-click="gitMerge"></button>
    <button id="StashBtn" data-label="Stash" class="ghost small ide-panel-action" data-on-click="gitStash"></button>
    <button id="StashPopBtn" data-label="Unstash" class="ghost small ide-panel-action" data-on-click="gitStashPop"></button>
    <button id="StashListBtn" data-label="Stash list" class="ghost small ide-panel-action" data-on-click="gitStashList"></button>
  </div>
  <listview id="Files" data-of="string" class="flat ide-panel-fill"></listview>
  <div id="CommitRow" class="ide-panel-toolbar">
    <input id="Message" class="small ide-panel-field" data-placeholder="Commit message..." />
    <button id="CommitBtn" data-label="Commit" class="primary small ide-panel-action" data-on-click="gitCommit"></button>
  </div>
</body>
</html>
