<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TerminalPanel</title>
</head>
<body data-zan-design id="TerminalPanel" class="ide-panel" data-role="control" data-layout-mode="1">
  <zan-console-view id="Log" class="ide-panel-fill"></zan-console-view>
  <div id="Row" class="ide-panel-toolbar" style="height:26px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <label id="Prompt" class="small secondary" style="width:72px"></label>
    <input id="Cmd" class="small" data-placeholder="Type a command and press Enter..." style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
  </div>
</body>
</html>
