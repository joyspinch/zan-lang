<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FindBar</title>
</head>
<body data-zan-design id="FindBar" data-role="control" data-layout-mode="1">
  <panel id="Surface" class="findbar" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-dock="5" data-pad="6">
    <panel id="Rows" data-dock="5" data-gap="4" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;1&quot;}">
      <panel id="QueryRow" data-dock="1" data-fh="24" data-gap="2" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <button id="ExpandBtn" class="text tiny" data-dock="3" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;chevron-down&quot;}"></button>
        <button id="CloseBtn" class="text tiny" data-dock="4" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;close&quot;}"></button>
        <button id="NextBtn" class="text tiny" data-dock="4" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;arrow-down&quot;}"></button>
        <button id="PrevBtn" class="text tiny" data-dock="4" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;arrow-up&quot;}"></button>
        <label id="StatusLbl" class="small hint" data-dock="4" data-fw="62"></label>
        <button id="RegexBtn" data-label=".*" class="text tiny" data-dock="4" data-fw="22"></button>
        <button id="WordBtn" data-label="ab" class="text tiny" data-dock="4" data-fw="22"></button>
        <button id="CaseBtn" data-label="Aa" class="text tiny" data-dock="4" data-fw="22"></button>
        <input id="QueryIn" data-dock="5" />
      </panel>
      <panel id="ReplRow" data-dock="1" data-fh="24" data-gap="4" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <button id="ReplAllBtn" class="small" data-dock="4" data-fw="48"></button>
        <button id="ReplBtn" class="small" data-dock="4" data-fw="66"></button>
        <input id="ReplIn" data-dock="5" />
      </panel>
      <label id="ErrLbl" class="small error" data-dock="1" data-fh="16"></label>
    </panel>
  </panel>
</body>
</html>
