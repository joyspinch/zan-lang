<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FindBar</title>
</head>
<body data-zan-design id="FindBar" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <panel id="Surface" class="findbar" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-pad="6" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <panel id="Rows" data-gap="4" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;1&quot;}" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:24px 24px 16px minmax(0,1fr)">
      <panel id="QueryRow" data-gap="2" data-x-props="{&quot;style&quot;:&quot;3&quot;}" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:1;display:grid;grid-template-columns:22px minmax(0,1fr) 22px 22px 22px 62px 22px 22px 22px;grid-template-rows:minmax(0,1fr)">
        <button id="ExpandBtn" class="text tiny" data-x-props="{&quot;icon&quot;:&quot;chevron-down&quot;}" style="min-width:0;min-height:0;width:22px;grid-column:1;grid-row:1"></button>
        <button id="CloseBtn" class="text tiny" data-x-props="{&quot;icon&quot;:&quot;close&quot;}" style="min-width:0;min-height:0;width:22px;grid-column:9;grid-row:1"></button>
        <button id="NextBtn" class="text tiny" data-x-props="{&quot;icon&quot;:&quot;arrow-down&quot;}" style="min-width:0;min-height:0;width:22px;grid-column:8;grid-row:1"></button>
        <button id="PrevBtn" class="text tiny" data-x-props="{&quot;icon&quot;:&quot;arrow-up&quot;}" style="min-width:0;min-height:0;width:22px;grid-column:7;grid-row:1"></button>
        <label id="StatusLbl" class="small hint" style="min-width:0;min-height:0;width:62px;grid-column:6;grid-row:1"></label>
        <button id="RegexBtn" data-label=".*" class="text tiny" style="min-width:0;min-height:0;width:22px;grid-column:5;grid-row:1"></button>
        <button id="WordBtn" data-label="ab" class="text tiny" style="min-width:0;min-height:0;width:22px;grid-column:4;grid-row:1"></button>
        <button id="CaseBtn" data-label="Aa" class="text tiny" style="min-width:0;min-height:0;width:22px;grid-column:3;grid-row:1"></button>
        <input id="QueryIn" style="min-width:0;min-height:0;grid-column:2;grid-row:1"/>
      </panel>
      <panel id="ReplRow" data-gap="4" data-x-props="{&quot;style&quot;:&quot;3&quot;}" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) 66px 48px;grid-template-rows:minmax(0,1fr)">
        <button id="ReplAllBtn" class="small" style="min-width:0;min-height:0;width:48px;grid-column:3;grid-row:1"></button>
        <button id="ReplBtn" class="small" style="min-width:0;min-height:0;width:66px;grid-column:2;grid-row:1"></button>
        <input id="ReplIn" style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
      </panel>
      <label id="ErrLbl" class="small error" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:3"></label>
    </panel>
  </panel>
</body>
</html>
