<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FindBar</title>
</head>
<body data-zan-design id="FindBar" data-role="control" data-layout-mode="1">
  <div id="Surface" data-kind="Panel" class="findbar" data-x-props="{&quot;style&quot;:&quot;0&quot;}" data-dock="5" data-pad="6">
    <div id="Rows" data-kind="Panel" data-dock="5" data-gap="4" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;1&quot;}">
      <div id="QueryRow" data-kind="Panel" data-dock="1" data-fh="24" data-gap="2" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <button id="ExpandBtn" data-kind="Button" class="text tiny" data-dock="3" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;chevron-down&quot;}"></button>
        <button id="CloseBtn" data-kind="Button" class="text tiny" data-dock="4" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;close&quot;}"></button>
        <button id="NextBtn" data-kind="Button" class="text tiny" data-dock="4" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;arrow-down&quot;}"></button>
        <button id="PrevBtn" data-kind="Button" class="text tiny" data-dock="4" data-fw="22" data-x-props="{&quot;icon&quot;:&quot;arrow-up&quot;}"></button>
        <label id="StatusLbl" data-kind="Label" class="small hint" data-dock="4" data-fw="62"></label>
        <button id="RegexBtn" data-kind="Button" data-label=".*" class="text tiny" data-dock="4" data-fw="22"></button>
        <button id="WordBtn" data-kind="Button" data-label="ab" class="text tiny" data-dock="4" data-fw="22"></button>
        <button id="CaseBtn" data-kind="Button" data-label="Aa" class="text tiny" data-dock="4" data-fw="22"></button>
        <input id="QueryIn" data-kind="Input" data-dock="5" />
      </div>
      <div id="ReplRow" data-kind="Panel" data-dock="1" data-fh="24" data-gap="4" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <button id="ReplAllBtn" data-kind="Button" class="small" data-dock="4" data-fw="48"></button>
        <button id="ReplBtn" data-kind="Button" class="small" data-dock="4" data-fw="66"></button>
        <input id="ReplIn" data-kind="Input" data-dock="5" />
      </div>
      <label id="ErrLbl" data-kind="Label" class="small error" data-dock="1" data-fh="16"></label>
    </div>
  </div>
</body>
</html>
