<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ProjectConfigDialog</title>
</head>
<body data-zan-design id="ProjectConfigDialog" data-role="control" data-layout-mode="1">
  <div id="Tabs" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="1" data-fh="40" data-pad="10" data-gap="8">
    <input id="TabConfig"  type="radio" data-dock="3" data-fw="110" data-bind="tab" data-x-props="{&quot;option&quot;:&quot;0&quot;}" />
    <input id="TabAssets"  type="radio" data-dock="3" data-fw="110" data-bind="tab" data-x-props="{&quot;option&quot;:&quot;1&quot;}" />
  </div>
  <div id="Assets" data-kind="AssetPanel" data-dock="5"></div>
  <div id="ConfigPage" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="5" data-pad="16" data-gap="6">
    <label id="ProjectName" data-kind="Label" class="title" data-dock="1" data-fh="26"></label>
    <label id="IconCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
    <div id="IconRow" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="1" data-fh="32" data-gap="8">
      <button id="ChooseIcon" data-kind="Button" class="primary small" data-dock="3" data-fw="130" data-on-click="projectIconChoose"></button>
      <button id="ClearIcon" data-kind="Button" class="ghost small" data-dock="3" data-fw="70" data-on-click="projectIconClear"></button>
      <label id="IconPath" data-kind="Label" class="small" data-dock="5"></label>
    </div>
    <label id="IconHint" data-kind="Label" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="ResourcesCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="22"></label>
    <label id="ResourceCounts" data-kind="Label" data-dock="1" data-fh="22"></label>
    <label id="AssetsHint1" data-kind="Label" class="secondary small" data-dock="1" data-fh="16"></label>
    <label id="AssetsHint2" data-kind="Label" class="secondary small" data-dock="1" data-fh="16"></label>
    <label id="PublishHint" data-kind="Label" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="SkinsCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="22"></label>
    <input id="SkinsOn"  type="checkbox" data-dock="1" data-fh="26" data-bind="skins" />
    <label id="SkinsHint" data-kind="Label" class="secondary small" data-dock="1" data-fh="18"></label>
    <div id="DoneRow" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="2" data-fh="44" data-gap="10">
      <button id="Done" data-kind="Button" class="primary small" data-dock="4" data-fw="110" data-on-click="projectConfigDone"></button>
    </div>
    <div id="SkinList" data-kind="ScrollColumn" data-dock="5" data-gap="6"></div>
  </div>
</body>
</html>
