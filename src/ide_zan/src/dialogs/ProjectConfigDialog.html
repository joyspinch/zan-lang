<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ProjectConfigDialog</title>
</head>
<body data-zan-design id="ProjectConfigDialog" data-role="control" data-layout-mode="1">
  <panel id="Tabs" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="1" data-fh="40" data-pad="10" data-gap="8">
    <input id="TabConfig"  type="radio" data-dock="3" data-fw="110" data-bind="tab" data-x-props="{&quot;option&quot;:&quot;0&quot;}" />
    <input id="TabAssets"  type="radio" data-dock="3" data-fw="110" data-bind="tab" data-x-props="{&quot;option&quot;:&quot;1&quot;}" />
  </panel>
  <zan-asset-panel id="Assets" data-dock="5"></zan-asset-panel>
  <panel id="ConfigPage" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="5" data-pad="16" data-gap="6">
    <label id="ProjectName" class="title" data-dock="1" data-fh="26"></label>
    <label id="IconCap" class="secondary small" data-dock="1" data-fh="20"></label>
    <panel id="IconRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="1" data-fh="32" data-gap="8">
      <button id="ChooseIcon" class="primary small" data-dock="3" data-fw="130" data-on-click="projectIconChoose"></button>
      <button id="ClearIcon" class="ghost small" data-dock="3" data-fw="70" data-on-click="projectIconClear"></button>
      <label id="IconPath" class="small" data-dock="5"></label>
    </panel>
    <label id="IconHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="ResourcesCap" class="secondary small" data-dock="1" data-fh="22"></label>
    <label id="ResourceCounts" data-dock="1" data-fh="22"></label>
    <label id="AssetsHint1" class="secondary small" data-dock="1" data-fh="16"></label>
    <label id="AssetsHint2" class="secondary small" data-dock="1" data-fh="16"></label>
    <label id="PublishHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="SkinsCap" class="secondary small" data-dock="1" data-fh="22"></label>
    <input id="SkinsOn"  type="checkbox" data-dock="1" data-fh="26" data-bind="skins" />
    <label id="SkinsHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="DiagCap" class="secondary small" data-dock="1" data-fh="22"></label>
    <input id="StrictMemOn" type="checkbox" data-dock="1" data-fh="26" data-bind="strictMemory" />
    <label id="StrictMemHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <input id="DenyWarningsOn" type="checkbox" data-dock="1" data-fh="26" data-bind="denyWarnings" />
    <label id="DenyWarningsHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="PlatformCap" class="secondary small" data-dock="1" data-fh="22"></label>
    <input id="MacMultiInstanceOn" type="checkbox" data-dock="1" data-fh="26" data-bind="macMultiInstance" />
    <label id="MacMultiInstanceHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <label id="SecurityCap" class="secondary small" data-dock="1" data-fh="22"></label>
    <input id="StripSymbolsOn" type="checkbox" data-dock="1" data-fh="26" data-bind="secStripSymbols" />
    <label id="StripSymbolsHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <input id="HideDiagnosticsOn" type="checkbox" data-dock="1" data-fh="26" data-bind="secHideDiagnostics" />
    <label id="HideDiagnosticsHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <input id="ObfStringsOn" type="checkbox" data-dock="1" data-fh="26" data-bind="secObfStrings" />
    <label id="ObfStringsHint" class="secondary small" data-dock="1" data-fh="18"></label>
    <panel id="DoneRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="2" data-fh="44" data-gap="10">
      <button id="Done" class="primary small" data-dock="4" data-fw="110" data-on-click="projectConfigDone"></button>
    </panel>
    <zan-scroll-column id="SkinList" data-dock="5" data-gap="6"></zan-scroll-column>
  </panel>
</body>
</html>
