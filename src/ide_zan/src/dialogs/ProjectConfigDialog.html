<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ProjectConfigDialog</title>
</head>
<body data-zan-design id="ProjectConfigDialog" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto">
  <zan-scroll-column style="grid-row:1;padding:var(--padding-large);gap:var(--space-l)">
    <label id="ProjectName" class="h2 strong"></label>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="IconCap" class="h3 strong"></label>
      <panel id="IconRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" style="display:flex;align-items:center;gap:var(--gap-medium)">
        <button id="ChooseIcon" class="secondary small" data-on-click="projectIconChoose" style="flex-shrink:0"></button>
        <button id="ClearIcon" class="ghost small" data-on-click="projectIconClear" style="flex-shrink:0"></button>
        <label id="IconPath" class="small" style="flex:1;min-width:0"></label>
      </panel>
      <label id="IconHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
    </panel>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="ResourcesCap" class="h3 strong"></label>
      <label id="ResourceCounts"></label>
      <input id="SingleFileOn" type="checkbox" bind="singleFile" class="small" />
      <input id="PackAssetsOn" type="checkbox" bind="packAssets" class="small" />
      <label id="PublishHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
    </panel>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="SkinsCap" class="h3 strong"></label>
      <input id="SkinsOn" type="checkbox" bind="skins" class="small" />
      <label id="SkinsHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
      <panel id="SkinList" data-x-props="{&quot;style&quot;:&quot;3&quot;}" style="display:flex;flex-direction:column;gap:var(--gap-small)"></panel>
    </panel>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="DiagCap" class="h3 strong"></label>
      <input id="StrictMemOn" type="checkbox" bind="strictMemory" class="small" />
      <label id="StrictMemHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
      <input id="DenyWarningsOn" type="checkbox" bind="denyWarnings" class="small" />
      <label id="DenyWarningsHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
    </panel>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="PlatformCap" class="h3 strong"></label>
      <input id="MacMultiInstanceOn" type="checkbox" bind="macMultiInstance" class="small" />
      <label id="MacMultiInstanceHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
    </panel>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="SecurityCap" class="h3 strong"></label>
      <input id="StripSymbolsOn" type="checkbox" bind="secStripSymbols" class="small" />
      <label id="StripSymbolsHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
      <input id="HideDiagnosticsOn" type="checkbox" bind="secHideDiagnostics" class="small" />
      <label id="HideDiagnosticsHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
      <input id="ObfStringsOn" type="checkbox" bind="secObfStrings" class="small" />
      <label id="ObfStringsHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>
    </panel>

    <panel class="config-section" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
      <label id="SigningCap" class="h3 strong"></label>
      <label id="SigningHint" class="secondary small" data-x-props="{&quot;wrap&quot;:&quot;true&quot;}"></label>

      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblAndroidKs" class="config-field-label"></label>
        <input id="InAndroidKs" type="text" bind="androidKeystore" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblAndroidAlias" class="config-field-label"></label>
        <input id="InAndroidAlias" type="text" bind="androidKeyAlias" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblAndroidPass" class="config-field-label"></label>
        <input id="InAndroidPass" type="text" bind="androidKeyPass" class="config-field-input small" />
      </panel>

      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblIosCert" class="config-field-label"></label>
        <input id="InIosCert" type="text" bind="iosCert" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblIosProf" class="config-field-label"></label>
        <input id="InIosProf" type="text" bind="iosProfile" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblIosBundle" class="config-field-label"></label>
        <input id="InIosBundle" type="text" bind="iosBundleId" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblIosName" class="config-field-label"></label>
        <input id="InIosName" type="text" bind="iosName" class="config-field-input small" />
      </panel>

      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblOhosCert" class="config-field-label"></label>
        <input id="InOhosCert" type="text" bind="ohosCert" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblOhosProf" class="config-field-label"></label>
        <input id="InOhosProf" type="text" bind="ohosProfile" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblOhosAlias" class="config-field-label"></label>
        <input id="InOhosAlias" type="text" bind="ohosKeyAlias" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblOhosPass" class="config-field-label"></label>
        <input id="InOhosPass" type="text" bind="ohosKeyPass" class="config-field-input small" />
      </panel>

      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblWinCert" class="config-field-label"></label>
        <input id="InWinCert" type="text" bind="windowsCert" class="config-field-input small" />
      </panel>
      <panel class="config-field-row" data-x-props="{&quot;style&quot;:&quot;3&quot;}">
        <label id="LblWinPass" class="config-field-label"></label>
        <input id="InWinPass" type="text" bind="windowsCertPass" class="config-field-input small" />
      </panel>
    </panel>
  </zan-scroll-column>
  <panel id="DoneRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" style="grid-row:2;display:flex;justify-content:flex-end;padding:var(--padding-small) var(--padding-large);border-top:1 var(--border-primary)">
    <button id="Done" class="primary medium project-config-done" data-on-click="projectConfigDone"></button>
  </panel>
</body>
</html>
