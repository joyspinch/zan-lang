<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PublishDialog</title>
</head>
<body data-zan-design id="PublishDialog" data-role="control" data-layout-mode="1">
  <panel id="Body" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="fill" data-pad="16" data-gap="6">
    <label id="ProjectCap" class="secondary small" data-dock="top" data-fh="20"></label>
    <label id="PlatformsCap" class="secondary small" data-dock="top" data-fh="20"></label>
    <panel id="ButtonRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="bottom" data-fh="44" data-gap="10">
      <button id="Publish" class="primary small" data-dock="right" data-fw="110" data-on-click="publishStart"></button>
      <button id="Cancel" class="ghost small" data-dock="right" data-fw="100" data-on-click="publishCancel"></button>
    </panel>
    <input id="DebugBuild"  type="checkbox" data-dock="bottom" data-fh="26" data-bind="pubDebug" />
    <label id="ModeCap" class="secondary small" data-dock="bottom" data-fh="22"></label>
    <input id="Companion"  type="checkbox" data-dock="bottom" data-fh="26" />
    <input id="MacMultiInstance" type="checkbox" data-dock="bottom" data-fh="26" data-bind="macMultiInstance" />
    <label id="LinuxHint2" class="secondary small" data-dock="bottom" data-fh="16"></label>
    <label id="LinuxHint1" class="secondary small" data-dock="bottom" data-fh="16"></label>
    <zan-scroll-column id="Platforms" data-dock="fill" data-pad="8" data-gap="6"></zan-scroll-column>
  </panel>
</body>
</html>
