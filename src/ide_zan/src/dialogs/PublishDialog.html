<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PublishDialog</title>
</head>
<body data-zan-design id="PublishDialog" data-role="control" data-layout-mode="1">
  <div id="Body" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="5" data-pad="16" data-gap="6">
    <label id="ProjectCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
    <label id="PlatformsCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
    <div id="ButtonRow" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="2" data-fh="44" data-gap="10">
      <button id="Publish" data-kind="Button" class="primary small" data-dock="4" data-fw="110" data-on-click="publishStart"></button>
      <button id="Cancel" data-kind="Button" class="ghost small" data-dock="4" data-fw="100" data-on-click="publishCancel"></button>
    </div>
    <div id="DebugBuild" data-kind="Checkbox" data-dock="2" data-fh="26" data-bind="pubDebug"></div>
    <label id="ModeCap" data-kind="Label" class="secondary small" data-dock="2" data-fh="22"></label>
    <div id="Companion" data-kind="Checkbox" data-dock="2" data-fh="26"></div>
    <label id="LinuxHint2" data-kind="Label" class="secondary small" data-dock="2" data-fh="16"></label>
    <label id="LinuxHint1" data-kind="Label" class="secondary small" data-dock="2" data-fh="16"></label>
    <div id="Platforms" data-kind="ScrollColumn" data-dock="5" data-pad="8" data-gap="6"></div>
  </div>
</body>
</html>
