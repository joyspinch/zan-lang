<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PublishDialog</title>
</head>
<body data-zan-design id="PublishDialog" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <panel id="Body" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-pad="16" data-gap="6" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:20px 20px minmax(0,1fr) 16px 16px 26px 26px 22px 26px 44px">
    <label id="ProjectCap" class="secondary small" style="min-width:0;min-height:0;height:20px;grid-column:1 / 2;grid-row:1"></label>
    <label id="PlatformsCap" class="secondary small" style="min-width:0;min-height:0;height:20px;grid-column:1 / 2;grid-row:2"></label>
    <panel id="ButtonRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-gap="10" style="min-width:0;min-height:0;height:44px;grid-column:1 / 2;grid-row:10;display:grid;grid-template-columns:minmax(0,1fr) 100px 110px;grid-template-rows:minmax(0,1fr)">
      <button id="Publish" class="primary small" data-on-click="publishStart" style="min-width:0;min-height:0;width:110px;grid-column:3;grid-row:1"></button>
      <button id="Cancel" class="ghost small" data-on-click="publishCancel" style="min-width:0;min-height:0;width:100px;grid-column:2;grid-row:1"></button>
    </panel>
    <input id="DebugBuild"  type="checkbox" bind="pubDebug" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:9"/>
    <label id="ModeCap" class="secondary small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:8"></label>
    <input id="Companion"  type="checkbox" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:7"/>
    <input id="MacMultiInstance" type="checkbox" bind="macMultiInstance" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:6"/>
    <label id="LinuxHint2" class="secondary small" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:5"></label>
    <label id="LinuxHint1" class="secondary small" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:4"></label>
    <zan-scroll-column id="Platforms" data-pad="8" data-gap="6" style="min-width:0;min-height:0;grid-column:1;grid-row:3"></zan-scroll-column>
  </panel>
</body>
</html>
