<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EditorSettingsDialog</title>
</head>
<body data-zan-design id="EditorSettingsDialog" data-role="control" data-layout-mode="1">
  <panel id="Body" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="fill" data-pad="18" data-gap="10">
    <label id="ThemeCap" class="secondary small" data-dock="top" data-fh="20"></label>
    <select id="ThemeSel"  data-dock="top" data-fh="34" data-bind="themeIdx"></select>
    <label id="FontCap" class="secondary small" data-dock="top" data-fh="20"></label>
    <panel id="FontRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="top" data-fh="34" data-gap="10">
      <button id="ResetFont" class="ghost small" data-dock="right" data-fw="90" data-on-click="resetFont"></button>
      <label id="PxCap" data-label="px" class="secondary small" data-dock="right" data-fw="24"></label>
      <label id="FontValue" data-dock="right" data-fw="36" data-bind="font" data-bind-prop="text"></label>
      <input id="Font"  type="range" data-dock="fill" data-bind="font"  min="9" max="30" />
    </panel>
    <label id="LangCap" class="secondary small" data-dock="top" data-fh="20"></label>
    <radio-group id="LangSel" class="button" data-dock="top" data-fh="34" data-bind="lang" data-options="English|简体中文" data-x-props="{&quot;type&quot;:&quot;button&quot;}"></radio-group>
    <panel id="ButtonRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="bottom" data-fh="40">
      <button id="Done" class="primary small" data-dock="right" data-fw="120" data-on-click="editorSettingsDone"></button>
    </panel>
  </panel>
</body>
</html>
