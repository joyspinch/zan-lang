<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EditorSettingsDialog</title>
</head>
<body data-zan-design id="EditorSettingsDialog" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <panel id="Body" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-pad="18" data-gap="10" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:20px 34px 20px 34px 20px 34px minmax(0,1fr) 40px">
    <label id="ThemeCap" class="secondary small" style="min-width:0;min-height:0;height:20px;grid-column:1 / 2;grid-row:1"></label>
    <select id="ThemeSel" bind="themeIdx" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:2"></select>
    <label id="FontCap" class="secondary small" style="min-width:0;min-height:0;height:20px;grid-column:1 / 2;grid-row:3"></label>
    <panel id="FontRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-gap="10" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:4;display:grid;grid-template-columns:minmax(0,1fr) 36px 24px 90px;grid-template-rows:minmax(0,1fr)">
      <button id="ResetFont" class="ghost small" data-on-click="resetFont" style="min-width:0;min-height:0;width:90px;grid-column:4;grid-row:1"></button>
      <label id="PxCap" data-label="px" class="secondary small" style="min-width:0;min-height:0;width:24px;grid-column:3;grid-row:1"></label>
      <label id="FontValue" bind:text="font" style="min-width:0;min-height:0;width:36px;grid-column:2;grid-row:1"></label>
      <input id="Font"  type="range" bind="font"  min="9" max="30" style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
    </panel>
    <label id="LangCap" class="secondary small" style="min-width:0;min-height:0;height:20px;grid-column:1 / 2;grid-row:5"></label>
    <radio-group id="LangSel" class="button" bind="lang" data-options="English|简体中文" data-x-props="{&quot;type&quot;:&quot;button&quot;}" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:6"></radio-group>
    <panel id="ButtonRow" data-x-props="{&quot;style&quot;:&quot;3&quot;}" style="min-width:0;min-height:0;height:40px;grid-column:1 / 2;grid-row:8;display:grid;grid-template-columns:minmax(0,1fr) 120px;grid-template-rows:minmax(0,1fr)">
      <button id="Done" class="primary small" data-on-click="editorSettingsDone" style="min-width:0;min-height:0;width:120px;grid-column:2;grid-row:1"></button>
    </panel>
  </panel>
</body>
</html>
