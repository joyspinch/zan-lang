<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EditorSettingsDialog</title>
</head>
<body data-zan-design id="EditorSettingsDialog" data-role="control" data-layout-mode="1">
  <div id="Body" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="5" data-pad="18" data-gap="10">
    <label id="ThemeCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
    <div id="ThemeSel" data-kind="SelectBox" data-dock="1" data-fh="34" data-bind="themeIdx"></div>
    <label id="FontCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
    <div id="FontRow" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="1" data-fh="34" data-gap="10">
      <button id="ResetFont" data-kind="Button" class="ghost small" data-dock="4" data-fw="90" data-on-click="resetFont"></button>
      <label id="PxCap" data-kind="Label" data-label="px" class="secondary small" data-dock="4" data-fw="24"></label>
      <label id="FontValue" data-kind="Label" data-dock="4" data-fw="36" data-bind="font" data-bind-prop="text"></label>
      <div id="Font" data-kind="Slider" data-dock="5" data-bind="font" data-x-props="{&quot;min&quot;:&quot;9&quot;,&quot;max&quot;:&quot;30&quot;}"></div>
    </div>
    <label id="LangCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
    <div id="LangSel" data-kind="SelectBox" data-dock="1" data-fh="34" data-bind="lang"></div>
    <div id="ButtonRow" data-kind="Panel" data-x-props="{&quot;style&quot;:&quot;3&quot;}" data-dock="2" data-fh="40">
      <button id="Done" data-kind="Button" class="primary small" data-dock="4" data-fw="120" data-on-click="editorSettingsDone"></button>
    </div>
  </div>
</body>
</html>
