<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiSettingsDialog</title>
</head>
<body data-zan-design id="AiSettingsDialog" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">
  <tabs id="TabBar" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></tabs>
  <panel id="ModelsPage" data-pad="16" data-gap="14" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <panel id="Left" data-gap="6" style="min-width:0;min-height:0;width:230px;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:20px 180px 34px 22px 140px 34px minmax(0,1fr)">
      <label id="ConfigsCap" class="secondary small" style="min-width:0;min-height:0;height:20px;grid-column:1 / 2;grid-row:1"></label>
      <listview id="Profiles" data-of="AiProfile" style="min-width:0;min-height:0;height:180px;grid-column:1 / 2;grid-row:2"></listview>
      <panel id="ConfigRow" data-gap="8" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:106px minmax(0,1fr) 106px;grid-template-rows:minmax(0,1fr)">
        <button id="NewProfile" class="small" data-on-click="aiProfileAdd" style="min-width:0;min-height:0;width:106px;grid-column:1;grid-row:1"></button>
        <button id="DeleteProfile" class="small" data-on-click="aiProfileDelete" style="min-width:0;min-height:0;width:106px;grid-column:3;grid-row:1"></button>
      </panel>
      <label id="PresetsCap" class="secondary small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:4"></label>
      <listview id="Presets" data-of="AiPreset" style="min-width:0;min-height:0;height:140px;grid-column:1 / 2;grid-row:5"></listview>
      <panel id="PresetActions" data-gap="8" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:6;display:grid;grid-template-columns:minmax(0,1fr) 70px;grid-template-rows:minmax(0,1fr)">
        <button id="SignUp" class="small" data-on-click="aiPresetSignUp" style="min-width:0;min-height:0;width:70px;grid-column:2;grid-row:1"></button>
        <button id="AddPreset" class="small" data-on-click="aiPresetAdd" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></button>
      </panel>
    </panel>
    <panel id="Right" data-gap="6" style="min-width:0;min-height:0;grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:22px 34px 22px 34px 22px 34px 22px 34px 22px 22px minmax(0,1fr) 40px">
      <label id="NameCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:1"></label>
      <input id="Name" bind="name" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:2"/>
      <label id="EndpointCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:3"></label>
      <input id="Endpoint" data-placeholder="https://api.openai.com/v1" bind="base" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:4"/>
      <label id="KeyCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:5"></label>
      <input id="Key" data-placeholder="sk-..." bind="key" data-x-props="{&quot;iconLead&quot;:&quot;lock&quot;,&quot;password&quot;:&quot;true&quot;}" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:6"/>
      <label id="ModelCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:7"></label>
      <panel id="ModelRow" data-gap="8" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:8;display:grid;grid-template-columns:minmax(0,1fr) 100px;grid-template-rows:minmax(0,1fr)">
        <button id="Fetch" class="small" data-on-click="aiModelsFetch" style="min-width:0;min-height:0;width:100px;grid-column:2;grid-row:1"></button>
        <select id="ModelPick" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></select>
        <input id="Model" data-placeholder="gpt-4o-mini" bind="model" style="min-width:0;min-height:0;grid-column:1;grid-row:1"/>
      </panel>
      <label id="Status" class="small" bind:text="status" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:9"></label>
      <panel id="ActionRow" data-gap="10" style="min-width:0;min-height:0;height:40px;grid-column:1 / 2;grid-row:12;display:grid;grid-template-columns:110px 150px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
        <button id="Save" class="small" data-on-click="aiProfileSave" style="min-width:0;min-height:0;width:110px;grid-column:1;grid-row:1"></button>
        <button id="SaveEnable" class="primary small" data-on-click="aiProfileEnable" style="min-width:0;min-height:0;width:150px;grid-column:2;grid-row:1"></button>
      </panel>
      <label id="LimitsCap" class="secondary small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:10"></label>
      <data-grid id="Limits" data-of="ModelLimitRow" style="min-width:0;min-height:0;grid-column:1;grid-row:11"></data-grid>
    </panel>
  </panel>
  <panel id="RolePage" data-pad="16" data-gap="6" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:24px 22px 22px 34px 22px minmax(0,1fr)">
    <label id="RoleTitle" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:1"></label>
    <label id="RoleDuty" class="secondary small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:2"></label>
    <label id="RoleModelCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:3"></label>
    <select id="RoleModel" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:4"></select>
    <label id="RolePromptCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:5"></label>
    <textarea id="RolePrompt" style="min-width:0;min-height:0;grid-column:1;grid-row:6"></textarea>
  </panel>
  <panel id="ActPage" data-pad="16" data-gap="6" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:24px 22px 34px 44px minmax(0,1fr)">
    <label id="ActTitle" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:1"></label>
    <label id="AutoContCap" class="small" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:2"></label>
    <input id="AutoCont" data-placeholder="40" bind="autocont" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:3"/>
    <label id="AutoContHint" class="secondary small" style="min-width:0;min-height:0;height:44px;grid-column:1 / 2;grid-row:4"></label>
  </panel>
</body>
</html>
