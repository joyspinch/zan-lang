<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiSettingsDialog</title>
</head>
<body data-zan-design id="AiSettingsDialog" data-role="control" data-layout-mode="1">
  <tabs id="TabBar" data-dock="1" data-fh="0"></tabs>
  <panel id="ModelsPage" data-dock="5" data-pad="16" data-gap="14">
    <panel id="Left" data-dock="3" data-fw="230" data-gap="6">
      <label id="ConfigsCap" class="secondary small" data-dock="1" data-fh="20"></label>
      <listview id="Profiles" data-of="AiProfile" data-dock="1" data-fh="180"></listview>
      <panel id="ConfigRow" data-dock="1" data-fh="34" data-gap="8">
        <button id="NewProfile" class="small" data-dock="3" data-fw="106" data-on-click="aiProfileAdd"></button>
        <button id="DeleteProfile" class="small" data-dock="4" data-fw="106" data-on-click="aiProfileDelete"></button>
      </panel>
      <label id="PresetsCap" class="secondary small" data-dock="1" data-fh="22"></label>
      <listview id="Presets" data-of="AiPreset" data-dock="1" data-fh="140"></listview>
      <panel id="PresetActions" data-dock="1" data-fh="34" data-gap="8">
        <button id="SignUp" class="small" data-dock="4" data-fw="70" data-on-click="aiPresetSignUp"></button>
        <button id="AddPreset" class="small" data-dock="5" data-on-click="aiPresetAdd"></button>
      </panel>
    </panel>
    <panel id="Right" data-dock="5" data-gap="6">
      <label id="NameCap" class="small" data-dock="1" data-fh="22"></label>
      <input id="Name" data-dock="1" data-fh="34" data-bind="name" />
      <label id="EndpointCap" class="small" data-dock="1" data-fh="22"></label>
      <input id="Endpoint" data-placeholder="https://api.openai.com/v1" data-dock="1" data-fh="34" data-bind="base" />
      <label id="KeyCap" class="small" data-dock="1" data-fh="22"></label>
      <input id="Key" data-placeholder="sk-..." data-dock="1" data-fh="34" data-bind="key" data-x-props="{&quot;iconLead&quot;:&quot;lock&quot;,&quot;password&quot;:&quot;true&quot;}" />
      <label id="ModelCap" class="small" data-dock="1" data-fh="22"></label>
      <panel id="ModelRow" data-dock="1" data-fh="34" data-gap="8">
        <button id="Fetch" class="small" data-dock="4" data-fw="100" data-on-click="aiModelsFetch"></button>
        <select id="ModelPick"  data-dock="5"></select>
        <input id="Model" data-placeholder="gpt-4o-mini" data-dock="5" data-bind="model" />
      </panel>
      <label id="Status" class="small" data-dock="1" data-fh="22" data-bind="status" data-bind-prop="text"></label>
      <panel id="ActionRow" data-dock="2" data-fh="40" data-gap="10">
        <button id="Save" class="small" data-dock="3" data-fw="110" data-on-click="aiProfileSave"></button>
        <button id="SaveEnable" class="primary small" data-dock="3" data-fw="150" data-on-click="aiProfileEnable"></button>
      </panel>
      <label id="LimitsCap" class="secondary small" data-dock="1" data-fh="22"></label>
      <data-grid id="Limits" data-of="ModelLimitRow" data-dock="5"></data-grid>
    </panel>
  </panel>
  <panel id="RolePage" data-dock="5" data-pad="16" data-gap="6">
    <label id="RoleTitle" data-dock="1" data-fh="24"></label>
    <label id="RoleDuty" class="secondary small" data-dock="1" data-fh="22"></label>
    <label id="RoleModelCap" class="small" data-dock="1" data-fh="22"></label>
    <select id="RoleModel"  data-dock="1" data-fh="34"></select>
    <label id="RolePromptCap" class="small" data-dock="1" data-fh="22"></label>
    <textarea id="RolePrompt" data-dock="5"></textarea>
  </panel>
  <panel id="ActPage" data-dock="5" data-pad="16" data-gap="6">
    <label id="ActTitle" data-dock="1" data-fh="24"></label>
    <label id="AutoContCap" class="small" data-dock="1" data-fh="22"></label>
    <input id="AutoCont" data-placeholder="40" data-dock="1" data-fh="34" data-bind="autocont" />
    <label id="AutoContHint" class="secondary small" data-dock="1" data-fh="44"></label>
  </panel>
</body>
</html>
