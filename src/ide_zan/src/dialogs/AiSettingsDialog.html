<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AiSettingsDialog</title>
</head>
<body data-zan-design id="AiSettingsDialog" data-role="control" data-layout-mode="1">
  <div id="TabBar" data-kind="Tabs" data-dock="1" data-fh="0"></div>
  <div id="ModelsPage" data-kind="Panel" data-dock="5" data-pad="16" data-gap="14">
    <div id="Left" data-kind="Panel" data-dock="3" data-fw="230" data-gap="6">
      <label id="ConfigsCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="20"></label>
      <div id="Profiles" data-kind="ListView" data-of="AiProfile" data-dock="1" data-fh="180"></div>
      <div id="ConfigRow" data-kind="Panel" data-dock="1" data-fh="34" data-gap="8">
        <button id="NewProfile" data-kind="Button" class="small" data-dock="3" data-fw="106" data-on-click="aiProfileAdd"></button>
        <button id="DeleteProfile" data-kind="Button" class="small" data-dock="4" data-fw="106" data-on-click="aiProfileDelete"></button>
      </div>
      <label id="PresetsCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="22"></label>
      <div id="Presets" data-kind="ListView" data-of="AiPreset" data-dock="1" data-fh="140"></div>
      <div id="PresetActions" data-kind="Panel" data-dock="1" data-fh="34" data-gap="8">
        <button id="SignUp" data-kind="Button" class="small" data-dock="4" data-fw="70" data-on-click="aiPresetSignUp"></button>
        <button id="AddPreset" data-kind="Button" class="small" data-dock="5" data-on-click="aiPresetAdd"></button>
      </div>
    </div>
    <div id="Right" data-kind="Panel" data-dock="5" data-gap="6">
      <label id="NameCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
      <input id="Name" data-kind="Input" data-dock="1" data-fh="34" data-bind="name" />
      <label id="EndpointCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
      <input id="Endpoint" data-kind="Input" data-placeholder="https://api.openai.com/v1" data-dock="1" data-fh="34" data-bind="base" />
      <label id="KeyCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
      <input id="Key" data-kind="Input" data-placeholder="sk-..." data-dock="1" data-fh="34" data-bind="key" data-x-props="{&quot;iconLead&quot;:&quot;lock&quot;,&quot;password&quot;:&quot;true&quot;}" />
      <label id="ModelCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
      <div id="ModelRow" data-kind="Panel" data-dock="1" data-fh="34" data-gap="8">
        <button id="Fetch" data-kind="Button" class="small" data-dock="4" data-fw="100" data-on-click="aiModelsFetch"></button>
        <div id="ModelPick" data-kind="SelectBox" data-dock="5"></div>
        <input id="Model" data-kind="Input" data-placeholder="gpt-4o-mini" data-dock="5" data-bind="model" />
      </div>
      <label id="Status" data-kind="Label" class="small" data-dock="1" data-fh="22" data-bind="status" data-bind-prop="text"></label>
      <div id="ActionRow" data-kind="Panel" data-dock="2" data-fh="40" data-gap="10">
        <button id="Save" data-kind="Button" class="small" data-dock="3" data-fw="110" data-on-click="aiProfileSave"></button>
        <button id="SaveEnable" data-kind="Button" class="primary small" data-dock="3" data-fw="150" data-on-click="aiProfileEnable"></button>
      </div>
      <label id="LimitsCap" data-kind="Label" class="secondary small" data-dock="1" data-fh="22"></label>
      <div id="Limits" data-kind="DataGrid" data-of="ModelLimitRow" data-dock="5"></div>
    </div>
  </div>
  <div id="RolePage" data-kind="Panel" data-dock="5" data-pad="16" data-gap="6">
    <label id="RoleTitle" data-kind="Label" data-dock="1" data-fh="24"></label>
    <label id="RoleDuty" data-kind="Label" class="secondary small" data-dock="1" data-fh="22"></label>
    <label id="RoleModelCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
    <div id="RoleModel" data-kind="SelectBox" data-dock="1" data-fh="34"></div>
    <label id="RolePromptCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
    <textarea id="RolePrompt" data-kind="TextArea" data-dock="5"></textarea>
  </div>
  <div id="ActPage" data-kind="Panel" data-dock="5" data-pad="16" data-gap="6">
    <label id="ActTitle" data-kind="Label" data-dock="1" data-fh="24"></label>
    <label id="AutoContCap" data-kind="Label" class="small" data-dock="1" data-fh="22"></label>
    <input id="AutoCont" data-kind="Input" data-placeholder="40" data-dock="1" data-fh="34" data-bind="autocont" />
    <label id="AutoContHint" data-kind="Label" class="secondary small" data-dock="1" data-fh="44"></label>
  </div>
</body>
</html>
