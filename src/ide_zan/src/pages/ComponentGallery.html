<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ComponentGallery</title>
</head>
<body data-zan-design id="ComponentGallery" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <card id="Frame" class="gallery" data-gap="10" style="min-width:0;min-height:0;grid-column:1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)">
    <panel id="Row1" data-gap="10" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;2&quot;}" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></panel>
    <panel id="Row2" data-gap="10" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;2&quot;}" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:2"></panel>
    <panel id="Stage" data-gap="8" data-x-props="{&quot;style&quot;:&quot;3&quot;,&quot;layout&quot;:&quot;1&quot;}" style="min-width:0;min-height:0;grid-column:1;grid-row:3"></panel>
  </card>
</body>
</html>
