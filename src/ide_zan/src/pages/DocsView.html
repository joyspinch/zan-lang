<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DocsView</title>
</head>
<body data-zan-design id="DocsView" data-role="control" data-layout-mode="1">
  <div id="Rail" data-kind="DocsSectionTabs" data-dock="3"></div>
  <div id="Side" data-kind="Panel" data-dock="3" data-fw="268" data-pad="12" data-gap="8">
    <div id="Search" data-kind="DocsSearchHost" data-dock="1" data-fh="32"></div>
    <div id="Topics" data-kind="DocsTopicList" data-dock="5"></div>
  </div>
  <div id="EmptyPane" data-kind="Panel" data-dock="5" data-pad="24" data-gap="8">
    <label id="EmptyText" data-kind="Label" class="hint" data-dock="1" data-fh="24"></label>
  </div>
  <div id="DetailScroll" data-kind="ScrollColumn" data-dock="5">
    <div id="Detail" data-kind="Panel" data-dock="1" data-pad="24" data-gap="10">
      <div id="Tag" data-kind="DocsTagHost" data-dock="1" data-fh="22"></div>
      <label id="Title" data-kind="Label" class="large" data-dock="1" data-fh="30"></label>
      <hr id="Rule"  data-dock="1" data-fh="1" />
      <textarea id="Body" data-kind="TextArea" class="doc-body" data-dock="1"></textarea>
      <div id="Preview" data-kind="DocsPreviewHost" data-dock="1"></div>
      <div id="Code" data-kind="DocsCodeBlockHost" data-dock="1"></div>
    </div>
  </div>
</body>
</html>
