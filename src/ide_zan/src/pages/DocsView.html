<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DocsView</title>
</head>
<body data-zan-design id="DocsView" data-role="control" data-layout-mode="1">
  <zan-docs-section-tabs id="Rail" data-dock="3"></zan-docs-section-tabs>
  <panel id="Side" data-dock="3" data-fw="268" data-pad="12" data-gap="8">
    <zan-docs-search-host id="Search" data-dock="1" data-fh="32"></zan-docs-search-host>
    <zan-docs-topic-list id="Topics" data-dock="5"></zan-docs-topic-list>
  </panel>
  <panel id="EmptyPane" data-dock="5" data-pad="24" data-gap="8">
    <label id="EmptyText" class="hint" data-dock="1" data-fh="24"></label>
  </panel>
  <zan-scroll-column id="DetailScroll" data-dock="5">
    <panel id="Detail" data-dock="1" data-pad="24" data-gap="10">
      <zan-docs-tag-host id="Tag" data-dock="1" data-fh="22"></zan-docs-tag-host>
      <label id="Title" class="large" data-dock="1" data-fh="30"></label>
      <hr id="Rule"  data-dock="1" data-fh="1" />
      <textarea id="Body" class="doc-body" data-dock="1"></textarea>
      <zan-docs-preview-host id="Preview" data-dock="1"></zan-docs-preview-host>
      <zan-docs-code-block-host id="Code" data-dock="1"></zan-docs-code-block-host>
    </panel>
  </zan-scroll-column>
</body>
</html>
