<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DocsView</title>
</head>
<body data-zan-design id="DocsView" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:auto 268px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
  <zan-docs-section-tabs id="Rail" style="min-width:0;min-height:0;width:auto;grid-column:1;grid-row:1"></zan-docs-section-tabs>
  <panel id="Side" data-pad="12" data-gap="8" style="min-width:0;min-height:0;width:268px;grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:32px minmax(0,1fr)">
    <zan-docs-search-host id="Search" style="min-width:0;min-height:0;height:32px;grid-column:1 / 2;grid-row:1"></zan-docs-search-host>
    <zan-docs-topic-list id="Topics" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></zan-docs-topic-list>
  </panel>
  <panel id="EmptyPane" data-pad="24" data-gap="8" style="min-width:0;min-height:0;grid-column:3;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:24px minmax(0,1fr)">
    <label id="EmptyText" class="hint" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:1"></label>
  </panel>
  <zan-scroll-column id="DetailScroll" style="min-width:0;min-height:0;grid-column:3;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">
    <panel id="Detail" data-pad="24" data-gap="10" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:22px 30px 1px auto auto auto minmax(0,1fr)">
      <zan-docs-tag-host id="Tag" style="min-width:0;min-height:0;height:22px;grid-column:1 / 2;grid-row:1"></zan-docs-tag-host>
      <label id="Title" class="large" style="min-width:0;min-height:0;height:30px;grid-column:1 / 2;grid-row:2"></label>
      <hr id="Rule" style="min-width:0;min-height:0;height:1px;grid-column:1 / 2;grid-row:3"/>
      <textarea id="Body" class="doc-body" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:4"></textarea>
      <zan-docs-preview-host id="Preview" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:5"></zan-docs-preview-host>
      <zan-docs-code-block-host id="Code" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:6"></zan-docs-code-block-host>
    </panel>
  </zan-scroll-column>
</body>
</html>
