<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MarketplaceView</title>
</head>
<body data-zan-design id="MarketplaceView" data-role="control" data-layout-mode="1">
  <div id="Bar" data-kind="Panel" class="market-bar" data-dock="1" data-fh="30" data-gap="8">
    <button id="RefreshBtn" data-kind="Button" data-label="Refresh" class="small" data-dock="3" data-fw="96"></button>
    <label id="Status" data-kind="Label" class="secondary small" data-dock="5"></label>
  </div>
  <div id="Body" data-kind="Panel" class="market-body" data-dock="5" data-gap="8">
    <div id="Detail" data-kind="Panel" class="market-detail" data-dock="4" data-fw="300" data-gap="6" data-x-props="{&quot;layout&quot;:&quot;1&quot;}">
      <label id="Name" data-kind="Label" class="large" data-dock="1"></label>
      <label id="Ns" data-kind="Label" class="secondary small" data-dock="1"></label>
      <label id="Ver" data-kind="Label" class="secondary small" data-dock="1"></label>
      <label id="Paid" data-kind="Label" class="secondary small" data-dock="1"></label>
      <button id="InstallBtn" data-kind="Button" data-label="Install" class="primary small" data-dock="1" data-fh="28"></button>
    </div>
    <div id="Packages" data-kind="ListView" data-of="MarketplacePackage" data-dock="5"></div>
  </div>
</body>
</html>
