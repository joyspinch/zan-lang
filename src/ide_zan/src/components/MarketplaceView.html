<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MarketplaceView</title>
</head>
<body data-zan-design id="MarketplaceView" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:30px minmax(0,1fr)">
  <panel id="Bar" class="market-bar" data-gap="8" style="min-width:0;min-height:0;height:30px;grid-column:1 / 2;grid-row:1;display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <button id="RefreshBtn" data-label="Refresh" class="small" style="min-width:0;min-height:0;width:96px;grid-column:1;grid-row:1"></button>
    <label id="Status" class="secondary small" style="min-width:0;min-height:0;grid-column:2;grid-row:1"></label>
  </panel>
  <panel id="Body" class="market-body" data-gap="8" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr)">
    <panel id="Detail" class="market-detail" data-gap="6" data-x-props="{&quot;layout&quot;:&quot;1&quot;}" style="min-width:0;min-height:0;width:300px;grid-column:2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto 28px minmax(0,1fr)">
      <label id="Name" class="large" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></label>
      <label id="Ns" class="secondary small" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:2"></label>
      <label id="Ver" class="secondary small" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:3"></label>
      <label id="Paid" class="secondary small" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:4"></label>
      <button id="InstallBtn" data-label="Install" class="primary small" style="min-width:0;min-height:0;height:28px;grid-column:1 / 2;grid-row:5"></button>
    </panel>
    <listview id="Packages" data-of="MarketplacePackage" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></listview>
  </panel>
</body>
</html>
