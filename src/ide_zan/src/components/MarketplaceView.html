<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MarketplaceView</title>
</head>
<body data-zan-design id="MarketplaceView" data-role="control" data-layout-mode="1">
  <panel id="Bar" class="market-bar" data-dock="top" data-fh="30" data-gap="8">
    <button id="RefreshBtn" data-label="Refresh" class="small" data-dock="left" data-fw="96"></button>
    <label id="Status" class="secondary small" data-dock="fill"></label>
  </panel>
  <panel id="Body" class="market-body" data-dock="fill" data-gap="8">
    <panel id="Detail" class="market-detail" data-dock="right" data-fw="300" data-gap="6" data-x-props="{&quot;layout&quot;:&quot;1&quot;}">
      <label id="Name" class="large" data-dock="top"></label>
      <label id="Ns" class="secondary small" data-dock="top"></label>
      <label id="Ver" class="secondary small" data-dock="top"></label>
      <label id="Paid" class="secondary small" data-dock="top"></label>
      <button id="InstallBtn" data-label="Install" class="primary small" data-dock="top" data-fh="28"></button>
    </panel>
    <listview id="Packages" data-of="MarketplacePackage" data-dock="fill"></listview>
  </panel>
</body>
</html>
