<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GenFormContract</title>
<style>body.document { padding: 9px; } .natural { display: flex; gap: 5px; }</style>
</head>
<body data-zan-design id="GenFormContract" class="document" data-layout-mode="1" data-form-size="0">
start <span id="Mixed" class="natural">left <button id="Action" data-kind="Button" data-position="1" data-anchor="9" data-fx="3" data-fy="4" data-fw="80" data-fh="30" data-on-click="Execute" data-arg="row.id">Run</button> right</span> end
<div id="Tabs" data-kind="Tabs" data-options="First|Second" data-active-tab="1" data-fw="240" data-fh="150">
<label id="PageFirst" data-kind="Label">first</label>
<label id="PageSecond" data-kind="Label" data-child-tab="1">second</label>
</div>
<div id="Split" data-kind="SplitPanel" data-fw="300" data-fh="120">
<input id="Left" data-kind="Input" placeholder="left" data-bind="left.value">
<label id="Right" data-kind="Label" data-child-tab="1">right</label>
</div>
<input id="Entry" data-kind="Input" required placeholder="required entry">
<div id="Grid" data-kind="DataGrid" data-of="ContractRow" data-row-factory="true" data-x-columns="[{&quot;field&quot;:&quot;caption&quot;,&quot;title&quot;:&quot;Caption&quot;,&quot;editable&quot;:true,&quot;click&quot;:&quot;CellExecute&quot;},{&quot;field&quot;:&quot;count&quot;,&quot;title&quot;:&quot;Count&quot;,&quot;type&quot;:&quot;num&quot;,&quot;sum&quot;:true}]"></div>
<button data-kind="Button" data-on-click="AnonymousExecute">anonymous</button>
</body>
</html>
