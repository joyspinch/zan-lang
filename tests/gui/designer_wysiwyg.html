<!doctype html>
<html>
<head>
<style>
body.surface { display: flex; flex-direction: column; padding: 12px; gap: 8px; background: #f0f4f8; }
.head { display: block; height: 34px; background: #dce8f4; color: #234567; }
.head > span { color: #c03040; font-size: 16px; }
.row { display: flex; gap: 8px; height: 40px; }
.row > button { width: 96px; }
.row > input { flex-grow: 1; }
.card { display: flex; flex-direction: column; padding: 8px; gap: 4px; width: 180px; height: 100px; }
</style>
</head>
<body data-zan-design id="WysiwygFixture" data-win-title="Preview parity" data-win-w="480" data-win-h="320" data-layout-mode="1" class="surface">
  <div id="Heading" class="head">Before <span id="Marker">styled text</span> after.</div>
  <div id="Row" class="row"><button id="Action" class="primary">Save</button><input id="Entry" placeholder="Name"></div>
  <zan-panel id="Anchored" class="card" data-position="1" data-anchor="9" data-fx="-8" data-fy="-8" data-fw="180" data-fh="100">
    <button id="Nested" class="secondary">Nested</button>
  </zan-panel>
</body>
</html>
