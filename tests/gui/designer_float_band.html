<!doctype html>
<html>
<head>
<style>
body.surface { display: block; padding: 0; margin: 0; }
.bar { height: 40px; background: #dce8f4; }
.box { width: 120px; height: 60px; background: #ffd0d0; }
</style>
</head>
<body data-zan-design id="FloatBand" data-win-w="480" data-win-h="320" data-layout-mode="1" class="surface" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:40px minmax(0,1fr)">
<div id="TitleBar" class="bar" style="min-width:0;min-height:0;height:40px;grid-column:1 / 2;grid-row:1"></div>
<div id="FloatBox" class="box" data-position="1" style="position:absolute;left:16px;top:40px;width:120px;height:60px"></div>
<div id="Inner" style="height: 120px; background: #eef2f6;">
<div id="InnerFloat" class="box" data-position="1" style="position:absolute;left:8px;top:0px;width:60px;height:30px"></div>
</div>
</body>
</html>
