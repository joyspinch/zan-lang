<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ZdPanel</title>
</head>
<body data-zan-design id="ZdPanel" data-role="control" data-layout-mode="1">
  <template id="Rows" data-for="items" data-dock="1">
    <li id="RowLi" data-fh="24">
      <span id="RowName" data-bind="name"></span>
    </li>
  </template>
  <input id="Title" data-label="title" data-bind="title" data-if="showTitle" data-dock="1" data-fh="32" />
</body>
</html>
