<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ZdPanel</title>
</head>
<body data-zan-design id="ZdPanel" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 32px minmax(0,1fr)">
  <template id="Rows" data-for="items" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1">
    <li id="RowLi" style="height:24px">
      <span id="RowName" bind="name"></span>
    </li>
  </template>
  <input id="Title" data-label="title" bind="title" :visible="showTitle" style="min-width:0;min-height:0;height:32px;grid-column:1 / 2;grid-row:2"/>
</body>
</html>
