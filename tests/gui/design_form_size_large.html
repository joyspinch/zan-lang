<!doctype html>
<html>
<head><meta charset="utf-8"><title>DesignFormSizeLarge</title></head>
<body data-zan-design id="DesignFormSizeLarge" data-role="control" data-form-size="0" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr)">
  <button id="AutoButton" data-label="Scale" class="text" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></button>
  <button id="ExplicitButton" data-label="Scale" class="text tiny" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:2"></button>
  <panel id="Group" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)">
    <button id="NestedButton" data-label="Scale" class="text" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:1"></button>
  </panel>
</body>
</html>
