<div>
  <template data-for="items">
    <li><span data-bind="name"></span></li>
  </template>
  <input data-bind="title" data-if="showTitle" />
</div>
<div>
  <button id="ok" data-on-click="save" data-arg="apple">Save</button>
  <input id="userName" z-model="user.name" z-show="showUser" />
  <button id="btnDbl" @dblclick="onDblSave">Dbl</button>
  <input id="inputChange" @change="onNameChange" z-hide="hideInput" />
</div>
