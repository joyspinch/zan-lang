<div>
  <template data-for="items">
    <li><span bind="name"></span></li>
  </template>
  <input bind="title" :visible="showTitle" />
</div>
<div>
  <button id="ok" data-on-click="save" data-arg="apple">Save</button>
  <input id="userName" bind="user.name" :visible="showUser" />
  <button id="btnDbl" @dblclick="onDblSave">Dbl</button>
  <input id="inputChange" @change="onNameChange" :visible="showInput" />
</div>
