<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VueBindingContract</title>
</head>
<body data-zan-design id="VueBindingContract" class="document">
  <!-- 输入类控件双向绑定与变化事件 -->
  <input id="UserNameInput" data-kind="Input" z-model="user.name" @change="OnNameChange" placeholder="Enter name">
  <input id="RememberMeCheck" data-kind="Checkbox" z-model="user.remember" @change="OnRememberChange">
  
  <!-- 条件显隐指令与富交互事件 -->
  <div id="VipBadge" data-kind="Panel" z-show="user.isVip" @right-click="OnBadgeContextMenu" @dblclick="OnBadgeDblClick">
    VIP Member
  </div>
  <div id="GuestNotice" data-kind="Panel" z-hide="user.isVip" @right-dblclick="OnNoticeRightDblClick">
    Regular Guest
  </div>

  <!-- 复合组件生命周期与高级事件 -->
  <div id="ViewTabs" data-kind="Tabs" data-options="Profile|Settings" @tab-changed="OnTabChanged">
    <label id="ProfileTab" data-kind="Label" @show="OnProfileShow">Profile Content</label>
    <label id="SettingsTab" data-kind="Label" data-child-tab="1" @hide="OnSettingsHide">Settings Content</label>
  </div>

  <!-- 表格富事件体系：行、列、单元格与声明式列点击 -->
  <div id="UserGrid" data-kind="DataGrid" data-of="UserDataRow"
       @row-click="OnGridRowClick"
       @row-dblclick="OnGridRowDblClick"
       @cell-click="OnGridCellClick"
       @col-click="OnGridColClick"
       data-x-columns="[{&quot;field&quot;:&quot;id&quot;,&quot;title&quot;:&quot;ID&quot;,&quot;click&quot;:&quot;OnIdColClick&quot;},{&quot;field&quot;:&quot;name&quot;,&quot;title&quot;:&quot;Name&quot;}]">
  </div>
</body>
</html>
