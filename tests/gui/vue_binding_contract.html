<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VueBindingContract</title>
</head>
<body data-zan-design id="VueBindingContract" class="document">
  
  <input id="UserNameInput" z-model="user.name" @change="OnNameChange" placeholder="Enter name">
  <checkbox id="RememberMeCheck" z-model="user.remember" @change="OnRememberChange">
  
  
  <panel id="VipBadge" z-show="user.isVip" @right-click="OnBadgeContextMenu" @dblclick="OnBadgeDblClick">
    VIP Member
  </panel>
  <panel id="GuestNotice" z-hide="user.isVip" @right-dblclick="OnNoticeRightDblClick">
    Regular Guest
  </panel>

  
  <tabs id="ViewTabs" data-options="Profile|Settings" @tab-changed="OnTabChanged">
    <label id="ProfileTab" @show="OnProfileShow">Profile Content</label>
    <label id="SettingsTab" data-child-tab="1" @hide="OnSettingsHide">Settings Content</label>
  </tabs>

  
  <data-grid id="UserGrid" data-of="UserDataRow"
       @row-click="OnGridRowClick"
       @row-dblclick="OnGridRowDblClick"
       @cell-click="OnGridCellClick"
       @col-click="OnGridColClick"
       data-x-columns="[{&quot;field&quot;:&quot;id&quot;,&quot;title&quot;:&quot;ID&quot;,&quot;click&quot;:&quot;OnIdColClick&quot;},{&quot;field&quot;:&quot;name&quot;,&quot;title&quot;:&quot;Name&quot;}]">
  </data-grid>
</body>
</html>
