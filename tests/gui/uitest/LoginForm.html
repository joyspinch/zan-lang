<!doctype html>
<html><head><meta charset="utf-8"><title>Login</title></head>
<body data-zan-design id="LoginForm" data-win-title="Login" data-win-w="320" data-win-h="200">
  <div class="page">
    <input id="UserName" bind="user" />
    <button id="Login" @click="OnLogin">Log in</button>
    <label id="Error" bind="error" :visible="showError"></label>
    <button id="Delete" disabled="true" @click="OnDelete">Delete</button>
  </div>
</body></html>
