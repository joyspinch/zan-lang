<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* scoping 用例 B：与 A 同名类 .card 但宽度不同、body 保持块流。
 * 无 scoping 时两份 CSS 合装会互相覆盖（后装者赢），两页布局俱毁。 */
.card { width: 40px; height: 10px; }
</style>
</head>
<body id="RB">
  <div class="card" id="K3"></div>
  <div class="card" id="K4"></div>
</body>
</html>
