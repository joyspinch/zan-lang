<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ZfPanel</title>
</head>
<body data-zan-design id="ZfPanel" data-role="control" data-layout-mode="1" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:28px 32px auto minmax(0,1fr)">
  <label id="Caption" data-label="side panel" style="min-width:0;min-height:0;height:28px;grid-column:1 / 2;grid-row:1"></label>
  <button id="GoBtn" data-label="Go" data-on-click="go" style="min-width:0;min-height:0;height:32px;grid-column:1 / 2;grid-row:2"></button>
  <card id="Box" data-gap="8" style="min-width:0;min-height:0;height:auto;grid-column:1 / 2;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:24px minmax(0,1fr)">
    <label id="BoxNote" data-label="in card" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:1"></label>
  </card>
  <panel id="Body" data-label="body region" style="min-width:0;min-height:0;grid-column:1;grid-row:4"></panel>
</body>
</html>
