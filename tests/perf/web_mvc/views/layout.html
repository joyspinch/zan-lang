<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/admin.css">
<script src="/static/js/csrf.js" defer></script>
<script src="/static/js/admin.js" defer></script>
</head>
<body class="admin">
<aside class="sidebar">
  <div class="brand"><a href="/">{{brand}}</a></div>
  <input class="menu-filter" type="search" placeholder="筛选菜单（支持首拼）">
  <nav class="menu">
    <ul>
{{#each menu}}
      <li class="menu-item{{#if active}} is-active{{/if}}">
        <a href="{{path}}" data-icon="{{icon}}"><span class="menu-icon"></span><span class="menu-title">{{title}}</span></a>
      </li>
{{/each}}
    </ul>
  </nav>
</aside>
<div class="main">
  <header class="topbar">
    <h1 class="heading">{{heading}}</h1>
    <div class="account">
      <span class="avatar">B</span>
      <span class="account-name">{{accountName}}</span>
      <span class="account-mail">{{accountMail}}</span>
      <a class="logout" href="/logout">退出登录</a>
    </div>
  </header>
  <main class="content">
{{content}}
  </main>
  <footer class="footer">
    <span>{{brand}}</span> · <span>Powered by Zan</span> · <span>账号 {{account}}</span>
  </footer>
</div>
</body>
</html>
