<section class="card">
  <div class="toolbar">
    <span class="total">共 {{total}} 条</span>
    <span class="page">第 {{page}} 页</span>
  </div>
  <table class="grid">
    <thead>
      <tr><th>ID</th><th>标题</th><th>负责人</th><th>金额</th><th>创建时间</th><th>操作</th></tr>
    </thead>
    <tbody>
{{#each rows}}
      <tr>
        <td>{{id}}</td>
        <td>{{title}}</td>
        <td>{{owner}}</td>
        <td class="num">{{amount}}</td>
        <td>{{createdAt}}</td>
        <td><a href="/bench/edit/{{id}}">编辑</a> <a href="/bench/delete/{{id}}">删除</a></td>
      </tr>
{{/each}}
    </tbody>
  </table>
</section>
