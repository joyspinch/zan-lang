<!doctype html>
<html><head><meta charset="utf-8"><title>Bad</title>
<style>
  .page { display: flex; flex-direction: column; }
  .narrow { width: 40px; overflow: hidden; white-space: nowrap; }
  .tiny { width: 12px; height: 12px; padding: 0; }
  .stack { position: relative; height: 40px; }
  .a { position: absolute; left: 0; top: 0; width: 80px; height: 30px; }
  .b { position: absolute; left: 40px; top: 0; width: 80px; height: 30px; }
  .far { margin-left: 600px; }
</style></head>
<body data-zan-design id="BadForm" data-win-title="Bad" data-win-w="320" data-win-h="240">
  <div class="page">
    <label id="LongLabel" class="narrow">This label text is far too long for its box</label>
    <button id="Tiny" class="tiny" @click="OnX">x</button>
    <div class="stack">
      <button id="Left" class="a" @click="OnX">Left</button>
      <button id="Right" class="b" @click="OnX">Right</button>
    </div>
    <input id="Far" class="far" />
  </div>
</body></html>
