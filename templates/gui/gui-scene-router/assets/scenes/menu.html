<!DOCTYPE html>
<!-- 主菜单场景：整屏 HTML。data-on-click 的名字由 MenuScene.OnWire 注册；
     id="best" 的文字由 MenuScene.OnEnter 回填。三个场景共用同一套深色游戏皮肤
     （.game-btn / .accent 等），换皮只改这几段 <style>。 -->
<html>
<head>
<style>
body { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap-large); background: #14161a; }
.title { color: #7ee787; font-size: var(--font-size-mega); margin: 0; }
.sub { color: #8b949e; font-size: var(--font-size-large); margin: 0; }
.best { color: #ffd166; font-size: var(--font-size-medium); margin: 0; }
.menu { display: flex; flex-direction: column; align-items: stretch; gap: var(--gap-large); width: 240px; margin-top: var(--space-l); }
.game-btn { height: var(--height-large); font-size: var(--font-size-large); border-radius: var(--radius-medium); background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
.game-btn:hover { background: #30363d; border-color: #7ee787; }
.game-btn.accent { background: #7ee787; color: #0d1117; border-color: #7ee787; }
.game-btn.accent:hover { background: #a6f0ad; }
.tip { color: #6e7681; font-size: var(--font-size-small); margin: 0; margin-top: var(--space-l); }
</style>
</head>
<body>
  <h1 class="title">弹球试炼</h1>
  <p class="sub">一个窗口三个场景 · 每个场景一个 HTML 文件</p>
  <p id="best" class="best">还没有成绩，来一局吧</p>
  <div class="menu">
    <button id="start" class="game-btn accent" data-on-click="start">开始游戏</button>
    <button id="quit" class="game-btn" data-on-click="quit">退出</button>
  </div>
  <p class="tip">鼠标移动挡板 · 接住弹球得分，越接越快 · Esc 退出</p>
</body>
</html>
