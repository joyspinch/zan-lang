<!DOCTYPE html>
<!-- 玩法场景的 HUD 叠层：只有顶部一条工具栏，其余透出 Canvas 直绘的游戏世界
     （body 不设背景）。暂停按钮的文字由 PlayScene 切换（暂停/继续）；
     得分由 PlayScene.Render 画在工具栏中段。 -->
<html>
<head>
<style>
body { display: flex; flex-direction: row; align-items: flex-start; gap: var(--gap-medium); padding: var(--padding-medium) var(--padding-large); }
.spacer { flex-grow: 1; }
.hud-btn { height: var(--height-medium); padding: 0 var(--padding-large); font-size: var(--font-size-medium); border-radius: var(--radius-medium); background: rgba(33, 38, 45, 0.85); color: #e6edf3; border: 1px solid #30363d; }
.hud-btn:hover { border-color: #7ee787; }
</style>
</head>
<body>
  <button id="pause" class="hud-btn" data-on-click="pause">暂停</button>
  <button id="menu" class="hud-btn" data-on-click="menu">主菜单</button>
  <div class="spacer"></div>
  <button id="quit" class="hud-btn" data-on-click="quit">退出</button>
</body>
</html>
