<!DOCTYPE html>
<!-- 玩法场景的 HUD 叠层：只有顶部一条工具栏，其余透出 Canvas 直绘的游戏世界。
     暂停按钮的文字由 PlayScene 在 OnEnter 后抓取切换（暂停/继续）。 -->
<html>
<body style="display:flex;flex-direction:row;align-items:flex-start;gap:10px;padding:10px 12px">
  <button id="pause" data-on-click="pause" style="padding:8px 22px">暂停</button>
  <button data-on-click="menu" style="padding:8px 22px">主菜单</button>
  <div style="flex:1"></div>
  <button data-on-click="quit" style="padding:8px 22px">退出</button>
</body>
</html>
