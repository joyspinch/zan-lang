<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 标准流式排版：只用 flex + gap + padding，没有任何绝对坐标。
   * 窗口拉大拉小，顶栏/侧栏/内容区自动跟随。 */
  body { display: flex; flex-direction: column; background: var(--window-bg); }
  .topbar { flex-shrink: 0; display: flex; flex-direction: row; align-items: center; gap: var(--gap-medium);
            padding: var(--padding-small) var(--padding-large); background: var(--bg-secondary); border-bottom: 1 var(--divider); }
  .spacer { flex-grow: 1; }
  .body { flex-grow: 1; min-height: 0; display: flex; flex-direction: row; }
  .sidebar { flex-shrink: 0; width: 180px; display: flex; flex-direction: column; gap: var(--gap-small);
             padding: var(--padding-medium); background: var(--bg-secondary); border-right: 1 var(--divider); }
  .content { flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--gap-large); padding: var(--padding-large); }
  .page { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap-large); }
  .stats { display: flex; flex-direction: row; gap: var(--gap-large); }
  .stats card { flex-grow: 1; flex-basis: 0; min-width: 0; }
  .list { display: flex; flex-direction: column; gap: var(--gap-small); }
  .form { display: flex; flex-direction: column; gap: var(--gap-large); }
  .row { display: flex; flex-direction: row; align-items: center; gap: var(--gap-medium); }
  .row .name { flex-grow: 1; min-width: 0; }
  .field { display: flex; flex-direction: row; align-items: center; gap: var(--gap-medium); }
  .field .cap { width: 96px; flex-shrink: 0; }
  .field input, .field select { flex-grow: 1; min-width: 0; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="880" data-win-h="600" data-win-center="true">
  <div class="topbar">
    <label id="BrandLabel" class="h3 primary">{{NAME}} 管理后台</label>
    <div class="spacer"></div>
    <label id="ClockLabel" class="small secondary" bind="lastAction"></label>
    <button id="ProfileButton" class="small ghost">管理员</button>
  </div>
  <div class="body">
    <div class="sidebar">
      <button id="NavDashboard" :class="navDashboard" data-arg="dashboard" @click="OnNav">仪表盘</button>
      <button id="NavUsers" :class="navUsers" data-arg="users" @click="OnNav">用户</button>
      <button id="NavSettings" :class="navSettings" data-arg="settings" @click="OnNav">系统设置</button>
    </div>
    <div class="content">
      <label id="PageTitle" class="h2" bind="pageTitle"></label>

      <div id="DashboardPage" class="page" :visible="showDashboard">
        <div class="stats">
          <card id="UsersCard"><statistic id="UsersStat" text="用户总数" bind="userCountText"></statistic></card>
          <card id="OnlineCard"><statistic id="OnlineStat" text="当前在线" bind="onlineText"></statistic></card>
          <card id="SavedCard"><statistic id="SavedStat" text="配置保存次数" bind="saveCountText"></statistic></card>
        </div>
        <card id="ActivityCard"><div class="list">
          <label id="ActivityTitle" class="h3">最近动态</label>
          <label id="Activity1" class="secondary" bind="activity1"></label>
          <label id="Activity2" class="secondary" bind="activity2"></label>
          <label id="Activity3" class="secondary" bind="activity3"></label>
        </div></card>
      </div>

      <div id="UsersPage" class="page" :visible="showUsers">
        <div class="row">
          <input id="NewUserInput" class="name" placeholder="输入用户名后回车添加" bind="newUser" @submit="OnAddUser" />
          <button id="AddUserButton" class="medium primary" @click="OnAddUser">添加用户</button>
        </div>
        <card id="UserListCard"><div class="list">
          <template data-for="users">
            <div class="row">
              <label class="name" bind="name"></label>
              <label class="secondary" bind="role"></label>
              <label bind="state" :class="stateClass"></label>
            </div>
          </template>
        </div></card>
      </div>

      <div id="SettingsPage" class="page" :visible="showSettings">
        <card id="SettingsCard"><div class="form">
          <div class="field">
            <label id="SiteCap" class="cap secondary">站点名称</label>
            <input id="SiteInput" bind="siteName" />
          </div>
          <div class="field">
            <label id="MailCap" class="cap secondary">管理员邮箱</label>
            <input id="MailInput" bind="adminEmail" />
          </div>
          <div class="field">
            <label id="LangCap" class="cap secondary">界面语言</label>
            <select id="LangSelect" bind="language">
              <option selected>简体中文</option>
              <option>English</option>
            </select>
          </div>
          <div class="field">
            <label id="SignupCap" class="cap secondary">开放注册</label>
            <switch id="SignupSwitch" bind="allowSignup"></switch>
          </div>
          <div class="row">
            <button id="SaveButton" class="medium primary" @click="OnSave">保存配置</button>
            <label id="SaveMessage" bind="saveMessage" :class="saveClass"></label>
          </div>
        </div></card>
      </div>
    </div>
  </div>
</body>
</html>
