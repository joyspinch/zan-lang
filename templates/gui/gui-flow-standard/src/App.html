<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>App</title>
<style>
  .topbar { height: 48px; border-bottom: 1px var(--border-secondary); background: var(--surface-bg); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
  .body-wrap { display: flex; flex: 1; height: 100%; }
  .sidebar { width: 180px; border-right: 1px var(--border-secondary); background: var(--surface-bg); padding: 16px 12px; display: flex; flex-direction: column; gap: 8px; }
  .main-content { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: var(--app-bg); }
  .form-row { display: flex; align-items: center; gap: 12px; }
  .form-label { width: 80px; text-align: right; }
  .form-input { flex: 1; }
</style>
</head>
<body data-zan-design id="App" data-win-w="720" data-win-h="540">
  <div class="topbar">
    <label data-kind="Label" data-label="系统管理后台"></label>
    <button id="ProfileBtn" data-kind="Button" data-label="管理员" class="small"></button>
  </div>
  <div class="body-wrap">
    <div class="sidebar">
      <button id="NavDashboard" data-kind="Button" data-label="仪表盘" class="ghost text-left" @click="OnNavDashboard"></button>
      <button id="NavSettings" data-kind="Button" data-label="系统设置" class="secondary text-left" @click="OnNavSettings"></button>
    </div>
    <div class="main-content">
      <label data-kind="Label" data-label="基础参数配置" class="large"></label>
      <div class="form-row">
        <label data-kind="Label" data-label="站点名称" class="form-label"></label>
        <input id="SiteNameInput" data-kind="Input" data-label="我的站点" class="form-input" />
      </div>
      <div class="form-row">
        <label data-kind="Label" data-label="管理员邮箱" class="form-label"></label>
        <input id="SiteEmailInput" data-kind="Input" data-label="admin@example.com" class="form-input" />
      </div>
      <div class="form-row">
        <label class="form-label"></label>
        <button id="SaveBtn" data-kind="Button" data-label="保存配置" class="primary" @click="OnSave"></button>
      </div>
    </div>
  </div>
</body>
</html>
