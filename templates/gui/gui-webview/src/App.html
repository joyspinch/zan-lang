<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1100" data-win-h="760" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0">
  <toolbar id="NavStrip" data-label="导航" data-span="24" data-dock="1" data-fx="0" data-fy="0" data-fw="200" data-fh="34" data-x-options="[&quot;后退:chevron-left&quot;,&quot;前进:chevron-right&quot;,&quot;刷新:refresh&quot;,&quot;-&quot;,&quot;新建标签:plus&quot;]" @item-click="OnNavCommand"></toolbar>
  <input id="AddressBar" data-label="" data-span="24" data-dock="1" data-fx="0" data-fy="0" data-fw="200" data-fh="34" data-placeholder="搜索或输入地址" />
  <status-bar id="MainStatusBar" data-label="就绪" data-span="24" data-dock="2" data-fx="0" data-fy="0" data-fw="200" data-fh="24" data-x-options="[&quot;就绪&quot;,&quot;&gt;1 个标签&quot;]"></status-bar>
  <tabs id="BrowserTabs" data-label="标签页" data-span="24" data-dock="5" data-fx="0" data-fy="0" data-fw="200" data-fh="32" data-x-options="[&quot;x新建标签&quot;]">
    <zan-web-view-box id="Tab1View" data-label="" data-span="24" data-dock="5" data-fx="0" data-fy="0" data-fw="200" data-fh="300" data-placeholder="https://www.example.com"></zan-web-view-box>
  </tabs>
</body>
</html>
