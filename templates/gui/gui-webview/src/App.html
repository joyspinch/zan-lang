<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1100" data-win-h="760" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px 34px minmax(0,1fr) 24px">
  <toolbar id="NavStrip" data-label="导航" data-x-options="[&quot;后退:chevron-left&quot;,&quot;前进:chevron-right&quot;,&quot;刷新:refresh&quot;,&quot;-&quot;,&quot;新建标签:plus&quot;]" @item-click="OnNavCommand" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:1"></toolbar>
  <input id="AddressBar" data-label="" data-placeholder="搜索或输入地址" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:2"/>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;1 个标签&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:4"></status-bar>
  <tabs id="BrowserTabs" data-label="标签页" data-x-options="[&quot;x新建标签&quot;]" style="min-width:0;min-height:0;grid-column:1;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <zan-web-view-box id="Tab1View" data-label="" data-placeholder="https://www.example.com" style="min-width:0;min-height:0;grid-column:1;grid-row:1"></zan-web-view-box>
  </tabs>
</body>
</html>
