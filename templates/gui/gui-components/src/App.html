<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  body { display: flex; flex-direction: column; background: var(--window-bg); }
  .page { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap-large); padding: var(--padding-large); }
  .columns { flex-grow: 1; min-height: 0; display: flex; flex-direction: row; align-items: flex-start; gap: var(--gap-large); }
  .main { flex-grow: 3; flex-basis: 0; min-width: 0; }
  .aside { flex-grow: 2; flex-basis: 0; min-width: 0; }
  .form { display: flex; flex-direction: column; gap: var(--gap-large); }
  .side { display: flex; flex-direction: column; gap: var(--gap-medium); }
  .field { display: flex; flex-direction: row; align-items: center; gap: var(--gap-medium); }
  .cap { width: 72px; flex-shrink: 0; }
  .grow { flex-grow: 1; min-width: 0; }
  .value { width: 40px; flex-shrink: 0; }
  .actions { display: flex; flex-direction: row; justify-content: flex-end; gap: var(--gap-medium); }
  .actions button { padding-left: var(--padding-large); padding-right: var(--padding-large); }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="820" data-win-h="420" data-win-center="true">
  <div class="page">
    <label id="TitleLabel" class="title">组件展示</label>
    <div class="columns">
      <card id="FormCard" class="main"><div class="form">
        <label id="FormTitle" class="h3">注册信息</label>
        <div class="field">
          <label id="NickCap" class="cap secondary">昵称 *</label>
          <input id="NickInput" class="grow" placeholder="怎么称呼你" bind="nickname" />
        </div>
        <div class="field">
          <label id="MailCap" class="cap secondary">邮箱 *</label>
          <input id="MailInput" class="grow" placeholder="name@example.com" bind="email" />
        </div>
        <div class="field">
          <label id="RoleCap" class="cap secondary">角色</label>
          <select id="RoleSelect" class="grow" bind="role">
            <option selected>开发者</option>
            <option>设计师</option>
            <option>产品经理</option>
            <option>测试工程师</option>
          </select>
        </div>
        <div class="field">
          <label id="PlanCap" class="cap secondary">套餐</label>
          <radio-group id="PlanGroup" class="grow" bind="plan" data-options="免费版|专业版|企业版"></radio-group>
        </div>
        <div class="field">
          <label id="VolumeCap" class="cap secondary">音量</label>
          <input id="VolumeSlider" type="range" class="grow" min="0" max="100" bind="volume" />
          <label id="VolumeValue" class="value" :text="volume"></label>
        </div>
        <div class="field">
          <label id="QtyCap" class="cap secondary">席位数</label>
          <input id="QtyInput" type="number" min="1" max="99" bind="seats" />
        </div>
        <div class="field">
          <label id="NotifyCap" class="cap secondary">通知</label>
          <switch id="NotifySwitch" bind="notify"></switch>
          <checkbox id="SubscribeCheck" label="订阅更新邮件" bind="subscribe"></checkbox>
        </div>
        <div class="actions">
          <button id="ResetButton" @click="OnReset">重置</button>
          <button id="SubmitButton" class="primary" @click="OnSubmit">提交</button>
        </div>
      </div></card>
      <card id="ResultCard" class="aside"><div class="side">
        <label id="ResultTitle" class="h3">提交结果</label>
        <label id="StatusLabel" bind="status" :class="statusClass"></label>
        <label id="SummaryLabel" wrap="true" bind="summary"></label>
      </div></card>
    </div>
  </div>
</body>
</html>
