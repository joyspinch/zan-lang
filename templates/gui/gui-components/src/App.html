<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="480" data-win-h="520">

  <input id="NameInput" data-label="姓名" @focus="OnNameFocus" @blur="OnNameBlur" />

</body>
</html>
