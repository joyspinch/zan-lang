<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 多文档外壳：工具条 / 文档标签区 / 状态栏，纵向 flex，标签区吃满剩余空间。 */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .fixed { flex-shrink: 0; }
  .documents { flex-grow: 1; min-height: 0; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-win-zoom="0">
  <toolbar id="MainToolStrip" class="fixed" data-label="工具条" data-x-options="[&quot;新建文档:file-plus&quot;,&quot;关闭当前:x&quot;,&quot;关闭其他&quot;]" @item-click="OnToolClick"></toolbar>
  <!-- 文档页签在运行期由 code-behind 按数据增删：每个页签一页，页里放一个文本框。 -->
  <tabs id="DocumentTabs" class="documents" data-label="文档"></tabs>
  <status-bar id="MainStatusBar" class="fixed" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;0 字&quot;]"></status-bar>
</body>
</html>
