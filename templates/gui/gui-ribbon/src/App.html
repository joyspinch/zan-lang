<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0">
  <tabs id="RibbonTabs" data-label="开始" data-span="24" data-dock="1" data-fx="0" data-fy="0" data-fw="200" data-fh="120" data-x-options="[&quot;开始&quot;,&quot;插入&quot;,&quot;视图&quot;]">
    <toolbar id="HomeCommands" data-label="开始" data-span="24" data-dock="1" data-fx="0" data-fy="0" data-fw="200" data-fh="34" data-x-options="[&quot;粘贴:paste&quot;,&quot;剪切:cut&quot;,&quot;复制:copy&quot;,&quot;-&quot;,&quot;保存:save&quot;]" @item-click="OnHomeCommand"></toolbar>
  </tabs>
  <status-bar id="MainStatusBar" data-label="就绪" data-span="24" data-dock="2" data-fx="0" data-fy="0" data-fw="200" data-fh="24" data-x-options="[&quot;就绪&quot;,&quot;&gt;UTF-8&quot;,&quot;&gt;第 1 行，第 1 列&quot;]"></status-bar>
  <panel id="DocumentPanel" data-label="文档" data-span="24" data-dock="5" data-fx="0" data-fy="0" data-fw="200" data-fh="32">
    <textarea id="BodyText" data-label="正文" data-span="24" data-dock="5" data-fx="0" data-fy="0" data-fw="200" data-fh="32" data-placeholder="在此输入..."></textarea>
  </panel>
</body>
</html>
