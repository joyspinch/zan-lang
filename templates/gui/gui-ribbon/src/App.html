<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* Ribbon 外壳：功能区 / 文档区 / 状态栏，纵向 flex，文档区吃满剩余空间。 */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-secondary);
  }
  .fixed { flex-shrink: 0; }
  .document {
    flex-grow: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: var(--padding-large);
  }
  .editor { flex-grow: 1; min-height: 0; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-win-zoom="0">
  <!-- 功能区的页签与命令组由 code-behind 按当前页签构建（见 BuildGroups）。 -->
  <ribbon id="MainRibbon" class="fixed"></ribbon>
  <div class="document">
    <textarea id="BodyText" class="editor" data-placeholder="在此输入……「开始」做剪贴板与编辑，「插入」插日期时间与片段，「视图」切只读与统计字数。" @change="OnTextChange"></textarea>
  </div>
  <status-bar id="MainStatusBar" class="fixed" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;可编辑&quot;,&quot;&gt;0 字&quot;]"></status-bar>
</body>
</html>
