<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:120px minmax(0,1fr) 24px">
  <tabs id="RibbonTabs" data-label="开始" data-x-options="[&quot;开始&quot;,&quot;插入&quot;,&quot;视图&quot;]" style="min-width:0;min-height:0;height:120px;grid-column:1 / 2;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px minmax(0,1fr)">
    <toolbar id="HomeCommands" data-label="开始" data-x-options="[&quot;粘贴:paste&quot;,&quot;剪切:cut&quot;,&quot;复制:copy&quot;,&quot;-&quot;,&quot;保存:save&quot;]" @item-click="OnHomeCommand" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:1"></toolbar>
  </tabs>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;UTF-8&quot;,&quot;&gt;第 1 行，第 1 列&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:3"></status-bar>
  <panel id="DocumentPanel" data-label="文档" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)">
    <textarea id="BodyText" data-label="正文" data-placeholder="在此输入..." style="min-width:0;min-height:0;grid-column:1;grid-row:1"></textarea>
  </panel>
</body>
</html>
