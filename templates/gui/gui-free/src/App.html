<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="480" data-win-h="520" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0">
  <label id="TitleLabel" data-label="欢迎" style="position:absolute;left:16px;top:16px;width:448px;height:30px"></label>
  <input id="NameInput" data-label="姓名" data-required="true" style="position:absolute;left:60px;top:76px;width:360px;height:32px"/>
  <input id="PasswordInput" data-label="密码" data-required="true" style="position:absolute;left:60px;top:122px;width:360px;height:32px"/>
  <input id="RememberCheck"  type="checkbox" data-label="记住我" @change="OnRememberChange" style="position:absolute;left:60px;top:168px;width:200px;height:26px"/>
  <button id="SignInButton" data-label="登录" @click="OnSignIn" style="position:absolute;left:160px;top:220px;width:160px;height:36px"></button>
  <label id="HintText" data-label="提示：在设计器中可切换流式/自由布局、缩放窗口，并把组件拖到画布任意位置。" data-wrap="true" style="position:absolute;left:16px;top:300px;width:448px;height:40px"></label>
</body>
</html>
