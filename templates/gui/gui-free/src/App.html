<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 自由布局：每个控件用 left/top/width/height 绝对定位，坐标相对父容器。
   * 在设计器里拖拽控件即改这些数；颜色、圆角、字号仍走 token。 */
  body { background: var(--bg-secondary); }
  .login-card { background: var(--surface-bg); border: 1 var(--border-secondary); border-radius: var(--radius-large);
                box-shadow: 0 var(--surface-shadow-dy) var(--surface-shadow-blur) var(--shadow-color); }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="480" data-win-h="540" data-win-center="true" data-layout-mode="1">
  <label id="BrandLabel" class="title primary" style="position:absolute;left:40px;top:28px;width:400px;height:32px">{{NAME}}</label>
  <div id="LoginCard" class="login-card" style="position:absolute;left:40px;top:80px;width:400px;height:404px">
    <label id="TitleLabel" class="h2" style="position:absolute;left:24px;top:24px;width:352px;height:28px">欢迎回来</label>
    <label id="SubtitleLabel" class="secondary" style="position:absolute;left:24px;top:56px;width:352px;height:20px">请登录你的账号（演示账号 admin / 123456）</label>
    <label id="UserCap" class="small secondary" style="position:absolute;left:24px;top:96px;width:352px;height:20px">用户名</label>
    <input id="UserInput" placeholder="输入用户名" bind="user" style="position:absolute;left:24px;top:120px;width:352px;height:32px" />
    <label id="PassCap" class="small secondary" style="position:absolute;left:24px;top:164px;width:352px;height:20px">密码</label>
    <input id="PassInput" type="password" placeholder="输入密码，回车登录" bind="password" @submit="OnSignIn" style="position:absolute;left:24px;top:188px;width:352px;height:32px" />
    <checkbox id="RememberCheck" label="记住我" bind="remember" style="position:absolute;left:24px;top:236px;width:160px;height:24px"></checkbox>
    <button id="ForgotButton" class="ghost small" @click="OnForgot" style="position:absolute;left:256px;top:234px;width:120px;height:28px">忘记密码？</button>
    <button id="SignInButton" class="primary" :disabled="locked" @click="OnSignIn" style="position:absolute;left:24px;top:280px;width:352px;height:40px">登 录</button>
    <!-- :class 会整串替换 class，所以定位放在外层 div，标签本身只管颜色。 -->
    <div id="MessageBox" style="position:absolute;left:24px;top:336px;width:352px;height:48px">
      <label id="MessageLabel" wrap="true" bind="message" :class="messageClass"></label>
    </div>
  </div>
</body>
</html>
