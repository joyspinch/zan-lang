<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 圆形表盘：窗口 466×466，data-win-round 把窗口裁成圆。
   * 控件只放在内接正方形（约 70..396）里，四角会被圆裁掉。 */
  body { background: var(--window-bg); }
  .center { text-align: center; }
  .date { text-align: center; color: var(--text-secondary); }
  /* var(--x, 回退值)：令牌缺失时用回退值，换肤少给令牌也不会丢整条声明。 */
  .time { text-align: center; font-size: var(--font-size-mega, 56px); }
  .metric { font-size: var(--font-size-small); color: var(--text-secondary); }
  .bar { display: flex; flex-direction: column; }
  .value { font-size: var(--font-size-small); text-align: right; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="466" data-win-h="466" data-win-center="true" data-layout-mode="1" data-win-round="true">
  <label id="DateLabel" class="date" bind="dateText" style="position:absolute;left:113px;top:84px;width:240px;height:20px"></label>
  <label id="TimeLabel" class="time" bind="timeText" style="position:absolute;left:83px;top:108px;width:300px;height:72px"></label>
  <label id="StepsCap" class="metric" style="position:absolute;left:113px;top:196px;width:100px;height:20px">步数</label>
  <label id="StepsLabel" class="value" bind="stepsText" style="position:absolute;left:213px;top:196px;width:140px;height:20px"></label>
  <div class="bar" style="position:absolute;left:113px;top:220px;width:240px;height:16px"><progress id="StepsBar" bind="stepsPercent"></progress></div>
  <label id="HeartCap" class="metric" style="position:absolute;left:113px;top:244px;width:100px;height:20px">心率</label>
  <label id="HeartLabel" class="value" bind="heartText" style="position:absolute;left:213px;top:244px;width:140px;height:20px"></label>
  <div class="bar" style="position:absolute;left:113px;top:268px;width:240px;height:16px"><progress id="HeartBar" bind="heartPercent"></progress></div>
  <button id="WorkoutButton" class="primary" bind:text="buttonText" @click="OnToggleWorkout" style="position:absolute;left:153px;top:304px;width:160px;height:40px"></button>
  <label id="StatusLabel" class="metric center" bind="statusText" style="position:absolute;left:113px;top:356px;width:240px;height:20px"></label>
</body>
</html>
