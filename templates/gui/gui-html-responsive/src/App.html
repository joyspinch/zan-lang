<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 响应式靠两件事，全程没有一个绝对坐标：
   *   1. 弹性尺寸：内容区 flex-grow 吃掉侧栏以外的全部宽度；
   *   2. 折行：指标卡 flex-wrap + flex-basis，窗口够宽一行四张，变窄自动折成两行。
   * 拖动窗口边框（或点顶栏「收起侧栏」腾出宽度）就能看到重排。 */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background: var(--window-bg);
  }
  .header {
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--gap-medium);
    padding: var(--padding-small) var(--padding-large);
    background: var(--surface-bg);
    border-bottom: 1px solid var(--border-secondary);
  }
  .brand { font-size: var(--font-size-large); font-weight: bold; }
  .spacer { flex-grow: 1; }
  .search { width: 220px; }
  .main { flex-grow: 1; min-height: 0; display: flex; flex-direction: row; }
  .sidebar {
    flex-shrink: 0;
    width: 180px;
    display: flex;
    flex-direction: column;
    gap: var(--gap-small);
    padding: var(--padding-medium);
    background: var(--surface-bg);
    border-right: 1px solid var(--border-secondary);
  }
  .sidebar.collapsed { width: 64px; }
  /* 导航是主要点击目标：至少 32px 高（不低于 24px 的可点目标下限，zan-check ui 步机检） */
  .nav { justify-content: flex-start; min-height: 32px; }
  .content {
    flex-grow: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap-large);
    padding: var(--padding-large);
  }
  .page { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--gap-large); }
  .page-title { font-size: var(--font-size-huge); font-weight: bold; }
  .kpis { display: flex; flex-direction: row; flex-wrap: wrap; gap: var(--gap-large); }
  .card {
    display: flex;
    flex-direction: column;
    gap: var(--gap-small);
    padding: var(--padding-large);
  }
  .kpi { flex-grow: 1; flex-basis: 200px; min-width: 0; }
  .kpi-value { font-size: var(--font-size-display); font-weight: bold; }
  .grow { flex-grow: 1; min-height: 0; }
  .section-title { font-size: var(--font-size-large); font-weight: bold; }
  .slot { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1100" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true">
  <div class="header">
    <button id="ToggleSidebar" class="small ghost" icon="menu" @click="OnToggleSidebar">收起侧栏</button>
    <label class="brand">{{NAME}} 监控台</label>
    <div class="spacer"></div>
    <input id="SearchInput" class="search small" placeholder="按服务名筛选…" @change="OnSearch" />
    <button id="RefreshButton" class="small primary" @click="OnRefresh">刷新数据</button>
  </div>

  <div class="main">
    <panel id="Sidebar" class="sidebar">
      <button id="NavOverview" class="nav primary" icon="home" @click="OnNavOverview">概览</button>
      <button id="NavServices" class="nav ghost" icon="server" @click="OnNavServices">服务</button>
      <button id="NavAbout" class="nav ghost" icon="info" @click="OnNavAbout">关于</button>
    </panel>

    <div class="content">
      <!-- 页面 = 三个 panel，导航只切 Visible；panel 有 id，code-behind 用 ui.Ctl 取得到。 -->
      <panel id="PageOverview" class="page">
        <label class="page-title">概览</label>
        <div class="kpis">
          <panel class="card kpi"><label class="secondary small">在线服务</label><label id="KpiUp" class="kpi-value">0</label></panel>
          <panel class="card kpi"><label class="secondary small">异常服务</label><label id="KpiDown" class="kpi-value">0</label></panel>
          <panel class="card kpi"><label class="secondary small">平均延迟</label><label id="KpiLatency" class="kpi-value">0 ms</label></panel>
          <panel class="card kpi"><label class="secondary small">实例总数</label><label id="KpiInstances" class="kpi-value">0</label></panel>
        </div>
        <panel class="card grow">
          <label class="section-title">最近事件</label>
          <label id="Event1" class="secondary"></label>
          <label id="Event2" class="secondary"></label>
          <label id="Event3" class="secondary"></label>
        </panel>
      </panel>

      <panel id="PageServices" class="page" visible="false">
        <label class="page-title">服务</label>
        <panel class="card grow">
          <label id="ServiceCount" class="secondary small"></label>
          <!-- 占位槽：设计稿只留一个空容器，表格由 code-behind 构建后挂进来。 -->
          <panel id="TableSlot" class="slot"></panel>
        </panel>
      </panel>

      <panel id="PageAbout" class="page" visible="false">
        <label class="page-title">关于</label>
        <panel class="card">
          <label data-wrap="true">本模板演示"声明式骨架 + 代码挂载"：布局、样式全部写在 {{NAME}}.html，表格这类数据驱动的复杂组件在 code-behind 里构建并挂进占位槽。</label>
          <label data-wrap="true" class="secondary">要接真实数据，把 ServiceStore.Refresh() 换成接口调用；耗时请求放后台线程，完成后用 app.Post 回到界面线程再刷新。</label>
        </panel>
      </panel>
    </div>
  </div>
</body>
</html>
