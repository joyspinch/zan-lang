<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>响应式管理后台</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
    }
    .header {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 16px;
      background: var(--surface-bg);
      border-bottom: 1px solid var(--border-secondary);
      flex-shrink: 0;
    }
    .main-body {
      display: flex;
      flex-direction: row;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 200px;
      padding: 12px;
      gap: 8px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-secondary);
      flex-shrink: 0;
    }
    .content-area {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 16px;
      gap: 16px;
      background: var(--bg-primary);
    }
    .card-grid {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 100%;
    }
    .card {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 12px;
      gap: 8px;
      background: var(--surface-bg);
      border: 1px solid var(--border-secondary);
      border-radius: 8px;
    }
    .toolbar {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body id="AppBody">
  <!-- 顶栏 -->
  <div class="header">
    <div style="font-size: 16px; font-weight: bold;">Zan 响应式系统控制台</div>
    <div class="toolbar">
      <input id="SearchInput" placeholder="全局搜索..." style="width: 180px;" />
      <button class="primary" @click="OnAction">执行操作</button>
    </div>
  </div>

  <!-- 主体双栏 -->
  <div class="main-body">
    <!-- 侧栏导航 -->
    <div class="sidebar">
      <button id="NavDashboard" class="primary" @click="OnNavDashboard">仪表盘</button>
      <button id="NavUsers" @click="OnNavUsers">用户管理</button>
      <button id="NavSettings" @click="OnNavSettings">系统配置</button>
      <div style="flex: 1;"></div>
      <button id="NavExit" @click="OnNavExit">退出登录</button>
    </div>

    <!-- 内容展示区 -->
    <div class="content-area">
      <!-- 统计指标卡片行 -->
      <div class="card-grid">
        <div class="card">
          <div style="color: var(--text-secondary); font-size: 13px;">实时在线</div>
          <div style="font-size: 24px; font-weight: bold; color: var(--primary);">1,428</div>
        </div>
        <div class="card">
          <div style="color: var(--text-secondary); font-size: 13px;">今日请求量</div>
          <div style="font-size: 24px; font-weight: bold; color: var(--success);">89.6k</div>
        </div>
        <div class="card">
          <div style="color: var(--text-secondary); font-size: 13px;">系统健康度</div>
          <div style="font-size: 24px; font-weight: bold; color: var(--info);">99.98%</div>
        </div>
      </div>

      <!-- 复杂组件与图表占位容器 -->
      <div class="card" style="flex: 1;">
        <div style="font-weight: bold; margin-bottom: 8px;">系统实时指标与数据列表</div>
        <div id="TablePlaceholder" style="flex: 1; min-height: 200px;">
          <!-- 由 code-behind 填充高级表格或虚拟列表控件 -->
        </div>
      </div>
    </div>
  </div>
</body>
</html>
