<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px minmax(0,1fr) 24px">
  <toolbar id="MainToolStrip" data-label="工具条" data-x-options="[&quot;新建:plus&quot;,&quot;打开:folder&quot;,&quot;保存:save&quot;,&quot;-&quot;,&quot;剪切:cut&quot;,&quot;复制:copy&quot;,&quot;粘贴:paste&quot;,&quot;-&quot;,&quot;&gt;帮助:info&quot;]" @item-click="OnToolClick" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:1"></toolbar>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;UTF-8&quot;,&quot;&gt;第 1 行，第 1 列&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:3"></status-bar>
  <panel id="ContentPanel" data-label="文档" style="min-width:0;min-height:0;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:30px minmax(0,1fr)">
    <label id="HeadingLabel" data-label="未命名文档" style="min-width:0;min-height:0;height:30px;grid-column:1 / 2;grid-row:1"></label>
    <textarea id="BodyText" data-label="正文" data-placeholder="在此输入..." style="min-width:0;min-height:0;grid-column:1;grid-row:2"></textarea>
  </panel>
</body>
</html>
