<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 经典桌面外壳：工具条 / 文档区 / 状态栏，纵向 flex，文档区吃满剩余空间。 */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-secondary);
  }
  .fixed { flex-shrink: 0; }
  .document {
    flex-grow: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap-medium);
    padding: var(--padding-large);
  }
  .heading { font-size: var(--font-size-large); font-weight: bold; flex-shrink: 0; }
  .editor { flex-grow: 1; min-height: 0; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-win-zoom="0">
  <toolbar id="MainToolStrip" class="fixed" data-label="工具条" data-x-options="[&quot;新建:file-plus&quot;,&quot;打开:folder-open&quot;,&quot;保存:save&quot;,&quot;-&quot;,&quot;剪切:cut&quot;,&quot;复制:copy&quot;,&quot;粘贴:paste&quot;,&quot;-&quot;,&quot;插入时间:clock&quot;,&quot;全选:select-all&quot;]" @item-click="OnToolClick"></toolbar>
  <div class="document">
    <label id="HeadingLabel" class="heading" data-label="未命名.txt"></label>
    <textarea id="BodyText" class="editor" data-placeholder="在此输入……工具条可新建、打开、保存，也可剪切 / 复制 / 粘贴选中的文字。" @change="OnTextChange"></textarea>
  </div>
  <status-bar id="MainStatusBar" class="fixed" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;UTF-8&quot;,&quot;&gt;0 行 · 0 字&quot;]"></status-bar>
</body>
</html>
