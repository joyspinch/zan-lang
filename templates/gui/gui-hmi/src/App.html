<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 上位机画面：工具条 / 报警横幅 / 主画面 / 报警列表 / 状态栏，纵向 flex。 */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-secondary);
  }
  .fixed { flex-shrink: 0; }
  .main {
    flex-grow: 1;
    min-height: 0;
    display: flex;
    flex-direction: row;
    gap: var(--gap-large);
    padding: var(--padding-large);
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: var(--gap-medium);
    padding: var(--padding-medium);
    background: var(--bg-primary);
    border: 1px solid var(--border-secondary);
    border-radius: var(--radius-medium);
  }
  .trend-panel { flex-grow: 1; min-width: 0; }
  .trend { flex-grow: 1; min-height: 0; }
  .side { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: var(--gap-large); }
  .row { display: flex; flex-direction: row; align-items: center; gap: var(--gap-large); }
  .gauge { width: 180px; height: 190px; flex-shrink: 0; }
  .readouts { flex-grow: 1; display: flex; flex-direction: column; gap: var(--gap-medium); }
  .level { flex-grow: 1; }
  .title { font-size: var(--font-size-large); font-weight: bold; }
  .alarms-panel { height: 180px; flex-shrink: 0; margin: 0 var(--padding-large) var(--padding-large) var(--padding-large); }
  .alarms { flex-grow: 1; min-height: 0; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1100" data-win-h="760" data-win-title="{{NAME}}" data-win-center="true" data-win-zoom="0">
  <toolbar id="MainToolStrip" class="fixed" data-label="工具条" data-x-options="[&quot;启动:play&quot;,&quot;停止:stop&quot;,&quot;-&quot;,&quot;确认报警:check&quot;,&quot;清除已复归:trash&quot;]" @item-click="OnToolClick"></toolbar>
  <zan-alarm-banner id="AlarmBanner" class="fixed"></zan-alarm-banner>

  <div class="main">
    <div class="panel trend-panel">
      <label class="title" data-label="反应釜温度 TIC101（PV / SP）"></label>
      <zan-trend id="PvTrend" class="trend"></zan-trend>
    </div>
    <div class="side">
      <div class="panel">
        <label class="title" data-label="反应釜"></label>
        <div class="row">
          <zan-gauge id="TempGauge" class="gauge" label="TIC101.PV"></zan-gauge>
          <div class="readouts">
            <zan-digital id="SpDigital" label="设定值 SP"></zan-digital>
            <zan-led id="RunLed" label="加热运行"></zan-led>
          </div>
        </div>
      </div>
      <div class="panel level">
        <label class="title" data-label="进料储罐"></label>
        <div class="row">
          <zan-bargraph id="LevelBar" label="LIC102.PV"></zan-bargraph>
          <div class="readouts">
            <zan-digital id="FlowDigital" label="进料 FIC103"></zan-digital>
            <zan-led id="PumpLed" label="出料泵"></zan-led>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel alarms-panel">
    <label class="title" data-label="报警记录（最新在上，点工具条「确认报警」应答）"></label>
    <zan-alarm-list id="AlarmList" class="alarms"></zan-alarm-list>
  </div>

  <status-bar id="MainStatusBar" class="fixed" data-label="就绪" data-x-options="[&quot;运行中&quot;,&quot;&gt;未确认报警 0&quot;,&quot;&gt;扫描周期 500 ms&quot;]"></status-bar>
</body>
</html>
