<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px 32px minmax(0,1fr) 24px">
  <toolbar id="MainToolStrip" data-label="工具条" data-x-options="[&quot;启动:play&quot;,&quot;停止:stop&quot;,&quot;-&quot;,&quot;确认:check&quot;,&quot;&gt;趋势:sort&quot;]" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:1"></toolbar>
  <zan-alarm-banner id="Alarms" data-label="报警" style="min-width:0;min-height:0;height:32px;grid-column:1 / 2;grid-row:2"></zan-alarm-banner>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;运行中&quot;,&quot;&gt;操作员&quot;,&quot;&gt;通讯正常&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:4"></status-bar>
  <split-panel id="MainSplit" data-label="分栏" data-x-options="[&quot;vertical&quot;,&quot;620&quot;]" style="min-width:0;min-height:0;grid-column:1;grid-row:3;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:170px 180px 26px minmax(0,1fr)">
    <zan-trend id="PvTrend" data-label="反应釜" style="min-width:0;min-height:0;grid-column:1;grid-row:4"></zan-trend>
    <zan-gauge id="PvGauge" data-label="TIC101.PV" data-child-tab="1" style="min-width:0;min-height:0;height:170px;grid-column:1 / 2;grid-row:1"></zan-gauge>
    <zan-bargraph id="LevelBar" data-label="LIC102.PV" data-child-tab="1" style="min-width:0;min-height:0;height:180px;grid-column:1 / 2;grid-row:2"></zan-bargraph>
    <zan-led id="RunLed" data-label="运行" data-child-tab="1" style="min-width:0;min-height:0;height:26px;grid-column:1 / 2;grid-row:3"></zan-led>
  </split-panel>
</body>
</html>
