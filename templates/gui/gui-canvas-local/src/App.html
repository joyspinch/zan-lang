<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 两种排版共存：外层（工具栏 + 画布区）是标准 flex 流式布局；
   * 画布区内部的牌是 position:absolute，坐标由 code-behind 的排版算法算出。 */
  body { display: flex; flex-direction: column; background: var(--window-bg); }
  .toolbar { flex-shrink: 0; display: flex; flex-direction: row; align-items: center; gap: var(--gap-medium);
             padding: var(--padding-small) var(--padding-medium); background: var(--bg-secondary); border-bottom: 1 var(--divider); }
  .spacer { flex-grow: 1; }
  .canvas { position: relative; flex-grow: 1; min-height: 0; overflow: hidden; background: var(--bg-tertiary); }
  .playing { position: absolute; width: 96px; height: 136px; padding: var(--padding-small);
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--gap-small); }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="800" data-win-h="600" data-win-center="true">
  <div class="toolbar">
    <button id="DealButton" class="small primary" @click="OnDeal">发牌</button>
    <button id="FanButton" class="small" :class="fanClass" data-arg="fan" @click="OnLayout">扇形</button>
    <button id="RowButton" class="small" :class="rowClass" data-arg="row" @click="OnLayout">横排</button>
    <button id="StackButton" class="small" :class="stackClass" data-arg="stack" @click="OnLayout">堆叠</button>
    <div class="spacer"></div>
    <label id="StatusLabel" class="small secondary" bind="status"></label>
  </div>
  <div id="Canvas" class="canvas">
    <card id="Card0" class="playing" data-arg="0" @click="OnPick"><label id="Rank0" class="h1"></label><label id="Suit0" class="h2"></label></card>
    <card id="Card1" class="playing" data-arg="1" @click="OnPick"><label id="Rank1" class="h1"></label><label id="Suit1" class="h2"></label></card>
    <card id="Card2" class="playing" data-arg="2" @click="OnPick"><label id="Rank2" class="h1"></label><label id="Suit2" class="h2"></label></card>
    <card id="Card3" class="playing" data-arg="3" @click="OnPick"><label id="Rank3" class="h1"></label><label id="Suit3" class="h2"></label></card>
    <card id="Card4" class="playing" data-arg="4" @click="OnPick"><label id="Rank4" class="h1"></label><label id="Suit4" class="h2"></label></card>
  </div>
</body>
</html>
