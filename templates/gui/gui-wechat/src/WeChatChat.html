<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>聊天</title>
<style>
/* 聊天页骨架样式（原在 WeChatSkin.zan 的 appCss 里，随 HTML+CSS
 * 改造迁进文档本体；页面独占的 .wxcol/.wxpad/.wxquote/.wxquotetext
 * 整体搬了进来）。颜色一律走皮肤 token。
 * 与独立聊天窗口（WxChatWindow，code-behind 控件）共用的类
 * （.wxhead/.wxcomposer/.wxtypewrap/textarea.wxtype/.wxbottom/
 * .wxchat）仍归皮肤——mounted 控件不携带文档作用域类，皮肤规则
 * 全局生效；这里只补文档元素自己的 flex 声明（原先是 Wx.Row/
 * Panel.Column 在代码里给的横排/纵排与交叉轴对齐）。布局走 web
 * 语义：根是左右两列的 flex 行（#ChatBody），右栏是「头 / 线 /
 * 聊天 / 弹出面板 / 线 / 输入区」的 flex 列。根选择器用 id：
 * scoping 由 GenHtml 编译期自动完成（元素与规则同混 zs-<基名>
 * 作用域类），id 留给 Find 与可读性。 */
#ChatBody { margin: 0; display: flex; flex-direction: row; }
.wxcol { width: 300px; background: var(--bg-secondary); flex-shrink: 0;
  display: flex; flex-direction: column; }
.wxpad { height: 46px; padding: 10px 10px 6px 10px;
  display: flex; flex-direction: column; }
#SessionHost { flex-grow: 1; display: flex; flex-direction: column; }
#ChatMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
.wxhead { display: flex; align-items: center; }
.wxline { height: 1px; background: var(--divider); flex-shrink: 0; }
#ChatHost { flex-grow: 1; display: flex; flex-direction: column; }
.wxquote { height: 34px; padding: 0 12px; gap: 8px;
  background: var(--bg-secondary); border-top: 1 var(--divider);
  display: flex; align-items: center; }
/* 引用文字吃满行宽：静态文本元素没有内在宽度申报，不 grow 会被
 * 量成几十 px 而折行（收藏页页脚同款教训）。 */
.wxquotetext { font-size: 12; color: var(--text-secondary); flex-grow: 1; }
.wxcomposer { display: flex; flex-direction: column; }
.wxtypewrap { flex-grow: 1; display: flex; flex-direction: column; }
.wxbottom { display: flex; align-items: center; }
</style>
</head>
<body id="ChatBody">
  <!-- 左栏：搜索框（<input> → Input，placeholder 同名属性直进）+
       会话列表宿主。列表本体（ListView）由 code-behind 挂进
       #SessionHost——列表是动态控件，HTML 只给壳。 -->
  <div id="ChatSide" class="wxcol">
    <div class="wxpad"><input id="SearchBox" placeholder="搜索"></div>
    <div id="SessionHost"></div>
  </div>

  <!-- 右栏：标题行的文字由 code-behind SetProp 回填（切会话换
       标题），四个图标按钮是动态控件（图标/悬停提示 runtime 通道
       没有 data-x-props，code-behind 补）。#ChatHost 挂 ChatView，
       #PopupHost 挂表情/头像/文件弹出面板（平时收起，壳零高）。 -->
  <div id="ChatMain">
    <div class="wxhead">
      <div id="HeadTitle" class="grow">
        <div id="HeadName" class="wxheadname"></div>
        <div id="HeadDesc" class="wxheaddesc"></div>
      </div>
      <button id="HeadCall" class="text small"></button>
      <button id="HeadVideo" class="text small"></button>
      <button id="HeadHist" class="text small"></button>
      <button id="HeadDots" class="text small"></button>
    </div>
    <div class="wxline"></div>
    <div id="ChatHost"></div>
    <div id="PopupHost"></div>
    <div class="wxline"></div>

    <!-- 输入区：引用条平时收起（code-behind 置 visible=false），
         随引用草稿显隐；发送条右端的发送钮是文档按钮，点击行为
         code-behind 接。grow 类把输入框/工具条撑满剩余空间
         （textarea 的外观规则 textarea.wxtype 仍在皮肤）。 -->
    <div class="wxcomposer">
      <div id="QuoteBar" class="wxquote">
        <div id="QuoteText" class="wxquotetext"></div>
        <button id="QuoteClose" class="text small"></button>
      </div>
      <div class="wxtypewrap"><textarea id="TypeBox" class="wxtype grow"></textarea></div>
      <div class="wxbottom">
        <div id="ToolsHost" class="grow"></div>
        <button id="SendBtn" class="primary small">发送</button>
      </div>
    </div>
  </div>
</body>
</html>
