<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>管理后台</title>
<style>
/* 管理后台页：工具条（标题 / 后退 / 刷新 / 地址）+ 网页视图宿主。
 *
 * 后台本身是服务端渲染的网页（/admin：工作台、系统管理、文档中心、
 * 备份恢复…），客户端不重做一套，只提供「一个能装下网页的地方」。
 * 网页视图本体是原生控件（WebViewBox），由 code-behind 挂进
 * #WebHost——它不带文档作用域类，外观规则走皮肤层。
 *
 * 版式：整页一根 flex 列——工具条固定 44px 高，网页视图吃掉余下
 * 全部空间（flex-grow）。工具条与网页视图不能都撑满（两个填充项
 * 会整块重叠，网页把工具条盖住）。
 */
#AdminBody { margin: 0; display: flex; flex-direction: column; }
#AdminBar { height: 44px; padding: 0 12px; gap: 8px; display: flex;
  align-items: center; background: var(--bg-secondary);
  border-bottom: 1px solid var(--divider); }
#AdminTitle { font-size: 14px; }
#AdminAddr { font-size: 12px; color: var(--text-secondary); }
#WebHost { flex-grow: 1; display: flex; flex-direction: column; }
#AdminTip { padding: 16px 20px; }
</style>
</head>
<body id="AdminBody">
  <div id="AdminBar">
    <div id="AdminTitle">管理后台</div>
    <button id="AdminBack" class="text small" icon="chevron-left" tip="后退"
            @click="admin-back"></button>
    <button id="AdminReload" class="text small" icon="refresh" tip="刷新"
            @click="admin-reload"></button>
    <div id="AdminAddr"></div>
  </div>
  <!-- 网页视图宿主：code-behind 把 WebViewBox 挂进来。 -->
  <div id="WebHost"></div>
  <!-- 原生网页运行时不可用时的提示（平时收起）。 -->
  <div id="AdminTip" class="hint small" visible="false">本机没有可用的网页视图运行时（WebView2），管理后台无法内嵌显示。</div>
</body>
</html>
