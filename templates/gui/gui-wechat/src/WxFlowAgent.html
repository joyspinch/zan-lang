<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AI 分配</title>
<style>
/* AI 分配页：左栏流程清单 + 中栏节点链 + 右栏工具分配面板。
 *
 * 版式：三段一行。左边是流程清单（标准库 ListView，代码建），中间是
 * 该流程的节点链，右边是选中节点的 AI 工具面板（绑定/调序/启停/
 * 解绑 + 试跑）。面板里的控件都是代码建的原生控件，不带文档作用域
 * 类——它们的规则在皮肤层；文档只管宿主的版式。
 */
#FlowBody { margin: 0; display: flex; flex-direction: row; }
#FlowSide { width: 220px; display: flex; flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--divider); }
#FlowSideHead { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider); }
#FlowSideTitle { font-size: 14px; }
#FlowListHost { flex-grow: 1; display: flex; flex-direction: column; }
#FlowMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
#FlowMid { flex-grow: 1; display: flex; flex-direction: row; }
#FlowNodes { flex-grow: 1; display: flex; flex-direction: column;
  border-right: 1px solid var(--divider); }
#FlowBar { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--divider); }
#FlowTitle { font-size: 14px; white-space: nowrap; }
#FlowSummary { font-size: 12px; color: var(--text-secondary);
  white-space: nowrap; }
#FlowNodeHost { flex-grow: 1; display: flex; flex-direction: column; }
#FlowTools { width: 380px; display: flex; flex-direction: column;
  background: var(--bg-primary); }
#FlowToolHead { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider); }
#FlowToolTitle { font-size: 14px; }
#FlowToolBody { flex-grow: 1; display: flex; flex-direction: column;
  padding: 6px 12px; gap: 2px; overflow-y: auto; }
#FlowFoot { height: 28px; padding: 0 12px; font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--divider); }
</style>
</head>
<body id="FlowBody">
  <div id="FlowSide">
    <div id="FlowSideHead">
      <div id="FlowSideTitle">流程</div>
      <button id="FlowReload" class="text small shrink-0" icon="refresh"
              tip="刷新" @click="flowagent-reload"></button>
    </div>
    <!-- 流程清单宿主：列表本体（ListView）由 code-behind 挂进来。 -->
    <div id="FlowListHost"></div>
  </div>
  <div id="FlowMain">
    <div id="FlowMid">
      <div id="FlowNodes">
        <div id="FlowBar">
          <div id="FlowTitle">未选择流程</div>
          <div id="FlowSummary"></div>
        </div>
        <!-- 节点链宿主：列表本体（ListView）由 code-behind 挂进来。 -->
        <div id="FlowNodeHost"></div>
      </div>
      <div id="FlowTools">
        <div id="FlowToolHead">
          <div id="FlowToolTitle">工具分配</div>
        </div>
        <!-- 工具面板宿主：面板本体（Panel）由 code-behind 挂进来。 -->
        <div id="FlowToolBody"></div>
      </div>
    </div>
    <div id="FlowFoot">就绪</div>
  </div>
</body>
</html>
