<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>朋友圈</title>
<style>
/* 朋友圈页骨架样式（原在 WeChatSkin.zan 的 appCss 里，随 HTML+CSS
 * 改造迁进文档本体；帖子行 .wxpost* 规则仍归皮肤——行是 code-behind
 * 建的；.wxpme 归皮肤：资料卡名片也用它）。颜色一律走皮肤 token。
 * 布局走 web 语义：根是 flex 行——左「发现」栏 + 右主列；主列是
 * flex 列——封面在上，下面「信息流 + 名片槽」的 flex 行。根选择器
 * 用 id 不用标签 body：四份文档的 CSS 合装在同一张 app 表里，裸
 * body 会同时命中别的文档根。 */
#MomBody { margin: 0; display: flex; flex-direction: row; }
/* 侧栏与封面是固定尺寸件，不参与溢出收缩：信息流的 ListView 测量
 * 期报全内容高（几十帖上千 px），flex 列溢出收缩若带上封面，240px
 * 的封面带会被按比例压扁——列表自己可滚，让它们吃下全部溢出。 */
.wxdisc { width: 230px; background: var(--bg-primary);
  border-right: 1 var(--divider); padding: 18px 10px; gap: 4px;
  flex-shrink: 0; display: flex; flex-direction: column; }
.wxdistitle { font-size: 17; margin: 0 6px 8px; }
.wxdentry { height: 46px; gap: 12px; padding: 0 12px; border-radius: 8px;
  display: flex; flex-direction: row; align-items: center; }
.wxdentry:hover { background: var(--bg-hover); }
.wxdentrytext { font-size: 14; }
.wxdentrytext.wxon { color: var(--primary); }
#MomMain { flex-grow: 1; display: flex; flex-direction: column; }
.wxcover { height: 240px; flex-shrink: 0;
  background: linear-gradient(160deg, #3b6f8f, #7fae8e 55%, #c8d9a4);
  display: flex; flex-direction: row; }
.wxcovercorner { align-items: end; justify-content: end;
  padding: 0 18px 12px 0; gap: 2px; flex-grow: 1;
  display: flex; flex-direction: column; }
.wxcovername { font-size: 15; color: #ffffff; }
/* 自己的头像：白描边圆角方形（Avatar 控件挂 wxpme 类）。 */
.wxcovercorner .wxpme { border: 3px #ffffff; border-radius: 8px; }
#MomContent { flex-grow: 1; display: flex; flex-direction: row; }
#MomFeedHost { flex-grow: 1; display: flex; flex-direction: column; }
#MomProfSlot { display: flex; flex-direction: row;
  align-items: center; justify-content: end; }
</style>
</head>
<body id="MomBody">
  <!-- 左栏：发现。行模板（图标 + 文字）由 code-behind 建——IconView
       图标是动态控件，HTML 只给容器与标题。 -->
  <div id="MomDisc" class="wxdisc">
    <div class="wxdistitle">发现</div>
  </div>

  <!-- 右主列：封面（右下角压着自己的名字与头像，头像 code-behind 挂
       进 #MomCorner）+ 帖子流（挂进 #MomFeedHost）+ 名片槽（点头像
       弹出的 WxProfilePanel，code-behind 挂进 #MomProfSlot；不显示时
       槽随内容收缩，信息流占满整行）。 -->
  <div id="MomMain">
    <div class="wxcover">
      <div id="MomCoverCorner" class="wxcovercorner">
        <div class="wxcovername">季然</div>
      </div>
    </div>
    <div id="MomContent">
      <div id="MomFeedHost"></div>
      <div id="MomProfSlot"></div>
    </div>
  </div>
</body>
</html>
