<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
/* 主窗口骨架的样式（原在 WeChatSkin.zan 的 appCss 里，随 HTML+CSS
 * 改造迁进文档本体）。颜色一律走皮肤 token。
 * 布局全部走 flex：body 是「导航栏 + 页面区」的 flex 行；导航栏是
 * flex 列（设置钮前的 .grow 占位把它沉底）；四个页面宿主是叠放在
 * 同一块矩形里的层（Pick() 切 visible），flex-grow 吃满导航栏以外
 * 的全部空间。注意页面控件（.wxmain）自己也要 flex-grow——宿主是
 * flex 列，页面没有声明高度，不吃满主轴就是零高整页空白。
 * 根选择器用 id（#MainBody）：文档 CSS 的 scoping 由 GenHtml 编译
 * 期自动完成（元素与规则同混 zs-<基名> 作用域类），id 留给
 * Find 与可读性。 */
#MainBody { margin: 0; display: flex; flex-direction: row; }
#RailHost { width: 56px; background: var(--bg-tertiary);
  display: flex; flex-direction: column; }
button.rail-btn { height: 56px; border-width: 0; border-radius: 10px;
  background: transparent; color: var(--text-secondary); font-size: 20px; }
button.rail-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
button.rail-btn.wxon { background: var(--bg-active); color: var(--primary); }
/* 未读徽标：absolute 脱离 flex 流，钉在导航栏右上角（相对父级
 * padding-box 落位，right 对齐随计数位数变化自然贴边）。 */
.wxrailbadge { position: absolute; top: 4px; right: 4px; }
/* 四页宿主：flex 列——页面以 .wxmain 的 flex-grow 吃满宿主，
 * 宿主再以 flex-grow 吃满 body 行里导航栏以外的剩余宽度。 */
#ChatHost, #ContactsHost, #FavsHost, #MomHost {
  flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
</style>
</head>
<body id="MainBody">
  <!-- 图标导航栏：聊天/通讯录/收藏/朋友圈 + 底部设置。dock（左栏/
       按钮纵排/设置沉底）、图标与悬停提示是行为配置——runtime
       通道没有 data-dock/data-x-props，code-behind 里补上。 -->
  <div id="RailHost">
    <button id="RailChat" class="rail-btn" data-on-click="nav-chat"></button>
    <button id="RailContacts" class="rail-btn" data-on-click="nav-contacts"></button>
    <button id="RailFavs" class="rail-btn" data-on-click="nav-favs"></button>
    <button id="RailMoments" class="rail-btn" data-on-click="nav-moments"></button>
    <button id="RailSettings" class="rail-btn" data-on-click="nav-settings"></button>
  </div>

  <!-- 四页宿主：同一块矩形的四个叠放层，Pick() 切 visible。 -->
  <div id="ChatHost"></div>
  <div id="ContactsHost"></div>
  <div id="FavsHost"></div>
  <div id="MomHost"></div>
</body>
</html>
