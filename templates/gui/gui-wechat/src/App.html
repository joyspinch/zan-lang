<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
/* 主窗口骨架的样式（原在 WeChatSkin.zan 的 appCss 里，随 HTML+CSS
 * 改造迁进文档本体）。颜色一律走皮肤 token。
 * 布局全部走 flex：body 是「导航栏 + 页面区」的 flex 行；导航栏是
 * flex 列（设置钮前的 .grow 占位把它沉底）；四个页面宿主是叠放在
 * 同一块矩形里的层（Pick() 切 visible），flex-grow 吃满导航栏以外
 * 的全部空间。注意页面控件（.wxmain）自己也要 flex-grow——宿主是
 * flex 列，页面没有声明高度，不吃满主轴就是零高整页空白。
 * 根选择器用 id（#MainBody）：文档 CSS 的 scoping 由 GenHtml 编译
 * 期自动完成（元素与规则同混 zs-<基名> 作用域类），id 留给
 * Find 与可读性。 */
#MainBody { margin: 0; display: flex; flex-direction: row; }
#RailHost { width: 56px; background: var(--bg-tertiary);
  display: flex; flex-direction: column; position: relative; }
button.rail-btn { height: 56px; border-width: 0; border-radius: 10px;
  background: transparent; color: var(--text-secondary); font-size: 20px;
  position: relative; }
button.rail-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
button.rail-btn.wxon { background: var(--bg-active); color: var(--primary); }
/* 未读徽标：absolute 脱离 flex 流，钉在导航栏右上角（相对父级
 * padding-box 落位，right 对齐随计数位数变化自然贴边）。徽标挂在
 * 按钮里时靠 button.rail-btn 的 position:relative 定位到该按钮角上，
 * 挂在栏里时靠 #RailHost 的 position:relative 定位到栏角。 */
.wxrailbadge { position: absolute; top: 4px; right: 4px; }
/* 页面宿主：flex 列——页面以 .wxmain 的 flex-grow 吃满宿主，
 * 宿主再以 flex-grow 吃满 body 行里导航栏以外的剩余宽度。 */
#ChatHost, #ContactsHost, #FavsHost, #MomHost, #WorkHost, #NotifyHost {
  flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
</style>
</head>
<body id="MainBody">
  <!-- 图标导航栏：聊天/通讯录/收藏/朋友圈/工作台/通知 + 底部设置。
       通过声明式属性在模板中直接声明 icon、tip、tip-side 与 free-layout，
       结合 @click 声明式事件指令，无需后台代码手动查找赋值。 -->
  <div id="RailHost">
    <button id="RailChat" class="rail-btn" icon="message" tip="聊天" tip-side="right" free-layout @click="nav-chat"></button>
    <button id="RailContacts" class="rail-btn" icon="users" tip="通讯录" tip-side="right" free-layout @click="nav-contacts"></button>
    <button id="RailFavs" class="rail-btn" icon="star" tip="收藏" tip-side="right" free-layout @click="nav-favs"></button>
    <button id="RailMoments" class="rail-btn" icon="compass" tip="朋友圈" tip-side="right" free-layout @click="nav-moments"></button>
    <button id="RailWork" class="rail-btn" icon="box" tip="工作台" tip-side="right" free-layout @click="nav-work"></button>
    <button id="RailNotify" class="rail-btn" icon="bell" tip="通知" tip-side="right" free-layout @click="nav-notify"></button>
    <button id="RailSettings" class="rail-btn" icon="settings" tip="设置" tip-side="right" free-layout @click="nav-settings"></button>
  </div>

  <!-- 页面宿主：同一块矩形的六个叠放层，Pick() 切 visible。 -->
  <div id="ChatHost"></div>
  <div id="ContactsHost"></div>
  <div id="FavsHost"></div>
  <div id="MomHost"></div>
  <div id="WorkHost"></div>
  <div id="NotifyHost"></div>
</body>
</html>
