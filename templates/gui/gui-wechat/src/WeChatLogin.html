<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>微聊登录</title>
<style>
/* 登录小窗的整套外观（原在 WeChatSkin.zan 的 appCss 字符串里，随
 * HTML+CSS 改造迁进文档本体）。颜色一律走皮肤 token；.wxloginava
 * 是新写法——头像不再用 Avatar 控件，就是一个 CSS 圆形带首字。 */
.wxlogin { padding: 22 34 14; gap: 8; background: var(--bg-secondary); }
.wxloginhead { margin-top: 10; display: flex; flex-direction: row;
  justify-content: center; }
.wxloginava { width: 72; height: 72; border-radius: 999;
  background: var(--success); color: #ffffff; font-size: 30;
  line-height: 72px; text-align: center; }
.wxlogintitlerow { margin: 2 0 6; display: flex; flex-direction: row;
  justify-content: center; }
.wxlogintitle { font-size: 17; }
.wxpage { gap: 10; }
.wxloginbtn { height: 38; }
.wxloginlinks { height: 26; margin-top: 4; display: flex;
  flex-direction: row; justify-content: center; gap: 18; }
.wxloginlink { font-size: 13; color: var(--primary); }
.wxloginstatus { height: 20; font-size: 13; color: #d9534f; }
.wxloginstatus.wxloginok { color: #3a9e52; }
.wxloginbackrow { height: 22; margin-top: 10; display: flex;
  flex-direction: row; justify-content: center; }
.wxloginguide-title { font-size: 16; margin-top: 8; }
.wxloginguide { font-size: 13; color: var(--text-secondary);
  line-height: 1.7; }
</style>
</head>
<body id="WxLoginBody">
  <div class="wxlogin">
    <div class="wxloginhead"><div class="wxloginava">微</div></div>
    <div class="wxlogintitlerow"><label class="wxlogintitle">微 聊</label></div>

    <!-- 登录页：账号 + 密码 + 登录 + 三个入口 -->
    <div id="PageLogin" class="wxpage">
      <input id="LoginAcc" placeholder="微信号 / 昵称" />
      <input id="LoginPwd" placeholder="密码" />
      <button id="LoginGo" class="primary wxloginbtn" data-on-click="login">登 录</button>
      <div class="wxloginlinks">
        <label class="wxloginlink" data-on-click="show-reg">注册账号</label>
        <label class="wxloginlink" data-on-click="show-chpwd">修改密码</label>
        <label class="wxloginlink" data-on-click="show-forgot">忘记密码</label>
      </div>
    </div>

    <!-- 子页：账号体系唯一，注册/改密/找回都走 Web 端 -->
    <div id="PageReg" class="wxpage">
      <label class="wxloginguide-title">注册账号</label>
      <label class="wxloginguide">企业内部账号统一在管理平台注册：需要账号 + 企业邮箱 + 邮箱验证码，注册通过后即可用同一账号登录本客户端。</label>
      <div class="wxloginbackrow"><label class="wxloginlink" data-on-click="back">返回登录</label></div>
    </div>

    <div id="PageChpwd" class="wxpage">
      <label class="wxloginguide-title">修改密码</label>
      <label class="wxloginguide">修改密码在管理平台的个人中心：登录 Web 端 → 个人中心 → 修改密码，改完用新密码重新登录本客户端。</label>
      <div class="wxloginbackrow"><label class="wxloginlink" data-on-click="back">返回登录</label></div>
    </div>

    <div id="PageForgot" class="wxpage">
      <label class="wxloginguide-title">找回密码</label>
      <label class="wxloginguide">忘记密码在登录页的「找回密码」：用企业邮箱接收验证码后重置，重置后用新密码登录本客户端。</label>
      <div class="wxloginbackrow"><label class="wxloginlink" data-on-click="back">返回登录</label></div>
    </div>

    <label id="LoginStatus" class="wxloginstatus"></label>
  </div>
</body>
</html>
