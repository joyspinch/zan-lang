<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>多维表格</title>
<style>
/* 多维表格页：左栏表清单 + 右栏记录网格。
 *
 * 版式：整页一根 flex 行——左栏固定 240 宽，右栏吃满余下宽度。
 * 左栏里「标题 + 新建钮」一行固定 44px，下面的清单吃满余高；右栏
 * 是「标题条 44px + 网格（flex-grow）+ 状态行 28px」三段。
 *
 * 网格本体是代码建的原生控件（DataGrid），不带文档作用域类——
 * 它的尺寸规则只能放皮肤层（.wxbitgrid）；文档里只管两个宿主的
 * 版式。文档 CSS 的数字必须带单位。
 */
#BitableBody { margin: 0; display: flex; flex-direction: row; }
#BitableSide { width: 240px; display: flex; flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--divider); }
#BitableSideHead { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider); }
#BitableSideTitle { font-size: 14px; }
#BitableListHost { flex-grow: 1; display: flex; flex-direction: column; }
#BitableMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
#BitableBar { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--divider); }
#BitableTitle { font-size: 14px; white-space: nowrap; }
/* nowrap：文本项在 flex 行里的基准宽是「可断词宽」，带空格的
 * “4 列 · 4 行” 会被压成一个字的宽（19px），逐字折行成竖排。 */
#BitableCount { font-size: 12px; color: var(--text-secondary);
  white-space: nowrap; }
#BitableGridHost { flex-grow: 1; display: flex; flex-direction: column; }
#BitableFoot { height: 28px; padding: 0 12px; font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--divider); }
</style>
</head>
<body id="BitableBody">
  <div id="BitableSide">
    <div id="BitableSideHead">
      <div id="BitableSideTitle">多维表格</div>
      <button id="BitableCreate" class="text small" icon="plus"
              tip="新建多维表格" @click="bitable-create"></button>
    </div>
    <!-- 表清单宿主：列表本体（ListView）由 code-behind 挂进来。 -->
    <div id="BitableListHost"></div>
  </div>
  <div id="BitableMain">
    <div id="BitableBar">
      <div id="BitableTitle">未选择表格</div>
      <div id="BitableCount"></div>
      <button id="BitableAddRow" class="text small" icon="plus"
              tip="新增一行" @click="bitable-addrow"></button>
      <button id="BitableAddCol" class="text small" icon="stack-2"
              tip="新增一列" @click="bitable-addcol"></button>
      <button id="BitableReload" class="text small" icon="refresh"
              tip="刷新" @click="bitable-reload"></button>
    </div>
    <!-- 网格宿主：网格本体（DataGrid）由 code-behind 挂进来。 -->
    <div id="BitableGridHost"></div>
    <div id="BitableFoot">就绪</div>
  </div>
</body>
</html>
