<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>文档</title>
<style>
/* 文档页：左栏空间/文档清单 + 中间正文 + 右栏版本历史。
 *
 * 版式：三段一行。左边是空间清单（标准库 ListView，代码建）与该空间的
 * 文档清单，中间是正文（读态是网页视图，编辑态是标题输入 + 块语法原文
 * 文本域），右边是版本历史。三个列表与网页视图都是代码建的原生控件，
 * 不带文档作用域类——它们的规则在皮肤层；文档只管宿主的版式。
 */
#DocBody { margin: 0; display: flex; flex-direction: row; }
#DocSide { width: 240px; display: flex; flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--divider); }
#DocSideHead { height: 40px; padding: 0 10px; gap: 6px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider); }
#DocSideTitle { font-size: 13px; flex-grow: 1; }
#DocSpaceHost { height: 190px; display: flex; flex-direction: column;
  border-bottom: 1px solid var(--divider); }
#DocListHead { height: 40px; padding: 0 10px; gap: 6px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider); }
#DocListTitle { font-size: 13px; flex-grow: 1; }
#DocListHost { flex-grow: 1; display: flex; flex-direction: column; }
#DocMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
#DocBar { height: 48px; padding: 0 12px; gap: 10px;
  display: flex; align-items: center;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--divider); }
#DocTitle { font-size: 14px; white-space: nowrap; }
#DocMeta { font-size: 12px; color: var(--text-secondary);
  white-space: nowrap; }
#DocActions { display: flex; flex-direction: row; gap: 6px; }
#DocMid { flex-grow: 1; display: flex; flex-direction: row; }
#DocReader { flex-grow: 1; display: flex; flex-direction: column;
  padding: 10px 14px; gap: 8px; }
#DocTitleBox { height: 32px; }
#DocEditor { flex-grow: 1; }
#DocWebHost { flex-grow: 1; display: flex; flex-direction: column; }
#DocTextHost { flex-grow: 1; display: flex; flex-direction: column; }
#DocVersions { width: 220px; display: flex; flex-direction: column;
  background: var(--bg-secondary);
  border-left: 1px solid var(--divider); }
#DocVerTitle { height: 36px; padding: 0 12px;
  display: flex; align-items: center;
  font-size: 12px; color: var(--text-secondary);
  border-bottom: 1px solid var(--divider); }
#DocVerHost { flex-grow: 1; display: flex; flex-direction: column; }
#DocFoot { height: 26px; padding: 0 12px; font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--divider); }
</style>
</head>
<body id="DocBody">
  <div id="DocSide">
    <div id="DocSideHead">
      <div id="DocSideTitle">空间</div>
      <button id="DocNewBtn" class="text small shrink-0" icon="plus"
              tip="新建文档" @click="doc-new"></button>
    </div>
    <!-- 空间清单宿主：列表本体（ListView）由 code-behind 挂进来。 -->
    <div id="DocSpaceHost"></div>
    <div id="DocListHead">
      <div id="DocListTitle">文档</div>
      <button id="DocReloadBtn" class="text small shrink-0" icon="refresh"
              tip="刷新" @click="doc-reload"></button>
    </div>
    <!-- 文档清单宿主：列表本体（ListView）由 code-behind 挂进来。 -->
    <div id="DocListHost"></div>
  </div>
  <div id="DocMain">
    <div id="DocBar">
      <div id="DocTitle">未选择文档</div>
      <div id="DocMeta"></div>
      <!-- 占位：把动作组推到右缘。 -->
      <div class="grow"></div>
      <div id="DocActions">
        <button id="DocEditBtn" class="text small shrink-0" icon="pencil"
                @click="doc-edit">编辑</button>
        <button id="DocSaveBtn" class="primary small"
                @click="doc-save">保存</button>
        <button id="DocCancelBtn" class="text small"
                @click="doc-cancel">取消</button>
        <button id="DocRevertBtn" class="text small shrink-0" icon="rotate-clockwise"
                @click="doc-revert">回滚</button>
        <button id="DocDeleteBtn" class="text small error"
                @click="doc-delete">删除</button>
      </div>
    </div>
    <div id="DocMid">
      <div id="DocReader">
        <!-- 编辑态的标题输入与块语法原文文本域；读态藏起来。 -->
        <input id="DocTitleBox" placeholder="文档标题">
        <!-- 正文宿主：网页视图（服务端渲染的 HTML）由 code-behind 挂进来。 -->
        <div id="DocWebHost"></div>
        <!-- 降级正文宿主：网页视图不可用时的纯文本。 -->
        <div id="DocTextHost"></div>
        <textarea id="DocEditor"
                  placeholder="块语法正文：# 标题、- 列表、> 引用、``` 代码块"></textarea>
      </div>
      <div id="DocVersions">
        <div id="DocVerTitle">版本历史</div>
        <!-- 版本清单宿主：列表本体（ListView）由 code-behind 挂进来。 -->
        <div id="DocVerHost"></div>
      </div>
    </div>
    <div id="DocFoot">就绪</div>
  </div>
</body>
</html>
