<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>独立聊天窗</title>
<style>
/* 独立聊天窗的骨架：标题行 / 分隔线 / 输入区 / 分隔线 / 气泡区 / 名片浮层。
 * 标题行与输入区沿用聊天页共用的类（.wxhead/.wxcomposer/.wxtoolrow/
 * .wxtypewrap/.wxsendrow/textarea.wxtype）——它们在皮肤里，聊天页与本窗
 * 共用一份。文档只补本窗自己的宿主槽位与标题文字块。 */
#ChatWinRoot { display: flex; flex-direction: column; flex-grow: 1;
  background: var(--bg-primary); }
#ChatWinAva { display: flex; flex-direction: row; align-items: center; }
/* 标题文字块（会话名 + 副标题）：一列两行、垂直居中、吃满标题行剩余宽度；
 * 文字不折行（皮肤里的 .wxheadname/.wxheaddesc 已声明 nowrap）。 */
#ChatWinTitle { display: flex; flex-direction: column; justify-content: center;
  min-width: 0; }
/* 工具条宿主必须是 flex 容器：ToolStrip 作为块级子项时宽度=宿主宽，
 * 窄窗口下工具条项会被裁成 0 宽；做成 flex 行后工具条是 flex 项，
 * 挂 shrink-0 即保持自然尺寸。 */
#ChatWinTools { display: flex; flex-direction: row; }
#ChatWinChat { display: flex; flex-direction: column; }
</style>
</head>
<body id="ChatWinRoot">
  <!-- 标题行：头像（代码建）、会话名与副标题（code-behind 回填文字）、
       更多按钮（图标钮，标准按钮控件）。 -->
  <div id="ChatWinHead" class="wxhead">
    <div id="ChatWinAva"></div>
    <div id="ChatWinTitle">
      <div id="ChatWinName" class="wxheadname"></div>
      <div id="ChatWinDesc" class="wxheaddesc"></div>
    </div>
    <button id="ChatWinDots" class="text small shrink-0" icon="dots" tip="更多"></button>
  </div>
  <div id="ChatWinLine1"></div>

  <!-- 输入区：工具条在上、输入框居中、发送钮右下（与聊天页同款次序）。 -->
  <div id="ChatWinComp" class="wxcomposer">
    <div id="ChatWinToolRow" class="wxtoolrow">
      <div id="ChatWinTools" class="grow"></div>
    </div>
    <div id="ChatWinTypeWrap" class="wxtypewrap">
      <textarea id="ChatWinBox" class="wxtype grow"></textarea>
    </div>
    <div id="ChatWinSendRow" class="wxsendrow">
      <button id="ChatWinSend" class="primary small">发送</button>
    </div>
  </div>
  <div id="ChatWinLine2"></div>

  <!-- 气泡区（ChatView，代码建）与名片浮层（代码建，AnchorRight）。 -->
  <div id="ChatWinChat" class="wxchat grow"></div>
  <div id="ChatWinProf"></div>
</body>
</html>
