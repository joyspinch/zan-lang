<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>设置</title>
<style>
/* 设置层窗口的骨架：左导航 + 右正文（六个分区只显示当前一个）。
 * 骨架的结构与尺寸都在文档里；分区里的「键 + 值/控件」行仍由
 * code-behind 建（行里有 Switch/SelectBox 这类标准控件，HTML 标签
 * 映射里没有 Switch），行的样式走皮肤（.wxsetrow/.wxsetkey/
 * .wxsetval 与导航钮外观都是全局规则——代码建的控件不带文档作用域
 * 类，只能吃全局规则）。 */
#SetRoot { display: flex; flex-direction: row; flex-grow: 1;
  background: var(--bg-primary); }
#SetNav { width: 166px; background: var(--bg-secondary); padding: 8px;
  display: flex; flex-direction: column; gap: 2px; }
#SetBody { flex-grow: 1; padding: 12px 20px; display: flex;
  flex-direction: column; }
.wxsetsection { display: flex; flex-direction: column; }
</style>
</head>
<body id="SetRoot">
  <!-- 左导航：点一项就切右边的分区（code-behind 里 pick-N 接线，
       选中态是 wxon 类，与皮肤里 button.wxsetnavbtn.wxon 一套）。 -->
  <div id="SetNav">
    <button id="Nav0" class="wxsetnavbtn" data-on-click="pick-0">账号与存储</button>
    <button id="Nav1" class="wxsetnavbtn" data-on-click="pick-1">通用</button>
    <button id="Nav2" class="wxsetnavbtn" data-on-click="pick-2">快捷键</button>
    <button id="Nav3" class="wxsetnavbtn" data-on-click="pick-3">通知</button>
    <button id="Nav4" class="wxsetnavbtn" data-on-click="pick-4">插件</button>
    <button id="Nav5" class="wxsetnavbtn" data-on-click="pick-5">关于微信</button>
  </div>

  <!-- 右正文：六个分区壳（SecNBody 是行容器，由 code-behind 填）。 -->
  <div id="SetBody">
    <div id="Sec0" class="wxsetsection">
      <div class="wxsetsec">账号</div>
      <div id="Sec0Body" class="wxsetsection"></div>
    </div>
    <div id="Sec1" class="wxsetsection" visible="false">
      <div class="wxsetsec">外观</div>
      <div id="Sec1Body" class="wxsetsection"></div>
    </div>
    <div id="Sec2" class="wxsetsection" visible="false">
      <div class="wxsetsec">发送与截图</div>
      <div id="Sec2Body" class="wxsetsection"></div>
    </div>
    <div id="Sec3" class="wxsetsection" visible="false">
      <div class="wxsetsec">消息提醒</div>
      <div id="Sec3Body" class="wxsetsection"></div>
    </div>
    <div id="Sec4" class="wxsetsection" visible="false">
      <div class="wxsetsec">已安装的插件</div>
      <div id="Sec4Body" class="wxsetsection"></div>
    </div>
    <div id="Sec5" class="wxsetsection" visible="false">
      <div class="wxsetsec">版本信息</div>
      <div id="Sec5Body" class="wxsetsection"></div>
    </div>
  </div>
</body>
</html>
