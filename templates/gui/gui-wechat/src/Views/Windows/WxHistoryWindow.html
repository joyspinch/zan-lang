<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>聊天记录</title>
<style>
/* 聊天记录窗的骨架：搜索行 + 类型标签行 + 分隔线 + 记录列表。
 * 结构与骨架样式在文档里；类型标签条（ToolStrip）与记录列表
 * （ListView）是动态控件，由 code-behind 建并挂进文档给的槽位，
 * 它们的样式走皮肤全局规则（代码建的控件不带文档作用域类）。 */
#HistRoot { display: flex; flex-direction: column; flex-grow: 1;
  background: var(--bg-primary); }
#HistHead { height: 54px; padding: 10px 14px; gap: 10px;
  display: flex; flex-direction: row; align-items: center; }
#HistTabs { height: 42px; padding: 0 10px; gap: 4px; }
#HistList { flex-grow: 1; display: flex; flex-direction: column; }
</style>
</head>
<body id="HistRoot">
  <!-- 搜索框（<input> → Input，边输边筛）+ 类型标签条 + 分隔线 + 列表。 -->
  <div id="HistHead">
    <input id="HistSearch" class="grow" placeholder="搜索" />
  </div>
  <div id="HistTabs"></div>
  <div id="HistLine"></div>
  <div id="HistList"></div>
</body>
</html>
