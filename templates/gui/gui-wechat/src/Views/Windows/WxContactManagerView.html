<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>通讯录管理</title>
<style>
/* 通讯录管理窗的骨架：左导航 + 右表 + 底栏（已选计数与批量操作）。
 * 骨架结构与布局在文档里；表格（ListView）、表头行、底栏的图标操作格
 * 仍由 code-behind 建（行模板与操作格是数据驱动的动态控件），它们
 * 的样式走皮肤全局规则（代码建的控件不带文档作用域类，只吃全局规则）。 */
#MgRoot { display: flex; flex-direction: column; flex-grow: 1;
  background: var(--bg-primary); }
#MgBody { display: flex; flex-direction: row; flex-grow: 1; gap: 0; }
#MgSide { width: 250px; background: var(--bg-secondary); padding: 10px 0;
  display: flex; flex-direction: column; gap: 2px; }
#MgMain { flex-grow: 1; background: var(--bg-primary); padding: 10px 14px 0 14px;
  display: flex; flex-direction: column; gap: 8px; }
#MgBottom { height: 64px; padding: 0 18px; gap: 12px;
  border-top: 1px solid var(--divider); background: var(--bg-secondary);
  display: flex; flex-direction: row; align-items: center; }
#MgSearch { height: 34px; }
#MgTable { flex-grow: 1; display: flex; flex-direction: column; }
.wxpermhead { height: 38px; padding: 0 12px 0 10px; gap: 4px;
  display: flex; flex-direction: row; align-items: center; }
.wxpermbox { gap: 0; display: flex; flex-direction: column; }
</style>
</head>
<body id="MgRoot">
  <!-- 左导航：全部（带计数，code-behind 回填文字）+ 权限折叠组 + 两个入口。 -->
  <div id="MgBody">
    <div id="MgSide">
      <button id="MgAll" class="wxmgall wxon" data-on-click="filter-all"></button>
      <div class="wxmgsec">筛选</div>
      <div class="wxpermhead">
        <button id="MgPermHead" class="wxmgitem grow" data-on-click="toggle-perm">朋友权限</button>
        <div id="MgChev"></div>
      </div>
      <div id="MgPermBox" class="wxpermbox">
        <button id="MgPerm0" class="wxmgsub" data-on-click="perm-0"></button>
        <button id="MgPerm1" class="wxmgsub" data-on-click="perm-1"></button>
        <button id="MgPerm2" class="wxmgsub" data-on-click="perm-2"></button>
      </div>
      <button class="wxmgitem">标签</button>
      <button class="wxmgitem">最近群聊</button>
    </div>

    <!-- 右栏：搜索框 + 表头（code-behind 建）+ 表格（ListView，code-behind 建）。 -->
    <div id="MgMain">
      <input id="MgSearch" placeholder="搜索" />
      <div id="MgHead"></div>
      <div id="MgTable"></div>
    </div>
  </div>

  <!-- 底栏：已选计数（code-behind 建）+ 取消选择 + 三个批量操作格
       （图标+文字的竖排格，code-behind 建）。 -->
  <div id="MgBottom">
    <div id="MgCount"></div>
    <button class="text small" data-on-click="clear">取消选择</button>
    <div class="grow"></div>
    <div id="MgOp1"></div>
    <div id="MgOp2"></div>
    <div id="MgOp3"></div>
  </div>
</body>
</html>
