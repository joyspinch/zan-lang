<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>智能体</title>
<style>
/* 智能体页：左栏智能体清单 + 右栏对话。
 *
 * 版式：整页一根 flex 行——左栏固定 220 宽，右栏吃满余下宽度。
 * 右栏是「标题条 44px + 对话区（flex-grow）+ 输入区 + 状态行 28px」。
 * 对话区与输入框是代码建的原生控件（ChatView / TextArea），不带文档
 * 作用域类——它们的规则在皮肤层；文档只管宿主的版式。
 */
#AgentBody { margin: 0; display: flex; flex-direction: row; }
#AgentSide { width: 220px; display: flex; flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--divider); }
#AgentSideHead { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  border-bottom: 1px solid var(--divider); }
#AgentSideTitle { font-size: 14px; }
#AgentListHost { flex-grow: 1; display: flex; flex-direction: column; }
#AgentMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
#AgentBar { height: 44px; padding: 0 12px; gap: 8px;
  display: flex; align-items: center;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--divider); }
#AgentTitle { font-size: 14px; white-space: nowrap; }
#AgentHint { font-size: 12px; color: var(--text-secondary);
  white-space: nowrap; }
#AgentChatHost { flex-grow: 1; display: flex; flex-direction: column; }
#AgentInputRow { display: flex; align-items: flex-end; gap: 8px;
  padding: 8px 12px; background: var(--bg-secondary);
  border-top: 1px solid var(--divider); }
#AgentInput { flex-grow: 1; height: 60px; padding: 8px 10px; }
#AgentFoot { height: 28px; padding: 0 12px; font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--divider); }
</style>
</head>
<body id="AgentBody">
  <div id="AgentSide">
    <div id="AgentSideHead">
      <div id="AgentSideTitle">智能体</div>
      <button id="AgentReload" class="text small shrink-0" icon="refresh"
              tip="刷新" @click="agent-reload"></button>
    </div>
    <!-- 智能体清单宿主：列表本体（ListView）由 code-behind 挂进来。 -->
    <div id="AgentListHost"></div>
  </div>
  <div id="AgentMain">
    <div id="AgentBar">
      <div id="AgentTitle">未选择智能体</div>
      <div id="AgentHint"></div>
    </div>
    <!-- 对话区宿主：对话本体（ChatView）由 code-behind 挂进来。 -->
    <div id="AgentChatHost"></div>
    <div id="AgentInputRow">
      <textarea id="AgentInput" placeholder="问点什么…（Enter 换行，发送钮提交）"></textarea>
      <button id="AgentSend" class="primary small" @click="agent-send">发送</button>
    </div>
    <div id="AgentFoot">就绪</div>
  </div>
</body>
</html>
