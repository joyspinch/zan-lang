<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>工作台</title>
<style>
/* 工作台骨架样式（A327-14）：左栏 = 我的任务/任务池 两个 tab +
 * 新建任务钮；中栏 = 任务列表；右栏 = 详情（选中任务或新建表单才
 * 现身，内容全部由 code-behind 重建）。颜色一律走皮肤 token。
 * 任务行模板 .wxworkrow 是 code-behind 建的，规则归皮肤（同
 * .wxfavrow 的口径——文档 CSS 由 GenHtml 做作用域混类，code-behind
 * 控件不在文档树里，规则放皮肤的全局表才吃得到）。 */
#WorkBody { margin: 0; display: flex; flex-direction: row; }
#WorkFilters { width: 208px; background: var(--bg-secondary);
  flex-shrink: 0; display: flex; flex-direction: column; }
#WorkTabsHost { flex-grow: 1; display: flex; flex-direction: column; }
.wxworknew { padding: 12px 14px; display: flex; }
.wxworknewbtn { flex-grow: 1; }
#WorkMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
.wxworkhead { height: 52px; padding: 0 18px; display: flex;
  align-items: center; }
.wxworktitle { font-size: 15; flex-grow: 1; }
#WorkListHost { flex-grow: 1; display: flex; flex-direction: column; }
#WorkDetail { width: 360px; background: var(--bg-secondary);
  flex-shrink: 0; display: flex; flex-direction: column; }
#WorkDetailHost { flex-grow: 1; display: flex; flex-direction: column; }
</style>
</head>
<body id="WorkBody">
  <!-- 左栏：tab 列表（ListView 挂 #WorkTabsHost）+ 新建模板。 -->
  <div id="WorkFilters">
    <div id="WorkTabsHost"></div>
    <div class="wxworknew"><button id="WorkNewBtn" class="wxworknewbtn">新建模板</button></div>
  </div>

  <!-- 中栏：标题行（Refresh 按当前 tab 改写计数）+ 行列表。 -->
  <div id="WorkMain">
    <div class="wxworkhead"><div id="WorkTitle" class="wxworktitle"></div></div>
    <div id="WorkListHost"></div>
  </div>

  <!-- 右栏：详情 / 新建表单 / 选执行人 三形态共用，初始隐藏。 -->
  <div id="WorkDetail">
    <div id="WorkDetailHost"></div>
  </div>
</body>
</html>
