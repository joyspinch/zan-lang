<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>通讯录</title>
<style>
/* 通讯录页骨架样式（原在 WeChatSkin.zan 的 appCss 里，随 HTML+CSS
 * 改造迁进文档本体；页面独占的 .wxcol/.wxmgmt/.wxmgmttext/.wxcard
 * 整体搬了进来）。颜色一律走皮肤 token。
 * 列表行模板（.wxcat/.wxsec 等）与资料卡内部（.wxdetail/.wxdrow
 * 等）是 code-behind 控件的规则，仍归皮肤——mounted 控件不携带
 * 文档作用域类。布局走 web 语义：根是左右两列的 flex 行
 * （#ContactsBody），右栏是「卡片宿主 / 提示行」的 flex 列。
 * 根选择器用 id：scoping 由 GenHtml 编译期自动完成（元素与规则
 * 同混 zs-<基名> 作用域类），id 留给 Find 与可读性。 */
#ContactsBody { margin: 0; display: flex; flex-direction: row; }
.wxcol { width: 300px; background: var(--bg-secondary); flex-shrink: 0;
  display: flex; flex-direction: column; }
.wxmgmt { height: 40px; margin: 8px 10px; padding: 0 10px; gap: 8px;
  border: 1 var(--divider); border-radius: 6;
  background: var(--bg-secondary); display: flex;
  align-items: center; justify-content: center; flex-shrink: 0; }
.wxmgmt:hover { background: var(--bg-hover); }
.wxmgmttext { font-size: 14; }
#ContactsListHost { flex-grow: 1; display: flex; flex-direction: column; }
.wxcard { background: var(--bg-primary); flex-grow: 1;
  display: flex; flex-direction: column; }
#CardsHost { flex-grow: 1; display: flex; flex-direction: column; }
</style>
</head>
<body id="ContactsBody">
  <!-- 左栏：「通讯录管理」入口（图标是动态控件，code-behind 挂进
       #MgmtIcon；点击行为同样 code-behind 接，整条入口/图标/文字
       三重绑定）+ 联系人列表宿主。列表本体（ListView）由
       code-behind 挂进 #ContactsListHost——动态控件，HTML 只给壳。 -->
  <div id="ContactsSide" class="wxcol">
    <div id="MgmtEntry" class="wxmgmt">
      <div id="MgmtIcon"></div>
      <div id="MgmtText" class="wxmgmttext">通讯录管理</div>
    </div>
    <div id="ContactsListHost"></div>
  </div>

  <!-- 右栏：三张资料卡（联系人/群聊/公众号，code-behind 建卡）叠
       放进 #CardsHost，只亮选中行对应的那张；底部提示行（Ping 的
       回执文字）由 code-behind SetProp 回填。 -->
  <div id="CardHost" class="wxcard">
    <div id="CardsHost"></div>
    <div id="CardHint" class="wxhint"></div>
  </div>
</body>
</html>
