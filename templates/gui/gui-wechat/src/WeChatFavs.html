<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>收藏</title>
<style>
/* 收藏页骨架样式（原在 WeChatSkin.zan 的 appCss 里，随 HTML+CSS
 * 改造迁进文档本体；会话行/收藏卡行模板的 .wxfilt 与 .wxfavrow
 * 规则仍归皮肤——行是 code-behind 建的）。颜色一律走皮肤 token。
 * 布局走 web 语义：根是左右两列的 flex 行（#FavBody），右栏是
 * 「头 / 列表 / 尾」的 flex 列——runtime 文档没有 data-dock，dock
 * 由 CSS display 语义给出（块流默认纵向堆叠，横排显式 flex）。
 * 根选择器用 id 不用标签 body：四份文档的 CSS 合装在同一张 app
 * 表里，裸 body 会同时命中别的文档根。 */
#FavBody { margin: 0; display: flex; flex-direction: row; }
#FavFilters { width: 208px; background: var(--bg-secondary);
  flex-shrink: 0; display: flex; flex-direction: column; }
#FavListHost { flex-grow: 1; display: flex; flex-direction: column; }
#FavMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); }
.wxfavhead { height: 52px; padding: 0 18px; display: flex;
  align-items: center; }
.wxfavtitle { font-size: 15; }
#FavCardsHost { flex-grow: 1; display: flex; flex-direction: column; }
.wxfavfoot { height: 36px; padding: 0 18px; display: flex;
  align-items: center; background: var(--bg-secondary); }
/* grow 让文案吃满行宽：静态 AddText 的 Element 没有内在宽度申报，
 * 不 grow 会被量成几十 px 而折行（实测 77px 三行）。 */
.wxfavfoottxt { font-size: 12; color: var(--text-tertiary); flex-grow: 1; }
</style>
</head>
<body id="FavBody">
  <!-- 左栏：筛选类型列。列表本体（ListView）由 code-behind 挂进
       #FavListHost——列表是动态控件，HTML 只给壳。 -->
  <div id="FavFilters">
    <div id="FavListHost"></div>
  </div>

  <!-- 右栏：标题（Filter() 按选中类型改写）/ 收藏卡列表 / 底部容量行。 -->
  <div id="FavMain">
    <div class="wxfavhead"><div id="FavTitle" class="wxfavtitle"></div></div>
    <div id="FavCardsHost"></div>
    <div class="wxfavfoot"><div class="wxfavfoottxt">已使用 148.6M，还剩 3.2G</div></div>
  </div>
</body>
</html>
