<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>通知</title>
<style>
/* 通知页（运行期文档）：样式随装载并进 appCss，作用域类由装载器自动
 * 混入（zs-load-<序>），只命中本文档元素——不必再把各文档的 Css 手工
 * 拼进同一次 UseAppCss。颜色一律走皮肤 token，数字一律带单位。
 *
 * 布局：左分类列（ListView 是代码建的控件，不吃文档作用域类，其样式
 * 在皮肤层）+ 右标题行 / 列表 / 底栏。列表行是模板克隆（data-for），
 * 行盒高度统一（内容两行 + 上下 8px 内衬），底边一条细分隔线。 */
#NotifyBody { margin: 0; display: flex; flex-direction: row; height: 100%; }
#NotifyFilters { width: 208px; background: var(--bg-secondary);
  flex-shrink: 0; display: flex; flex-direction: column; }
#NotifyFilterHost { flex-grow: 1; display: flex; flex-direction: column; }
#NotifyMain { flex-grow: 1; display: flex; flex-direction: column;
  background: var(--bg-primary); min-width: 0; }
.wxnotifyhead { height: 52px; padding: 0 16px; display: flex;
  align-items: center; gap: 8px; flex-shrink: 0; }
.wxnotifytitle { font-size: 15px; flex-grow: 1; }
#NotifySearch { width: 180px; flex-shrink: 0; }
#NotifyList { flex-grow: 1; display: flex; flex-direction: column;
  overflow-y: auto; }
/* 通知行：未读用左侧 8px 圆点（data-if 按行内模型插拔）。 */
.wxnotifyrow { display: flex; flex-direction: row; align-items: flex-start;
  gap: 8px; padding: 8px 16px; flex-shrink: 0; }
.wxnotifydot { width: 8px; height: 8px; border-radius: 4px;
  background: var(--primary); margin-top: 6px; flex-shrink: 0; }
.wxnotifycol { flex-grow: 1; display: flex; flex-direction: column;
  gap: 2px; min-width: 0; }
.wxnotifyline { display: flex; flex-direction: row; align-items: baseline;
  gap: 8px; }
.wxnotifyitemtitle { font-size: 14px; flex-grow: 1; }
.wxnotifytime { font-size: 12px; color: var(--text-tertiary);
  flex-shrink: 0; }
.wxnotifycontent { font-size: 13px; color: var(--text-secondary); }
.wxnotifyempty { padding: 32px 16px; text-align: center;
  color: var(--text-tertiary); font-size: 13px; }
.wxnotifyfoot { height: 40px; padding: 0 16px; display: flex;
  align-items: center; background: var(--bg-secondary); gap: 8px;
  flex-shrink: 0; }
.wxnotifyfoottxt { font-size: 12px; color: var(--text-tertiary);
  flex-grow: 1; }
</style>
</head>
<body id="NotifyBody">
  <!-- 左栏：分类列（ListView 由 code-behind 挂进 #NotifyFilterHost）。 -->
  <div id="NotifyFilters">
    <div id="NotifyFilterHost"></div>
  </div>

  <!-- 右栏：标题行（标题与计数绑模型、搜索框双向绑定、全部已读）/
       通知列表（模板行，逐行绑定行内模型）/ 底部状态行。 -->
  <div id="NotifyMain">
    <div class="wxnotifyhead">
      <div id="NotifyTitle" class="wxnotifytitle" data-bind="title"></div>
      <input id="NotifySearch" class="small" data-bind="keyword"
             placeholder="搜索通知" @change="notify-search" />
      <button id="NotifyReadAll" class="text small" @click="notify-readall">全部已读</button>
    </div>
    <div id="NotifyList">
      <template data-for="items" data-key="id">
        <div class="wxnotifyrow" @click="notify-open">
          <div class="wxnotifydot" data-if="unread"></div>
          <div class="wxnotifycol">
            <div class="wxnotifyline">
              <span class="wxnotifyitemtitle" data-bind="title"></span>
              <span class="wxnotifytime" data-bind="time"></span>
            </div>
            <div class="wxnotifycontent" data-bind="content"></div>
          </div>
        </div>
      </template>
      <div class="wxnotifyempty" data-if="empty">没有通知</div>
    </div>
    <div class="wxnotifyfoot">
      <div id="NotifyFootText" class="wxnotifyfoottxt" data-bind="footText"></div>
      <button id="NotifyGoWork" class="text small" data-if="showGoWork"
              @click="notify-work">去工作台</button>
    </div>
  </div>
</body>
</html>
