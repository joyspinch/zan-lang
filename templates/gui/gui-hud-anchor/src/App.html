<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>App</title>
<style>
  .hud-root { position: relative; width: 100%; height: 100%; background: #1a1a24; overflow: hidden; }
  .viewport-bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .hud-top-left { position: absolute; left: 16px; top: 16px; display: flex; flex-direction: column; gap: 6px; padding: 12px; background: rgba(20, 24, 36, 0.85); border-radius: 8px; border: 1px rgba(255,255,255,0.1); width: 220px; }
  .hud-top-right { position: absolute; right: 16px; top: 16px; width: 120px; height: 120px; background: rgba(20, 24, 36, 0.85); border-radius: 8px; border: 1px rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
  .hud-bottom-center { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px 16px; background: rgba(20, 24, 36, 0.85); border-radius: 12px; border: 1px rgba(255,255,255,0.1); }
</style>
</head>
<body data-zan-design id="App" data-win-w="800" data-win-h="600">
  <div class="hud-root">
    <div class="viewport-bg">
      <label data-kind="Label" data-label="[游戏视口区域: 3D/2D 画布内容]" class="secondary"></label>
    </div>
    <div class="hud-top-left">
      <label id="PlayerName" data-kind="Label" data-label="角色: 游侠 Lv.45" class="medium text-white"></label>
      <progress id="HpBar" data-kind="Progress" value="85" max="100"></progress>
      <progress id="MpBar" data-kind="Progress" value="60" max="100"></progress>
    </div>
    <div class="hud-top-right">
      <label data-kind="Label" data-label="小地图" class="small"></label>
    </div>
    <div class="hud-bottom-center">
      <button id="Skill1" data-kind="Button" data-label="Q: 斩击" class="small" @click="OnSkill1"></button>
      <button id="Skill2" data-kind="Button" data-label="W: 闪避" class="small" @click="OnSkill2"></button>
      <button id="Skill3" data-kind="Button" data-label="E: 箭雨" class="small" @click="OnSkill3"></button>
      <button id="Skill4" data-kind="Button" data-label="R: 绝啸" class="small primary" @click="OnSkill4"></button>
    </div>
  </div>
</body>
</html>
