<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* HUD 锚定排版：.hud 铺满窗口作定位参照；各面板用 left/right/top/bottom
   * 贴到九宫格的角或边上。窗口怎么缩放，面板都贴着自己的锚点走。
   * 居中的条（目标血条、技能栏）用"整行绝对定位 + flex 居中"实现。 */
  body { display: flex; flex-direction: column; }
  .hud { position: relative; flex-grow: 1; min-height: 0; overflow: hidden; background: var(--bg-tertiary); }
  .viewport { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
  .panel { display: flex; flex-direction: column; gap: var(--gap-small); padding: var(--padding-medium);
           background: var(--surface-bg); border: 1 var(--border-secondary); border-radius: var(--radius-medium); }
  .top-left { position: absolute; left: var(--space-m); top: var(--space-m); width: 220px; }
  .top-right { position: absolute; right: var(--space-m); top: var(--space-m); width: 140px; align-items: center; }
  .bottom-left { position: absolute; left: var(--space-m); bottom: var(--space-m); width: 220px; }
  .top-center { position: absolute; left: 0; right: 0; top: var(--space-m); display: flex; justify-content: center; }
  .bottom-center { position: absolute; left: 0; right: 0; bottom: var(--space-m); display: flex; justify-content: center; }
  .target { width: 240px; }
  .skills { display: flex; flex-direction: row; gap: var(--gap-medium); padding: var(--padding-small);
            background: var(--surface-bg); border: 1 var(--border-secondary); border-radius: var(--radius-large); }
  .skills button { width: 88px; }
  .minimap { width: 112px; height: 112px; background: var(--bg-secondary); border-radius: var(--radius-small); }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="900" data-win-h="600" data-win-center="true">
  <div class="hud">
    <div class="viewport">
      <label id="ViewportLabel" class="hint">游戏画面区域（2D/3D 画布挂在这一层）</label>
    </div>

    <div id="PlayerPanel" class="panel top-left">
      <label id="PlayerName" class="h3">游侠 Lv.12</label>
      <progress id="HpBar" type="error" bind="hpPercent"></progress>
      <label id="HpText" class="small secondary" bind="hpText"></label>
      <progress id="MpBar" type="info" bind="mpPercent"></progress>
      <label id="MpText" class="small secondary" bind="mpText"></label>
    </div>

    <div id="MapPanel" class="panel top-right">
      <div id="Minimap" class="minimap"></div>
      <label id="ZoneLabel" class="small secondary">迷雾森林 · 第 2 层</label>
    </div>

    <div class="top-center">
      <div id="TargetPanel" class="panel target">
        <label id="TargetName" bind="targetText"></label>
        <progress id="TargetBar" type="warning" bind="targetPercent"></progress>
      </div>
    </div>

    <div id="LogPanel" class="panel bottom-left">
      <label id="Log1" class="small" bind="log1"></label>
      <label id="Log2" class="small secondary" bind="log2"></label>
      <label id="Log3" class="small hint" bind="log3"></label>
    </div>

    <div class="bottom-center">
      <div id="SkillBar" class="skills">
        <button id="Skill1" bind:text="skill1Text" :disabled="skill1Busy" data-arg="0" @click="OnSkill"></button>
        <button id="Skill2" bind:text="skill2Text" :disabled="skill2Busy" data-arg="1" @click="OnSkill"></button>
        <button id="Skill3" bind:text="skill3Text" :disabled="skill3Busy" data-arg="2" @click="OnSkill"></button>
        <button id="Skill4" class="primary" bind:text="skill4Text" :disabled="skill4Busy" data-arg="3" @click="OnSkill"></button>
      </div>
    </div>
  </div>
</body>
</html>
