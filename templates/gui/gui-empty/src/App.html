<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 根节点贴边铺满，留白由内容区自己决定（padding 只用 token）。 */
  body { display: flex; flex-direction: column; background: var(--window-bg); }
  .page { flex-grow: 1; display: flex; flex-direction: column; gap: var(--gap-large); padding: var(--padding-large); }
  .card { display: flex; flex-direction: column; gap: var(--gap-medium); }
  .row { display: flex; flex-direction: row; gap: var(--gap-medium); }
  .row input { flex-grow: 1; min-width: 0; }
  .row button { flex-shrink: 0; padding-left: var(--padding-large); padding-right: var(--padding-large); }
  .tips { display: flex; flex-direction: column; gap: var(--gap-small); }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-title="{{NAME}}" data-win-w="480" data-win-h="520" data-win-center="true">
  <div class="page">
    <label id="TitleLabel" class="title">{{NAME}}</label>
    <label id="HintLabel" class="secondary">从这里开始：界面写在 {{NAME}}.html，逻辑写在 {{NAME}}.zan。</label>
    <card id="HelloCard"><div class="card">
      <label id="NameCaption" class="small secondary">你的名字</label>
      <div class="row">
        <input id="NameInput" placeholder="输入名字后回车或点按钮" bind="name" @submit="OnGreet" />
        <button id="GreetButton" class="primary" @click="OnGreet">打招呼</button>
      </div>
      <label id="GreetingLabel" bind="greeting" :class="greetingClass"></label>
    </div></card>
    <card id="TipsCard"><div class="tips">
      <label id="TipsTitle" class="h3">接下来可以</label>
      <label id="Tip1" class="secondary">· 在设计器里拖入新控件，或直接编辑 {{NAME}}.html</label>
      <label id="Tip2" class="secondary">· 给控件写 bind="字段名"，界面与字段自动同步</label>
      <label id="Tip3" class="secondary">· 写 @click="方法名"，在 {{NAME}}.zan 里实现同名方法</label>
    </div></card>
  </div>
</body>
</html>
