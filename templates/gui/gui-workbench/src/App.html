<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1100" data-win-h="720" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0">
  <toolbar id="TopHeader" data-label="主工具栏" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="38" data-x-options="[&quot;新建项目:plus&quot;,&quot;打开工程:folder&quot;,&quot;-&quot;,&quot;构建:play&quot;,&quot;&gt;用户中心:user&quot;]" @item-click="OnHeaderCommand"></toolbar>
  <status-bar id="MainStatusBar" data-label="就绪" data-span="24" data-dock="bottom" data-fx="0" data-fy="0" data-fw="200" data-fh="24" data-x-options="[&quot;就绪&quot;,&quot;8pt Grid: ON&quot;,&quot;&gt;UTF-8&quot;]"></status-bar>
  <panel id="SidebarPanel" data-label="导航侧栏" data-span="24" data-dock="left" data-fx="0" data-fy="0" data-fw="220" data-fh="32">
    <button id="NavProject" data-label="工程总览" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnNavProject"></button>
    <button id="NavArchitecture" data-label="调用链路图" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnNavArchitecture"></button>
    <button id="NavDatabase" data-label="数据中心" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnNavDatabase"></button>
    <button id="NavSettings" data-label="全局配置" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnNavSettings"></button>
  </panel>
  <panel id="MainWorkspace" data-label="工作区" data-span="24" data-dock="fill" data-fx="0" data-fy="0" data-fw="200" data-fh="32">
    <label id="WorkspaceTitle" data-label="工程工作台" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36"></label>
    <data-grid id="ProjectGrid" data-label="模块列表" data-span="24" data-dock="fill" data-fx="0" data-fy="0" data-fw="200" data-fh="32"></data-grid>
  </panel>
</body>
</html>
