<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1100" data-win-h="720" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:38px minmax(0,1fr) 24px">
  <toolbar id="TopHeader" data-label="主工具栏" data-x-options="[&quot;新建项目:plus&quot;,&quot;打开工程:folder&quot;,&quot;-&quot;,&quot;构建:play&quot;,&quot;&gt;用户中心:user&quot;]" @item-click="OnHeaderCommand" style="min-width:0;min-height:0;height:38px;grid-column:1 / 3;grid-row:1"></toolbar>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;8pt Grid: ON&quot;,&quot;&gt;UTF-8&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 3;grid-row:3"></status-bar>
  <panel id="SidebarPanel" data-label="导航侧栏" style="min-width:0;min-height:0;width:220px;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:36px 36px 36px 36px minmax(0,1fr)">
    <button id="NavProject" data-label="工程总览" @click="OnNavProject" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:1"></button>
    <button id="NavArchitecture" data-label="调用链路图" @click="OnNavArchitecture" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:2"></button>
    <button id="NavDatabase" data-label="数据中心" @click="OnNavDatabase" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:3"></button>
    <button id="NavSettings" data-label="全局配置" @click="OnNavSettings" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:4"></button>
  </panel>
  <panel id="MainWorkspace" data-label="工作区" style="min-width:0;min-height:0;grid-column:2;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:36px minmax(0,1fr)">
    <label id="WorkspaceTitle" data-label="工程工作台" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:1"></label>
    <data-grid id="ProjectGrid" data-label="模块列表" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></data-grid>
  </panel>
</body>
</html>
