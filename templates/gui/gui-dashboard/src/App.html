<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="520" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px minmax(0,1fr) 24px">
  <toolbar id="MainToolStrip" data-label="工具条" data-x-options="[&quot;刷新:refresh&quot;,&quot;导出:save&quot;,&quot;-&quot;,&quot;&gt;区间:clock&quot;]" @item-click="OnToolClick" style="min-width:0;min-height:0;height:34px;grid-column:1 / 2;grid-row:1"></toolbar>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;刚刚更新&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 2;grid-row:3"></status-bar>
  <panel id="Card1" data-label="吞吐量" style="position:absolute;left:16px;top:16px;width:300px;height:160px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px 16px minmax(0,1fr)">
    <statistic id="Stat1" data-label="吞吐量" style="min-width:0;min-height:0;height:60px;grid-column:1 / 2;grid-row:1"></statistic>
    <progress id="Bar1" data-label="进度" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:2"></progress>
  </panel>
  <panel id="Card2" data-label="运行时长" style="position:absolute;left:336px;top:16px;width:300px;height:160px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px 16px minmax(0,1fr)">
    <statistic id="Stat2" data-label="运行时长" style="min-width:0;min-height:0;height:60px;grid-column:1 / 2;grid-row:1"></statistic>
    <progress id="Bar2" data-label="进度" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:2"></progress>
  </panel>
  <panel id="Card3" data-label="未处理报警" style="position:absolute;left:656px;top:16px;width:300px;height:160px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px 16px minmax(0,1fr)">
    <statistic id="Stat3" data-label="未处理报警" style="min-width:0;min-height:0;height:60px;grid-column:1 / 2;grid-row:1"></statistic>
    <progress id="Bar3" data-label="进度" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:2"></progress>
  </panel>
  <panel id="Card4" data-label="能耗" style="position:absolute;left:16px;top:196px;width:300px;height:160px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px 16px minmax(0,1fr)">
    <statistic id="Stat4" data-label="能耗" style="min-width:0;min-height:0;height:60px;grid-column:1 / 2;grid-row:1"></statistic>
    <progress id="Bar4" data-label="进度" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:2"></progress>
  </panel>
  <panel id="Card5" data-label="产量" style="position:absolute;left:336px;top:196px;width:300px;height:160px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px 16px minmax(0,1fr)">
    <statistic id="Stat5" data-label="产量" style="min-width:0;min-height:0;height:60px;grid-column:1 / 2;grid-row:1"></statistic>
    <progress id="Bar5" data-label="进度" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:2"></progress>
  </panel>
  <panel id="Card6" data-label="队列" style="position:absolute;left:656px;top:196px;width:300px;height:160px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:60px 16px minmax(0,1fr)">
    <statistic id="Stat6" data-label="队列" style="min-width:0;min-height:0;height:60px;grid-column:1 / 2;grid-row:1"></statistic>
    <progress id="Bar6" data-label="进度" style="min-width:0;min-height:0;height:16px;grid-column:1 / 2;grid-row:2"></progress>
  </panel>
</body>
</html>
