<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
<style>
  /* 整窗：工具条 / 内容两段纵向 flex；内容区吃满剩余高度。 */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    background: var(--window-bg);
  }
  .bar-top { flex-shrink: 0; }
  .toolbar-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: var(--gap-small);
    padding: var(--padding-tiny) var(--padding-medium);
    background: var(--surface-bg);
    border-bottom: 1px solid var(--border-secondary);
  }
  .spacer { flex-grow: 1; }
  .content {
    flex-grow: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap-large);
    padding: var(--padding-large);
  }
  /* 指标卡片墙：三列等宽网格，卡片随窗口宽度伸缩。 */
  .kpis {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--gap-large);
    flex-shrink: 0;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: var(--gap-medium);
    padding: var(--padding-large);
  }
  .card-foot {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
  .kpi-value { font-size: var(--font-size-huge); font-weight: bold; }
  .chart-card { flex-grow: 1; min-height: 0; }
  .chart-title { font-size: var(--font-size-large); font-weight: bold; }
  .chart { flex-grow: 1; min-height: 0; }
</style>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1080" data-win-h="720" data-win-title="{{NAME}}" data-win-center="true" data-win-zoom="0">
  <div class="bar-top toolbar-row">
    <button id="RefreshButton" class="small" icon="refresh" @click="OnRefresh">刷新</button>
    <button id="PauseButton" class="small" :icon="pauseIcon" @click="OnTogglePause" bind:text="pauseText"></button>
    <button id="ExportButton" class="small" icon="download" @click="OnExport">导出快照</button>
    <div class="spacer"></div>
    <label id="StatusLabel" class="small secondary" bind="status"></label>
  </div>

  <div class="content">
    <!-- 指标卡：行模板按 cards 列表逐项克隆；行内 bind 指向 Metric 的字段。 -->
    <div class="kpis">
      <template data-for="cards">
        <panel class="card">
          <label class="small secondary" bind="Name"></label>
          <label class="kpi-value" bind="ValueText"></label>
          <progress bind="Completion"></progress>
          <div class="card-foot">
            <label class="small secondary" bind="GoalText"></label>
            <label bind="TrendText" :class="TrendClass"></label>
          </div>
        </panel>
      </template>
    </div>

    <panel class="card chart-card">
      <label class="chart-title" data-label="吞吐量趋势（最近 30 次采样，req/s）"></label>
      <chart id="TrendChart" class="chart"></chart>
    </panel>
  </div>

</body>
</html>
