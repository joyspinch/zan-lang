<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0">
  <toolbar id="MainToolStrip" data-label="工具条" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="34" data-x-options="[&quot;刷新:refresh&quot;,&quot;-&quot;,&quot;&gt;账户:user&quot;]"></toolbar>
  <status-bar id="MainStatusBar" data-label="就绪" data-span="24" data-dock="bottom" data-fx="0" data-fy="0" data-fw="200" data-fh="24" data-x-options="[&quot;就绪&quot;,&quot;&gt;已登录&quot;]"></status-bar>
  <panel id="NavPanel" data-label="导航" data-span="24" data-dock="left" data-fx="0" data-fy="0" data-fw="200" data-fh="32">
    <button id="DashboardNav" data-label="仪表盘" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnDashboardClick"></button>
    <button id="DevicesNav" data-label="设备" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnDevicesClick"></button>
    <button id="ReportsNav" data-label="报表" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnReportsClick"></button>
    <button id="SettingsNav" data-label="设置" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="36" @click="OnSettingsClick"></button>
  </panel>
  <panel id="ContentPanel" data-label="仪表盘" data-span="24" data-dock="fill" data-fx="0" data-fy="0" data-fw="200" data-fh="32">
    <label id="PageTitle" data-label="仪表盘" data-span="24" data-dock="top" data-fx="0" data-fy="0" data-fw="200" data-fh="30"></label>
    <data-grid id="DataGrid" data-label="记录" data-span="24" data-dock="fill" data-fx="0" data-fy="0" data-fw="200" data-fh="32"></data-grid>
  </panel>
</body>
</html>
