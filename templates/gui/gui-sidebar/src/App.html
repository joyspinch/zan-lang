<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{{NAME}}</title>
</head>
<body data-zan-design id="{{NAME}}" data-win-w="1000" data-win-h="680" data-win-title="{{NAME}}" data-win-center="true" data-layout-mode="1" data-win-zoom="0" style="display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-rows:34px minmax(0,1fr) 24px">
  <toolbar id="MainToolStrip" data-label="工具条" data-x-options="[&quot;刷新:refresh&quot;,&quot;-&quot;,&quot;&gt;账户:user&quot;]" style="min-width:0;min-height:0;height:34px;grid-column:1 / 3;grid-row:1"></toolbar>
  <status-bar id="MainStatusBar" data-label="就绪" data-x-options="[&quot;就绪&quot;,&quot;&gt;已登录&quot;]" style="min-width:0;min-height:0;height:24px;grid-column:1 / 3;grid-row:3"></status-bar>
  <panel id="NavPanel" data-label="导航" style="min-width:0;min-height:0;width:200px;grid-column:1;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:36px 36px 36px 36px minmax(0,1fr)">
    <button id="DashboardNav" data-label="仪表盘" @click="OnDashboardClick" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:1"></button>
    <button id="DevicesNav" data-label="设备" @click="OnDevicesClick" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:2"></button>
    <button id="ReportsNav" data-label="报表" @click="OnReportsClick" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:3"></button>
    <button id="SettingsNav" data-label="设置" @click="OnSettingsClick" style="min-width:0;min-height:0;height:36px;grid-column:1 / 2;grid-row:4"></button>
  </panel>
  <panel id="ContentPanel" data-label="仪表盘" style="min-width:0;min-height:0;grid-column:2;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:30px minmax(0,1fr)">
    <label id="PageTitle" data-label="仪表盘" style="min-width:0;min-height:0;height:30px;grid-column:1 / 2;grid-row:1"></label>
    <data-grid id="DataGrid" data-label="记录" style="min-width:0;min-height:0;grid-column:1;grid-row:2"></data-grid>
  </panel>
</body>
</html>
