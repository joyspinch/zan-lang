<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} · 聊天室</title>
<link rel="stylesheet" href="css/client.css">
</head>
<body>
<header>
  <h1>{{NAME}}</h1>
  <span id="status" class="status off">未连接</span>
  <form id="nickForm" class="nick">
    <input id="nick" maxlength="16" placeholder="起个昵称" autocomplete="off">
    <button type="submit">改名</button>
  </form>
</header>
<main>
  <section id="log" aria-live="polite"></section>
  <aside>
    <h2>在线 <span id="count">0</span></h2>
    <ul id="users"></ul>
  </aside>
</main>
<form id="sayForm" class="say">
  <input id="text" maxlength="500" placeholder="输入消息，回车发送" autocomplete="off" disabled>
  <button type="submit" id="send" disabled>发送</button>
</form>
<script src="js/client.js"></script>
</body>
</html>
