<div class="row">
  <h1>极简博客</h1>
  <span class="badge right">{{count}} 篇</span>
</div>
<p class="muted">数据来自 <b>{{source}}</b>（cache = {{cacheKind}}，TTL 60s）· 连接池 {{pool}}</p>

<form class="toolbar" method="get" action="/blog" style="margin:1rem 0">
  <input class="input grow" type="text" name="kw" value="{{kw}}"
         placeholder="按标题搜索（带搜索词的结果不进缓存）">
  <button class="btn btn-primary" type="submit">搜索</button>
</form>

<div class="post-list">
  {{#each posts}}
  <article class="card post-item">
    <h2><a href="/blog/{{id}}">{{title}}</a></h2>
    <div class="meta"><span>#{{id}}</span><span>{{author}}</span><span>{{createdAt}}</span></div>
  </article>
  {{/each}}
</div>

<section class="card" style="margin-top:1.4rem">
  <header><h3>发布一篇</h3></header>
  <form class="body form" method="post" action="/blog/create">
    <div class="form-row">
      <label for="title">标题</label>
      <input class="input" id="title" type="text" name="title" required>
    </div>
    <div class="form-row">
      <label for="body">正文</label>
      <textarea class="textarea" id="body" name="body" rows="5"></textarea>
    </div>
    <div class="row">
      <button class="btn btn-primary" type="submit">发布</button>
      <span class="hint">作者取自登录身份；发布后 <code>blog:list</code> 缓存失效，列表立刻更新。</span>
    </div>
  </form>
</section>
