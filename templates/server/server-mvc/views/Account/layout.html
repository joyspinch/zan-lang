<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-body">
<!-- This module's own layout: a centred card, no sidebar and no site nav.
     Dropping layout.html into a module's View/ folder overrides the global one
     for that module only (View.RenderPage). -->
<main class="auth">
  {{content}}
  <p class="auth-foot"><a href="/">&larr; 返回前台</a></p>
</main>
<script>
// The "send code" button posts the address next to it and counts down, so the
// page needs no framework for the one bit of behaviour it has.
document.addEventListener('click', function (ev) {
  var btn = ev.target.closest('[data-send-code]');
  if (!btn) { return; }
  var form = btn.closest('form');
  var mail = form.querySelector('[name=email]');
  if (!mail || !mail.value) { mail.focus(); return; }
  btn.disabled = true;
  var body = new URLSearchParams({ email: mail.value });
  fetch(btn.getAttribute('data-send-code'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  }).then(function (r) { return r.json(); }).then(function (j) {
    var ok = j && j.code === '0000';
    var note = form.querySelector('.flash') || document.createElement('p');
    note.className = 'flash ' + (ok ? 'ok' : 'bad');
    note.textContent = (j && j.msg) || (ok ? '验证码已发送' : '发送失败');
    form.prepend(note);
    if (!ok) { btn.disabled = false; return; }
    var left = 60;
    btn.textContent = left + ' 秒后重发';
    var t = setInterval(function () {
      left = left - 1;
      btn.textContent = left + ' 秒后重发';
      if (left <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = '获取验证码'; }
    }, 1000);
  }).catch(function () { btn.disabled = false; });
});
</script>
</body>
</html>
