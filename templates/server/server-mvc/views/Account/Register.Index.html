<section class="card auth-card">
  <header>
    <span class="brand-mark">Z</span>
    <div>
      <h2>注册 {{brand}}</h2>
      <p class="hint">创建一个账号后即可登录</p>
    </div>
  </header>
  <form class="body form" method="post" action="/register">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    <div class="form-row">
      <label for="user">账号</label>
      <input class="input" id="user" type="text" name="user" value="{{user}}"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-row">
      <label for="email">邮箱</label>
      <input class="input" id="email" type="email" name="email" value="{{email}}"
             autocomplete="email" required>
    </div>
    {{#if needCode}}
    <div class="form-row">
      <label for="code">验证码</label>
      <div class="code-row">
        <input class="input" id="code" type="text" name="code" inputmode="numeric"
               maxlength="6" autocomplete="one-time-code" required>
        <button class="btn" type="button" data-send-code="/register/code">获取验证码</button>
      </div>
    </div>
    {{/if}}
    <div class="form-row">
      <label for="pass">密码</label>
      <input class="input" id="pass" type="password" name="pass"
             autocomplete="new-password" minlength="8" required>
    </div>
    <button class="btn btn-primary" type="submit">注册</button>
    <p class="hint">已有账号？<a href="/login">去登录</a></p>
  </form>
</section>
