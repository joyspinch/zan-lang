<section class="hero">
  <span class="pill">{{version}}</span>
  <h1>{{title}}</h1>
  <p class="lede">{{message}}</p>
  <div class="btn-row">
    <a class="btn btn-primary" href="/blog">看看博客</a>
    <a class="btn" href="/admin">进入管理后台</a>
  </div>
  <dl class="hero-facts">
    {{#each facts}}
    <div><dt>{{k}}</dt><dd>{{v}}</dd></div>
    {{/each}}
  </dl>
</section>

<h2 class="section-title">框架做了什么</h2>
<div class="features">
  {{#each features}}
  <article class="card feature">
    <h3>{{name}}</h3>
    <p>{{desc}}</p>
    <code>{{hint}}</code>
  </article>
  {{/each}}
</div>

<section class="card" style="margin-top:1.4rem">
  <header><h3>试一下</h3></header>
  <div class="body">
    <table class="table">
      <thead><tr><th>请求</th><th>说明</th></tr></thead>
      <tbody>
        {{#each routes}}
        <tr>
          <td data-label="请求"><code class="nowrap">{{req}}</code></td>
          <td data-label="说明">{{what}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
  </div>
</section>
