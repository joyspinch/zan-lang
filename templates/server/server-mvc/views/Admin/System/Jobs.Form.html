<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/system/jobs/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>任务名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="64">
      <label>类型</label>
      {{#if kindSelect}}
      <select class="input" name="kind">
        {{#each kinds}}<option value="{{value}}" {{selected}}>{{text}}</option>{{/each}}
      </select>
      {{else}}
      <input type="hidden" name="kind" value="{{kind}}">
      <input class="input mono" value="{{kindText}}" disabled>
      {{/if}}
      <label>参数</label>
      <input class="input" name="param" value="{{param}}" maxlength="128">
      <div class="muted" style="font-size:12px">按类型解释：日志清理=保留天数（1-365）；其他类型留空</div>
      <label>间隔（秒）</label>
      <input class="input" type="number" name="intervalSec" min="5" max="604800" value="{{intervalSec}}" required>
      <label>状态</label>
      <select class="input" name="enabled">
        <option value="1" {{enabled1}}>启用</option>
        <option value="0" {{enabled0}}>停用</option>
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>{{iCancel}}</button>
      <button class="btn primary" type="submit">{{iSave}}</button>
    </footer>
  </form>
</div>
