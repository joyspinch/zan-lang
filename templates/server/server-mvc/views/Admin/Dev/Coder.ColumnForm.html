<form data-submit action="/admin/dev/coder/columnsave">
  <input type="hidden" name="id" value="{{id}}">
  <input type="hidden" name="tableId" value="{{tableId}}">
  <div class="form">
    <label>字段名</label>
    <input class="input" name="name" value="{{name}}" placeholder="order_no" required>
    <label>名称</label>
    <input class="input" name="label" value="{{label}}" placeholder="订单号">
    <label>类型</label>
    <select class="input" name="kind" data-value="{{kindValue}}">
      <option value="string">字符串</option>
      <option value="text">长文本</option>
      <option value="int">整数</option>
      <option value="long">长整数</option>
      <option value="decimal">小数</option>
      <option value="bool">开关</option>
      <option value="datetime">时间戳</option>
    </select>
    <label>长度</label>
    <input class="input" type="number" name="size" value="{{size}}">
    <label>控件</label>
    <select class="input" name="widget" data-value="{{widgetValue}}">
      <option value="text">单行文本</option>
      <option value="textarea">多行文本</option>
      <option value="number">数字</option>
      <option value="select">下拉选择</option>
      <option value="switch">开关</option>
      <option value="date">日期</option>
      <option value="richtext">富文本</option>
      <option value="upload">上传</option>
    </select>
    <label>默认值</label>
    <input class="input" name="defValue" value="{{defValue}}">
    <label>字典类型</label>
    <input class="input" name="dictType" value="{{dictType}}" placeholder="下拉取自数据字典时填类型标识">
    <label>关联表</label>
    <select class="input" name="relTable" data-value="{{relTable}}">
      <option value="">不关联</option>
      {{#each tables}}<option value="{{tableName}}">{{title}}（{{tableName}}）</option>{{/each}}
    </select>
    <label>关联值列</label>
    <input class="input" name="relValue" value="{{relValue}}" placeholder="id">
    <label>关联显示列</label>
    <input class="input" name="relLabel" value="{{relLabel}}" placeholder="name">
    <label>排序</label>
    <input class="input" type="number" name="sortOrder" value="{{sortOrder}}">
    <label>出现在</label>
    <div class="chk-row">
      <label><input type="checkbox" name="inList" value="1" {{inListChecked}}> 列表</label>
      <label><input type="checkbox" name="inFilter" value="1" {{inFilterChecked}}> 筛选</label>
      <label><input type="checkbox" name="inCreate" value="1" {{inCreateChecked}}> 新增</label>
      <label><input type="checkbox" name="inEdit" value="1" {{inEditChecked}}> 编辑</label>
      <label><input type="checkbox" name="required" value="1" {{requiredChecked}}> 必填</label>
      <label><input type="checkbox" name="nullable" value="1" {{nullableChecked}}> 允许空</label>
    </div>
  </div>
</form>
