<div class="card">
  <div class="toolbar">
    <b>表设计</b>
    <span class="muted">设计表 → 同步到数据库 → 直接管理数据，需要定制时再生成代码</span>
    <span class="sp"></span>
    <a class="btn sm primary" href="/admin/dev/coder/tableform" data-dialog>新建数据表</a>
  </div>
  <table class="table">
    <thead><tr>
      <th style="width:180px">表名</th><th style="width:150px">名称</th>
      <th style="width:150px">实体</th><th style="width:90px">URL 分区</th>
      <th class="num" style="width:64px">字段</th>
      <th class="mid" style="width:80px">状态</th>
      <th class="ops" style="width:300px">操作</th>
    </tr></thead>
    <tbody>
      {{#each tables}}
      <tr>
        <td class="mono">{{tableName}}</td>
        <td>{{title}}</td>
        <td class="mono">{{entityName}}</td>
        <td>{{section}}</td>
        <td class="num">{{columns}}</td>
        <td class="mid"><span class="tag {{stateClass}}">{{stateText}}</span></td>
        <td class="ops">
          <a href="/admin/dev/coder/design?id={{id}}" data-tab data-title="{{title}} · 字段">字段</a>
          <a href="/admin/dev/coder/tableform?id={{id}}" data-dialog>表信息</a>
          <a href="#" data-post="/admin/dev/coder/migrate" data-args="id={{id}}" data-confirm="将按设计创建表或补齐缺少的列，继续吗？">同步数据库</a>
          <a href="/admin/monitor/data?t={{tableName}}" data-tab data-title="{{title}}">管理数据</a>
          <a href="#" data-post="/admin/dev/coder/tabledelete" data-args="id={{id}}" data-confirm="只删除设计，数据库中的表保留，确定吗？">删除</a>
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有设计过表，先新建一张</div>{{/if}}
</div>
