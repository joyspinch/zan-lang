<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
<!-- The admin shell: a sticky sidebar that becomes an off-canvas drawer under
     900px (see app.css), driven by one Alpine boolean. Every admin screen gets
     this frame because the file lives in Admin/View/ and the view keys start
     with "Admin." -->
<div class="shell" x-data="{ open: false }" :class="open ? 'drawer-open' : ''">
  <div class="scrim" @click="open = false"></div>

  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">Z</span>{{brand}}</a>

    <div class="group">概览</div>
    <a class="{{navDashboard}}" href="/admin">仪表盘</a>

    <div class="group">内容</div>
    <a class="{{navPosts}}" href="/admin/posts">文章</a>

    <div class="group">系统</div>
    <a class="{{navUsers}}" href="/admin/users">账号</a>
    <a href="/api/docs" target="_blank">API 文档</a>
    <a href="/admin/metrics/index" target="_blank">运行指标 JSON</a>
    <a href="/admin/index/index" target="_blank">菜单 JSON</a>

    <div class="spacer"></div>
    <a href="/blog">前台博客</a>
    <a href="/admin/logout">退出登录</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" type="button" @click="open = !open" aria-label="菜单">≡</button>
      <span class="title">{{heading}}</span>
      <div class="right">
        <span class="badge">{{account}}</span>
      </div>
    </header>

    <div class="content">
      {{#if flash}}<p class="flash {{flashKind}}">{{flash}}</p>{{/if}}
      <div id="flash" class="stack"></div>
      {{content}}
    </div>
  </div>
</div>
</body>
</html>
