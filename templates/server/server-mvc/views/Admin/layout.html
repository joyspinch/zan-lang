<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
  <!-- No-ops on a page without #charts, so the shell stays one file. -->
  <script src="/static/js/charts.js" defer></script>
</head>
<body>
<!-- The admin shell: a sticky sidebar that becomes an off-canvas drawer under
     900px (see app.css), driven by one Alpine boolean. Every admin screen gets
     this frame because the file lives in Admin/View/ and the view keys start
     with "Admin." -->
<div class="shell" x-data="{ open: false }" :class="open ? 'drawer-open' : ''">
  <div class="scrim" @click="open = false"></div>

  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">Z</span>{{brand}}</a>

    <!-- Navigation comes from the route attributes, filtered by this account's
         permissions (AdminController.Layout -> MenuBuilder). Adding a screen is
         one [Custom(IsMenu = true, MenuGroup = ..., Rank = ...)] on its action;
         there is no list of links here to keep in step with the routes. -->
    {{#each menu}}
      {{#if group}}<div class="group">{{group}}</div>{{/if}}
      {{#if path}}<a class="{{active}}" href="{{path}}">{{title}}</a>{{/if}}
    {{/each}}

    <div class="spacer"></div>
    <a href="/blog">前台博客</a>
    <a href="/admin/logout">退出登录</a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" type="button" @click="open = !open" aria-label="菜单">≡</button>
      <span class="title">{{heading}}</span>
      <div class="right">
        <span class="badge">{{account}}</span>
      </div>
    </header>

    <div class="content">
      {{#if flash}}<p class="flash {{flashKind}}">{{flash}}</p>{{/if}}
      <div id="flash" class="stack"></div>
      {{content}}
    </div>
  </div>
</div>
</body>
</html>
