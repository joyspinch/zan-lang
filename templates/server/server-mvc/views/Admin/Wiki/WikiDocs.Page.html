<div class="toolbar">
  <span class="tag ok">r{{rev}}</span>
  <span class="muted">{{spaceName}} · {{updatedBy}} · {{updatedAt}} · 约 {{minutes}} 分钟 · {{views}} 次阅读</span>
  <span class="sp"></span>
  <a class="btn sm" href="/admin/wiki/history?id={{id}}" data-load>修订历史</a>
  {{#if canUpdate}}<a class="btn sm" href="/admin/wiki/edit?id={{id}}">编辑</a>{{/if}}
  <a class="btn sm" href="/admin/wiki?space={{spaceId}}" data-load>返回列表</a>
</div>
<div class="card wiki-page">
  <h2>{{title}}</h2>
  <div>
    {{{bodyHtml}}}
  </div>
  {{#if hasTags}}
  <div style="margin-top:20px">
    {{#each tags}}<span class="tag">{{name}}</span> {{/each}}
  </div>
  {{/if}}
</div>
