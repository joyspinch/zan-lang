<div class="toolbar">
  <span class="tag">r{{rev}} 历史版本</span>
  <span class="muted">{{title}} · {{editor}} · {{createdAt}} · {{note}}</span>
  <span class="sp"></span>
  <a class="btn sm" href="/admin/wiki/history?id={{id}}" data-load>返回历史</a>
  {{#if canUpdate}}<a class="btn sm" href="#" data-post="/admin/wiki/rollback" data-args="id={{id}}&rev={{rev}}" data-confirm="回滚到 r{{rev}}？会生成一个新版本，历史保留。">回滚到此版本</a>{{/if}}
</div>
<div class="card wiki-page">
  <h2>{{title}}</h2>
  <div>
    {{{bodyHtml}}}
  </div>
</div>
