<form data-submit action="/admin/wiki/save">
  <input type="hidden" name="id" value="{{id}}">
  <input type="hidden" name="spaceId" value="{{spaceId}}">
  <div class="toolbar">
    <b>{{heading}}</b>
    <span class="mono muted">{{#if rev}}r{{rev}}{{/if}}</span>
    <span class="sp"></span>
    {{#if aiReady}}<button class="btn sm" type="button" data-post="/admin/wiki/aiorganize" data-args="id={{id}}" data-confirm="让 AI 整理当前正文？结果会保存为一个新版本。">AI 整理</button>{{/if}}
    <a class="btn sm" href="/admin/wiki?space={{spaceId}}" data-load>返回列表</a>
    <button class="btn sm primary" type="submit">保存</button>
  </div>
  <div class="card">
    <div class="form" style="max-width:640px">
      <label>标题</label>
      <input class="input" name="title" value="{{title}}" required maxlength="128">
      <div class="grid c2" style="gap:12px">
        <div>
          <label>标签（逗号分隔）</label>
          <input class="input" name="tags" value="{{tags}}" maxlength="128">
        </div>
        <div>
          <label>状态</label>
          <select class="input" name="status">
            <option value="1" {{status1}}>发布</option>
            <option value="0" {{status0}}>草稿</option>
          </select>
        </div>
      </div>
      <label>正文（Markdown：# 标题、- 列表、**粗体**、`代码`、``` 围栏、> 引用）</label>
      <textarea class="input mono" name="body" rows="22" style="min-height:420px" required>{{body}}</textarea>
      <label>修订说明</label>
      <input class="input" name="note" value="" maxlength="255" placeholder="这次改了什么（可选）">
    </div>
  </div>
</form>
