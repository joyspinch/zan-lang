<div class="card">
  <header>共享内存表（只读）
    <span class="right hint">共 {{count}} 张表，预留 {{reserved}}，实际驻留 {{resident}}</span>
  </header>
  <table class="table">
    <thead>
      <tr>
        <th>表</th>
        <th class="num" style="width:110px">已用行</th>
        <th class="num" style="width:96px">容量</th>
        <th class="num" style="width:72px">占用率</th>
        <th class="num" style="width:88px">每行字节</th>
        <th class="num" style="width:88px">键长</th>
        <th class="num" style="width:64px">列数</th>
        <th class="num" style="width:104px">预留映射</th>
        <th class="num" style="width:104px">实际驻留</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="mono">{{name}}</td>
        <td class="num">{{used}}</td>
        <td class="num muted">{{capacity}}</td>
        <td class="num muted">{{fill}}%</td>
        <td class="num muted">{{stride}}</td>
        <td class="num muted">{{keySize}}</td>
        <td class="num muted">{{columns}}</td>
        <td class="num muted">{{reserved}}</td>
        <td class="num">{{resident}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">没有共享表</div>{{/if}}
  {{#if partial}}<div class="hint">当前平台无法报告部分表的驻留页，合计为下限。</div>{{/if}}
</div>
