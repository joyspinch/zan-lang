<div class="card">
  <div class="toolbar">
    <b>媒体库</b>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="#" data-upload="/admin/media/upload">上传文件</a>{{/if}}
  </div>
  <table class="table" data-table="sort filter">
    <thead><tr><th style="width:56px">预览</th><th>文件</th><th style="width:70px">类型</th><th class="num" style="width:90px">大小</th><th style="width:120px">上传者</th><th style="width:160px">时间</th><th class="ops">{{iOps}}</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{#if isImage}}<a href="/static/media/{{path}}" target="_blank"><img class="thumb" src="/static/media/{{path}}" alt="{{name}}"></a>{{else}}<span class="tag mono">{{ext}}</span>{{/if}}</td>
        <td><a href="/static/media/{{path}}" target="_blank">{{name}}</a></td>
        <td class="mono">{{ext}}</td>
        <td class="num">{{sizeText}}</td>
        <td>{{uploadedBy}}</td>
        <td>{{dateText}}</td>
        <td class="ops">
          {{#if canDelete}}<a href="#" data-post="/admin/media/delete" data-args="id={{id}}" data-confirm="删除后文件不可恢复，确定吗？">{{iDelete}}</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有上传过文件</div>{{/if}}
</div>
