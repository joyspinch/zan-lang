<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/content/posts/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form wide">
      <label>标题</label>
      <input class="input" name="title" value="{{title}}" required maxlength="120" style="grid-column:2 / -1">
      <label>分类</label>
      <select class="input" name="categoryId">
        <option value="0">未分类</option>
        {{#each categories}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>作者</label>
      <input class="input" name="author" value="{{author}}" maxlength="32">
      <label>标签</label>
      <input class="input" name="tags" value="{{tags}}" maxlength="120" placeholder="逗号分隔">
      <label>封面</label>
      <input class="input" name="cover" value="{{cover}}" maxlength="255" placeholder="图片地址，可留空">
      <label>状态</label>
      <select class="input" name="published">
        <option value="1" {{state1}}>发布</option>
        <option value="0" {{state0}}>草稿</option>
      </select>
      <label>置顶</label>
      <select class="input" name="top">
        <option value="0">否</option>
        <option value="1" {{topChecked}}>是</option>
      </select>
      <label>摘要</label>
      <textarea class="input" name="summary" rows="2" maxlength="255" style="grid-column:2 / -1">{{summary}}</textarea>
      <label>正文</label>
      <textarea class="input" name="body" rows="14" required style="grid-column:2 / -1">{{body}}</textarea>
      <div class="span hint">正文按空行分段展示，摘要留空时自动截取正文开头。</div>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
