<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="keywords" content="{{siteKeywords}}">
  <meta name="description" content="{{siteDescription}}">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="public">
<!-- The one public layout. A module gets its own look by dropping a
     layout.html into its View/ folder (Admin/, Account/); everything else
     falls back to this file, so the site chrome exists once. `body.public`
     is what scopes the marketing styling in app.css to these pages. -->
<header class="site-header">
  <a class="brand" href="/"><span class="brand-mark">Z</span>{{siteTitle}}</a>
  <nav>
    <a href="/" aria-current="{{navHome}}">概览</a>
    <a href="/#why">为什么</a>
    <a href="/#language">语言</a>
    <a href="/#scenes">场景</a>
    <a href="/#platform">工具链</a>
    <a href="/#start">上手</a>
    <a href="/blog" aria-current="{{navBlog}}">博客</a>
    <a href="/login">登录</a>
    <a href="/admin">管理后台</a>
  </nav>
</header>

<main class="container">
  <div id="flash" class="stack"></div>
  {{content}}
</main>

<footer class="site-footer">
  {{#if siteCopyright}}<div>{{siteCopyright}}</div>{{/if}}
  {{#if siteIcp}}<div><a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">{{siteIcp}}</a></div>{{/if}}
  {{#if sitePolice}}<div>{{sitePolice}}</div>{{/if}}
  <div class="site-live" data-live>现在在线 <b data-live-visitors>–</b> 人 · <b data-live-pages>–</b> 个页面 · 本页 <b data-live-ttfb>–</b></div>
  <div>Zan · C# 风格语法 · LLVM 原生代码 · ARC 内存管理</div>
</footer>
{{{siteAnalytics}}}
</body>
</html>
