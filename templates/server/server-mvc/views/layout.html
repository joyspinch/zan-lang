<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/alpine.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
<!-- The one public layout. A module gets its own look by dropping a
     layout.html into its View/ folder (Admin/, Session/); everything else
     falls back to this file, so the site chrome exists once. -->
<header class="site-header">
  <a class="brand" href="/"><span class="brand-mark">Z</span>ZanWeb</a>
  <nav>
    <a href="/" aria-current="{{navHome}}">首页</a>
    <a href="/blog" aria-current="{{navBlog}}">博客</a>
    <a href="/admin">管理后台</a>
  </nav>
</header>

<main class="container">
  <div id="flash" class="stack"></div>
  {{content}}
</main>

<footer class="site-footer">
  Powered by ZanWeb · 服务端渲染 + htmx + Alpine，无构建步骤 · 模板常驻内存，请求零文件 IO
</footer>
</body>
</html>
