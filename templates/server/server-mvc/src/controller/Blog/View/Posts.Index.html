<h1>极简博客</h1>
<p class="meta">
  本页数据来自 <b>{{source}}</b>（cache = {{cacheKind}}，TTL 60s）·
  共 {{count}} 篇 · 连接池 {{pool}}
</p>

<form method="get" action="/blog">
  <input type="text" name="kw" value="{{kw}}" placeholder="按标题搜索（带搜索词的结果不进缓存）">
  <button type="submit">搜索</button>
</form>

{{#each posts}}
<div class="post">
  <a href="/blog/{{id}}"><b>{{title}}</b></a>
  <div class="meta">#{{id}} · {{author}} · {{createdAt}}</div>
</div>
{{/each}}

<form method="post" action="/blog/create">
  <b>发布一篇</b>
  <input type="text" name="title" placeholder="标题">
  <textarea name="body" rows="4" placeholder="正文"></textarea>
  <input type="text" name="author" placeholder="作者（可空）">
  <button type="submit">发布</button>
  <div class="meta">发布后会删掉 <code>blog:list</code> 缓存，列表立刻能看到新文章。</div>
</form>
