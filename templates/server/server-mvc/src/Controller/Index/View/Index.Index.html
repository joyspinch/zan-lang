<h1>{{title}}</h1>
<p class="muted">{{message}}</p>

<div class="stats">
  {{#each features}}
  <div class="card stat">
    <div class="k">{{name}}</div>
    <div class="v" style="font-size:1rem;font-weight:600">{{desc}}</div>
  </div>
  {{/each}}
</div>

<div class="btn-row" style="margin-top:1.4rem">
  <a class="btn btn-primary" href="/blog">极简博客</a>
  <a class="btn" href="/admin">管理后台</a>
</div>

<p class="hint" style="margin-top:1.2rem">
  Try: <code>GET /user/42</code> · <code>GET /api/index/index</code> ·
  <code>POST /api/auth/login (user=admin&amp;pass=...)</code> · <code>GET /api/auth/me</code>
</p>
