<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px auto; max-width: 760px; color: #222; }
    a { color: #0b6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1 { color: #0b6; margin-bottom: 4px; }
    .meta { color: #888; font-size: 13px; }
    .post { padding: 10px 0; border-bottom: 1px solid #eee; }
    form { margin-top: 24px; padding: 16px; background: #fafafa; border: 1px solid #eee; border-radius: 6px; }
    input[type=text], textarea { width: 100%; padding: 7px; margin: 4px 0 10px; box-sizing: border-box;
      border: 1px solid #ddd; border-radius: 4px; font: inherit; }
    button { padding: 7px 16px; background: #0b6; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
<p><a href="/blog">&larr; 博客首页</a></p>
{{content}}
</body>
</html>
