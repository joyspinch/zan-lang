<section class="card auth-card">
  <header>
    <span class="brand-mark">Z</span>
    <div>
      <h2>{{brand}} 管理后台</h2>
      <p class="hint">用你的账号登录以继续</p>
    </div>
  </header>
  <form class="body form" method="post" action="/admin/login">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    <div class="form-row">
      <label for="user">账号</label>
      <input class="input" id="user" type="text" name="user" value="{{user}}"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-row">
      <label for="pass">密码</label>
      <input class="input" id="pass" type="password" name="pass"
             autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">登录</button>
    <p class="hint">
      种子账号 <code>admin</code> / <code>admin1234</code>（见 src/Framework/Schema.zan，
      仅用于开发）。会话是加密并签名的 Cookie，需要环境变量
      <code>ZAN_AUTH_SECRET</code>（至少 32 字符）。
    </p>
  </form>
</section>
