<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/lic/products/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>产品标识</label>
      <input class="input" name="productId" value="{{productId}}" required maxlength="64"
             placeholder="客户端 SDK 里 Product(\"...\") 用的字符串键">
      <label>名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="128">
      <label>备注</label>
      <input class="input" name="note" value="{{note}}" maxlength="256">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{status1}}>启用</option>
        <option value="0" {{status0}}>停用</option>
      </select>
    </div>
    <footer class="endrow">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
