<div class="toolbar">
  <b>{{name}}</b>
  <span class="mono muted">{{kindText}} · {{intervalText}} · {{paramText}}</span>
  <span class="sp"></span>
  {{#if canDelete}}<a class="btn sm" href="#" data-post="/admin/system/jobs/clear" data-args="id={{id}}" data-confirm="清空该任务的全部运行历史？">清空历史</a>{{/if}}
  <a class="btn sm" href="/admin/system/jobs" data-load>{{iBackList}}</a>
</div>
<div class="card">
  <div class="table-scroll">
  <table class="table" data-table="sort">
    <thead><tr><th width="170">开始时间</th><th class="num" width="110">耗时</th><th class="mid" width="80">结果</th><th>消息</th></tr></thead>
    <tbody>
      {{#each logs}}
      <tr>
        <td class="mono">{{startedAt}}</td>
        <td class="num">{{msText}}</td>
        <td class="mid"><span class="tag {{okClass}}">{{okText}}</span></td>
        <td class="wrap">{{message}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  </div>
  {{#if empty}}<div class="empty">还没有运行记录</div>{{/if}}
  <div class="pager">
    <span class="muted">共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    {{#if prev}}<a class="btn sm" href="?id={{id}}&page={{prev}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?id={{id}}&page={{next}}" data-load>下一页</a>{{/if}}
  </div>
</div>
