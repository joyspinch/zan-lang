<div class="card">
  <form class="toolbar" data-search action="/admin/monitor/errors">
    <input class="input w80" type="number" name="h" value="{{hours}}" min="1" max="720" title="最近几小时">
    <button class="btn sm" type="submit">查询</button>
    <a class="btn sm" href="/admin/monitor/errors" data-load>重置</a>
    <span class="sp"></span>
    <span class="hint">共 {{shown}} 条 · 详情已脱敏（不含密钥/令牌/口令）</span>
  </form>
  <div class="table-scroll">
  <table class="table" data-table="sort filter">
    <thead>
      <tr>
        <th class="num" width="70">ID</th>
        <th width="150">时间</th>
        <th width="240">来源</th>
        <th>详情</th>
        <th class="ops" width="88">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td class="muted">{{ts}}</td>
        <td class="mono">{{origin}}</td>
        <td class="ellip">{{detail}}</td>
        <td class="ops"><button class="link-btn" type="button" data-text-preview="{{detail}}">查看详情</button></td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  </div>
  {{#if empty}}<div class="empty">该时间窗内没有错误</div>{{/if}}
</div>
