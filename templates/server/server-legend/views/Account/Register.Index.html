<section class="card auth-card">
  <header>
    <span class="brand-mark">G</span>
    <div>
      <h2>{{brand}} 注册游戏账号</h2>
      <p class="hint">账号全局通用，进入客户端后按区服创建角色</p>
    </div>
  </header>
  {{#if done}}
  <div class="body form">
    <p class="flash ok">注册成功，账号 <b>{{user}}</b> 已创建。</p>
    <p class="hint">启动游戏客户端，连接服务器后用该账号登录，选择区服并创建角色即可进入游戏。密保问题用于在网页或客户端找回密码，请牢记答案。</p>
    <p class="hint"><a href="/">返回服务器状态</a> · <a href="/login">登录管理后台</a></p>
  </div>
  {{else}}
  <form class="body form" method="post" action="/register">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    <div class="form-row">
      <label for="user">账号</label>
      <input class="input" id="user" type="text" name="user" value="{{user}}"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-row">
      <label for="pass">密码</label>
      <input class="input" id="pass" type="password" name="pass"
             autocomplete="new-password" required>
    </div>
    <div class="form-row">
      <label for="pass2">确认密码</label>
      <input class="input" id="pass2" type="password" name="pass2"
             autocomplete="new-password" required>
    </div>
    <div class="form-row">
      <label for="question">密保问题</label>
      <input class="input" id="question" type="text" name="question"
             value="{{question}}" maxlength="50" placeholder="例如：您出生的城市是？" required>
    </div>
    <div class="form-row">
      <label for="answer">密保答案</label>
      <input class="input" id="answer" type="text" name="answer"
             value="{{answer}}" maxlength="50" placeholder="找回密码的唯一凭证" required>
    </div>
    <button class="btn btn-primary" type="submit">注册</button>
    <p class="hint">已有账号？用客户端直接登录 · 忘记密码走 <a href="/forgot">找回密码</a></p>
  </form>
  {{/if}}
</section>
