<div data-title="分配角色 · {{username}}">
  <form data-submit action="/admin/system/users/rolessave">
    <input type="hidden" name="id" value="{{id}}">
    <div class="checks">
      {{#each roles}}
      <label><input type="checkbox" name="roleIds[]" value="{{id}}" {{checked}}> {{name}}</label>
      {{/each}}
    </div>
    <footer class="lay-footer">
      <button class="btn" type="button" data-close>{{iCancel}}</button>
      <button class="btn primary" type="submit">{{iSave}}</button>
    </footer>
  </form>
</div>
