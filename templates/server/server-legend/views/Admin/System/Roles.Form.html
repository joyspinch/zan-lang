<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/system/roles/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="32">
      <label>标识</label>
      <input class="input mono" name="code" value="{{code}}" required maxlength="32" placeholder="如 editor">
      <label>排序</label>
      <input class="input w120" name="rank" value="{{rank}}" type="number" min="0">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{status1}}>启用</option>
        <option value="0" {{status0}}>停用</option>
      </select>
      <label>数据权限</label>
      <select class="input" name="dataScope" data-scope-pick>
        <option value="1" {{scope1}}>全部数据</option>
        <option value="2" {{scope2}}>本部门</option>
        <option value="3" {{scope3}}>本部门及下级</option>
        <option value="4" {{scope4}}>仅本人</option>
        <option value="5" {{scope5}}>自定义部门</option>
      </select>
      <label data-scope-label>自定义部门</label>
      <div class="checks" data-scope-depts>
        {{#each depts}}
        <label><input type="checkbox" name="scopeDepts[]" value="{{id}}" {{checked}}> {{name}}</label>
        {{/each}}
      </div>
      <label>说明</label>
      <textarea class="input" name="description" rows="2" maxlength="255">{{description}}</textarea>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
  <script>
  /* 自定义部门 only means anything for the 自定义 scope, so its checkboxes follow
     the select instead of sitting there dead. */
  (function () {
    var picks = document.querySelectorAll('[data-scope-pick]');
    var pick = picks[picks.length - 1];
    if (!pick) { return; }
    var box = pick.form.querySelector('[data-scope-depts]');
    var lab = pick.form.querySelector('[data-scope-label]');
    function sync() {
      var on = pick.value === '5';
      box.hidden = !on;
      lab.hidden = !on;
    }
    pick.addEventListener('change', sync);
    sync();
  })();
  </script>
</div>
