<div data-title="部门角色 · {{name}}">
  <form data-submit action="/admin/system/departments/rolessave">
    <input type="hidden" name="id" value="{{id}}">
    <p class="muted">该部门的成员自动继承这里勾选的角色，无需再逐人分配。</p>
    <div class="checks">
      {{#each roles}}
      <label><input type="checkbox" name="roleIds[]" value="{{id}}" {{checked}}> {{name}}</label>
      {{/each}}
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
