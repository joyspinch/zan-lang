<div class="card">
  <form class="toolbar" data-search action="/admin/system/logs/login">
    <input class="input w160" type="search" name="kw" value="{{kw}}" placeholder="搜索账号 / IP">
    <button class="btn sm" type="submit">查询</button>
    <a class="btn sm" href="/admin/system/logs/login" data-load>重置</a>
    <span class="sp"></span>
    <a class="btn sm" href="/admin/system/logs" data-tab data-title="操作日志">操作日志</a>
    {{#if canDelete}}<a class="btn sm danger" href="#" data-post="/admin/system/logs/clear" data-args="kind=login" data-confirm="确定清空全部登录日志吗？">清空</a>{{/if}}
  </form>
  <div class="table-scroll">
<table class="table" data-table="sort filter">
    <thead>
      <tr>
        <th class="num" width="64">ID</th>
        <th width="130">账号</th>
        <th width="130">IP</th>
        <th>客户端</th>
        <th width="140">时间</th>
        <th width="160">说明</th>
        <th class="mid" width="64">结果</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{username}}</td>
        <td class="mono muted">{{ip}}</td>
        <td class="ellip muted">{{agent}}</td>
        <td class="muted nowrap">{{createdAt}}</td>
        <td class="muted">{{message}}</td>
        <td class="mid"><span class="tag {{okClass}}">{{okText}}</span></td>
      </tr>
      {{/each}}
    </tbody>
  </table>
</div>
  {{#if empty}}<div class="empty">暂无登录日志</div>{{/if}}
  <div class="pager">
    <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    <span class="sp"></span>
    {{#if prev}}<a class="btn sm" href="?page={{prev}}&kw={{kw}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?page={{next}}&kw={{kw}}" data-load>下一页</a>{{/if}}
  </div>
</div>
