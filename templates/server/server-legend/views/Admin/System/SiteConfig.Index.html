<form data-submit action="/admin/system/settings/save">
  <div class="card">
    <div class="subtabs" data-setting-tabs>
      {{#each tabs}}
      <button class="subtab {{on}}" type="button" data-pane="{{group}}">{{group}}</button>
      {{/each}}
    </div>
    <div class="body">
      <div class="form">
        {{#each fields}}
        {{#if group}}</div><div class="form set-pane {{open}}" data-pane-body="{{group}}">{{/if}}
        {{#if label}}<label title="{{tip}}">{{label}}</label>{{/if}}
        {{#if area}}<textarea class="input" name="{{name}}" rows="3" placeholder="{{tip}}">{{value}}</textarea>{{/if}}
        {{#if line}}<input class="input" name="{{name}}" value="{{value}}" placeholder="{{tip}}">{{/if}}
        {{#if secret}}<input class="input" type="password" name="{{name}}" value="{{value}}" placeholder="{{tip}}" autocomplete="new-password">{{/if}}
        {{#if bool}}
        <div class="sw-cell">
          <input type="hidden" name="{{name}}" value="0">
          <label class="sw">
            <input type="checkbox" name="sw.{{name}}" value="1" {{#if on}}checked{{/if}}>
            <span></span>
          </label>
          {{#if tip}}<span class="muted">{{tip}}</span>{{/if}}
        </div>
        {{/if}}
        {{/each}}
      </div>
    </div>
  </div>

  {{#if canUpdate}}
  <div class="card">
    <div class="toolbar">
      <span class="muted">保存后前台立即使用新的配置。</span>
      <span class="sp"></span>
      <button class="btn primary" type="submit">保存配置</button>
    </div>
  </div>
  {{/if}}
  {{#if empty}}<div class="card"><div class="empty">没有可编辑的配置项</div></div>{{/if}}
</form>
