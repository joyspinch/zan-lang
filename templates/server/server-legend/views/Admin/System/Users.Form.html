<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/system/users/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>账号</label>
      <input class="input" name="username" value="{{username}}" required maxlength="32" placeholder="登录名">
      <label>姓名</label>
      <input class="input" name="nickname" value="{{nickname}}" maxlength="32">
      <label>邮箱</label>
      <input class="input" name="email" value="{{email}}" maxlength="64">
      <label>手机</label>
      <input class="input" name="mobile" value="{{mobile}}" maxlength="20">
      <label>部门</label>
      <select class="input" name="departmentId">
        <option value="0">未分配</option>
        {{#each depts}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{status1}}>启用</option>
        <option value="0" {{status0}}>禁用</option>
      </select>
      {{#if edit}}
      <label>密码</label>
      <div class="hint">修改密码请在列表中使用「重置密码」。</div>
      {{/if}}
      {{#if new}}
      <label>初始密码</label>
      <input class="input" type="password" name="password" minlength="8" required placeholder="至少 8 位">
      {{/if}}
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
