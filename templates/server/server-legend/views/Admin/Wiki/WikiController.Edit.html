<form data-submit action="/admin/wiki/save">
  <input type="hidden" name="id" value="{{id}}">
  <input type="hidden" name="spaceId" value="{{spaceId}}">
  <div class="toolbar">
    <b>{{heading}}</b>
    <span class="mono muted">{{#if rev}}r{{rev}}{{/if}}</span>
    <span class="sp"></span>
    {{#if rev}}{{#if aiReady}}{{#if canUpdate}}<button class="btn sm" type="button" data-post="/admin/wiki/aiorganize" data-args="id={{id}}" data-confirm="让 AI 整理已保存的正文？未保存的修改不会包含在结果中，整理结果会保存为新版本。">AI 整理</button>{{/if}}{{/if}}{{/if}}
    <a class="btn sm" href="/admin/wiki?space={{spaceId}}" data-load>{{iBackList}}</a>
    <button class="btn sm primary" type="submit">{{iSave}}</button>
  </div>
  <div class="card">
    <div class="body">
      <div class="form" style="max-width:860px">
        <label>标题</label>
        <input class="input" name="title" value="{{title}}" required maxlength="128">
        <label>标签</label>
        <input class="input" name="tags" value="{{tags}}" maxlength="128" placeholder="英文逗号分隔">
        <label>状态</label>
        <select class="input" name="status">
          <option value="1" {{status1}}>发布</option>
          <option value="0" {{status0}}>草稿</option>
        </select>
        <label>正文</label>
        <textarea class="input mono" name="body" rows="20" style="min-height:360px" required>{{body}}</textarea>
        <div class="span hint">支持 Markdown 格式：# 标题、- 列表、**粗体**、`代码`、``` 代码块、> 引用</div>
        <label>修订说明</label>
        <input class="input" name="note" value="" maxlength="255" placeholder="本次修订内容简述（可选）">
      </div>
    </div>
  </div>
</form>
