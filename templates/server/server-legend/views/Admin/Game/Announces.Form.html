<form data-submit action="/admin/game/announces/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}</header>
    <div class="body form">
      <label>标题</label><input class="input" name="title" value="{{title}}" maxlength="128" required>
      <label>正文</label><textarea class="input" name="body" rows="4" maxlength="512" required>{{body}}</textarea>
      <label>状态</label>
      <select class="input" name="enabled">
        <option value="1" {{on1}}>启用（登录时下发）</option>
        <option value="0" {{on0}}>停用</option>
      </select>
    </div>
  </div>
</form>
