<form data-submit action="/admin/game/drops/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}</header>
    <div class="body form">
      <label>怪物</label>
      <select class="input" name="mobId">
        {{#each mobs}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>物品</label>
      <select class="input" name="itemId">
        {{#each items}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>概率(万分比)</label><input class="input" name="rate" type="number" min="1" max="10000" value="{{rate}}">
      <label class="muted"></label><span class="muted">每次击杀独立掷骰，1000 = 10%；改完即时热重载</span>
    </div>
  </div>
</form>
