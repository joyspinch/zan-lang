<form data-submit action="/admin/game/skills/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}</header>
    <div class="body form">
      <label>技能名</label><input class="input" name="name" value="{{name}}" maxlength="32" required>
      <label>职业</label>
      <select class="input" name="job">
        <option value="0" {{job0}}>战士</option>
        <option value="1" {{job1}}>法师</option>
        <option value="2" {{job2}}>道士</option>
      </select>
      <label>栏位(0-7)</label><input class="input" name="slot" type="number" min="0" max="7" value="{{slot}}">
      <label>类型</label>
      <select class="input" name="kind">
        <option value="active" {{kindA}}>主动</option>
        <option value="passive" {{kindP}}>被动</option>
      </select>
      <label>冷却(秒)</label><input class="input" name="cooldown" type="number" min="0" value="{{cooldown}}">
      <label>耗蓝</label><input class="input" name="mana" type="number" min="0" value="{{mana}}">
      <label>伤害系数%</label><input class="input" name="damagePct" type="number" min="0" value="{{damagePct}}">
      <label>每级伤害%</label><input class="input" name="damagePerLevel" type="number" min="0" value="{{damagePerLevel}}">
      <label>治疗系数%</label><input class="input" name="healPct" type="number" min="0" value="{{healPct}}">
      <label>每级治疗%</label><input class="input" name="healPerLevel" type="number" min="0" value="{{healPerLevel}}">
      <label>被动每级伤害%</label><input class="input" name="passiveDamagePct" type="number" min="0" value="{{passiveDamagePct}}">
      <label>被动每级防御%</label><input class="input" name="passiveDefensePct" type="number" min="0" value="{{passiveDefensePct}}">
      <label>等级上限</label><input class="input" name="maxLevel" type="number" min="1" value="{{maxLevel}}">
      <label>升级金币</label><input class="input" name="trainGold" type="number" min="0" value="{{trainGold}}">
      <label>升级铁矿</label><input class="input" name="trainIron" type="number" min="0" value="{{trainIron}}">
      <label>流派</label><input class="input" name="school" value="{{school}}" maxlength="16">
      <label>美术键</label><input class="input" name="picture" value="{{picture}}" maxlength="64">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{on1}}>启用</option>
        <option value="0" {{on0}}>停用</option>
      </select>
    </div>
  </div>
</form>
