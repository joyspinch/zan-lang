<form data-submit action="/admin/game/mobs/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}</header>
    <div class="body form">
      <label>怪物名</label><input class="input" name="name" value="{{name}}" maxlength="32" required>
      <label>地图</label>
      <select class="input" name="mapId">
        {{#each maps}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>等级</label><input class="input" name="level" type="number" min="1" value="{{level}}">
      <label>HP</label><input class="input" name="hp" type="number" min="1" value="{{hp}}">
      <label>攻击</label><input class="input" name="atk" type="number" min="0" value="{{atk}}">
      <label>防御</label><input class="input" name="def" type="number" min="0" value="{{def}}">
      <label>经验</label><input class="input" name="exp" type="number" min="0" value="{{exp}}">
      <label>金币下限</label><input class="input" name="goldMin" type="number" min="0" value="{{goldMin}}">
      <label>金币上限</label><input class="input" name="goldMax" type="number" min="0" value="{{goldMax}}">
      <label>重生(秒)</label><input class="input" name="respawnSec" type="number" min="1" value="{{respawnSec}}">
      <label>数量</label><input class="input" name="count" type="number" min="1" max="99" value="{{count}}">
      <label class="muted"></label><span class="muted">掉落清单在「<a href="/admin/game/drops{{#if edit}}?mob={{id}}{{/if}}" data-load>爆率管理</a>」按怪维护（一怪多条、各自掷骰）</span>
      <label>美术键</label><input class="input" name="picture" value="{{picture}}" maxlength="64" placeholder="怪物图编号">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{on1}}>启用</option>
        <option value="0" {{on0}}>停用（不再重生）</option>
      </select>
    </div>
  </div>
</form>
