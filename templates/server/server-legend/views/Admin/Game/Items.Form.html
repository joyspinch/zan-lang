<form data-submit action="/admin/game/items/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}</header>
    <div class="body form">
      <label>名称</label><input class="input" name="name" value="{{name}}" maxlength="32" required>
      <label>类型</label>
      <select class="input" name="kind">
        <option value="0" {{kind0}}>消耗品（hp=使用回复）</option>
        <option value="1" {{kind1}}>武器（atk）</option>
        <option value="2" {{kind2}}>防具（def）</option>
        <option value="3" {{kind3}}>材料（掉落+卖店）</option>
      </select>
      <label>攻击</label><input class="input" name="atk" type="number" min="0" value="{{atk}}">
      <label>防御</label><input class="input" name="def" type="number" min="0" value="{{def}}">
      <label>回复</label><input class="input" name="hp" type="number" min="0" value="{{hp}}">
      <label>价格</label><input class="input" name="price" type="number" min="0" value="{{price}}">
      <label>等级门槛</label><input class="input" name="minLevel" type="number" min="0" value="{{minLevel}}">
      <label>美术键</label><input class="input" name="picture" value="{{picture}}" maxlength="64" placeholder="物品图编号，如 58 → item/00058.png">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{on1}}>启用</option>
        <option value="0" {{on0}}>停用</option>
      </select>
    </div>
  </div>
</form>
