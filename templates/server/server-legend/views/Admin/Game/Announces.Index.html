<div class="card">
  <form class="toolbar" action="/admin/game/announces">
    <span class="muted">启用中的公告在玩家登录时下发；「推送」即时发给全部在线会话。</span>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/game/announces/form" data-dialog>发布公告</a>{{/if}}
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:200px">标题</th>
        <th>正文</th>
        <th style="width:96px">发布人</th>
        <th style="width:140px">时间</th>
        <th class="mid" style="width:64px">状态</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{title}}</td>
        <td class="ellip muted">{{body}}</td>
        <td>{{author}}</td>
        <td class="muted">{{createdAt}}</td>
        <td class="mid"><span class="tag {{onClass}}">{{onText}}</span></td>
        <td class="ops">
          {{#if canUpdate}}<a href="/admin/game/announces/form?id={{id}}" data-dialog>编辑</a>
          <a href="#" data-post="/admin/game/announces/push" data-args="id={{id}}" data-confirm="把这条公告推送给全部在线玩家吗？">推送</a>{{/if}}
          {{#if canDelete}}<a href="#" data-post="/admin/game/announces/delete" data-args="id={{id}}" data-confirm="删除后不可恢复，确定删除该公告吗？">删除</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有公告</div>{{/if}}
</div>
