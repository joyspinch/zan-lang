<div class="card">
  <form class="toolbar" action="/admin/game/realms">
    <span class="muted">维护中的区服拒绝玩家进入（enter/create 被网关拒绝），客户端列表可置灰展示。</span>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/game/realms/form" data-dialog>新增区服</a>{{/if}}
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:180px">区服名称</th>
        <th class="num" style="width:64px">排序</th>
        <th class="num" style="width:72px">在线</th>
        <th class="mid" style="width:72px">状态</th>
        <th style="width:150px">创建时间</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{name}}</td>
        <td class="num">{{sort}}</td>
        <td class="num">{{online}}</td>
        <td class="mid"><span class="tag {{stateClass}}">{{stateText}}</span></td>
        <td class="muted">{{createdAt}}</td>
        <td class="ops">
          {{#if canUpdate}}<a href="/admin/game/realms/form?id={{id}}" data-dialog>编辑</a>{{/if}}
          {{#if canDelete}}<a href="#" data-post="/admin/game/realms/delete" data-args="id={{id}}" data-confirm="删除后不可恢复，确定删除该区服吗？">删除</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有区服 — 新增一个并保持开放状态，客户端就能看到了</div>{{/if}}
</div>
