<form data-submit action="/admin/game/maps/save">
  <input type="hidden" name="id" value="{{id}}">
  <div class="card">
    <header>{{dialogTitle}}</header>
    <div class="body form">
      <label>名称</label><input class="input" name="name" value="{{name}}" maxlength="64" required>
      <label>等级门槛</label><input class="input" name="minLevel" type="number" min="1" value="{{minLevel}}">
      <label>排序</label><input class="input" name="sortOrder" type="number" min="0" value="{{sortOrder}}">
      <label>美术键</label><input class="input" name="picture" value="{{picture}}" maxlength="64" placeholder="地图缩略图编号">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{on1}}>开放</option>
        <option value="0" {{on0}}>维护（拒绝进入）</option>
      </select>
    </div>
  </div>
</form>
