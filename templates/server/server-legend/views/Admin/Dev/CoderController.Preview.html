<div class="code-preview">
  {{#if existsNote}}<div class="metric-note">{{existsNote}}</div>{{/if}}
  <div class="subtabs" data-code-tabs>
    <button class="subtab on" type="button" data-code="model">Model</button>
    <button class="subtab" type="button" data-code="controller">后台控制器</button>
    <button class="subtab" type="button" data-code="dao">Dao</button>
    <button class="subtab" type="button" data-code="list">后台列表视图</button>
    <button class="subtab" type="button" data-code="form">后台表单视图</button>
    {{#if api}}<button class="subtab" type="button" data-code="api">JSON 接口</button>{{/if}}
  </div>
  <pre class="code open" data-code-body="model">{{model}}</pre>
  <pre class="code" data-code-body="controller">{{controller}}</pre>
  <pre class="code" data-code-body="dao">{{dao}}</pre>
  <pre class="code" data-code-body="list">{{list}}</pre>
  <pre class="code" data-code-body="form">{{form}}</pre>
  {{#if api}}<pre class="code" data-code-body="api">{{api}}</pre>{{/if}}
</div>
