<form id="ai-design-form" data-table="{{tableId}}">
  <div class="form">
    <label>业务描述</label>
    <textarea class="input" name="desc" rows="5" maxlength="2000"
      placeholder="例：商品表，要有名称、货号、分类（关联）、品牌字典、售价、库存、上下架开关、详情富文本、上架时间"></textarea>
  </div>
  <p class="muted fs12 mt8">
    AI 只出草案：生成后逐列勾选，点「应用所选」才写入设计；写入后仍需点「同步数据库」才建列。
    已有字段不会重复生成。</p>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>{{iCancel}}</button>
    <button class="btn primary" type="submit" id="ai-go">生成设计草稿</button>
  </footer>
</form>
<div id="ai-review" hidden>
  <p class="muted fs12 mb8" id="ai-note"></p>
  <div class="table-scroll maxh52">
    <table class="table">
      <thead><tr>
        <th width="30"></th>
        <th width="130">字段</th><th width="110">名称</th>
        <th width="80">类型</th><th width="80">控件</th>
        <th width="120">字典/关联</th>
        <th class="mid" width="44">列</th>
        <th class="mid" width="44">筛</th>
        <th class="mid" width="44">增</th>
        <th class="mid" width="44">改</th>
        <th class="mid" width="44">必填</th>
      </tr></thead>
      <tbody id="ai-rows"></tbody>
    </table>
  </div>
  <footer class="lay-footer between">
    <label class="fs12"><input type="checkbox" id="ai-all" checked> 全选</label>
    <span class="row8">
      <button class="btn" type="button" id="ai-back">返回修改</button>
      <button class="btn primary" type="button" id="ai-apply">应用所选</button>
    </span>
  </footer>
</div>
<script src="/static/js/ai-form.js" defer></script>
