<div class="grid c2">
  <div class="card">
    <header>基本资料</header>
    <div class="body">
      <form data-submit action="/admin/profile/save">
        <div class="form">
          <label>账号</label><div class="mono">{{username}} {{#if super}}<span class="tag warn">超管</span>{{/if}}</div>
          <label>姓名</label><input class="input" name="nickname" value="{{nickname}}" maxlength="32">
          <label>邮箱</label><input class="input" name="email" value="{{email}}" maxlength="64">
          <label>手机</label><input class="input" name="mobile" value="{{mobile}}" maxlength="20">
          <label>角色</label>
          <div>
            {{#each roles}}<span class="tag">{{name}}</span> {{/each}}
            {{#if noRoles}}<span class="muted">未分配角色</span>{{/if}}
          </div>
          <label>创建时间</label><div class="muted">{{createdAt}}</div>
          <div class="span"><button class="btn primary" type="submit">保存资料</button></div>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <header>修改密码</header>
    <div class="body">
      <form data-submit action="/admin/profile/password">
        <div class="form">
          <label>当前密码</label><input class="input" type="password" name="current" required>
          <label>新密码</label><input class="input" type="password" name="password" minlength="8" required placeholder="至少 8 位">
          <label>确认</label><input class="input" type="password" name="confirm" minlength="8" required>
          <div class="span hint">修改成功后需要使用新密码重新登录。</div>
          <div class="span"><button class="btn primary" type="submit">修改密码</button></div>
        </div>
      </form>
    </div>
  </div>
</div>
