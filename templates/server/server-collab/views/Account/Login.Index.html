<section class="card auth-card">
  <header>
    <span class="brand-mark">Z</span>
    <div>
      <h2>{{brand}} {{heading}}</h2>
      <p class="hint">用你的账号登录以继续</p>
    </div>
  </header>
  <form class="body form" method="post" action="{{action}}">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    <div class="form-row">
      <label for="user">账号</label>
      <input class="input" id="user" type="text" name="user" value="{{user}}"
             autocomplete="username" autofocus required>
    </div>
    <div class="form-row">
      <label for="pass">密码</label>
      <input class="input" id="pass" type="password" name="pass"
             autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary" type="submit">登录</button>
    {{#if authLinks}}
    <p class="hint">
      {{#if canRegister}}<a href="/register">注册账号</a>{{/if}}
      {{#if canReset}}<a href="/forgot">忘记密码</a>{{/if}}
    </p>
    {{/if}}
    {{#if home}}<p class="hint"><a href="/">返回首页</a></p>{{/if}}
    {{#if demo}}<p class="hint">默认账号 <code>admin</code> / <code>admin1234</code>，请在首次登录后修改密码。</p>{{/if}}
  </form>
</section>
