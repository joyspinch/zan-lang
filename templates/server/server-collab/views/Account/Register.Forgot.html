<section class="card auth-card">
  <header>
    <span class="brand-mark">Z</span>
    <div>
      <h2>找回密码</h2>
      <p class="hint">用注册时的邮箱接收验证码</p>
    </div>
  </header>
  <form class="body form" method="post" action="/forgot">
    {{#if error}}<p class="flash bad">{{error}}</p>{{/if}}
    {{#if done}}<p class="flash ok">{{done}}</p>{{/if}}
    <div class="form-row">
      <label for="email">邮箱</label>
      <input class="input" id="email" type="email" name="email" value="{{email}}"
             autocomplete="email" autofocus required>
    </div>
    <div class="form-row">
      <label for="code">验证码</label>
      <div class="code-row">
        <input class="input" id="code" type="text" name="code" inputmode="numeric"
               maxlength="6" autocomplete="one-time-code" required>
        <button class="btn" type="button" data-send-code="/forgot/code">获取验证码</button>
      </div>
    </div>
    <div class="form-row">
      <label for="pass">新密码</label>
      <input class="input" id="pass" type="password" name="pass"
             autocomplete="new-password" minlength="8" required>
    </div>
    <button class="btn btn-primary" type="submit">重设密码</button>
    <p class="hint">已有账号？<a href="/login">返回登录</a></p>
  </form>
</section>
