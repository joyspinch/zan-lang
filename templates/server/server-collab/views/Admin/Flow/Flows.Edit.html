<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/flow/flows/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>流程名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="64" placeholder="如：商品上架流程">
      <label>说明</label>
      <input class="input" name="description" value="{{description}}" maxlength="256">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{status1}}>启用</option>
        <option value="0" {{status0}}>停用</option>
      </select>
    </div>

    <h4 style="margin:16px 0 8px">流程节点（每行一环，按「顺序」字段从小到大流转）</h4>
    <table class="grid" id="node-table">
      <thead>
        <tr><th style="width:56px">顺序</th><th>环节名称</th><th style="width:120px">责任部门</th><th style="width:120px">指定员工</th><th style="width:88px">执行者</th><th>AI 指令</th></tr>
      </thead>
      <tbody>
        {{#each nodes}}
        <tr>
          <td><input class="input" name="{{sortField}}" value="{{sort}}" style="width:48px"></td>
          <td><input class="input" name="{{nameField}}" value="{{name}}" required maxlength="64"></td>
          <td><select class="input" name="{{deptField}}">
            <option value="0">不限</option>
            {{#each ../depts}}<option value="{{id}}">{{name}}</option>{{/each}}
          </select></td>
          <td><select class="input" name="{{userField}}">
            <option value="0">未指定</option>
            {{#each ../users}}<option value="{{id}}">{{name}}</option>{{/each}}
          </select></td>
          <td><select class="input" name="{{kindField}}">
            <option value="human" {{selectedHuman}}>人工</option>
            <option value="ai" {{selectedAi}}>AI</option>
          </select></td>
          <td><input class="input" name="{{promptField}}" value="{{aiPrompt}}" maxlength="512" placeholder="AI 节点执行指令"></td>
        </tr>
        {{/each}}
        {{#each slots}}
        <tr>
          <td><input class="input" name="{{sortField}}" value="{{nextSort}}" style="width:48px"></td>
          <td><input class="input" name="{{nameField}}" maxlength="64" placeholder="留空忽略此行"></td>
          <td><select class="input" name="{{deptField}}">
            <option value="0">不限</option>
            {{#each ../depts}}<option value="{{id}}">{{name}}</option>{{/each}}
          </select></td>
          <td><select class="input" name="{{userField}}">
            <option value="0">未指定</option>
            {{#each ../users}}<option value="{{id}}">{{name}}</option>{{/each}}
          </select></td>
          <td><select class="input" name="{{kindField}}">
            <option value="human">人工</option>
            <option value="ai">AI</option>
          </select></td>
          <td><input class="input" name="{{promptField}}" maxlength="512" placeholder="AI 节点执行指令"></td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    <p class="tip">已有环节直接改；空行填上环节名即新增（共 {{slotCount}} 个空位，保存后可再编辑）。</p>

    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
