<div class="page">
  <div class="page-head">
    <h2>{{tabTitle}}</h2>
    <div class="ops">
      <a class="btn {{doneOff}}" href="/admin/flow/tasks" data-load>待办</a>
      <a class="btn {{doneOn}}" href="/admin/flow/tasks?done=1" data-load>已办</a>
    </div>
  </div>

  <div class="card">
    <table class="grid">
      <thead>
        <tr><th>编号</th><th>实例</th><th>环节</th><th>状态</th><th>到达时间</th><th class="ops-col">操作</th></tr>
      </thead>
      <tbody>
        {{#each rows}}
        <tr>
          <td>{{id}}</td>
          <td>{{inst}}</td>
          <td>{{node}}</td>
          <td>{{status}}</td>
          <td>{{createdAt}}</td>
          <td>
            <a class="btn sm" href="/admin/flow/tasks/detail?id={{id}}" data-dialog data-title="任务详情">详情</a>
            {{#if canReport}}<a class="btn sm primary" href="/admin/flow/tasks/form?id={{id}}" data-dialog data-title="汇报并完成">汇报</a>{{/if}}
          </td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    {{#if empty}}<div class="empty">{{emptyText}}</div>{{/if}}
    <div class="pager">
      <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
      <span class="sp"></span>
      {{#if prev}}<a class="btn sm" href="?page={{prev}}&done={{done}}" data-load>上一页</a>{{/if}}
      {{#if next}}<a class="btn sm" href="?page={{next}}&done={{done}}" data-load>下一页</a>{{/if}}
    </div>
  </div>
</div>
