<div class="page">
  <div class="page-head">
    <h2>通知中心</h2>
    <div class="ops">
      <a class="btn" href="#" data-post="/admin/flow/notifies/read" data-args="">全部标记已读</a>
    </div>
  </div>

  <div class="card">
    <table class="grid">
      <thead>
        <tr><th style="width:72px">类型</th><th>内容</th><th style="width:96px">时间</th><th class="ops-col">操作</th></tr>
      </thead>
      <tbody>
        {{#each rows}}
        <tr class="{{#if unread}}row-unread{{/if}}">
          <td>{{kindText}}</td>
          <td>{{content}}</td>
          <td>{{createdAt}}</td>
          <td>
            <a class="btn sm" href="{{link}}" data-tab data-title="通知跳转">前往</a>
          </td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    {{#if empty}}<div class="empty">没有通知</div>{{/if}}
    <div class="pager">
      <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
      <span class="sp"></span>
      {{#if prev}}<a class="btn sm" href="?page={{prev}}" data-load>上一页</a>{{/if}}
      {{#if next}}<a class="btn sm" href="?page={{next}}" data-load>下一页</a>{{/if}}
    </div>
  </div>
</div>
