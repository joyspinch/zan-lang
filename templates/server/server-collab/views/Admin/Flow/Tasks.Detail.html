<div data-title="{{dialogTitle}}">
  <div class="form">
    <p><b>实例：</b>{{inst}}</p>
    <p><b>环节：</b>{{node}} · <b>状态：</b>{{status}}</p>
    {{#if result}}<p><b>结论：</b>{{result}}</p>{{/if}}
  </div>

  <h4 style="margin:12px 0 6px">进度汇报（流水）</h4>
  <table class="grid">
    <thead><tr><th style="width:96px">汇报人</th><th>内容</th><th style="width:96px">时间</th></tr></thead>
    <tbody>
      {{#each logs}}
      <tr><td>{{who}}</td><td>{{content}}</td><td>{{createdAt}}</td></tr>
      {{/each}}
    </tbody>
  </table>
  {{#if logsEmpty}}<p class="tip">还没有汇报记录</p>{{/if}}
</div>
