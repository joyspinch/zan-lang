<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/flow/flows/start">
    <input type="hidden" name="defId" value="{{id}}">
    <div class="form">
      <label>实例标题</label>
      <input class="input" name="title" required maxlength="128" placeholder="如：2026秋季连衣裙上架">
      <label>业务关联（可选）</label>
      <input class="input" name="bizRef" maxlength="64" placeholder="如 wms.sku:3">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">发起</button>
    </footer>
  </form>
</div>
