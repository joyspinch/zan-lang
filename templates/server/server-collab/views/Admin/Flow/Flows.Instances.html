<div class="page">
  <div class="page-head">
    <h2>流程实例</h2>
    <div class="ops">
      <form class="bar" action="/admin/flow/flows/instances" method="get" data-search>
        <input type="search" name="kw" value="{{kw}}" placeholder="按标题搜索">
        <button class="btn" type="submit">搜索</button>
      </form>
    </div>
  </div>

  <div class="card">
    <table class="grid">
      <thead>
        <tr><th>编号</th><th>标题</th><th>流程</th><th>当前环节</th><th>状态</th><th>发起时间</th><th class="ops-col">操作</th></tr>
      </thead>
      <tbody>
        {{#each rows}}
        <tr>
          <td>{{id}}</td>
          <td>{{title}}</td>
          <td>{{def}}</td>
          <td>{{node}}</td>
          <td>{{status}}</td>
          <td>{{createdAt}}</td>
          <td>
            {{#if running}}{{#if canKill}}<a href="#" data-post="/admin/flow/flows/kill" data-args="id={{id}}" data-confirm="终止后流程不再流转，确定终止？">终止</a>{{/if}}{{/if}}
          </td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    {{#if empty}}<div class="empty">还没有流程实例，到「流程编排」里对某个流程点「发起」</div>{{/if}}
    <div class="pager">
      <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
      <span class="sp"></span>
      {{#if prev}}<a class="btn sm" href="?page={{prev}}&kw={{kw}}" data-load>上一页</a>{{/if}}
      {{#if next}}<a class="btn sm" href="?page={{next}}&kw={{kw}}" data-load>下一页</a>{{/if}}
    </div>
  </div>
</div>
