<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/flow/tasks/report">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>实例 / 环节</label>
      <p>{{inst}} · {{node}}</p>
      <label>汇报内容</label>
      <textarea class="input" name="report" rows="4" required maxlength="512" placeholder="进度说明或完成结论"></textarea>
      <label>@相关责任人（通知他们进度，可多选）</label>
      <select class="input" name="mentions" multiple size="5">
        {{#each users}}<option value="{{id}}">{{name}}</option>{{/each}}
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">提交并流转</button>
    </footer>
  </form>
</div>
