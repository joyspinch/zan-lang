<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/wms/skus/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>SKU 编码 <i class="req">*</i></label>
      <input class="input" name="sku" value="{{sku}}" maxlength="64" required placeholder="如 SKU001">
      <label>名称 <i class="req">*</i></label>
      <input class="input" name="name" value="{{name}}" maxlength="128" required>
      <label>单位</label>
      <input class="input" name="unit" value="{{unit}}" maxlength="32" placeholder="件/箱/千克">
      <label>规格</label>
      <input class="input" name="spec" value="{{spec}}" maxlength="256">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
