<div class="card">
  <form class="toolbar" data-search action="/admin/wms/warehouses">
    <input class="input w160" type="search" name="kw" value="{{kw}}" placeholder="搜索仓库名称">
    <button class="btn sm" type="submit">查询</button>
    <a class="btn sm" href="/admin/wms/warehouses" data-load>重置</a>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/wms/warehouses/form" data-dialog>新增仓库</a>{{/if}}
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:160px">名称</th>
        <th style="width:120px">编码</th>
        <th>位置</th>
        <th class="mid" style="width:72px">状态</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{name}}</td>
        <td class="muted">{{code}}</td>
        <td class="muted">{{location}}</td>
        <td class="mid"><span class="tag {{statusClass}}">{{statusText}}</span></td>
        <td class="ops">
          {{#if canUpdate}}<a href="/admin/wms/warehouses/form?id={{id}}" data-dialog>编辑</a>
          <a href="#" data-post="/admin/wms/warehouses/status" data-args="id={{id}}&status={{nextStatus}}">{{toggleText}}</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">没有符合条件的仓库</div>{{/if}}
  <div class="pager">
    <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    <span class="sp"></span>
    {{#if prev}}<a class="btn sm" href="?page={{prev}}&kw={{kw}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?page={{next}}&kw={{kw}}" data-load>下一页</a>{{/if}}
  </div>
</div>
