<div data-title="导入商品">
  <div class="form">
    <label>CSV 文件</label>
    <input type="file" id="skimpFile" accept=".csv,text/csv">
    <label>导入说明</label>
    <div class="muted">UTF-8 编码 CSV；SKU 编码重复的行会报错跳过。</div>
    <label>模板下载</label>
    <div><a class="btn sm" href="/admin/wms/skus/template" data-export>下载模板</a></div>
  </div>
  <div id="skimpResult"></div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn primary" type="button" id="skimpGo">开始导入</button>
  </footer>
  <script src="/static/js/import-skus.js" defer></script>
</div>
