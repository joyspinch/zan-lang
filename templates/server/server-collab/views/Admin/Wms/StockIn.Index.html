<div class="card">
  <form class="toolbar" data-search action="/admin/wms/stockin">
    <button class="btn sm" type="submit">刷新</button>
    <a class="btn sm" href="/admin/wms/stockin" data-load>重置</a>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/wms/stockin/create" data-dialog>登记入库</a>{{/if}}
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:160px">单号</th>
        <th style="width:160px">仓库</th>
        <th style="width:160px">商品</th>
        <th class="num" style="width:100px">数量</th>
        <th style="width:120px">登记时间</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{billNo}}</td>
        <td>{{warehouse}}</td>
        <td>{{sku}}</td>
        <td class="num">{{qty}}</td>
        <td class="muted">{{createdAt}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有入库记录，先到「仓库管理」建一个仓库</div>{{/if}}
  <div class="pager">
    <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    <span class="sp"></span>
    {{#if prev}}<a class="btn sm" href="?page={{prev}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?page={{next}}" data-load>下一页</a>{{/if}}
  </div>
</div>
