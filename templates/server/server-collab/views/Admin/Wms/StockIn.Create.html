<div data-title="登记入库">
  <form data-submit action="/admin/wms/stockin/submit">
    <div class="form">
      <label>仓库</label>
      <select class="input" name="warehouseId" required>
        <option value="0">请选择</option>
        {{#each warehouses}}<option value="{{id}}">{{name}}</option>{{/each}}
      </select>
      <label>商品</label>
      <select class="input" name="skuId" required>
        <option value="0">请选择</option>
        {{#each skus}}<option value="{{id}}">{{name}}</option>{{/each}}
      </select>
      <label>数量</label>
      <input class="input" type="number" name="qty" min="1" required placeholder="入库数量">
      <label>备注</label>
      <input class="input" name="remark" maxlength="256">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">提交</button>
    </footer>
  </form>
</div>
