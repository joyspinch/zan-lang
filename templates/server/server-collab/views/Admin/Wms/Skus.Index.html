<div class="card">
  <form class="toolbar" data-search action="/admin/wms/skus">
    <input class="input w160" type="search" name="kw" value="{{kw}}" placeholder="搜索编码或名称">
    <button class="btn sm" type="submit">查询</button>
    <a class="btn sm" href="/admin/wms/skus" data-load>重置</a>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/wms/skus/form" data-dialog>新增商品</a>{{/if}}
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:120px">SKU 编码</th>
        <th>名称</th>
        <th style="width:80px">单位</th>
        <th>规格</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{sku}}</td>
        <td>{{name}}</td>
        <td class="muted">{{unit}}</td>
        <td class="muted">{{spec}}</td>
        <td class="ops">
          {{#if canUpdate}}<a href="/admin/wms/skus/form?id={{id}}" data-dialog>编辑</a>{{/if}}
          {{#if canDelete}}<a href="#" data-confirm="确认删除该商品？" data-post="/admin/wms/skus/delete" data-args="id={{id}}">删除</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">没有符合条件的商品</div>{{/if}}
  <div class="pager">
    <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    <span class="sp"></span>
    {{#if prev}}<a class="btn sm" href="?page={{prev}}&kw={{kw}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?page={{next}}&kw={{kw}}" data-load>下一页</a>{{/if}}
  </div>
</div>
