<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/wms/warehouses/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="64" placeholder="仓库名称">
      <label>编码</label>
      <input class="input" name="code" value="{{code}}" maxlength="32">
      <label>位置</label>
      <input class="input" name="location" value="{{location}}" maxlength="128">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{status1}}>启用</option>
        <option value="0" {{status0}}>禁用</option>
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
