<div class="card">
  <form class="toolbar" data-search action="/admin/wms/inventory">
    <input class="input w160" type="search" name="kw" value="{{kw}}" placeholder="搜索">
    <button class="btn sm" type="submit">查询</button>
    <a class="btn sm" href="/admin/wms/inventory" data-load>重置</a>
  </form>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th>仓库</th>
        <th>商品</th>
        <th class="num" style="width:120px">当前库存</th>
        <th style="width:120px">更新时间</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td>{{warehouse}}</td>
        <td>{{sku}}</td>
        <td class="num">{{qty}}</td>
        <td class="muted">{{updatedAt}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">暂无库存数据，请先到「入库登记」录入</div>{{/if}}
  <div class="pager">
    <span>共 {{total}} 条 · 第 {{page}}/{{pages}} 页</span>
    <span class="sp"></span>
    {{#if prev}}<a class="btn sm" href="?page={{prev}}&kw={{kw}}" data-load>上一页</a>{{/if}}
    {{#if next}}<a class="btn sm" href="?page={{next}}&kw={{kw}}" data-load>下一页</a>{{/if}}
  </div>
</div>
