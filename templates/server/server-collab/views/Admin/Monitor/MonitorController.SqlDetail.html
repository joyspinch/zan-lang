<div class="sql-detail" data-title="SQL 模板详情">
  <div class="sql-detail-meta">
    <span class="badge">已脱敏模板</span>
    <span class="muted">窗口 {{window}} · 调用 {{calls}} · 慢次 {{slow}} · 平均 {{avg}} · 最慢 {{max}}</span>
  </div>
  <pre class="sql-detail-code mono">{{sql}}</pre>
  <p class="hint">这里只展示统计系统已保存的规范化 SQL 模板，不含用户输入参数。模板在采集时最多保留 200 个字符，超过部分无法从统计数据恢复。</p>
</div>
