<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/static/css/admin.css">
  <script src="/static/js/admin.js" defer></script>
  <script src="/static/js/attach.js" defer></script>
  <script src="/static/js/bell.js" defer></script>
  <script src="/static/js/search.js" defer></script>
</head>
<body class="admin" data-tab-title="{{tabTitle}}">
<!-- 工作区：固定侧栏 + 标签条 + 面板，菜单点击以 X-Fragment 载入保持标签。 -->
<div class="ad-shell">
  <aside class="ad-side">
    <a class="ad-brand" href="/" target="_blank"><span class="ad-mark">Z</span><b>{{brand}}</b></a>
    <div class="ad-find">
      <input type="search" id="ad-find" placeholder="Ctrl+F 筛选菜单（支持首拼）" autocomplete="off">
    </div>
    {{#each menu}}
      {{#if group}}<div class="ad-group">{{group}}</div>{{/if}}
      {{#if path}}<a class="mi {{active}}" href="{{path}}" data-tab data-title="{{title}}">{{title}}</a>{{/if}}
    {{/each}}
    <div class="ad-foot">
      <a class="mi" href="/" target="_blank">查看前台</a>
    </div>
  </aside>

  <div class="ad-main">
    <header class="ad-top">
      <button class="ad-menu-btn" type="button" data-side title="菜单">☰</button>
      <span class="ad-title">{{heading}}</span>
      <div class="ad-right">
        <div class="ad-gsearch" data-gsearch>
          <input type="search" data-gsearch-input placeholder="搜索客户、商机、流程…" autocomplete="off">
          <div class="ad-gsearch-menu" data-gsearch-menu hidden><div data-gsearch-list></div></div>
        </div>
        <div class="ad-bell" data-bell title="通知">
          <button class="ad-bell-btn" type="button" data-bell-btn>🔔<i class="ad-bell-badge" data-bell-badge hidden>0</i></button>
          <div class="ad-bell-menu" data-bell-menu hidden>
            <div class="ad-bell-head">通知 <a href="/admin/oa/notifies" data-tab data-title="通知中心">全部</a></div>
            <div data-bell-list><div class="ad-bell-empty">暂无未读</div></div>
          </div>
        </div>
        <button class="btn sm" type="button" data-refresh>刷新</button>
        <div class="ad-account" data-account>
          <button class="ad-account-btn" type="button" data-account-btn>
            <span class="ad-avatar">{{accountInitial}}</span>
            <span class="ad-account-name">{{accountName}}</span>
            <i class="caret down"></i>
          </button>
          <div class="ad-account-menu">
            <div class="who">
              <b>{{accountName}}</b>
              {{#if accountMail}}<span>{{accountMail}}</span>{{/if}}
            </div>
            <a href="/admin/profile" data-tab data-title="个人资料">个人资料</a>
            <a href="/admin/profile#password" data-tab data-title="个人资料">修改密码</a>
            <a class="danger" href="/admin/logout">退出登录</a>
          </div>
        </div>
      </div>
    </header>
    <div class="ad-tabbar">
      <button class="tabnav" type="button" data-tabnav="-1" title="向左">‹</button>
      <div class="ad-tabs" id="ad-tabs"></div>
      <button class="tabnav" type="button" data-tabnav="1" title="向右">›</button>
    </div>
    <div class="ad-panel" id="ad-panel">
      {{content}}
    </div>
  </div>
</div>

<button class="ai-fab" type="button" data-ai-btn title="AI 助手">AI</button>

<div class="notices" id="ad-notices"></div>
<div class="toasts" id="ad-toasts"></div>
</body>
</html>
