<div data-title="角色授权 · {{name}}">
  <form data-submit action="/admin/system/roles/grantsave">
    <input type="hidden" name="id" value="{{id}}">
    <table class="table">
      <thead>
        <tr><th>功能</th><th>查看</th><th>新增</th><th>修改</th><th>删除</th><th>导出</th></tr>
      </thead>
      <tbody>
        {{#each perms}}
        <tr>
          <td>{{name}}</td>
          <td>{{#if hasView}}<input type="checkbox" name="permIds[]" value="{{valView}}" {{onView}}>{{/if}}</td>
          <td>{{#if hasCreate}}<input type="checkbox" name="permIds[]" value="{{valCreate}}" {{onCreate}}>{{/if}}</td>
          <td>{{#if hasUpdate}}<input type="checkbox" name="permIds[]" value="{{valUpdate}}" {{onUpdate}}>{{/if}}</td>
          <td>{{#if hasDelete}}<input type="checkbox" name="permIds[]" value="{{valDelete}}" {{onDelete}}>{{/if}}</td>
          <td>{{#if hasExport}}<input type="checkbox" name="permIds[]" value="{{valExport}}" {{onExport}}>{{/if}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    {{#if unmarked}}
    <p class="muted">未标注权限位、因此无法授权的接口：{{unmarked}}</p>
    {{/if}}
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
