<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/system/dicts/itemsave">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>所属类型</label>
      <input class="input mono" name="typeCode" value="{{typeCode}}" required maxlength="32">
      <label>显示名</label>
      <input class="input" name="label" value="{{label}}" required maxlength="64">
      <label>值</label>
      <input class="input mono" name="value" value="{{value}}" required maxlength="64">
      <label>排序</label>
      <input class="input w120" type="number" name="sortOrder" value="{{sortOrder}}" min="0">
      <label>状态</label>
      <select class="input" name="status">
        <option value="1" {{status1}}>启用</option>
        <option value="0" {{status0}}>停用</option>
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
