<div data-title="重置密码 · {{username}}">
  <form data-submit action="/admin/system/users/password">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>新密码</label>
      <input class="input" type="password" name="password" minlength="8" required placeholder="至少 8 位">
      <div class="span hint">重置后该账号当前的登录状态全部失效，需要用新密码重新登录。</div>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">重置</button>
    </footer>
  </form>
</div>
