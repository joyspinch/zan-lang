<div class="cal-bar">
  <a class="btn" href="/admin/oa/docs?spaceId={{spaceId}}" data-tab data-title="文档中心">← 返回列表</a>
  <span class="sp"></span>
  {{#if canUpdate}}<a class="btn pri" href="/admin/oa/docs/edit?id={{id}}" data-tab data-title="编辑文档">编辑</a>{{/if}}
  <a class="btn" href="/admin/oa/docs/history?id={{id}}" data-tab data-title="版本历史">历史</a>
</div>
<div class="card">
  <header>{{title}} <span class="muted" style="font-size:12px;font-weight:400">v{{version}} · {{spaceName}} · 更新于 {{updatedAt}}</span></header>
  <div class="doc-content">
    {{{html}}}
  </div>
</div>
