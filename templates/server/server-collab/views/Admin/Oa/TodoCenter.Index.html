<div class="card">
  <header>新增个人待办</header>
  <form data-submit action="/admin/oa/todocenter/add">
    <input type="text" name="title" placeholder="要做什么？" required class="w280">
    <input type="text" name="link" placeholder="跳转地址（可选）" class="w220">
    <button class="btn pri" type="submit">添加</button>
  </form>
</div>

<div class="card">
  <header>我的待办</header>
  <table class="table">
    <thead><tr><th width="72">来源</th><th>事项</th><th class="mid" width="120">截止</th><th class="mid" width="130">操作</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td><span class="tag">{{src}}</span></td>
        <td><a href="{{link}}" data-tab data-title="{{title}}">{{title}}</a>{{#if overdue}} <span class="tag bad">逾期</span>{{/if}}</td>
        <td class="muted mid">{{due}}</td>
        <td class="mid">
          <a href="#" data-post="/admin/oa/todocenter/done" data-args="{{args}}">完成</a>
          <a href="#" data-post="/admin/oa/todocenter/ignore" data-args="{{args}}">忽略</a>
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">太棒了，没有待办事项</div>{{/if}}
</div>
