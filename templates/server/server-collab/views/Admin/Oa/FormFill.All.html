<div class="card">
  <header>提交记录：{{formName}}<span class="fr">{{#if canExport}}<a class="btn" href="/admin/oa/formfill/export?formId={{formId}}">导出 CSV</a>{{/if}} <a class="btn" href="/admin/oa/forms" data-tab data-title="表单定义">← 表单定义</a></span></header>
  <table class="table">
    <thead><tr><th width="120">提交人</th><th>摘要</th><th class="mid" width="90">状态</th><th class="mid" width="150">时间</th><th class="ops" width="80">操作</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{who}}</td>
        <td class="muted maxw220 ell">{{summary}}</td>
        <td class="mid"><span class="tag {{statusKind}}">{{statusText}}</span></td>
        <td class="muted mid">{{createdAt}}</td>
        <td class="ops"><a href="/admin/oa/formfill/detail?id={{id}}&as=dialog" data-dialog data-title="提交详情">查看</a></td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有提交记录</div>{{/if}}
</div>
