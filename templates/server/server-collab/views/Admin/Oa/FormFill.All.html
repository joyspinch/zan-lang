<div class="card">
  <header>提交记录：{{formName}}<span style="float:right">{{#if canExport}}<a class="btn" href="/admin/oa/formfill/export?formId={{formId}}">导出 CSV</a>{{/if}} <a class="btn" href="/admin/oa/forms" data-tab data-title="表单定义">← 表单定义</a></span></header>
  <table class="table">
    <thead><tr><th style="width:120px">提交人</th><th>摘要</th><th class="mid" style="width:90px">状态</th><th class="mid" style="width:150px">时间</th><th class="ops" style="width:80px">操作</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{who}}</td>
        <td class="muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{summary}}</td>
        <td class="mid"><span class="tag {{statusKind}}">{{statusText}}</span></td>
        <td class="muted mid">{{createdAt}}</td>
        <td class="ops"><a href="/admin/oa/formfill/detail?id={{id}}" data-tab data-title="提交详情">查看</a></td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有提交记录</div>{{/if}}
</div>
