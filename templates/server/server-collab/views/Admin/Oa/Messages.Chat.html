<div class="card" data-chat-peer="{{peerId}}" data-chat-name="{{peerName}}">
  <header>与 {{peerName}} 的对话</header>
  <div data-chat-scroll style="max-height:52vh;overflow:auto;padding:10px">
    {{#each rows}}
    <div style="display:flex;{{#if mine}}justify-content:flex-end{{/if}};margin:4px 0">
      <div style="max-width:72%;padding:6px 10px;border-radius:8px;{{#if mine}}background:#e8f1ff;{{/if}}border:1px solid #eef0f3">
        <div class="muted" style="font-size:11px">{{who}} · {{at}}{{#if readed}} · 已读{{/if}}</div>
        <div style="white-space:pre-wrap;line-height:1.6">{{content}}</div>
      </div>
    </div>
    {{/each}}
    {{#if empty}}<div class="empty">还没有消息，发第一条吧</div>{{/if}}
  </div>
  <form data-submit action="/admin/oa/messages/send" style="display:flex;gap:8px;padding:8px 10px;border-top:1px solid #eef0f3">
    <input type="hidden" name="peer" value="{{peerId}}">
    <textarea class="input" name="content" rows="2" required maxlength="2048" placeholder="输入私信内容，Ctrl+Enter 发送" style="flex:1"></textarea>
    <button class="btn primary" type="submit">发送</button>
  </form>
</div>
