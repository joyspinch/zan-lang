<div class="card" data-chat-peer="{{peerId}}" data-chat-name="{{peerName}}">
  <header>与 {{peerName}} 的对话</header>
  <div data-chat-scroll class="maxh52 scrollp">
    {{#each rows}}
    <div data-msg="{{id}}"{{#if mine}} data-mine="1"{{/if}} class="chatrow{{#if mine}} mine{{/if}}">
      <div class="bubble{{#if mine}} mine{{/if}}">
        <div class="muted fs11">{{who}} · {{at}}<span data-mark>{{#if mark}} · {{mark}}{{/if}}</span></div>
        <div class="pretext">{{content}}</div>
      </div>
    </div>
    {{/each}}
    {{#if empty}}<div class="empty">还没有消息，发第一条吧</div>{{/if}}
  </div>
  <form data-submit action="/admin/oa/messages/send" class="chatinput">
    <input type="hidden" name="peer" value="{{peerId}}">
    <textarea class="input grow" name="content" rows="2" required maxlength="2048" placeholder="输入私信内容，Ctrl+Enter 发送"></textarea>
    <button class="btn primary" type="submit">发送</button>
  </form>
</div>
