<div data-title="新建文档">
  <form data-submit action="/admin/oa/docs/save">
    <input type="hidden" name="id" value="0">
    <div class="form">
      <label>所属空间</label>
      <select class="input" name="spaceId">
        {{#each spaces}}<option value="{{id}}" {{cur}}>{{name}}</option>{{/each}}
      </select>
      <label>标题</label>
      <input class="input" name="title" required maxlength="128" placeholder="文档标题">
      <label>初始内容（可选，支持行式块语法）</label>
      <textarea class="input" name="content" rows="6" placeholder="# 一级标题&#10;- 列表项&#10;**粗体** 与 *斜体*"></textarea>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">创建</button>
    </footer>
  </form>
</div>
