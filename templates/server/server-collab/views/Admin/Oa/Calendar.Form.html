<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/oa/calendar/save">
    <input type="hidden" name="id" value="{{id}}">
    <input type="hidden" name="relatedType" value="{{relatedType}}">
    <input type="hidden" name="relatedId" value="{{relatedId}}">
    <div class="form">
      <label>标题</label>
      <input class="input" name="title" value="{{title}}" required maxlength="128" placeholder="如：客户拜访">
      <label>开始时间</label>
      <input class="input" type="datetime-local" name="startAt" value="{{startAt}}" required>
      <label>结束时间</label>
      <input class="input" type="datetime-local" name="endAt" value="{{endAt}}" required>
      <label>全天</label>
      <select class="input" name="allDay">
        <option value="0" {{allDay0}}>否</option>
        <option value="1" {{allDay1}}>是</option>
      </select>
      <label>提醒</label>
      <select class="input" name="remindMinutes">
        <option value="0" {{rm0}}>不提醒</option>
        <option value="30" {{rm30}}>提前 30 分钟</option>
        <option value="60" {{rm60}}>提前 1 小时</option>
        <option value="1440" {{rm1440}}>提前 1 天</option>
      </select>
      <label>说明</label>
      <input class="input" name="description" value="{{description}}" maxlength="1024" placeholder="备注（可选）">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      {{#if canDelete}}<a class="btn" style="margin-right:auto" href="#" data-post="/admin/oa/calendar/delete" data-args="id={{id}}" data-confirm="删除后不可恢复，确定删除该日程吗？">删除</a>{{/if}}
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
