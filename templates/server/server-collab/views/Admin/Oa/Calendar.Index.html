<div class="page">
  <div class="page-head">
    <h2>日程</h2>
    <div class="ops">
      {{#if canCreate}}<a class="btn primary" href="/admin/oa/calendar/form" data-dialog data-title="新建日程">新建日程</a>{{/if}}
    </div>
  </div>

  <div class="card">
    <div class="cal-bar">
      <a class="btn sm" href="{{prevLink}}" data-load>‹</a>
      <span class="cal-label">{{label}}</span>
      <a class="btn sm" href="{{nextLink}}" data-load>›</a>
      <a class="btn sm" href="/admin/oa/calendar" data-load>今日</a>
      <span class="sp"></span>
      {{#if isWeek}}<a class="btn sm" href="/admin/oa/calendar" data-load>月视图</a>
      {{else}}<a class="btn sm" href="/admin/oa/calendar?week={{todayText}}" data-load>周视图</a>{{/if}}
    </div>
    <table class="cal-grid">
      <thead><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead>
      <tbody>
        {{#each cells}}
        {{#if rowOpen}}<tr>{{/if}}
        <td class="{{cellClass}}"><div class="cal-day">{{day}}</div>{{{eventsHtml}}}</td>
        {{#if rowClose}}</tr>{{/if}}
        {{/each}}
      </tbody>
    </table>
  </div>
</div>
