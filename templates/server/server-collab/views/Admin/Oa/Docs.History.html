<div class="cal-bar">
  <a class="btn" href="/admin/oa/docs/read?id={{docId}}" data-tab data-title="阅读文档">← 返回文档</a>
  <span class="cal-label">{{title}} · 版本历史</span>
  <span class="sp"></span>
</div>
<div class="card">
  <table class="table">
    <thead><tr><th class="mid" style="width:80px">版本</th><th>标题</th><th style="width:110px">编辑人</th><th class="mid" style="width:150px">保存时间</th><th class="mid" style="width:80px">状态</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="mid">v{{version}}</td>
        <td>{{title}}</td>
        <td class="muted">{{editor}}</td>
        <td class="muted mid">{{createdAt}}</td>
        <td class="mid">{{#if current}}<span class="tag">当前</span>{{/if}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">暂无版本记录</div>{{/if}}
</div>
