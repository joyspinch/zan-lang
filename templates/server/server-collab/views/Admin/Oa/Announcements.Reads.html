<div data-title="{{dialogTitle}}">
  <div style="margin-bottom:8px">
    <b>{{title}}</b>
    <span class="muted" style="margin-left:8px;font-size:12px">已读 {{readCount}} / 受众 {{total}} 人</span>
  </div>
  <table class="table">
    <thead><tr><th>已读用户</th><th class="mid" style="width:150px">阅读时间</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{user}}</td>
        <td class="muted mid">{{readAt}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有人读过</div>{{/if}}
  <footer style="display:flex;justify-content:flex-end;margin-top:12px">
    <button class="btn" type="button" data-close>关闭</button>
  </footer>
</div>
