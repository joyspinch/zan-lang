<div data-title="{{dialogTitle}}">
  <div class="mbot8">
    <b>{{title}}</b>
    <span class="muted ml8 fs12">已读 {{readCount}} / 受众 {{total}} 人</span>
  </div>
  <table class="table">
    <thead><tr><th>已读用户</th><th class="mid" width="150">阅读时间</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{user}}</td>
        <td class="muted mid">{{readAt}}</td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有人读过</div>{{/if}}
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>关闭</button>
  </footer>
</div>
