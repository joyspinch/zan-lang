<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/oa/announcements/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>公告标题</label>
      <input class="input" name="title" value="{{title}}" required maxlength="128" placeholder="如：关于假期安排的通知">
      <label>正文</label>
      <textarea class="input" name="content" rows="7" maxlength="8192" placeholder="公告正文（纯文本，保留换行）">{{content}}</textarea>
      <label>受众部门</label>
      <div class="checks">
        <div class="head">不勾选任何部门 = 本租户全员可见；勾选后仅所选部门成员可见</div>
        {{#each depts}}
        <label><input type="checkbox" name="dept" value="{{id}}" {{checked}}> {{name}}</label>
        {{/each}}
      </div>
      {{#if canPinned}}
      <label>置顶</label>
      <label class="dotrow6">
        <input type="checkbox" name="pinned" value="1" {{pinned}}> 置顶显示在公告列表最前
      </label>
      {{/if}}
    </div>
    <footer class="lay-footer">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
