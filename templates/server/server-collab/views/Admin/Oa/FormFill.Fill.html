<div class="card">
  <header>填写：{{name}}{{#if flowStopped}} <span class="tag bad">绑定的流程已停用，暂时无法提交，可先存草稿</span>{{/if}}</header>
  {{#if description}}<div class="muted" style="padding:8px 12px 0;font-size:12px">{{description}}</div>{{/if}}
  <form data-submit action="/admin/oa/formfill/submit" style="padding:12px">
    <input type="hidden" name="formId" value="{{formId}}">
    <div class="form">
      {{#each fields}}
      <label>{{label}}{{#if required}} <span class="tag bad">*</span>{{/if}}</label>
      {{{ctrl}}}
      {{/each}}
    </div>
    {{#if canSubmit}}
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="submit" name="draft" value="1">存草稿</button>
      <button class="btn primary" type="submit">提交</button>
    </footer>
    {{else}}
    <div class="muted" style="margin-top:12px;text-align:right;font-size:12px">无提交权限，仅可预览</div>
    {{/if}}
  </form>
</div>
