<div class="cal-bar">
  <a class="btn" href="/admin/oa/formfill/my" data-tab data-title="我的提交">← 我的提交</a>
  {{#if flowId}}<a class="btn" href="/admin/flow/instances" data-tab data-title="流程实例">查看流程</a>{{/if}}
</div>
<div class="card">
  <header>提交详情 <span class="muted" style="font-size:12px;font-weight:400">{{createdAt}} · <span class="tag {{statusKind}}">{{statusText}}</span></span></header>
  <div class="form" style="padding:12px">
    {{#each fields}}
    <label>{{label}}{{#if required}} <span class="tag bad">*</span>{{/if}}</label>
    {{{ctrl}}}
    {{/each}}
  </div>
</div>
