{{#if showBar}}<div class="cal-bar">
  <a class="btn" href="/admin/oa/formfill/my" data-tab data-title="我的提交">← 我的提交</a>
</div>{{/if}}
<div data-title="{{dialogTitle}}">
  <div class="card">
    <header>提交详情 <span class="muted fs12 fw4">{{createdAt}} · <span class="tag {{statusKind}}">{{statusText}}</span></span></header>
    <div class="form p12">
      {{#each fields}}
      <label>{{label}}{{#if required}} <span class="tag bad">*</span>{{/if}}</label>
      {{{ctrl}}}
      {{/each}}
    </div>
  </div>
  {{#if flowId}}<footer class="lay-footer">
    <a class="btn" href="/admin/flow/instances" data-tab data-title="流程实例">查看流程</a>
  </footer>{{/if}}
</div>
