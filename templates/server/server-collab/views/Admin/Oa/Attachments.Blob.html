<h4 class="mv148">附件</h4>
<table class="table">
  <thead><tr><th>文件名</th><th width="88">大小</th><th width="150">上传时间</th><th width="64">操作</th></tr></thead>
  <tbody>
    {{#each rows}}
    <tr>
      <td>{{fileName}}</td>
      <td>{{sizeText}}</td>
      <td>{{createdAt}}</td>
      <td>{{#if canDel}}<a class="btn sm" href="#" data-attach-del="{{id}}">删除</a>{{/if}}</td>
    </tr>
    {{/each}}
  </tbody>
</table>
{{#if empty}}<p class="tip">还没有附件</p>{{/if}}
<div class="mtop8">
  <input type="file" data-attach-file>
  <span class="tip" data-attach-status></span>
</div>
