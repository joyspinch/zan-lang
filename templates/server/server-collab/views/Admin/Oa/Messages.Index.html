<div class="card">
  <header>站内私信</header>
  <table class="table">
    <thead><tr><th>对话</th><th class="mid" style="width:64px">未读</th><th class="mid" style="width:150px">最近消息</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr data-peer="{{peerId}}">
        <td><a href="/admin/oa/messages/chat?peer={{peerId}}" data-tab data-title="与 {{peerName}}">{{peerName}}</a></td>
        <td class="mid" data-unread>{{#if unread}}<span class="tag bad">{{unread}}</span>{{else}}<span class="muted">0</span>{{/if}}</td>
        <td class="muted" data-last>
          <span class="muted" style="font-size:12px">{{lastAt}}</span>
          {{#if mine}}<span class="tag">我</span>{{/if}}
          {{lastText}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有私信。在成员列表或待办指派处找到同事，发第一条私信吧</div>{{/if}}
</div>
