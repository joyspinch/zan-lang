<div data-title="{{dialogTitle}}">
  <div class="mbot8">
    <b class="fs15">{{title}}</b>
    <span class="muted ml8 fs12">{{publisher}} · {{createdAt}}</span>
  </div>
  <div class="prebox">{{content}}</div>
  <div class="mtop10 hrule">
    <div class="muted fs12 mbot4">附件</div>
    <div data-attach data-module="announce" data-related="{{id}}"></div>
  </div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>关闭</button>
  </footer>
</div>
