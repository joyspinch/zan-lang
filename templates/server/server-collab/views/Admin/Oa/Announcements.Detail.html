<div data-title="{{dialogTitle}}">
  <div style="margin-bottom:8px">
    <b style="font-size:15px">{{title}}</b>
    <span class="muted" style="margin-left:8px;font-size:12px">{{publisher}} · {{createdAt}}</span>
  </div>
  <div style="white-space:pre-wrap;line-height:1.7;max-height:46vh;overflow:auto;border-top:1px solid #eef0f3;padding-top:8px">{{content}}</div>
  <div style="margin-top:10px;border-top:1px solid #eef0f3;padding-top:8px">
    <div class="muted" style="font-size:12px;margin-bottom:4px">附件</div>
    <div data-attach data-module="announce" data-related="{{id}}"></div>
  </div>
  <footer style="display:flex;justify-content:flex-end;margin-top:12px">
    <button class="btn" type="button" data-close>关闭</button>
  </footer>
</div>
