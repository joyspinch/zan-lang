<div class="card">
  <header>我的提交<a class="btn fr" href="/admin/oa/formfill" data-tab data-title="表单填报">← 填报中心</a></header>
  <table class="table">
    <thead><tr><th width="180">表单</th><th>摘要</th><th class="mid" width="90">状态</th><th class="mid" width="150">时间</th><th class="ops" width="80">操作</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td>{{formName}}</td>
        <td class="muted maxw220 ell">{{summary}}</td>
        <td class="mid"><span class="tag {{statusKind}}">{{statusText}}</span></td>
        <td class="muted mid">{{createdAt}}</td>
        <td class="ops"><a href="/admin/oa/formfill/detail?id={{id}}&as=dialog" data-dialog data-title="提交详情">查看</a></td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有提交记录，去填报中心填一张表单吧</div>{{/if}}
</div>
