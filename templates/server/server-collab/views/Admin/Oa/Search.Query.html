<div class="ad-gsearch-body">
  {{#each items}}
  {{#if first}}<div class="ad-gsearch-group">{{group}}</div>{{/if}}
  <a class="ad-gsearch-item" href="{{link}}" data-tab data-title="{{group}}"><span class="ad-gsearch-badge">{{group}}</span>{{title}}</a>
  {{/each}}
  {{#if empty}}<div class="ad-gsearch-empty">无匹配结果</div>{{/if}}
</div>
