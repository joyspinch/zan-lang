<form data-submit action="/admin/oa/docs/save" class="card">
  <input type="hidden" name="id" value="{{id}}">
  <input type="hidden" name="spaceId" value="{{spaceId}}">
  <input type="hidden" name="baseVersion" value="{{baseVersion}}">
  <header>
    <input class="input" name="title" value="{{title}}" required maxlength="128" placeholder="文档标题" style="width:50%">
    <span class="muted" style="font-size:12px;float:right;line-height:32px">{{#if version}}v{{version}}{{/if}}</span>
  </header>
  <textarea class="input doc-editor" name="content" rows="22" placeholder="支持行式块语法：# 标题、- 列表、1. 有序列表、> 引用、代码围栏、--- 分隔线、[ ] 待办；行内：**粗体**、*斜体*、行内码、[文字](链接)">{{content}}</textarea>
  <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
    <a class="btn" href="/admin/oa/docs" data-tab data-title="文档中心">取消</a>
    <button class="btn primary" type="submit">保存</button>
  </footer>
</form>
