<div class="card be-wrap" x-data="blockEditor()"
     data-doc-id="{{id}}" data-space-id="{{spaceId}}"
     data-base-version="{{baseVersion}}" data-src="{{content}}">
  <header>
    <input id="be-title" class="input be-title" value="{{title}}" maxlength="128" placeholder="文档标题">
    <span class="muted be-meta">{{#if version}}v{{version}} · {{/if}}<span id="be-status"></span></span>
  </header>
  <div class="be-toolbar">
    <span class="muted be-hint">Enter 新建下一块 · 2 秒无操作自动保存</span>
    <span class="sp"></span>
    <button class="btn pri" type="button" @click="save(true)">保存</button>
    <a class="btn" href="/admin/oa/docs" data-tab data-title="文档中心">取消</a>
  </div>
  <div class="be-body">
    <template x-for="b in blocks" :key="b.id">
      <div class="be-row" :data-t="b.t">
        <select class="input be-type" x-model="b.t" @change="mark()">
          <option value="p">正文</option>
          <option value="h1">标题 1</option>
          <option value="h2">标题 2</option>
          <option value="h3">标题 3</option>
          <option value="ul">无序列表</option>
          <option value="ol">有序列表</option>
          <option value="todo">待办</option>
          <option value="quote">引用</option>
          <option value="code">代码</option>
          <option value="img">图片</option>
          <option value="hr">分隔线</option>
        </select>
        <span class="be-ops">
          <input type="checkbox" x-model="b.done" x-show="b.t==='todo'" title="已完成" @change="mark()">
          <button class="be-btn" type="button" @click="move(b,-1)" title="上移">↑</button>
          <button class="be-btn" type="button" @click="move(b,1)" title="下移">↓</button>
          <button class="be-btn be-x" type="button" @click="del(b)" title="删除块">×</button>
        </span>
        <div class="be-main">
          <div class="be-text" x-show="b.t!=='img' && b.t!=='hr'"
               :class="'be-'+b.t" contenteditable="true" data-be-text
               data-placeholder="输入内容，/ 选择块型"
               @input="mark()" @keydown="key($event,b)" @paste="paste($event)"
               @compositionstart="composing=true"
               @compositionend="composing=false; mark()"></div>
          <div class="be-imgline" x-show="b.t==='img'">
            <input class="input" style="flex:1" x-model="b.url"
                   placeholder="图片地址（可直接上传）" @input="mark()">
            <img class="be-thumb" :src="b.url" x-show="b.url" alt="预览">
            <label class="btn sm">上传图片
              <input type="file" accept="image/*" style="display:none"
                     @change="upload(b,$event)">
            </label>
          </div>
          <div class="be-hrline" x-show="b.t==='hr'"><hr></div>
        </div>
      </div>
    </template>
  </div>
  <footer class="be-foot">
    <button class="btn sm" type="button" @click="add('p', lastId())">+ 添加块</button>
    <button class="btn sm" type="button" @click="add('img', lastId())">+ 图片</button>
    <button class="btn sm" type="button" @click="add('code', lastId())">+ 代码</button>
    <button class="btn sm" type="button" @click="add('hr', lastId())">+ 分隔线</button>
  </footer>
</div>
