<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/oa/forms/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>表单名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="128" placeholder="如：用章申请">
      <label>表单标识</label>
      <input class="input" name="code" value="{{code}}" required maxlength="64" placeholder="[a-z0-9_]，租户内唯一，如 seal_apply">
      <label>描述</label>
      <input class="input" name="description" value="{{description}}" maxlength="512" placeholder="用途说明（可选）">
      <label>绑定流程</label>
      <select class="input" name="flowDefId">
        <option value="0">不绑流程（纯数据收集）</option>
        {{#each flows}}
        <option value="{{id}}" {{#if sel}}selected{{/if}}>{{name}}</option>
        {{/each}}
      </select>
      <label>Schema JSON
        {{#if locked}}<span class="tag warn">已有提交记录，schema 锁定只读</span>{{/if}}
      </label>
      <textarea class="input" name="schemaJson" rows="12" required
        placeholder='{"fields":[{"code":"reason","label":"用章事由","type":"textarea","required":true,"maxlen":500}]}'
        {{#if locked}}readonly{{/if}}>{{schemaJson}}</textarea>
      <div class="muted" style="font-size:12px">type 白名单：text / textarea / number / date / select / radio / checkbox / attachment；select·radio·checkbox 须带 options 数组或 "optionsSrc":"dict:类型code"</div>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
