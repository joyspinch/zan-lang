<div class="card">
  <header>表单填报<a class="btn" style="float:right" href="/admin/oa/formfill/my" data-tab data-title="我的提交">我的提交</a></header>
  <table class="table">
    <thead><tr><th>表单</th><th style="width:140px">流程绑定</th><th class="mid" style="width:90px">我的提交</th><th class="ops" style="width:110px">操作</th></tr></thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td><a href="/admin/oa/formfill/fill?formId={{id}}" data-tab data-title="填写：{{name}}">{{name}}</a>{{#if description}}<div class="muted" style="font-size:12px">{{description}}</div>{{/if}}</td>
        <td class="muted">{{flowName}}</td>
        <td class="mid muted">{{mine}}</td>
        <td class="ops"><a class="btn sm pri" href="/admin/oa/formfill/fill?formId={{id}}" data-tab data-title="填写：{{name}}">填写</a></td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">暂无可填报的表单，可在「表单定义」中创建并启用</div>{{/if}}
</div>
