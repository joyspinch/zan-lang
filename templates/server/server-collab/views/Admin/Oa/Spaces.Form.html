<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/oa/spaces/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>空间名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="64" placeholder="如：产品资料">
      <label>说明</label>
      <input class="input" name="description" value="{{description}}" maxlength="256" placeholder="空间用途（可选）">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
