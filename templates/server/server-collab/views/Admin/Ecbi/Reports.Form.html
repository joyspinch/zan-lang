<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/ecbi/reports/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>报表名称 <i class="req">*</i></label>
      <input class="input" name="name" value="{{name}}" required maxlength="64" placeholder="如 各平台销售汇总">
      <label>维度（分析口径，可多选）</label>
      <div style="display:flex;gap:16px;flex-wrap:wrap;padding:4px 0">
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="dimPlatform" value="1" {{dimPlatformChecked}}> 平台</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="dimShop" value="1" {{dimShopChecked}}> 店铺</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="dimCategory" value="1" {{dimCategoryChecked}}> 品类</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="dimDay" value="1" {{dimDayChecked}}> 日期</label>
      </div>
      <label>指标（要看的数，可多选）</label>
      <div style="display:flex;gap:16px;flex-wrap:wrap;padding:4px 0">
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="mSales" value="1" {{mSalesChecked}}> 销售额</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="mOrders" value="1" {{mOrdersChecked}}> 订单数</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="mAov" value="1" {{mAovChecked}}> 客单价</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="mAdCost" value="1" {{mAdCostChecked}}> 推广花费</label>
        <label style="display:flex;align-items:center;gap:4px;font-weight:400"><input type="checkbox" name="mRoi" value="1" {{mRoiChecked}}> ROI</label>
      </div>
      <label>图表类型</label>
      <select class="input" name="chart">
        <option value="bar" {{bar}}>柱状图</option>
        <option value="line" {{line}}>折线图</option>
        <option value="table" {{table}}>纯表格</option>
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
