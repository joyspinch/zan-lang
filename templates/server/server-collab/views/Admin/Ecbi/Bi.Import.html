<div data-title="导入订单">
  <div class="form">
    <label>CSV 文件</label>
    <input type="file" id="odimpFile" accept=".csv,text/csv">
    <label>导入说明</label>
    <div class="muted">UTF-8 编码 CSV；金额单位为分；支付日期填 YYYY-MM-DD（留空=当前时间）；订单号重复的行报错跳过。</div>
    <label>模板下载</label>
    <div><a class="btn sm" href="/admin/ecbi/template" data-export>下载模板</a></div>
  </div>
  <div id="odimpResult"></div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn primary" type="button" id="odimpGo">开始导入</button>
  </footer>
  <script src="/static/js/import-bi.js" defer></script>
</div>
