<div data-title="导入订单">
  <div class="form">
    <label>CSV 文件</label>
    <input type="file" id="odimpFile" accept=".csv,text/csv">
    <label>导入说明</label>
    <div class="muted">UTF-8 编码 CSV；金额单位为分；支付日期填 YYYY-MM-DD（留空=当前时间）；订单号重复的行报错跳过。</div>
    <label>模板下载</label>
    <div><a class="btn sm" href="/admin/ecbi/template" data-export>下载模板</a></div>
  </div>
  <div id="odimpResult"></div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn primary" type="button" id="odimpGo">开始导入</button>
  </footer>
  <script>
  (function () {
    var go = document.getElementById('odimpGo');
    if (!go) { return; }
    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    go.onclick = function () {
      var inp = document.getElementById('odimpFile');
      var box = document.getElementById('odimpResult');
      var f = inp && inp.files && inp.files[0];
      if (!f) { box.innerHTML = '<div class="empty">请先选择 CSV 文件</div>'; return; }
      go.disabled = true;
      box.innerHTML = '<div class="muted">导入中…</div>';
      fetch('/admin/ecbi/import', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/octet-stream' }, body: f
      }).then(function (r) { return r.json(); }).then(function (j) {
        go.disabled = false;
        var d = (j && j.data) || {};
        if (!j || j.code !== '0000') {
          box.innerHTML = '<div class="empty">' + esc((j && j.msg) || '导入失败') + '</div>';
          return;
        }
        var h = '<div class="card" style="margin-top:10px"><b>导入完成</b>：成功 '
          + esc(d.ok) + ' 条，失败 ' + esc(d.fail) + ' 条';
        var errs = d.errors || [];
        if (errs.length) {
          h += '<table class="table"><thead><tr><th style="width:70px">行号</th>'
            + '<th style="width:100px">字段</th><th>问题</th></tr></thead><tbody>';
          for (var i = 0; i < errs.length; i++) {
            h += '<tr><td class="num">' + esc(errs[i].row) + '</td><td>'
              + esc(errs[i].field || '—') + '</td><td>' + esc(errs[i].msg) + '</td></tr>';
          }
          h += '</tbody></table>';
        }
        h += '</div>';
        box.innerHTML = h;
        if (Number(d.ok) > 0) { setTimeout(function () { location.reload(); }, 1200); }
      }).catch(function () {
        go.disabled = false;
        box.innerHTML = '<div class="empty">请求失败</div>';
      });
    };
  })();
  </script>
</div>
