<div class="card">
  <div class="toolbar">
    <a class="btn sm" href="/admin/ecbi/products" data-tab data-title="商品主档">← 商品主档</a>
    <span class="fw6">{{productName}} · 各平台售卖链接</span>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/ecbi/products/linkform?productId={{productId}}" data-dialog>新增链接</a>{{/if}}
  </div>
  <table class="table">
    <thead>
      <tr>
        <th class="num" width="56">ID</th>
        <th width="110">平台</th>
        <th width="180">店铺</th>
        <th width="140">平台商品编码</th>
        <th>链接</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td class="muted">{{platform}}</td>
        <td>{{shop}}</td>
        <td class="mono muted">{{outerCode}}</td>
        <td class="muted maxw260 ell">{{url}}</td>
        <td class="ops">
          {{#if canUpdate}}<a href="/admin/ecbi/products/linkform?id={{id}}&productId={{productId}}" data-dialog>编辑</a>{{/if}}
          {{#if canDelete}}<a href="#" data-confirm="确认删除该链接？" data-post="/admin/ecbi/products/linkdelete" data-args="id={{id}}">删除</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">该商品还没有平台链接。同一商品可在多个店铺各挂一条链接。</div>{{/if}}
</div>
