<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/ecbi/shops/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>店铺名称 <i class="req">*</i></label>
      <input class="input" name="name" value="{{name}}" required maxlength="64" placeholder="如 官方旗舰店">
      <label>所属平台 <i class="req">*</i></label>
      <select class="input" name="platformId" required>
        <option value="0">请选择</option>
        {{#each platforms}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
