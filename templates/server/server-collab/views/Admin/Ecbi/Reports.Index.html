<div class="card">
  <div class="toolbar">
    <span style="color:#666">先在「平台 / 店铺 / 商品」维护主数据，外部数据落到订单与推广表后，在这里编排成报表。</span>
    <span class="sp"></span>
    {{#if canCreate}}<a class="btn sm primary" href="/admin/ecbi/reports/form" data-dialog>新建报表</a>{{/if}}
  </div>
  <table class="table">
    <thead>
      <tr>
        <th class="num" style="width:56px">ID</th>
        <th style="width:180px">报表名称</th>
        <th>维度</th>
        <th>指标</th>
        <th style="width:90px">图表</th>
        <th class="ops">操作</th>
      </tr>
    </thead>
    <tbody>
      {{#each rows}}
      <tr>
        <td class="num muted">{{id}}</td>
        <td><a href="/admin/ecbi/reports/run?id={{id}}" data-tab data-title="{{name}}">{{name}}</a></td>
        <td class="muted">{{dims}}</td>
        <td class="muted">{{metrics}}</td>
        <td class="muted">{{chartText}}</td>
        <td class="ops">
          <a href="/admin/ecbi/reports/run?id={{id}}" data-tab data-title="{{name}}">查看</a>
          {{#if canUpdate}}<a href="/admin/ecbi/reports/form?id={{id}}" data-dialog>编辑</a>{{/if}}
          {{#if canDelete}}<a href="#" data-confirm="确认删除该报表？" data-post="/admin/ecbi/reports/delete" data-args="id={{id}}">删除</a>{{/if}}
        </td>
      </tr>
      {{/each}}
    </tbody>
  </table>
  {{#if empty}}<div class="empty">还没有报表，点右上角「新建报表」，选维度和指标即可</div>{{/if}}
</div>
