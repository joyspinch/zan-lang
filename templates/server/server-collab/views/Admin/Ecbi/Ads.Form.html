<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/ecbi/ads/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>店铺 <i class="req">*</i></label>
      <select class="input" name="shopId" required>
        <option value="0">请选择</option>
        {{#each shops}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>推广计划</label>
      <input class="input" name="campaign" value="{{campaign}}" maxlength="64" placeholder="如 618 预热">
      <label>日期 <i class="req">*</i></label>
      <input class="input" name="day" value="{{day}}" required placeholder="YYYY-MM-DD">
      <label>花费（分）<i class="req">*</i></label>
      <input class="input" type="number" name="cost" value="{{cost}}" min="0" required>
      <label>曝光</label>
      <input class="input" type="number" name="impression" value="{{impression}}" min="0">
      <label>点击</label>
      <input class="input" type="number" name="click" value="{{click}}" min="0">
      <label>成交单数</label>
      <input class="input" type="number" name="orderCount" value="{{orderCount}}" min="0">
      <label>成交金额（分）</label>
      <input class="input" type="number" name="orderAmount" value="{{orderAmount}}" min="0">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
