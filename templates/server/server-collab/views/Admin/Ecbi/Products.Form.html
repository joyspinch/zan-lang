<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/ecbi/products/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>商品名称 <i class="req">*</i></label>
      <input class="input" name="name" value="{{name}}" required maxlength="64">
      <label>SKU</label>
      <input class="input" name="sku" value="{{sku}}" maxlength="32">
      <label>品类</label>
      <input class="input" name="category" value="{{category}}" maxlength="32">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
