<div class="card">
  <div class="toolbar">
    <a class="btn sm" href="/admin/ecbi/ads" data-tab data-title="推广数据">← 推广数据</a>
    <span class="sp"></span>
  </div>

  <div class="grid c4">
    <div class="card kpi"><div class="k">总花费</div><div class="v">{{totalCost}}</div></div>
    <div class="card kpi"><div class="k">推广成交</div><div class="v">{{totalAmount}}</div></div>
    <div class="card kpi"><div class="k">整体 ROI</div><div class="v">{{totalRoi}}</div></div>
    <div class="card kpi"><div class="k">整体点击率</div><div class="v">{{totalCtr}}</div></div>
  </div>

  <div class="card">
    <header>按店铺汇总（花费 / 成交 / ROI）</header>
    <table class="table">
      <thead>
        <tr>
          <th style="width:160px">平台</th>
          <th>店铺</th>
          <th class="num" style="width:110px">花费</th>
          <th class="num" style="width:110px">成交额</th>
          <th class="num" style="width:80px">ROI</th>
          <th class="num" style="width:80px">点击率</th>
        </tr>
      </thead>
      <tbody>
        {{#each rows}}
        <tr>
          <td class="muted">{{platform}}</td>
          <td>{{shop}}</td>
          <td class="num">{{cost}}</td>
          <td class="num">{{orderAmount}}</td>
          <td class="num">{{roi}}</td>
          <td class="num muted">{{ctr}}</td>
        </tr>
        {{/each}}
      </tbody>
    </table>
    {{#if noData}}<div class="empty">还没有推广数据，先到「推广数据」录入</div>{{/if}}
  </div>
</div>
