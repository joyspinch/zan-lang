<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/crm/contacts/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>所属客户 <i class="req">*</i></label>
      <select class="input" name="customerId" required>
        <option value="0">请选择</option>
        {{#each customers}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>姓名 <i class="req">*</i></label>
      <input class="input" name="name" value="{{name}}" maxlength="64" required>
      <label>职位</label>
      <input class="input" name="title" value="{{title}}" maxlength="64">
      <label>电话</label>
      <input class="input" name="phone" value="{{phone}}" maxlength="32">
      <label>邮箱</label>
      <input class="input" name="email" value="{{email}}" maxlength="128">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
