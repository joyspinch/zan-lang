<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/crm/opportunities/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>客户</label>
      <select class="input" name="customerId" required>
        <option value="0">请选择</option>
        {{#each customers}}<option value="{{id}}" {{selected}}>{{name}}</option>{{/each}}
      </select>
      <label>商机名称</label>
      <input class="input" name="title" value="{{title}}" required maxlength="128" placeholder="商机名称">
      <label>金额</label>
      <input class="input" type="number" name="amount" value="{{amount}}" min="0" placeholder="预计金额">
      <label>阶段</label>
      <select class="input" name="stage">
        <option value="1" {{stage1}}>初步接触</option>
        <option value="2" {{stage2}}>需求确认</option>
        <option value="3" {{stage3}}>方案报价</option>
        <option value="4" {{stage4}}>谈判</option>
        <option value="5" {{stage5}}>赢单</option>
      </select>
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
