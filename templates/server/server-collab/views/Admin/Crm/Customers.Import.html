<div data-title="导入客户">
  <div class="form">
    <label>CSV 文件</label>
    <input type="file" id="cimpFile" accept=".csv,text/csv">
    <label>导入说明</label>
    <div class="muted">UTF-8 编码 CSV，列名需与模板一致（顺序无关）。错误行自动跳过，成功的好行正常入库。</div>
    <label>模板下载</label>
    <div><a class="btn sm" href="/admin/crm/customers/template" data-export>下载模板</a></div>
  </div>
  <div id="cimpResult"></div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn primary" type="button" id="cimpGo">开始导入</button>
  </footer>
  <script src="/static/js/import-customers.js" defer></script>
</div>
