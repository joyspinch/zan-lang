<div data-title="{{dialogTitle}}">
  <form data-submit action="/admin/crm/customers/save">
    <input type="hidden" name="id" value="{{id}}">
    <div class="form">
      <label>名称</label>
      <input class="input" name="name" value="{{name}}" required maxlength="64" placeholder="客户名称">
      <label>联系人</label>
      <input class="input" name="contact" value="{{contact}}" maxlength="32" placeholder="联系人姓名">
      <label>电话</label>
      <input class="input" name="phone" value="{{phone}}" maxlength="32" placeholder="联系电话">
      <label>等级</label>
      <select class="input" name="level">
        <option value="1" {{level1}}>重要</option>
        <option value="2" {{level2}}>普通</option>
        <option value="3" {{level3}}>潜在</option>
      </select>
      <label>备注</label>
      <input class="input" name="remark" value="{{remark}}" maxlength="256">
    </div>
    <footer style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" type="button" data-close>取消</button>
      <button class="btn primary" type="submit">保存</button>
    </footer>
  </form>
</div>
