<div data-title="导入联系人">
  <div class="form">
    <label>CSV 文件</label>
    <input type="file" id="ctimpFile" accept=".csv,text/csv">
    <label>导入说明</label>
    <div class="muted">UTF-8 编码 CSV，「客户」列按名称匹配现有客户，查无此客户的行会报错跳过。</div>
    <label>模板下载</label>
    <div><a class="btn sm" href="/admin/crm/contacts/template" data-export>下载模板</a></div>
  </div>
  <div id="ctimpResult"></div>
  <footer class="lay-footer">
    <button class="btn" type="button" data-close>取消</button>
    <button class="btn primary" type="button" id="ctimpGo">开始导入</button>
  </footer>
  <script src="/static/js/import-contacts.js" defer></script>
</div>
