<div class="dash">
<div class="grid c4">
  <div class="card kpi"><div class="k">Webhook 开关</div><div class="v"><span class="tag green">{{webhookEnabled}}</span></div><div class="s">数据转发引擎</div></div>
  <div class="card kpi"><div class="k">累计派发事件</div><div class="v" id="wh-total">0</div><div class="s">非阻塞异步投递</div></div>
  <div class="card kpi"><div class="k">投递成功率</div><div class="v" id="wh-success">0 成功</div><div class="s" id="wh-fail">0 失败</div></div>
  <div class="card kpi"><div class="k">最新派发状态</div><div class="v" id="wh-last" style="font-size: 16px;">—</div><div class="s">HTTP 响应确认</div></div>
</div>

<div class="card" style="margin-top: 16px;">
  <header>
    <span>当前规则配置 (Rule Definition)</span>
  </header>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px 16px;">
    <div>
      <div class="muted" style="font-size: 12px; margin-bottom: 4px;">目标 Webhook URL (POST 接收端)</div>
      <div class="mono" style="font-weight: 600;">{{webhookUrl}}</div>
    </div>
    <div>
      <div class="muted" style="font-size: 12px; margin-bottom: 4px;">主题路由匹配规则 (Topic Rule)</div>
      <div class="mono"><code class="tag">{{webhookRuleTopic}}</code></div>
    </div>
  </div>
</div>

<div class="card" style="margin-top: 16px;">
  <header>
    <span>最近派发审计流水 (Delivery Audit Log)</span>
    <div class="right">
      <button class="btn sm" onclick="loadWebhookStats()">刷新审计流水</button>
    </div>
  </header>
  <div class="table-scroll">
    <table class="table fit">
      <thead>
        <tr>
          <th width="120">时间</th>
          <th>主题 (Topic)</th>
          <th>来源客户端</th>
          <th width="80">QoS</th>
          <th width="100" class="mid">投递状态</th>
          <th>响应/错误详情</th>
        </tr>
      </thead>
      <tbody id="wh-log-body">
        <tr><td colspan="6" class="empty">暂无派发流水</td></tr>
      </tbody>
    </table>
  </div>
</div>
</div>

<script>
async function loadWebhookStats() {
  try {
    const res = await fetch('/iot/webhook/stats');
    const d = await res.json();
    if (!d.data) return;
    const s = d.data;
    document.getElementById('wh-total').textContent = s.total_forwarded || 0;
    document.getElementById('wh-success').textContent = (s.success_count || 0) + ' 成功';
    document.getElementById('wh-fail').textContent = (s.fail_count || 0) + ' 失败';
    document.getElementById('wh-last').textContent = s.last_status || 'idle';

    const tbody = document.getElementById('wh-log-body');
    const logs = s.recent_logs || [];
    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">暂无派发流水</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map(l => {
      const dt = new Date(l.time * 1000).toLocaleTimeString();
      return `
        <tr>
          <td class="mono muted">${dt}</td>
          <td><strong class="mono">${esc(l.topic)}</strong></td>
          <td class="mono">${esc(l.client_id || '(internal)')}</td>
          <td><span class="tag">QoS ${l.qos}</span></td>
          <td class="mid"><span class="tag ${l.success ? 'green' : 'red'}">${l.success ? '✓ 成功' : '✗ 失败'}</span></td>
          <td class="mono muted ellip">${esc(l.detail)}</td>
        </tr>
      `;
    }).join('');
  } catch (e) {
    document.getElementById('wh-log-body').innerHTML = '<tr><td colspan="6" class="empty">加载异常: ' + e.message + '</td></tr>';
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

loadWebhookStats();
</script>
