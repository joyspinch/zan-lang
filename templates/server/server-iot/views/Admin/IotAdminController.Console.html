<div class="dash">
<div class="grid c2">
  <div class="card">
    <header>
      <span>在线消息调试发布器 (MQTT Publisher)</span>
      <div class="right"><span class="tag green">Online Test</span></div>
    </header>
    <div style="padding: 12px 16px;">
      <div style="margin-bottom: 12px;">
        <label class="muted" style="display: block; font-size: 12px; margin-bottom: 4px;">发布目标主题 (Topic)</label>
        <input id="c-topic" class="input" placeholder="如 sensors/temperature 或 alerts/v1" style="width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border, #30363d); background: var(--bg-canvas, #0d1117); color: inherit;">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;">
        <div>
          <label class="muted" style="display: block; font-size: 12px; margin-bottom: 4px;">服务质量 (QoS)</label>
          <select id="c-qos" style="width: 100%; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border, #30363d); background: var(--bg-canvas, #0d1117); color: inherit;">
            <option value="0">QoS 0 - 最多一次 (At most once)</option>
            <option value="1">QoS 1 - 至少一次 (At least once)</option>
            <option value="2">QoS 2 - 恰好一次 (Exactly once)</option>
          </select>
        </div>
        <div>
          <label class="muted" style="display: block; font-size: 12px; margin-bottom: 4px;">保留标记 (Retain Flag)</label>
          <label style="display: flex; align-items: center; gap: 8px; height: 36px; cursor: pointer; font-size: 13px;">
            <input type="checkbox" id="c-retain"> 存为保留消息 (Retained)
          </label>
        </div>
      </div>
      <div style="margin-bottom: 12px;">
        <label class="muted" style="display: block; font-size: 12px; margin-bottom: 4px;">消息载荷 (Payload)</label>
        <textarea id="c-payload" rows="5" placeholder="请输入消息内容，如 JSON: {'temp': 24.8, 'hum': 60}" style="width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 4px; border: 1px solid var(--border, #30363d); background: var(--bg-canvas, #0d1117); color: inherit; font-family: monospace;"></textarea>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <button class="btn primary" onclick="sendConsoleMsg()">发送测试消息</button>
        <button class="btn sm" onclick="clearConsoleLog()">清空控制台日志</button>
      </div>
    </div>
  </div>

  <div class="card">
    <header>
      <span>实时事件与操作日志 (Live Console)</span>
      <div class="right"><span class="tag blue" id="log-count">0 条记录</span></div>
    </header>
    <div id="console-stream" style="padding: 12px 16px; height: 320px; overflow-y: auto; background: var(--bg-canvas, #0d1117); font-family: monospace; font-size: 12px; border-radius: 0 0 6px 6px;">
      <div style="color: #8b949e;">[ready] 控制台已就绪，等待消息发送或事件到达...</div>
    </div>
  </div>
</div>
</div>

<script>
let logCount = 0;

function appendLog(type, text) {
  logCount++;
  document.getElementById('log-count').textContent = logCount + ' 条记录';
  const box = document.getElementById('console-stream');
  const div = document.createElement('div');
  const now = new Date().toLocaleTimeString();
  let color = '#8b949e';
  if (type === 'success') color = '#3fb950';
  if (type === 'error') color = '#f85149';
  if (type === 'info') color = '#58a6ff';
  div.style.color = color;
  div.style.marginBottom = '4px';
  div.innerHTML = `<span style="color: #6e7681;">[${now}]</span> ${esc(text)}`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function clearConsoleLog() {
  logCount = 0;
  document.getElementById('log-count').textContent = '0 条记录';
  document.getElementById('console-stream').innerHTML = '<div style="color: #8b949e;">[cleared] 日志已清空</div>';
}

async function sendConsoleMsg() {
  const topic = document.getElementById('c-topic').value.trim();
  const qos = document.getElementById('c-qos').value;
  const retain = document.getElementById('c-retain').checked ? "1" : "0";
  const payload = document.getElementById('c-payload').value;

  if (!topic) {
    appendLog('error', '发布被拒绝: 主题 (Topic) 不能为空');
    return;
  }

  appendLog('info', `准备发布 -> Topic: ${topic}, QoS: ${qos}, Retain: ${retain === "1" ? "true" : "false"}`);
  try {
    const res = await fetch('/iot/publish', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'topic=' + encodeURIComponent(topic) + '&payload=' + encodeURIComponent(payload) + '&qos=' + qos + '&retain=' + retain
    });
    const d = await res.json();
    if (res.ok && d.code === 0) {
      appendLog('success', `✓ 发布成功: 已送达 ${d.data.delivered || 0} 个匹配客户端 (QoS: ${d.data.qos}, Retain: ${d.data.retain})`);
    } else {
      appendLog('error', `✗ 发布失败: ${d.msg || '未知服务端错误'}`);
    }
  } catch (e) {
    appendLog('error', `✗ 请求发生异常: ${e.message}`);
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
</script>
