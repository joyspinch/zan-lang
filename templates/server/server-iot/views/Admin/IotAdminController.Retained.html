<div class="dash">
<div class="card">
  <header>
    <span>保留消息管理 (Retained Messages)</span>
    <div class="right" style="display: flex; gap: 8px;">
      <button class="btn sm" onclick="loadRetained()">刷新</button>
      <button class="btn sm danger" onclick="clearAllRetained()">清空所有保留消息</button>
    </div>
  </header>
  <div style="padding: 10px 16px; background: rgba(56, 189, 248, 0.08); border-bottom: 1px solid var(--border, #30363d); font-size: 13px; color: #58a6ff;">
    💡 提示：保留消息是 Broker 为每个主题持久保留的最新有效状态。新客户端一旦订阅该主题，Broker 会立即将此消息投递给该客户端。
  </div>
  <div class="table-scroll">
    <table class="table fit">
      <thead>
        <tr>
          <th>主题 (Topic)</th>
          <th width="90">QoS</th>
          <th>载荷内容 (Payload)</th>
          <th width="100">长度 (字节)</th>
          <th class="mid" width="100">管理操作</th>
        </tr>
      </thead>
      <tbody id="retained-table-body">
        <tr><td colspan="5" class="empty">正在加载保留消息...</td></tr>
      </tbody>
    </table>
  </div>
</div>
</div>

<script>
async function loadRetained() {
  try {
    const res = await fetch('/iot/retained');
    const d = await res.json();
    const tbody = document.getElementById('retained-table-body');
    if (!d.data || d.data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">当前 Broker 无任何保留消息</td></tr>';
      return;
    }
    tbody.innerHTML = d.data.map(r => `
      <tr>
        <td><strong class="mono">${esc(r.topic)}</strong></td>
        <td><span class="tag ${r.qos === 2 ? 'green' : r.qos === 1 ? 'blue' : ''}">QoS ${r.qos}</span></td>
        <td class="mono ellip" style="max-width: 380px;">${esc(r.payload)}</td>
        <td class="mono muted">${r.len || 0} B</td>
        <td class="mid">
          <button class="btn sm danger" onclick="clearSingleRetained('${esc(r.topic)}')">清除</button>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('retained-table-body').innerHTML = '<tr><td colspan="5" class="empty">加载异常: ' + e.message + '</td></tr>';
  }
}

async function clearSingleRetained(topic) {
  if (!confirm('确定清除主题 [' + topic + '] 的保留消息吗？')) { return; }
  try {
    const res = await fetch('/iot/retained/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'topic=' + encodeURIComponent(topic)
    });
    const d = await res.json();
    if (res.ok && d.code === 0) {
      loadRetained();
    } else {
      alert('清除失败: ' + (d.msg || '未知错误'));
    }
  } catch (e) {
    alert('请求异常: ' + e.message);
  }
}

async function clearAllRetained() {
  if (!confirm('【警告】确定要清空 Broker 中的全部保留消息吗？此操作不可逆。')) { return; }
  try {
    const res = await fetch('/iot/retained/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: ''
    });
    const d = await res.json();
    if (res.ok && d.code === 0) {
      loadRetained();
    } else {
      alert('清空失败: ' + (d.msg || '未知错误'));
    }
  } catch (e) {
    alert('请求异常: ' + e.message);
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

loadRetained();
</script>
