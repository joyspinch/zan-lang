<div class="dash">
<div class="card">
  <header>
    <span>在线客户端连接 (Connected Clients)</span>
    <div class="right">
      <button class="btn sm" onclick="loadClients()">刷新列表</button>
    </div>
  </header>
  <div class="table-scroll">
    <table class="table fit">
      <thead>
        <tr>
          <th width="50">#</th>
          <th>Client ID</th>
          <th>远端 IP:端口</th>
          <th width="80">订阅数</th>
          <th width="100">接收报文</th>
          <th width="100">下发报文</th>
          <th class="mid" width="100">管理操作</th>
        </tr>
      </thead>
      <tbody id="client-table-body">
        <tr><td colspan="7" class="empty">正在加载客户端列表...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="card" style="margin-top: 16px;">
  <header>
    <span>全局订阅关系 (Subscriptions)</span>
    <div class="right">
      <span class="tag" id="sub-count-tag">0 规则</span>
    </div>
  </header>
  <div class="table-scroll">
    <table class="table fit">
      <thead>
        <tr>
          <th>Client ID</th>
          <th>主题过滤器 (Topic Filter)</th>
          <th width="100">授予 QoS</th>
        </tr>
      </thead>
      <tbody id="sub-table-body">
        <tr><td colspan="3" class="empty">暂无订阅关系</td></tr>
      </tbody>
    </table>
  </div>
</div>
</div>

<script>
async function loadClients() {
  try {
    const r = await fetch('/iot/clients');
    const d = await r.json();
    const tbody = document.getElementById('client-table-body');
    if (!d.data || d.data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">当前没有连接的 MQTT 客户端</td></tr>';
      return;
    }
    tbody.innerHTML = d.data.map((c, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong class="mono">${esc(c.client_id)}</strong></td>
        <td class="mono muted">${esc(c.addr)}</td>
        <td><span class="tag">${c.subs || 0}</span></td>
        <td class="mono">${c.msgs_in || 0}</td>
        <td class="mono">${c.msgs_out || 0}</td>
        <td class="mid">
          <button class="btn sm danger" onclick="kickClient('${esc(c.client_id)}')">强制下线</button>
        </td>
      </tr>
    `).join('');

    // 同步加载订阅
    const rs = await fetch('/iot/subscriptions');
    const ds = await rs.json();
    const sbody = document.getElementById('sub-table-body');
    const stag = document.getElementById('sub-count-tag');
    if (ds.data && ds.data.length > 0) {
      stag.textContent = ds.data.length + ' 规则';
      sbody.innerHTML = ds.data.map(s => `
        <tr>
          <td class="mono">${esc(s.client_id)}</td>
          <td><code class="tag">${esc(s.filter)}</code></td>
          <td><span class="tag ${s.qos === 2 ? 'green' : s.qos === 1 ? 'blue' : ''}">QoS ${s.qos}</span></td>
        </tr>
      `).join('');
    } else {
      stag.textContent = '0 规则';
      sbody.innerHTML = '<tr><td colspan="3" class="empty">暂无订阅关系</td></tr>';
    }
  } catch (e) {
    document.getElementById('client-table-body').innerHTML = '<tr><td colspan="7" class="empty">加载异常: ' + e.message + '</td></tr>';
  }
}

async function kickClient(clientId) {
  if (!confirm('确定要强制踢出客户端 [' + clientId + '] 吗？将立即断开其套接字。')) {
    return;
  }
  try {
    const res = await fetch('/iot/clients/' + encodeURIComponent(clientId) + '/kick', {
      method: 'POST'
    });
    const d = await res.json();
    if (res.ok && d.code === 0) {
      loadClients();
    } else {
      alert('踢除失败: ' + (d.msg || '未知错误'));
    }
  } catch (e) {
    alert('请求失败: ' + e.message);
  }
}

function esc(s) {
  return String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

loadClients();
</script>
