<div class="dash">
<div class="grid c4">
  <div class="card kpi"><div class="k">在线客户端</div><div class="v" id="m-clients">{{clientsConn}}</div><div class="s">累计连接 {{clientsTotal}}</div></div>
  <div class="card kpi"><div class="k">活跃主题 / 订阅</div><div class="v" id="m-topics">{{topics}} / {{subs}}</div><div class="s">主题数 / 订阅规则数</div></div>
  <div class="card kpi"><div class="k">消息流吞吐</div><div class="v" id="m-msgs">入 {{msgsIn}} · 出 {{msgsOut}}</div><div class="s">MQTT 3.1.1 核心路由</div></div>
  <div class="card kpi"><div class="k">运行时长</div><div class="v">{{uptime}}</div><div class="s">服务监听 {{brokerHost}}:{{brokerPort}}</div></div>
</div>

<div class="grid c2" style="margin-top: 16px;">
  <div class="card">
    <header>
      <span>快速消息注入 (Publish)</span>
      <div class="right"><span class="tag green">Broker Internal</span></div>
    </header>
    <div style="padding: 12px 0;">
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input id="q-topic" class="input" placeholder="主题，如 sensors/room1/temp" style="flex: 2; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border, #30363d); background: var(--bg-canvas, #0d1117); color: inherit;">
        <select id="q-qos" style="padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border, #30363d); background: var(--bg-canvas, #0d1117); color: inherit;">
          <option value="0">QoS 0 (最多一次)</option>
          <option value="1">QoS 1 (至少一次)</option>
          <option value="2">QoS 2 (恰好一次)</option>
        </select>
        <label style="display: flex; align-items: center; gap: 4px; font-size: 13px; cursor: pointer;">
          <input type="checkbox" id="q-retain"> 保留 (Retain)
        </label>
      </div>
      <div style="display: flex; gap: 8px;">
        <input id="q-payload" class="input" placeholder="消息载荷 Payload (如 25.4C 或 JSON)" style="flex: 1; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border, #30363d); background: var(--bg-canvas, #0d1117); color: inherit;">
        <button class="btn primary sm" onclick="doQuickPublish()">立即发布</button>
      </div>
      <div id="q-status" style="margin-top: 8px; font-size: 12px; color: #8b949e;"></div>
    </div>
  </div>

  <div class="card">
    <header>
      <span>常用功能快捷入口</span>
    </header>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 0;">
      <a class="btn" href="/admin/iot/clients" data-tab data-title="客户端管理" style="text-align: center; padding: 12px;">📱 在线客户端与连接</a>
      <a class="btn" href="/admin/iot/retained" data-tab data-title="保留消息" style="text-align: center; padding: 12px;">💾 保留消息 (Retained)</a>
      <a class="btn" href="/admin/iot/webhooks" data-tab data-title="规则与Webhook" style="text-align: center; padding: 12px;">🪝 规则与 Webhook 转发</a>
      <a class="btn" href="/admin/iot/console" data-tab data-title="消息测试台" style="text-align: center; padding: 12px;">⚡ 消息在线调试控制台</a>
    </div>
  </div>
</div>
</div>

<script>
async function doQuickPublish() {
  const topic = document.getElementById('q-topic').value.trim();
  const payload = document.getElementById('q-payload').value;
  const qos = document.getElementById('q-qos').value;
  const retain = document.getElementById('q-retain').checked ? "1" : "0";
  const st = document.getElementById('q-status');
  if (!topic) { st.textContent = '请输入主题'; st.style.color = '#f85149'; return; }
  st.textContent = '正在发送...';
  st.style.color = '#8b949e';
  try {
    const res = await fetch('/iot/publish', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: 'topic=' + encodeURIComponent(topic) + '&payload=' + encodeURIComponent(payload) + '&qos=' + qos + '&retain=' + retain
    });
    const data = await res.json();
    if (res.ok && data.code === 0) {
      st.textContent = '✓ 发送成功，已送达 ' + (data.data.delivered || 0) + ' 个本地订阅客户端 (QoS ' + qos + ')';
      st.style.color = '#3fb950';
    } else {
      st.textContent = '✗ 发送失败: ' + (data.msg || '未知错误');
      st.style.color = '#f85149';
    }
  } catch (e) {
    st.textContent = '✗ 网络请求异常: ' + e.message;
    st.style.color = '#f85149';
  }
}

async function refreshDashboardMetrics() {
  try {
    const res = await fetch('/iot/metrics');
    const d = await res.json();
    if (!d.data) return;
    const m = d.data;
    const elClients = document.getElementById('m-clients');
    if (elClients) elClients.textContent = m.clients_connected || 0;
    const elTopics = document.getElementById('m-topics');
    if (elTopics) elTopics.textContent = (m.topics || 0) + ' / ' + (m.subscriptions || 0);
    const elMsgs = document.getElementById('m-msgs');
    if (elMsgs) elMsgs.textContent = '入 ' + (m.messages_in || 0) + ' · 出 ' + (m.messages_out || 0);
  } catch (e) { /* ignore during background refresh */ }
}
setInterval(refreshDashboardMetrics, 2000);
</script>
