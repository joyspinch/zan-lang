<!DOCTYPE html>
<!-- 结算场景：body 半透明叠在定格的牌桌画面上（DzOverScene.Render 继续画
     DrawTableBase）。结构须保持「body 直接子元素」的扁平列（嵌套 flex 容
     器引擎不认）。id 由 DzOverScene.OnEnter 回填。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,10,6,0.72)">
  <h1 id="headline" style="color:#ffdc64;font-size:42px;margin:0">胜利！赢 20 豆</h1>
  <p id="sub" style="color:#e8d8b8;font-size:19px;margin:0">豆 220 · 倍数 x1</p>
  <p id="cheer" style="color:#96e6be;font-size:17px;margin:0">手气正旺，再来一局！</p>
  <div style="height:18px"></div>
  <button data-on-click="again" style="font-size:20px;padding:14px 56px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">再来一局</button>
  <button data-on-click="menu" style="font-size:17px;padding:11px 48px;background:#3a2c1a;color:#e6d8c0;border:2px solid #6b5432;border-radius:12px">回到菜单</button>
</body>
</html>
