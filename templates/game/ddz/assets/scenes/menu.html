<!DOCTYPE html>
<!-- 主菜单场景：画布层已画美术背景与标题（DzMenuScene.Render → DrawMenuArt），
     body 保持透明只放按钮与战绩行。结构须保持「body 直接子元素」的扁平列
     （嵌套 flex 容器引擎不认）。data-on-click 由 DzMenuScene.OnWire 注册；
     难度按钮选定即开局，开始按钮沿用当前难度。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:13px;background:rgba(0,0,0,0)">
  <div style="height:244px"></div>
  <p style="color:#ffd696;font-size:21px;margin:0">叫分抢庄 · 炸弹翻倍 · 连胜赢豆</p>
  <div style="height:16px"></div>
  <button data-on-click="start" style="font-size:24px;padding:22px 120px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:14px">开始斗地主</button>
  <p style="color:#e6d2a8;font-size:17px;margin:6px 0 0 0">选择难度开局</p>
  <button data-on-click="easy" style="font-size:20px;padding:14px 108px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">简单场</button>
  <button data-on-click="normal" style="font-size:20px;padding:14px 108px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">普通场</button>
  <button data-on-click="hard" style="font-size:20px;padding:14px 108px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:12px">困难场</button>
  <p id="stats" style="color:#e6d2a8;font-size:16px;margin:14px 0 0 0">长工 · 豆 200 · 胜 0 负 0</p>
  <p style="color:#b9a98c;font-size:15px;margin:0">Esc 退出</p>
</body>
</html>
