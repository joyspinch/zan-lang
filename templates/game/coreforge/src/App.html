<!doctype html>
<html>
<head><meta charset="utf-8"><title>CoreforgeHud</title></head>
<body data-zan-design id="CoreforgeHud" class="cf-root" data-layout-mode="1">

  <!-- 顶栏：品牌 + 资源 + 波次 + 节奏按钮 -->
  <zan-flex id="Topbar" class="cf-topbar align-center" data-dock="1" data-fh="46" data-gap="10">
    <label class="cf-brand">炉心边境</label>
    <label class="cf-brand-sub">COREFORGE</label>
    <zan-flex class="cf-pill align-center" style="height:24px;padding:0 10px">
      <div class="cf-dot cf-copper" style="width:10px;height:10px"></div>
      <label id="rCopper" class="cf-pilltext" data-dock="5">铜 0</label>
    </zan-flex>
    <zan-flex class="cf-pill align-center" style="height:24px;padding:0 10px">
      <div class="cf-dot cf-lead" style="width:10px;height:10px"></div>
      <label id="rLead" class="cf-pilltext" data-dock="5">铅 0</label>
    </zan-flex>
    <zan-flex class="cf-pill align-center" style="height:24px;padding:0 10px">
      <div class="cf-dot cf-graphite" style="width:10px;height:10px"></div>
      <label id="rGraphite" class="cf-pilltext" data-dock="5">石墨 0</label>
    </zan-flex>
    <zan-flex class="cf-pill align-center" style="height:24px;padding:0 10px">
      <div class="cf-dot cf-titanium" style="width:10px;height:10px"></div>
      <label id="rTitanium" class="cf-pilltext" data-dock="5">钛 0</label>
    </zan-flex>
    <label class="grow" data-dock="5"></label>
    <label id="waveText" class="cf-wave" data-dock="5"></label>
    <button id="btnLaunch" class="cf-btn cf-warn" data-fh="32" data-on-click="hudLaunch">迎敌</button>
    <button id="btnSpeed" class="cf-btn" data-fh="32" data-on-click="hudSpeed">×1</button>
    <button id="btnPause" class="cf-btn" data-fh="32" data-on-click="hudPause">暂停</button>
  </zan-flex>

  <!-- 第二排：炉心条 + 电力 + 全局工具 -->
  <zan-flex id="Toolbar" class="cf-toolbar align-center" data-dock="1" data-fh="34" data-gap="8">
    <progress id="hpBar" class="cf-hp" data-fh="10" data-percent="100" data-show-indicator="false" style="width:220px"></progress>
    <label id="hpText" class="cf-hptext" data-dock="5"></label>
    <label class="grow" data-dock="5"></label>
    <button id="btnPower" class="cf-mini" data-on-click="hudPower">电网</button>
    <button id="btnTech" class="cf-mini" data-on-click="hudTech">科技</button>
    <button id="btnSave" class="cf-mini" data-on-click="hudSave">保存</button>
    <button id="btnLoad" class="cf-mini" data-on-click="hudLoad">读档</button>
    <button id="btnHome" class="cf-mini" data-on-click="hudHome">回炉心</button>
    <button id="btnDrones" class="cf-mini" data-on-click="hudDrones">铁蜂·守卫</button>
    <button id="btnNew" class="cf-mini cf-danger" data-on-click="hudNew">新远征</button>
  </zan-flex>

  <!-- 悬浮层：自由几何面板的宿主（body 直接子级只吃 dock） -->
  <div id="Overlay" class="cf-overlay" data-dock="5">
  <!-- 远征目标（新手引导清单，全部完成后隐藏） -->
  <zan-flex id="Objectives" class="cf-panel column" data-position="1" data-anchor="1" data-fx="14" data-fy="14" data-fw="238" data-fh="182">
    <label class="cf-paneltitle">远征目标</label>
    <label id="obj0" class="cf-obj" data-wrap="true"></label>
    <label id="obj1" class="cf-obj" data-wrap="true"></label>
    <label id="obj2" class="cf-obj" data-wrap="true"></label>
    <label id="obj3" class="cf-obj" data-wrap="true"></label>
    <label id="obj4" class="cf-obj" data-wrap="true"></label>
  </zan-flex>

  <!-- 选中/点检详情（右上） -->
  <zan-flex id="Detail" class="cf-panel column" data-position="1" data-anchor="1" data-fx="1000" data-fy="14" data-fw="266" data-fh="230">
    <label id="detTitle" class="cf-paneltitle"></label>
    <label id="detBody" class="cf-detbody" data-wrap="true"></label>
    <zan-flex class="align-center" data-dock="5" data-gap="6">
      <button id="btnRecipe" class="cf-mini" data-on-click="hudRecipe">配方</button>
      <button id="btnTarget" class="cf-mini" data-on-click="hudTarget">索敌</button>
      <button id="btnFeed" class="cf-mini" data-on-click="hudFeed">投入</button>
    </zan-flex>
  </zan-flex>

  <!-- 波次横幅（进攻期间显示） -->
  <zan-flex id="Banner" class="cf-banner align-center" data-position="1" data-anchor="1" data-fx="360" data-fy="10" data-fw="560" data-fh="46">
    <label id="bannerText" class="cf-bannertext"></label>
  </zan-flex>

  <!-- 科技面板（左侧，与目标面板互斥显示） -->
  <zan-flex id="Tech" class="cf-panel column" data-position="1" data-anchor="1" data-fx="14" data-fy="14" data-fw="330" data-fh="470">
    <label class="cf-paneltitle">研究与扩张</label>
    <button id="tech1" class="cf-techrow" data-on-click="hudTech1"></button>
    <button id="tech2" class="cf-techrow" data-on-click="hudTech2"></button>
    <button id="tech3" class="cf-techrow" data-on-click="hudTech3"></button>
    <button id="tech4" class="cf-techrow" data-on-click="hudTech4"></button>
    <button id="tech5" class="cf-techrow" data-on-click="hudTech5"></button>
    <button id="tech6" class="cf-techrow" data-on-click="hudTech6"></button>
    <button id="tech7" class="cf-techrow" data-on-click="hudTech7"></button>
    <button id="tech8" class="cf-techrow" data-on-click="hudTech8"></button>
    <button id="tech9" class="cf-techrow" data-on-click="hudTech9"></button>
    <button id="tech10" class="cf-techrow" data-on-click="hudTech10"></button>
    <button id="tech11" class="cf-techrow" data-on-click="hudTech11"></button>
    <label class="cf-hint" data-wrap="true">前置完成后，用核心库存换取扩张。</label>
  </zan-flex>

  <!-- 建造栏（底部中央） -->
  <zan-flex id="Palette" class="cf-palette align-center" data-dock="2" data-fh="74" data-gap="6">
    <button id="pb2" class="cf-build" data-on-click="hudB2">钻头</button>
    <button id="pb3" class="cf-build" data-on-click="hudB3">传送带</button>
    <button id="pb4" class="cf-build" data-on-click="hudB4">分流器</button>
    <button id="pb5" class="cf-build" data-on-click="hudB5">熔炉</button>
    <button id="pb6" class="cf-build" data-on-click="hudB6">装配机</button>
    <button id="pb7" class="cf-build" data-on-click="hudB7">发电机</button>
    <button id="pb8" class="cf-build" data-on-click="hudB8">蓄电池</button>
    <button id="pb9" class="cf-build" data-on-click="hudB9">炮塔</button>
    <button id="pb15" class="cf-build" data-on-click="hudB15">散射</button>
    <button id="pb16" class="cf-build" data-on-click="hudB16">狙炮</button>
    <button id="pb17" class="cf-build" data-on-click="hudB17">臼炮</button>
    <button id="pb18" class="cf-build" data-on-click="hudB18">机巢</button>
    <button id="pb19" class="cf-build" data-on-click="hudB19">棱镜</button>
    <button id="pb10" class="cf-build" data-on-click="hudB10">合金墙</button>
    <button id="pb11" class="cf-build" data-on-click="hudB11">取水泵</button>
    <button id="pb12" class="cf-build" data-on-click="hudB12">管道</button>
    <button id="pb13" class="cf-build" data-on-click="hudB13">中继</button>
    <button id="pb14" class="cf-build" data-on-click="hudB14">油井</button>
  </zan-flex>

  <!-- 状态栏（最底） -->
  <zan-flex id="Statusbar" class="cf-status align-center" data-dock="2" data-fh="28" data-gap="8">
    <label id="statusText" class="cf-statustext" data-dock="5"></label>
    <button id="btnRotate" class="cf-mini" data-on-click="hudRotate">旋转 R</button>
    <button id="btnDemolish" class="cf-mini" data-on-click="hudDemolish">拆除 X</button>
    <button id="btnCancel" class="cf-mini" data-on-click="hudCancel">取消 Q</button>
  </zan-flex>

  <!-- 结算幕（败北/胜利，Overlay 内铺满 = 最上层） -->
  <div id="EndVeil" class="cf-veil" data-dock="5">
    <zan-flex id="EndPanel" class="cf-endpanel column align-center" data-position="1" data-anchor="1" data-fx="430" data-fy="290" data-fw="420" data-fh="250">
      <label id="endTitle" class="cf-endtitle"></label>
      <label id="endStats" class="cf-endstats" data-wrap="true"></label>
      <zan-flex class="align-center" data-dock="5" data-gap="12">
        <button id="btnAgain" class="cf-btn cf-warn" data-on-click="hudAgain">再度远征</button>
        <button id="btnEndLoad" class="cf-btn" data-on-click="hudLoad2">读档重演</button>
      </zan-flex>
    </zan-flex>
  </div>
  </div>
</body>
</html>
