<!DOCTYPE html>
<!-- 主菜单场景：整屏 HTML。data-on-click 的名字由 MenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14161a;gap:18px">
  <h1 style="color:#7ee787;font-size:52px;margin:0">弹球试炼</h1>
  <p style="color:#8b949e;font-size:18px;margin:0">一个窗口三个场景 · 每个场景一个 HTML 文件</p>
  <div style="height:16px"></div>
  <button data-on-click="start" style="font-size:22px;padding:14px 56px">开始游戏</button>
  <button data-on-click="quit" style="padding:10px 48px">退出</button>
  <p style="color:#6e7681;font-size:14px;margin-top:20px">鼠标移动挡板 · 接住弹球 · Esc 退出</p>
</body>
</html>
