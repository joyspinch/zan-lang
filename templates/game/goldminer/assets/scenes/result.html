<!DOCTYPE html>
<!-- 结算场景：body 半透明叠在定格的对局画面上（MnOverScene.Render 继续画
     DrawAll）。结构须保持「body 直接子元素」的扁平列（嵌套 flex 容器引擎
     不认）。id 由 MnOverScene.OnEnter 回填；按钮 next 走 ConfirmResult
     （赢开下一关、输重开，600ms 冷却内点击无效）。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,12,17,0.72)">
  <h1 id="headline" style="color:#ffdc64;font-size:44px;margin:0">过关!</h1>
  <p id="sub" style="color:#f4d078;font-size:20px;margin:0">本关 $0 / 目标 $650</p>
  <p id="total" style="color:#e8e2d4;font-size:17px;margin:0">累计 $0</p>
  <div style="height:14px"></div>
  <button id="next" data-on-click="next" style="font-size:21px;padding:16px 64px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">继续 →</button>
  <p style="color:#b9c2ce;font-size:14px;margin:0">Esc 退出并存档</p>
</body>
</html>
