<!DOCTYPE html>
<!-- 主菜单场景：真美术（背景 + 标题）在画布层画，这里只放文字与按钮。
     HTML 引擎不支持 url() 背景图，图片走画布 → 见 SnMenuScene.Render。
     data-on-click="start" 由 SnMenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(4,10,20,0.35)">
  <div style="height:150px"></div>
  <p style="color:#7ddfff;font-size:22px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,0.8)">无边画布 · 吞豆成长 · 猎食小蛇 · 智斗大蛇</p>
  <div style="height:18px"></div>
  <button data-on-click="start" style="font-size:24px;padding:16px 64px;background:linear-gradient(180deg,#2fae8d,#1d7f66);color:#f0fff9;border:2px solid #5fe8bf;border-radius:14px;text-shadow:0 1px 4px rgba(0,0,0,0.6)">开始滑行</button>
  <p id="stats" style="color:#ffe082;font-size:16px;margin:14px 0 0 0;text-shadow:0 1px 6px rgba(0,0,0,0.8)">最高分 0</p>
  <p style="color:#a9c8d8;font-size:15px;margin:0;text-shadow:0 1px 6px rgba(0,0,0,0.8)">鼠标转向 · 按住左键/空格冲刺 · Esc 退出 · 分数越高猎手越凶</p>
</body>
</html>
