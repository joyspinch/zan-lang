<!DOCTYPE html>
<!-- 主菜单场景：整屏 HTML+CSS。data-on-click="start" 由 SnMenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(170deg,#07231e 0%,#06121f 55%,#0a1a30 100%)">
  <h1 style="color:#8effd9;font-size:64px;margin:0">蛇蛇乐</h1>
  <p style="color:#7ddfff;font-size:20px;margin:0">无边画布 · 吞豆成长 · 猎食小蛇 · 智斗大蛇</p>
  <div style="height:28px"></div>
  <button data-on-click="start" style="font-size:24px;padding:16px 64px;background:linear-gradient(180deg,#2fae8d,#1d7f66);color:#f0fff9;border:2px solid #5fe8bf;border-radius:14px">开始滑行</button>
  <p id="stats" style="color:#ffe082;font-size:16px;margin:14px 0 0 0">最高分 0</p>
  <p style="color:#a9c8d8;font-size:15px;margin:0">鼠标转向 · 按住左键/空格冲刺 · Esc 退出 · 分数越高猎手越凶</p>
</body>
</html>
