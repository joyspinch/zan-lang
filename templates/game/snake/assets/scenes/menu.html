<!DOCTYPE html>
<!-- 主菜单场景：真美术（背景 + 标题）在画布层画，这里只放文字与按钮。
     HTML 引擎不支持 url() 背景图，图片走画布 → 见 SnMenuScene.Render。
     data-on-click 由 SnMenuScene.OnWire 注册；皮肤按钮 data-arg = 皮肤编号，
     样式（色板渐变 / 锁定 / 选中）由 SnMenuScene.SyncSkins 回填。 -->
<html>
<head>
<style>
body { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:rgba(4,8,22,0.38); }
.tag { color:#7ddfff; font-size:21px; margin:0; text-shadow:0 2px 8px rgba(0,0,0,0.85); }
button.go { font-size:24px; height:58px; padding:0 70px; background:linear-gradient(180deg,#36c79f,#1d7f66); color:#f0fff9; border:2px solid #5fe8bf; border-radius:16px; text-shadow:0 1px 4px rgba(0,0,0,0.6); }
button.go:hover { background:linear-gradient(180deg,#4adeb4,#24917a); border-color:#b4fff0; }
button.go:active { background:#17664f; border-color:#5fe8bf; }
button.go:focus { border-color:#ffffff; }
.card { display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 26px; background:rgba(8,12,34,0.80); border:1px solid rgba(125,223,255,0.38); border-radius:18px; }
.row { display:flex; flex-direction:row; gap:12px; align-items:center; }
.cap { color:#a9c8e8; font-size:15px; margin:0; }
button.skin { width:116px; height:42px; font-size:16px; color:#0b1020; background:#3a4466; border:2px solid rgba(255,255,255,0.22); border-radius:21px; }
button.skin:hover { border-color:#ffffff; }
button.skin:active { border-color:#7ddfff; }
button.skin:focus { border-color:#7ddfff; }
button.skin:disabled { color:#7c86a6; background:#161c32; border:2px solid #2c3556; }
button.skin-sel { border:3px solid #ffffff; }
.desc { color:#ffe082; font-size:15px; margin:0; }
.stats { color:#ffe082; font-size:15px; margin:0; text-shadow:0 1px 6px rgba(0,0,0,0.8); }
.keys { color:#a9c8d8; font-size:14px; margin:0; text-shadow:0 1px 6px rgba(0,0,0,0.85); }
</style>
</head>
<body>
  <div style="height:150px"></div>
  <p class="tag">无边画布 · 吞豆成长 · 智斗三种性格的大蛇 · 抢夺限时道具</p>
  <button class="go" data-on-click="start">开始滑行</button>
  <div class="card">
    <p class="cap">选择皮肤（最高分 / 累计击败解锁）</p>
    <div class="row">
      <button id="skin0" class="skin" data-on-click="skin" data-arg="0">薄荷</button>
      <button id="skin1" class="skin" data-on-click="skin" data-arg="1">落日</button>
      <button id="skin2" class="skin" data-on-click="skin" data-arg="2">冰晶</button>
      <button id="skin3" class="skin" data-on-click="skin" data-arg="3">熔岩</button>
      <button id="skin4" class="skin" data-on-click="skin" data-arg="4">极光</button>
    </div>
    <p id="skindesc" class="desc">当前皮肤：薄荷</p>
    <p id="stats" class="stats">最高分 0</p>
  </div>
  <p id="mute" class="keys">回车/空格 开始 · ←/→ 换皮肤 · Esc 退出 · M 音效：开</p>
  <p class="keys">鼠标转向 · 按住左键/空格冲刺 · P/Esc 暂停 · 撞墙或撞上大蛇身体即出局</p>
</body>
</html>
