<!DOCTYPE html>
<!-- 结算场景：body 半透明叠在定格的对局画面上（蛇蛇乐战场）。
     id 由 SnOverScene.OnEnter 回填（headline/score/sub/cheer）。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,10,20,0.7)">
  <h1 id="headline" style="color:#ffdc64;font-size:42px;margin:0">旅程结束</h1>
  <p id="score" style="color:#ffe16e;font-size:34px;margin:0">得分 0</p>
  <p id="sub" style="color:#a9d8ef;font-size:17px;margin:0">长度 14 · 击败 0 · 小蛇苗</p>
  <p id="cheer" style="color:#8effd9;font-size:16px;margin:0">再来一局，超越自己！</p>
  <div style="height:16px"></div>
  <button data-on-click="retry" style="font-size:19px;padding:12px 48px;background:linear-gradient(180deg,#2fae8d,#1d7f66);color:#f0fff9;border:2px solid #5fe8bf;border-radius:12px">再滑一次</button>
  <button data-on-click="menu" style="font-size:17px;padding:10px 44px;background:#22384a;color:#e2f2f7;border:2px solid #3a5b74;border-radius:12px">回到菜单</button>
</body>
</html>
