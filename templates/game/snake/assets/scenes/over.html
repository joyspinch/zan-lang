<!DOCTYPE html>
<!-- 结算场景：半透明 body 叠在定格的对局画面上，成绩卡居中。
     id 由 SnOverScene.OnEnter 回填（headline/killer/score/rank/sub/unlock/cheer）。 -->
<html>
<head>
<style>
body { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(4,8,22,0.66); }
.card { display:flex; flex-direction:column; align-items:center; gap:10px; padding:24px 56px; background:rgba(8,12,34,0.88); border:2px solid rgba(255,110,170,0.55); border-radius:22px; }
.ttl { color:#ffdc64; font-size:40px; margin:0; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
.killer { color:#ff8fb0; font-size:19px; margin:0; }
.score { color:#ffe16e; font-size:46px; margin:0; text-shadow:0 2px 10px rgba(255,200,80,0.35); }
.rank { color:#7ddfff; font-size:22px; margin:0; }
.best { color:#ffb3d1; font-size:16px; margin:0; }
.sub { color:#a9d8ef; font-size:16px; margin:0; }
.unlock { color:#8effd9; font-size:18px; margin:0; }
.cheer { color:#c9b8ff; font-size:15px; margin:0; }
.keys { color:#8ea6c0; font-size:14px; margin:0; }
.row { display:flex; flex-direction:row; gap:16px; align-items:center; }
button.go { font-size:20px; height:52px; padding:0 48px; background:linear-gradient(180deg,#36c79f,#1d7f66); color:#f0fff9; border:2px solid #5fe8bf; border-radius:14px; }
button.go:hover { background:linear-gradient(180deg,#4adeb4,#24917a); border-color:#b4fff0; }
button.go:active { background:#17664f; }
button.go:focus { border-color:#ffffff; }
button.alt { font-size:17px; height:52px; padding:0 40px; background:#1f2c4a; color:#e2f2f7; border:2px solid #3f5a86; border-radius:14px; }
button.alt:hover { background:#2a3b62; border-color:#7ddfff; }
button.alt:active { background:#16203a; }
button.alt:focus { border-color:#ffffff; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="headline" class="ttl">旅程结束</h1>
    <p id="killer" class="killer">被击败</p>
    <p id="score" class="score">0</p>
    <p id="rank" class="rank">最终排名 #1</p>
    <p id="best" class="best">最高 0</p>
    <p id="sub" class="sub">长度 14 · 截杀 0 · 小蛇苗</p>
    <p id="unlock" class="unlock">新皮肤解锁</p>
    <p id="cheer" class="cheer">再来一局，超越自己！</p>
    <div style="height:6px"></div>
    <div class="row">
      <button class="go" data-on-click="retry">再滑一次</button>
      <button class="alt" data-on-click="menu">回到菜单</button>
    </div>
    <p class="keys">回车/空格 再来一局 · Esc 回到菜单 · M 静音</p>
  </div>
</body>
</html>
