<!DOCTYPE html>
<!-- 暂停场景：body 半透明叠在定格的对局画面上（同结算场景的做法）。
     data-on-click 由 SnPauseScene.OnWire 注册；id="mute" 由 OnEnter/按 M 回填。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,10,20,0.62)">
  <h1 style="color:#7ddfff;font-size:44px;margin:0;text-shadow:0 2px 8px rgba(0,0,0,0.8)">暂停中</h1>
  <p id="score" style="color:#ffe16e;font-size:22px;margin:0">得分 0</p>
  <div style="height:12px"></div>
  <button data-on-click="resume" style="font-size:22px;height:56px;padding:0 60px;background:linear-gradient(180deg,#2fae8d,#1d7f66);color:#f0fff9;border:2px solid #5fe8bf;border-radius:14px;text-shadow:0 1px 4px rgba(0,0,0,0.6)">继续滑行</button>
  <button data-on-click="restart" style="font-size:18px;height:50px;padding:0 48px;background:#2a3d5e;color:#e2f2f7;border:2px solid #4a6c94;border-radius:12px">重新开局</button>
  <button data-on-click="menu" style="font-size:18px;height:50px;padding:0 48px;background:#22384a;color:#e2f2f7;border:2px solid #3a5b74;border-radius:12px">回到菜单</button>
  <p id="mute" style="color:#a9c8d8;font-size:15px;margin:10px 0 0 0;text-shadow:0 1px 6px rgba(0,0,0,0.8)">P/Esc 继续 · R 重开 · M 静音</p>
</body>
</html>
