<!DOCTYPE html>
<!-- 暂停场景：半透明 body 叠在定格的对局画面上，面板居中。
     data-on-click 由 SnPauseScene.OnWire 注册；id 由 OnEnter/按 M 回填。 -->
<html>
<head>
<style>
body { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(4,8,22,0.58); }
.card { display:flex; flex-direction:column; align-items:center; gap:12px; padding:26px 60px; background:rgba(8,12,34,0.88); border:2px solid rgba(125,223,255,0.45); border-radius:22px; }
.ttl { color:#7ddfff; font-size:42px; margin:0; text-shadow:0 2px 8px rgba(0,0,0,0.8); }
.score { color:#ffe16e; font-size:21px; margin:0; }
.info { color:#a9c8e8; font-size:15px; margin:0; }
.keys { color:#8ea6c0; font-size:14px; margin:0; }
button { width:240px; }
button.go { font-size:21px; height:54px; background:linear-gradient(180deg,#36c79f,#1d7f66); color:#f0fff9; border:2px solid #5fe8bf; border-radius:14px; }
button.go:hover { background:linear-gradient(180deg,#4adeb4,#24917a); border-color:#b4fff0; }
button.go:active { background:#17664f; }
button.go:focus { border-color:#ffffff; }
button.alt { font-size:17px; height:48px; background:#1f2c4a; color:#e2f2f7; border:2px solid #3f5a86; border-radius:14px; }
button.alt:hover { background:#2a3b62; border-color:#7ddfff; }
button.alt:active { background:#16203a; }
button.alt:focus { border-color:#ffffff; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="ttl">暂停中</h1>
    <p id="score" class="score">得分 0</p>
    <p id="info" class="info">排名 #1 · 威胁 0</p>
    <div style="height:4px"></div>
    <button class="go" data-on-click="resume">继续滑行</button>
    <button class="alt" data-on-click="restart">重新开局</button>
    <button class="alt" data-on-click="menu">回到菜单</button>
    <p id="mute" class="keys">P/Esc 继续 · R 重开 · M 静音</p>
  </div>
</body>
</html>
