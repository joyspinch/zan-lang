<!DOCTYPE html>
<!-- 主菜单场景：画布层已画美术背景与标题（XqMenuScene.Render → DrawMenuArt），
     body 保持透明只放模式按钮与战绩行。结构须保持「body 直接子元素」的扁平列
     （嵌套 flex 容器引擎不认）。data-on-click 由 XqMenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:rgba(0,0,0,0)">
  <div style="height:236px"></div>
  <p style="color:#ffd89b;font-size:22px;margin:0">楚河汉界 · 经典残局 · 段位成长</p>
  <div style="height:12px"></div>
  <button data-on-click="classic" style="font-size:22px;padding:18px 128px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:14px">经典对弈</button>
  <button data-on-click="drill1" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:12px">残局 · 双车错</button>
  <button data-on-click="drill2" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">残局 · 马后炮</button>
  <button data-on-click="drill3" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:12px">残局 · 车兵破士象</button>
  <button data-on-click="drill4" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">残局 · 重炮夺魁</button>
  <button data-on-click="drill5" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:12px">残局 · 卧槽马</button>
  <button data-on-click="drill6" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">残局 · 双马饮泉</button>
  <button data-on-click="drill7" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:12px">残局 · 海底捞月</button>
  <button data-on-click="drill8" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">残局 · 老卒逼宫</button>
  <button data-on-click="drill9" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:12px">残局 · 车炮巧胜</button>
  <button data-on-click="drill10" style="font-size:19px;padding:12px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">残局 · 单兵擒王</button>
  <p id="stats" style="color:#e6d2a8;font-size:16px;margin:10px 0 0 0">段位 新手 · 0 分</p>
  <p style="color:#b9a98c;font-size:15px;margin:0">点选红子再点目标 · Esc 退出</p>
</body>
</html>
