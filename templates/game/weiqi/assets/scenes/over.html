<!DOCTYPE html>
<!-- 结算场景：body 半透明叠在定格的棋局画面上（WqOverScene.Render 继续画
     DrawPlay）。结构须保持「body 直接子元素」的扁平列（嵌套 flex 容器引擎
     不认）。id 由 WqOverScene.OnEnter 回填。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,8,4,0.72)">
  <h1 id="headline" style="color:#ffdc64;font-size:44px;margin:0">妙手成局，黑胜！</h1>
  <p id="score" style="color:#e8d8b8;font-size:19px;margin:0">黑 0 · 白 0（含贴目）</p>
  <p id="cheer" style="color:#96e6be;font-size:17px;margin:0">棋形优美，再来一盘！</p>
  <div style="height:18px"></div>
  <button data-on-click="again" style="font-size:20px;padding:14px 56px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:12px">再来一局</button>
  <button data-on-click="menu" style="font-size:17px;padding:11px 48px;background:#3a2c1a;color:#e6d8c0;border:2px solid #6b5432;border-radius:12px">回到菜单</button>
</body>
</html>
