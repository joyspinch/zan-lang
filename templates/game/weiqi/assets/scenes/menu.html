<!DOCTYPE html>
<!-- 主菜单场景：画布层已画美术背景与标题（WqMenuScene.Render → DrawMenuArt），
     body 保持透明只放模式按钮与战绩行。结构须保持「body 直接子元素」的扁平列
     （嵌套 flex 容器引擎不认）。data-on-click 由 WqMenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;background:rgba(0,0,0,0)">
  <div style="height:252px"></div>
  <p style="color:#ffd696;font-size:22px;margin:0">黑白之间 · 死活经典 · 段位成长</p>
  <div style="height:20px"></div>
  <button data-on-click="game" style="font-size:22px;padding:20px 120px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:14px">九路对弈</button>
  <button data-on-click="drill1" style="font-size:21px;padding:19px 96px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:14px">死活题 · 征子</button>
  <button data-on-click="drill2" style="font-size:21px;padding:19px 96px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:14px">死活题 · 直三杀</button>
  <button data-on-click="drill3" style="font-size:21px;padding:19px 96px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:14px">死活题 · 关门吃</button>
  <p id="stats" style="color:#e6d2a8;font-size:16px;margin:16px 0 0 0">段位 布衣 · 0 分</p>
  <p style="color:#b9a98c;font-size:15px;margin:0">执黑先行 · P 停一手 · Esc 退出</p>
</body>
</html>
