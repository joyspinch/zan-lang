<!DOCTYPE html>
<!-- 主菜单场景：画布层已画美术背景与标题（GmMenuScene.Render → DrawMenuArt），
     body 保持透明只放按钮与战绩行。结构须保持「body 直接子元素」的扁平列
     （嵌套 flex 容器引擎不认）。data-on-click 由 GmMenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;background:rgba(0,0,0,0)">
  <div style="height:250px"></div>
  <p style="color:#ffd696;font-size:22px;margin:0">落子生根 · 五连制胜 · 段位成长</p>
  <div style="height:22px"></div>
  <button data-on-click="easy" style="font-size:22px;padding:20px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:14px">初学对弈</button>
  <button data-on-click="normal" style="font-size:22px;padding:20px 110px;background:linear-gradient(180deg,#d9ab52,#b8862f);color:#42290d;border:2px solid #f0d18c;border-radius:14px">棋士对弈</button>
  <button data-on-click="hard" style="font-size:22px;padding:20px 110px;background:linear-gradient(180deg,#c99b44,#a1742a);color:#42290d;border:2px solid #e0bd7a;border-radius:14px">棋圣对弈</button>
  <p id="stats" style="color:#e6d2a8;font-size:16px;margin:18px 0 0 0">段位 新手 · 0 分</p>
  <p style="color:#b9a98c;font-size:15px;margin:0">执黑先行 · Esc 退出</p>
</body>
</html>
