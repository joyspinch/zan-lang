<!DOCTYPE html>
<!-- 结算场景：body 半透明叠在定格的对局画面上。结构须保持「body 直接
     子元素」的扁平列（与 menu.html 同构）——嵌套 flex 容器引擎不认，
     子元素会挤成窄列文本散排。id 由 BkOverScene.OnEnter 回填。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(6,8,18,0.72)">
  <h1 id="headline" style="color:#ffdc64;font-size:42px;margin:0">挡板失守</h1>
  <p id="score" style="color:#ffe16e;font-size:34px;margin:0">得分 0</p>
  <p id="sub" style="color:#afc8eb;font-size:17px;margin:0">第 1 关 · 最长连击 0</p>
  <p id="cheer" style="color:#96e6be;font-size:16px;margin:0">再来一局，打出更高连击！</p>
  <div style="height:16px"></div>
  <button data-on-click="retry" style="font-size:19px;padding:12px 48px;background:linear-gradient(180deg,#38a06e,#2c8058);color:#f2fff7;border:2px solid #4fd595;border-radius:12px">再来一局</button>
  <button data-on-click="menu" style="font-size:17px;padding:10px 44px;background:#2e3650;color:#e6ebf7;border:2px solid #47527a;border-radius:12px">回到菜单</button>
</body>
</html>
