<!DOCTYPE html>
<!-- 主菜单场景：整屏 HTML+CSS。data-on-click="start" 由 BkMenuScene.OnWire 注册。 -->
<html>
<body style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(170deg,#1b1035 0%,#0c0a1c 55%,#12082a 100%)">
  <h1 style="color:#ffedbe;font-size:64px;margin:0">打砖块</h1>
  <p style="color:#ffd696;font-size:20px;margin:0">霓虹碎砖 · 连击倍增 · 道具连锁</p>
  <div style="height:28px"></div>
  <button data-on-click="start" style="font-size:24px;padding:16px 64px;background:linear-gradient(180deg,#38a06e,#2c8058);color:#f2fff7;border:2px solid #4fd595;border-radius:14px">开始弹射</button>
  <p id="stats" style="color:#ffe082;font-size:16px;margin:14px 0 0 0">最高分 0</p>
  <p style="color:#b9c3dc;font-size:15px;margin:0">鼠标移动挡板 · 点击发射 · Esc 退出</p>
</body>
</html>
