<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>围住神经猫</title>
<style>
:root {
  --primary: #e0774f;
  --primary-hover: #ea8a63;
  --primary-pressed: #c9643f;
  --leaf: #3f7a4a;
  --leaf-hover: #4b8b56;
  --leaf-pressed: #336a3e;
  --window-bg: #fbf1df;
  --surface-bg: #fffaf0;
  --text-primary: #4a3a33;
  --text-secondary: #7d6a5e;
  --text-tertiary: #a08f82;
  --border-primary: #ead9bf;
  --wood: #b98552;
  --gold: #f4b63f;
  --dot-size: 36px;
  --dot-gap: 6px;
  --row-gap: 2px;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 10px;
  padding: 14px 16px;
  background: linear-gradient(180deg, #fdf6e8 0%, #f6e6cc 100%);
  color: var(--text-primary);
  line-height: 1.35;
  position: relative;
}
body > div, body > p { flex-shrink: 0; }
p { margin: 0; }

/* ---------- 头部 ---------- */
.topbar { display: flex; flex-direction: row; align-items: center; gap: 10px; width: 100%; max-width: 540px; }
.logo { width: 46px; height: 46px; min-width: 46px; border-radius: 14px; border: 3px solid #ffffff; box-shadow: 0 2px 6px rgba(120, 80, 40, 0.28); flex-shrink: 0; }
.brand { display: flex; flex-direction: column; gap: 0px; flex-grow: 1; }
h1 { margin: 0; font-size: 24px; color: #5b3d2e; font-weight: bold; }
.tagline { font-size: 12px; color: var(--text-secondary); }
button.icon-btn { font-size: 13px; height: 34px; padding: 0 12px; border-radius: 17px; background: var(--surface-bg); color: var(--text-tertiary); border: 2px solid var(--border-primary); flex-shrink: 0; }
button.icon-btn:hover { background: #ffffff; border-color: #dcc6a4; }
button.icon-btn:active { background: #f3e5cc; }
button.icon-btn.selected { color: var(--leaf); border-color: #9cc79a; }

.chips { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 6px; padding: 4px; border-radius: 22px; background: rgba(185, 133, 82, 0.14); }
button.chip { font-size: 14px; height: 34px; padding: 0 14px; border-radius: 17px; background: transparent; color: var(--text-secondary); border: none; transition: background 160ms; }
button.chip:hover { background: rgba(255, 255, 255, 0.7); color: var(--text-primary); }
button.chip:active { background: #f3e5cc; }
button.chip:focus-visible { border: 2px solid var(--gold); }
button.chip.selected { background: var(--leaf); color: #ffffff; box-shadow: 0 2px 4px rgba(50, 90, 50, 0.35); }
button.chip.camp { color: #8a5a1c; font-weight: bold; }
button.chip.camp.selected { background: linear-gradient(180deg, #f6b94e 0%, #e3913a 100%); color: #ffffff; }
.chip-sep { width: 2px; height: 20px; background: rgba(185, 133, 82, 0.35); border-radius: 1px; }

.hud { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; width: 100%; max-width: 520px; }
.hud-left { display: flex; flex-direction: column; gap: 0px; flex-grow: 1; flex-shrink: 0; }
.hud-title { font-size: 15px; color: var(--text-primary); font-weight: bold; white-space: nowrap; }
.record-text { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.pills { display: flex; flex-direction: row; gap: 6px; flex-shrink: 0; }
.pill { font-size: 13px; color: var(--text-primary); background: var(--surface-bg); border: 2px solid var(--border-primary); border-radius: 14px; padding: 3px 10px; white-space: nowrap; }
.pill.moves { font-weight: bold; }
.pill.fence { color: #6b4a2c; background: #fbe7c8; border-color: #e7c391; }
.pill.fence.low { color: #ffffff; background: #e0774f; border-color: #c9643f; }
.pill.target { color: #8a5a1c; background: #fff3cf; border-color: #f0d38a; }

/* ---------- 棋盘 ---------- */
.board { display: flex; flex-direction: column; align-items: center; gap: var(--row-gap); padding: 18px 22px; flex-shrink: 0; overflow: visible; position: relative; border-radius: 26px; background: #a8743f; box-shadow: 0 6px 14px rgba(110, 70, 30, 0.32); }
.board-bg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 26px; }
.board-art { position: absolute; inset: 0; background: transparent; border: none; overflow: visible; }
.cat-layer { position: absolute; inset: 0; background: transparent; border: none; overflow: visible; }
.board-row { display: flex; flex-direction: row; gap: var(--dot-gap); flex-shrink: 0; position: relative; left: -10px; }
.board-row.odd { left: 11px; }
button.dot {
  width: var(--dot-size);
  height: var(--dot-size);
  min-width: var(--dot-size);
  min-height: var(--dot-size);
  padding: 0;
  flex-shrink: 0;
  border: 2px solid rgba(255, 255, 255, 0.55);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.30);
  color: var(--text-primary);
  transition: background 120ms;
}
button.dot.open:hover { background: rgba(255, 250, 220, 0.75); border-color: #ffe17a; }
button.dot.open:active { background: rgba(255, 236, 170, 0.9); }
button.dot.open:focus-visible { border-color: #ffcf3a; }
button.dot.blocked { background: rgba(70, 52, 30, 0.22); border-color: rgba(70, 52, 30, 0.10); }
button.dot.cat { background: rgba(255, 232, 160, 0.55); border-color: rgba(255, 255, 255, 0.7); }
button.dot.hinted { background: rgba(255, 236, 140, 0.85); border-color: #ffcf3a; }
button.dot:disabled { opacity: 1; }

/* ---------- 状态与操作 ---------- */
.result { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; max-width: 520px; padding: 8px 14px; border-radius: 16px; background: var(--surface-bg); border: 2px solid var(--border-primary); }
.result.won { background: #eaf6df; border-color: #b9dc9f; }
.result.lost { background: #fff0dc; border-color: #f2c99a; }
.result.warn { background: #fff4d6; border-color: #f4c95a; }
.status-line { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; }
.status { font-size: 16px; color: var(--text-primary); text-align: center; font-weight: bold; }
.hint { font-size: 12px; color: var(--text-secondary); text-align: center; }
.new-best { font-size: 11px; color: #ffffff; background: var(--primary); border-radius: 10px; padding: 1px 8px; font-weight: bold; }
.actions { display: flex; flex-direction: row; justify-content: center; gap: 10px; }
button.act { font-size: 15px; height: 42px; min-width: 104px; padding: 0 18px; border-radius: 21px; border: 2px solid var(--border-primary); background: var(--surface-bg); color: var(--text-primary); box-shadow: 0 3px 0 #e2cba8; }
button.act:hover { background: #ffffff; border-color: #dcc6a4; }
button.act:active { background: #f3e5cc; box-shadow: 0 1px 0 #e2cba8; translate: 0 2px; }
button.act:focus-visible { border-color: var(--gold); }
button.act:disabled { color: #c3b4a6; background: #f6eddc; box-shadow: none; border-color: #efe2cc; }
button.act.hint-btn { color: #8a5a1c; background: #fff3cf; border-color: #f0d38a; box-shadow: 0 3px 0 #e8c46e; }
button.act.hint-btn:hover { background: #fff8e2; }
button.act.hint-btn:disabled { color: #c9b58a; background: #f8f0dc; box-shadow: none; border-color: #efe2cc; }
button.act.go { color: #ffffff; background: var(--leaf); border-color: var(--leaf); box-shadow: 0 3px 0 #2a5733; }
button.act.go:hover { background: var(--leaf-hover); border-color: var(--leaf-hover); }
button.act.go:active { background: var(--leaf-pressed); box-shadow: 0 1px 0 #2a5733; }
.legend { font-size: 11px; color: var(--text-tertiary); text-align: center; }

.play-view { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 540px; }
/* ---------- 选关 ---------- */
.levels-view { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 540px; flex-grow: 1; }
.levels-head { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.levels-title { font-size: 20px; font-weight: bold; color: #5b3d2e; white-space: nowrap; flex-shrink: 0; }
.star-total { white-space: nowrap; flex-shrink: 0; font-size: 14px; font-weight: bold; color: #8a5a1c; background: #fff3cf; border: 2px solid #f0d38a; border-radius: 14px; padding: 3px 12px; }
.chapter { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 10px 12px; border-radius: 18px; border: 2px solid var(--border-primary); }
.chapter.c0 { background: #eef7e2; border-color: #cfe5b6; }
.chapter.c1 { background: #fbeef1; border-color: #f1cfd8; }
.chapter.c2 { background: #fbeadf; border-color: #efc6ad; }
button.act.back { height: 34px; min-width: 80px; font-size: 14px; }
.chapter-head { display: flex; flex-direction: row; justify-content: flex-start; align-items: center; gap: 12px; }
.chapter-title { white-space: nowrap; flex-shrink: 0; font-size: 15px; font-weight: bold; color: var(--text-primary); }
.chapter-note { white-space: nowrap; flex-shrink: 0; font-size: 12px; color: var(--text-secondary); }
.level-row { display: flex; flex-direction: row; gap: 6px; justify-content: space-between; }
button.lv { font-size: 14px; height: 42px; width: 92px; min-width: 60px; flex-grow: 1; padding: 0 4px; border-radius: 12px; border: 2px solid #e6d3b3; background: #fffaf0; color: var(--text-primary); box-shadow: 0 2px 0 #e2cba8; }
button.lv:hover { background: #ffffff; border-color: var(--gold); }
button.lv:active { background: #f3e5cc; box-shadow: none; }
button.lv:focus-visible { border-color: var(--gold); }
button.lv.s3 { background: #fff3cf; border-color: #f0c85a; color: #8a5a1c; }
button.lv.current { border-color: var(--primary); color: #b4532e; font-weight: bold; }
button.lv:disabled { background: rgba(255, 255, 255, 0.4); color: #c3b4a6; border-color: #eadfcd; box-shadow: none; }

/* ---------- 结算卡 ---------- */
.modal { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(70, 48, 30, 0.42); }
.card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 380px; padding: 18px 20px 20px 20px; border-radius: 26px; background: #fffaf0; border: 4px solid #f0dcb8; box-shadow: 0 10px 24px rgba(60, 35, 15, 0.4); animation: pop 260ms ease-out; }
.card.won { border-color: #bfe0a4; }
.card.lost { border-color: #f2c99a; }
.card-hero { width: 84px; height: 84px; border-radius: 42px; border: 4px solid #ffffff; box-shadow: 0 3px 8px rgba(120, 80, 40, 0.3); }
.card-title { font-size: 24px; font-weight: bold; color: #5b3d2e; text-align: center; }
.stars { display: flex; flex-direction: row; gap: 6px; align-items: center; justify-content: center; height: 56px; }
.star { font-size: 40px; color: #e6d6bc; }
.star.mid { font-size: 50px; }
.star.on { color: #f4b63f; }
.card-text { font-size: 14px; color: var(--text-secondary); text-align: center; }
.card-actions { display: flex; flex-direction: row; gap: 8px; justify-content: center; }
.card-actions button.act { min-width: 96px; padding: 0 12px; }
.confetti-layer { position: absolute; inset: 0; background: transparent; border: none; }
@keyframes pop { 0% { scale: 0.8; opacity: 0; } 70% { scale: 1.04; opacity: 1; } 100% { scale: 1; opacity: 1; } }

@media (max-width: 480px) {
  :root { --dot-size: 30px; --dot-gap: 4px; }
  .board { padding: 14px 16px; }
  .board-row { left: -8px; }
  .board-row.odd { left: 9px; }
  body { padding: 10px; gap: 8px; }
  h1 { font-size: 20px; }
  button.chip { padding: 0 10px; font-size: 13px; }
  .card { width: 300px; }
  button.act { min-width: 84px; padding: 0 10px; }
}
@media (max-width: 360px) {
  :root { --dot-size: 24px; --dot-gap: 4px; }
  .board-row { left: -7px; }
  .board-row.odd { left: 7px; }
  body { padding: 8px; gap: 6px; }
  .logo { width: 36px; height: 36px; min-width: 36px; }
}
</style>
</head>
