<!doctype html>

<head>
<meta charset="utf-8">
<title>围住神经猫</title>
<style>
:root {
  --primary: #276c53;
  --primary-hover: #348367;
  --primary-pressed: #205842;
  --window-bg: #f1f6ed;
  --surface-bg: #ffffff;
  --text-primary: #253b32;
  --text-secondary: #63786a;
  --text-tertiary: #7c8e80;
  --border-primary: #d9e5d7;
  --border-secondary: #e3ebe0;
  --dot-open: rgba(214, 231, 200, 0.72);
  --dot-hover: rgba(189, 219, 159, 0.85);
  --dot-blocked: rgba(71, 114, 92, 0.92);
  --dot-cat: rgba(244, 198, 83, 0.95);
  --won-bg: #e2f0dc;
  --lost-bg: #fff0d6;
  --dot-size: 40px;
  --dot-gap: 8px;
  --row-gap: 4px;
}
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 24px;
  background: var(--window-bg);
  color: var(--text-primary);
  line-height: 1.4;
}
body > div, body > p { flex-shrink: 0; }
.intro { display: flex; flex-direction: column; align-items: center; gap: 8px; }
h1 { margin: 0; font-size: var(--font-size-huge); color: var(--text-primary); }
p { margin: 0; font-size: var(--font-size-small); color: var(--text-secondary); }
.difficulties { display: flex; flex-direction: row; justify-content: center; gap: 8px; }
button.mode { font-size: var(--font-size-small); border-radius: var(--border-radius-medium); background: var(--surface-bg); color: var(--text-secondary); border: 1px solid var(--border-primary); }
button.mode.selected { background: var(--primary); color: #ffffff; border-color: var(--primary); }
.game-line { display: flex; flex-direction: row; align-items: center; justify-content: space-between; width: 100%; max-width: 440px; }
.caption { font-size: var(--font-size-small); color: var(--text-secondary); }
.moves { font-size: var(--font-size-large); color: var(--text-primary); white-space: nowrap; flex-shrink: 0; }
.board { display: flex; flex-direction: column; align-items: center; gap: var(--row-gap); padding: 8px 12px; flex-shrink: 0; overflow: visible; position: relative; }
.board-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cat-layer { position: absolute; inset: 0; background: transparent; border: none; overflow: visible; }
.board-row { display: flex; flex-direction: row; gap: var(--dot-gap); flex-shrink: 0; position: relative; left: -12px; }
.board-row.odd { left: 12px; }
button.dot {
  width: var(--dot-size);
  height: var(--dot-size);
  min-width: var(--dot-size);
  min-height: var(--dot-size);
  padding: 0;
  flex-shrink: 0;
  border: none;
  border-radius: 50%;
  font-size: var(--font-size-huge);
  background: var(--dot-open);
  color: var(--text-primary);
}
button.dot.open:hover { background: var(--dot-hover); }
button.dot.blocked { background: var(--dot-blocked); }
button.dot.cat { background: var(--dot-cat); color: var(--text-primary); }
button.dot:disabled { opacity: 1; }
.result { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 480px; padding: 16px; border-radius: var(--border-radius-large); background: var(--surface-bg); }
.result.won { background: var(--won-bg); }
.result.lost { background: var(--lost-bg); }
.status { font-size: var(--font-size-large); color: var(--text-primary); text-align: center; }
.hint { font-size: var(--font-size-small); color: var(--text-secondary); text-align: center; }
.actions { display: flex; flex-direction: row; justify-content: center; gap: 12px; }
button { font-size: var(--font-size-medium); }
.legend { font-size: var(--font-size-small); color: var(--text-secondary); text-align: center; }
@media (max-width: 480px), (max-height: 780px) {
  button.dot { width: 32px; height: 32px; min-width: 32px; min-height: 32px; }
  .board-row { gap: 4px; left: -9px; }
  .board-row.odd { left: 9px; }
  body { padding: 16px; gap: 8px; }
  .result { padding: 8px; }
}
@media (max-width: 360px) {
  button.dot { width: 24px; height: 24px; min-width: 24px; min-height: 24px; }
  .board-row { left: -7px; }
  .board-row.odd { left: 7px; }
  body { padding: 8px; gap: 8px; }
}
</style>
</head>
